<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 020 — Publish Gauntlet Honesty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../themes/default.css">
<style>
/* ───────────────────────────────────────────────────────────────
   Sketch 020 — Publish Gauntlet Honesty · NET-NEW (no publish UI today)
   Q: How does the publish moment render the REAL 8-stage gauntlet
      (lint → real golden run on the project KB → independent judge
      verdict) as a first-class honesty surface — where a judge fail
      is a HARD wall, the verdict is RENDERED (never re-derived), and
      the long synchronous golden run is legible?
   Truth (BRIEF §3.1–3.3):
     • PublishRequest = ONE field: golden_input (a textarea + Publish).
     • 8 REAL ordered stages 0,0b,1,2,2.5,3,3b,4,5 — NOT the stale 4.
     • PublishVerdict = EXACTLY 5 fields: published, version,
       golden_run_id, blocked_stage, named_failures. Rendered verbatim.
     • 10 real blocked_stage strings only; null on success.
     • Judge block = per-criterion {criterion,score,evidence} rows +
       {summary} — NOT raw JudgeVerdict booleans (those live in the
       governance receipt). A judge fail is a HARD WALL — no override.
     • "open the golden run" link ONLY when golden_run_id is non-null.
     • Sync long-wait is REAL (blocks up to harness_publish_max_seconds).
   ─────────────────────────────────────────────────────────────── */
body { padding-top: 52px; }
.shell { min-height: calc(100vh - 52px); }
/* one shared "ink on a bright surface" token (mirrors 019) so dark-text-on-primary/warning
   spots collapse to one literal instead of drifting */
:root { --color-on-bright: hsl(240 60% 8%); }

/* ── builder head (shared, mirrors 019) ── */
.builder-head { display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3) var(--space-6); border-bottom:1px solid var(--color-border); background:var(--color-bg-elev1); position:sticky; top:0; z-index:50; }
.builder-head .bh-title { font-family:var(--font-headline); font-weight:600; font-size:var(--text-md); display:flex; align-items:center; gap:var(--space-2); }
.builder-head .netnew { font-family:var(--font-mono); font-size:9px; padding:2px 7px; border-radius:var(--radius-full); background:var(--color-accent-violet); color:var(--color-text); }
.builder-head .spacer { flex:1; }
.dial-chip { display:inline-flex; align-items:center; gap:6px; font-size:var(--text-xs); padding:4px var(--space-3); border-radius:var(--radius-full); border:1px solid hsl(142 71% 45% / .35); background:var(--color-success-dim); color:var(--color-success); font-family:var(--font-mono); }
.immut-chip { display:inline-flex; align-items:center; gap:6px; font-size:var(--text-xs); padding:4px var(--space-3); border-radius:var(--radius-full); background:var(--color-muted); color:var(--color-text-muted); border:1px solid var(--color-border); font-family:var(--font-mono); }

/* ── canvas ── */
.canvas { max-width:760px; margin:0 auto; padding:var(--space-8) var(--space-6) 120px; }
.canvas.wide { max-width:820px; }

/* ── (shared) RESTING publish form — ONE golden_input textarea + Publish ── */
.publish-card { border:1px solid var(--color-border); border-radius:var(--radius-lg); background:var(--color-surface); padding:var(--space-5); animation:fadeSlideUp var(--dur-base) var(--ease-out); }
.publish-card .pc-h { font-family:var(--font-headline); font-size:var(--text-lg); font-weight:600; display:flex; align-items:center; gap:var(--space-2); }
.publish-card .pc-sub { font-size:12.5px; color:var(--color-text-muted); margin-top:6px; line-height:1.55; max-width:600px; }
.gi-label { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--color-text-dim); font-family:var(--font-mono); margin:var(--space-5) 0 6px; text-transform:uppercase; letter-spacing:.05em; }
.gi-input { width:100%; background:var(--color-surface-hi); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:var(--space-3); color:var(--color-text); font-family:inherit; font-size:13px; line-height:1.55; resize:vertical; min-height:88px; transition:border-color var(--dur-fast); }
.gi-input:focus { outline:none; border-color:var(--color-primary); box-shadow:0 0 0 3px var(--color-primary-dim); }
.gi-hint { font-size:11px; color:var(--color-text-dim); margin-top:6px; line-height:1.5; }
.gi-foot { display:flex; align-items:center; gap:var(--space-3); margin-top:var(--space-5); }
.gi-foot .spacer { flex:1; }
.publish-btn { font-size:var(--text-sm); font-weight:600; padding:9px var(--space-5); border-radius:var(--radius-md); background:var(--color-primary); color:var(--color-on-bright); border:none; cursor:pointer; transition:filter var(--dur-fast), transform var(--dur-fast); display:inline-flex; align-items:center; gap:7px; }
.publish-btn:hover:not(:disabled) { filter:brightness(1.08); transform:translateY(-1px); }
.publish-btn:active:not(:disabled) { transform:translateY(0); }
.publish-btn:disabled { opacity:.45; cursor:not-allowed; }
.publish-btn.ghost { background:transparent; color:var(--color-text-muted); border:1px solid var(--color-border); }
.publish-btn.ghost:hover { border-color:var(--color-primary-glow); color:var(--color-text); }

/* info popover (ⓘ) — tiered guidance for terms */
.info { width:14px; height:14px; border-radius:50%; border:1px solid var(--color-border); color:var(--color-text-dim); display:inline-grid; place-items:center; font-size:8px; cursor:help; position:relative; }
.info:hover .pop { display:block; }
.info .pop { display:none; position:absolute; bottom:20px; left:0; width:248px; background:var(--color-surface-hi); border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:8px 10px; font-size:10.5px; color:var(--color-text-muted); line-height:1.55; z-index:80; box-shadow:var(--shadow-md); text-transform:none; letter-spacing:0; font-family:var(--font-sans); }

/* ── (shared) STAGE LADDER — the 8 real ordered stages ── */
.gauntlet-h { display:flex; align-items:baseline; gap:var(--space-2); margin-bottom:var(--space-2); }
.gauntlet-h .gh-title { font-family:var(--font-headline); font-size:var(--text-md); font-weight:600; }
.gauntlet-h .gh-rollup { font-family:var(--font-mono); font-size:11px; color:var(--color-text-dim); margin-left:auto; }
.gauntlet-cap { font-size:11px; color:var(--color-text-dim); font-family:var(--font-mono); margin-bottom:var(--space-4); line-height:1.6; }

.ladder { list-style:none; margin:0; padding:0; }
.ladder > li { position:relative; padding-left:36px; padding-bottom:var(--space-2); }
.ladder > li:last-child { padding-bottom:0; }
/* connecting rail */
.ladder > li::before { content:''; position:absolute; left:14px; top:30px; bottom:-2px; width:2px; background:var(--color-border-soft); }
.ladder > li:last-child::before { display:none; }
.ladder > li.done::before { background:hsl(142 71% 45% / .4); }

.lnode { position:absolute; left:3px; top:8px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-family:var(--font-mono); font-size:10px; background:var(--color-surface); border:1.5px solid var(--color-border); color:var(--color-text-dim); z-index:1; transition:all var(--dur-base) var(--ease-out); }
.ladder > li.done .lnode { border-color:var(--color-success); background:var(--color-success-dim); color:var(--color-success); }
.ladder > li.running .lnode { border-color:var(--color-warning); color:var(--color-warning); animation:pulseGlow 1.6s infinite; }
.ladder > li.blocked .lnode { border-color:var(--color-danger); background:var(--color-danger-dim); color:var(--color-danger); }
.ladder > li.pending .lnode { opacity:.6; }
.ladder > li.judge-stage .lnode { /* judge bullet hint when blocked elsewhere */ }

.lrow { display:flex; align-items:center; gap:var(--space-2); padding:6px var(--space-3); border-radius:var(--radius-md); border:1px solid transparent; min-height:30px; transition:background var(--dur-fast); }
.lrow.clickable { cursor:pointer; }
.lrow.clickable:hover { background:var(--color-accent); }
.ladder > li.running .lrow { background:var(--color-warning-dim); border-color:hsl(38 92% 60% / .3); }
.ladder > li.blocked .lrow { background:var(--color-danger-dim); border-color:hsl(0 72% 51% / .35); }
.lrow .l-name { font-size:13px; font-weight:500; color:var(--color-text); }
.ladder > li.pending .lrow .l-name { color:var(--color-text-dim); font-weight:400; }
.lrow .l-num { font-family:var(--font-mono); font-size:9px; color:var(--color-text-dim); border:1px solid var(--color-border-soft); border-radius:var(--radius-sm); padding:0 5px; flex-shrink:0; }
.lrow .l-what { font-size:11px; color:var(--color-text-muted); margin-left:4px; }
.lrow .l-statetag { margin-left:auto; font-family:var(--font-mono); font-size:9px; padding:2px 8px; border-radius:var(--radius-full); flex-shrink:0; display:inline-flex; align-items:center; gap:5px; }
.l-statetag.t-done { background:var(--color-success-dim); color:var(--color-success); }
.l-statetag.t-running { background:var(--color-warning-dim); color:var(--color-warning); }
.l-statetag.t-blocked { background:var(--color-danger-dim); color:var(--color-danger); }
.l-statetag.t-pending { background:var(--color-muted); color:var(--color-text-dim); }
/* the dot-bounce micro-spinner inside a running tag */
.l-statetag .mini-dots { display:inline-flex; gap:2px; }
.l-statetag .mini-dots i { width:3px; height:3px; border-radius:50%; background:var(--color-warning); animation:dotBounce 1.1s infinite; }
.l-statetag .mini-dots i:nth-child(2){animation-delay:.13s} .l-statetag .mini-dots i:nth-child(3){animation-delay:.26s}

/* the code chip = the verbatim blocked_stage string */
.code-chip { font-family:var(--font-mono); font-size:9px; padding:2px 7px; border-radius:var(--radius-sm); border:1px solid hsl(0 72% 51% / .4); background:var(--color-danger-dim); color:var(--color-danger); }
.code-chip.ok { border-color:hsl(142 71% 45% / .35); background:var(--color-success-dim); color:var(--color-success); }

/* ── the LONG GOLDEN-RUN running panel (the real synchronous wait) ── */
.goldenrun-wait { margin-top:var(--space-3); margin-left:36px; border:1px solid hsl(38 92% 60% / .35); background:var(--color-warning-dim); border-radius:var(--radius-md); padding:var(--space-4); animation:fadeSlideUp var(--dur-base) var(--ease-out); }
.grw-h { display:flex; align-items:center; gap:var(--space-2); font-size:13px; font-weight:600; color:var(--color-warning); }
.grw-h .live-dot { width:8px; height:8px; border-radius:50%; background:var(--color-warning); animation:brandPulse 1.3s infinite; }
.grw-sub { font-size:12px; color:var(--color-text); margin-top:7px; line-height:1.6; }
.grw-sub b { color:var(--color-text); }
.grw-bar { margin-top:var(--space-3); }
.grw-meta { display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-family:var(--font-mono); font-size:10px; color:var(--color-text-muted); }
.grw-honest { margin-top:var(--space-3); font-size:10.5px; color:var(--color-text-dim); font-family:var(--font-mono); line-height:1.6; border-top:1px dashed var(--color-border-soft); padding-top:8px; }

/* ── EXPAND-IN-PLACE block detail (variant A) ── */
.block-detail { margin-top:var(--space-3); margin-left:36px; animation:fadeSlideUp var(--dur-slow) var(--ease-out); }
/* variant A — the per-stage "expand in place" toggle hint (a real interaction, not just a layout) */
.lrow .l-expand { font-family:var(--font-mono); font-size:9px; color:var(--color-danger); margin-left:8px; flex-shrink:0; opacity:.85; transition:transform var(--dur-fast); }
.ladder > li.a-open .lrow .l-expand { transform:rotate(90deg); }
.block-detail.collapsed { display:none; }

/* ── variant B — the COMPACT progress-spine (a horizontal pip row, NOT the full ladder) ──
   B's named idea is a "spine": while running, the ladder collapses to a single strip of pips
   and the golden-run wait panel becomes the hero of the canvas. */
.spine { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:var(--space-3) 0 var(--space-4); }
.spine .sp-pip { display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:var(--radius-full); border:1px solid var(--color-border-soft); background:var(--color-surface); font-family:var(--font-mono); font-size:9.5px; color:var(--color-text-dim); white-space:nowrap; transition:all var(--dur-base) var(--ease-out); }
.spine .sp-pip .sp-dot { width:7px; height:7px; border-radius:50%; background:var(--color-border); flex-shrink:0; }
.spine .sp-pip.done { border-color:hsl(142 71% 45% / .4); color:var(--color-success); }
.spine .sp-pip.done .sp-dot { background:var(--color-success); }
.spine .sp-pip.running { border-color:var(--color-warning); color:var(--color-warning); background:var(--color-warning-dim); }
.spine .sp-pip.running .sp-dot { background:var(--color-warning); animation:brandPulse 1.3s infinite; }
.spine .sp-pip.blocked { border-color:hsl(0 72% 51% / .5); color:var(--color-danger); background:var(--color-danger-dim); }
.spine .sp-pip.blocked .sp-dot { background:var(--color-danger); }
.spine .sp-conn { width:10px; height:2px; background:var(--color-border-soft); flex-shrink:0; }
/* B's hero wait panel — larger than A's inline one, dominates the canvas */
.goldenrun-wait.hero { margin-left:0; margin-top:0; padding:var(--space-5); border-width:1.5px; }
.goldenrun-wait.hero .grw-h { font-size:15px; }

/* ── (shared) VERDICT CARD ── the rendered PublishVerdict ── */
.verdict { border-radius:var(--radius-lg); padding:var(--space-5); animation:fadeSlideUp var(--dur-slow) var(--ease-out); }
.verdict.success { border:1px solid hsl(142 71% 45% / .45); background:linear-gradient(180deg, var(--color-success-dim), transparent); }
.verdict.block { border:1px solid hsl(0 72% 51% / .45); background:linear-gradient(180deg, var(--color-danger-dim), transparent); }
.verdict-top { display:flex; align-items:flex-start; gap:var(--space-3); }
.verdict-icon { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:18px; flex-shrink:0; }
.verdict.success .verdict-icon { background:var(--color-success-dim); color:var(--color-success); animation:checkPop var(--dur-slow) var(--ease-bounce); }
.verdict.block .verdict-icon { background:var(--color-danger-dim); color:var(--color-danger); }
.verdict-title { font-family:var(--font-headline); font-size:var(--text-lg); font-weight:600; }
.verdict.success .verdict-title { color:var(--color-success); }
.verdict.block .verdict-title { color:var(--color-danger); }
.verdict-line { font-size:12.5px; color:var(--color-text-muted); margin-top:4px; line-height:1.55; }

/* the 5 rendered PublishVerdict fields, shown as a labeled grid — "rendered, never re-derived" */
.verdict-fields { margin-top:var(--space-4); border:1px solid var(--color-border); border-radius:var(--radius-md); overflow:hidden; }
.vf-row { display:grid; grid-template-columns:160px 1fr; gap:var(--space-3); padding:8px var(--space-4); border-bottom:1px solid var(--color-border-soft); font-size:12px; align-items:center; }
.vf-row:last-child { border-bottom:none; }
.vf-row:nth-child(odd) { background:hsl(220 30% 7% / .4); }
.vf-key { font-family:var(--font-mono); font-size:10.5px; color:var(--color-text-dim); }
.vf-val { font-family:var(--font-mono); font-size:11.5px; color:var(--color-text); overflow-wrap:anywhere; }
.vf-val .v-bool-true { color:var(--color-success); }
.vf-val .v-bool-false { color:var(--color-danger); }
.vf-val .v-null { color:var(--color-text-dim); font-style:italic; }
.vf-val .v-block { color:var(--color-danger); }
.vf-srvtag { font-family:var(--font-mono); font-size:8.5px; color:var(--color-text-dim); margin-left:auto; }

/* HTTP status badge */
.http-badge { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px; padding:3px 9px; border-radius:var(--radius-sm); border:1px solid var(--color-border); color:var(--color-text-muted); }
.http-badge.s200 { border-color:var(--color-border); }
.http-badge.s4xx { border-color:hsl(0 72% 51% / .4); color:var(--color-danger); background:var(--color-danger-dim); }

/* HTTP-outcomes legend — proves all four codes the gauntlet distinguishes are rendered,
   not just declared in a JS map (200-block vs 404 not_found vs 409 already_published vs 400) */
.http-legend { margin-top:var(--space-5); border:1px solid var(--color-border); border-radius:var(--radius-md); overflow:hidden; }
.http-legend .hl-cap { font-family:var(--font-mono); font-size:9px; color:var(--color-text-dim); text-transform:uppercase; letter-spacing:.06em; padding:8px var(--space-4); border-bottom:1px solid var(--color-border-soft); background:var(--color-surface-hi); }
.hl-row { display:grid; grid-template-columns:88px 1fr; gap:var(--space-3); padding:7px var(--space-4); border-bottom:1px solid var(--color-border-soft); align-items:center; }
.hl-row:last-child { border-bottom:none; }
.hl-code { font-family:var(--font-mono); font-size:10px; font-weight:600; }
.hl-code.c200 { color:var(--color-text-muted); }
.hl-code.c4xx { color:var(--color-danger); }
.hl-text { font-size:11px; color:var(--color-text-muted); line-height:1.5; }
.hl-text .mono { font-family:var(--font-mono); font-size:10px; }

/* "view the golden run" link — appears ONLY when golden_run_id non-null */
.run-link { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--color-primary); text-decoration:none; padding:7px var(--space-4); border-radius:var(--radius-md); border:1px solid var(--color-primary-glow); background:var(--color-primary-dim); cursor:pointer; transition:filter var(--dur-fast); margin-top:var(--space-4); }
.run-link:hover { filter:brightness(1.12); }
/* the explicit ABSENCE notice on a pre-run block (no link) */
.no-run-note { margin-top:var(--space-4); font-size:11px; color:var(--color-text-dim); font-family:var(--font-mono); line-height:1.6; border:1px dashed var(--color-border); border-radius:var(--radius-md); padding:9px var(--space-3); }

/* fix & re-publish affordance — the ONLY path on a block (no override) */
.fix-strip { margin-top:var(--space-5); display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; padding-top:var(--space-4); border-top:1px solid var(--color-border-soft); }
.fix-strip .fx-note { font-size:11.5px; color:var(--color-text-muted); line-height:1.5; flex:1; min-width:240px; }
.fix-btn { font-size:var(--text-sm); font-weight:600; padding:8px var(--space-5); border-radius:var(--radius-md); background:var(--color-primary); color:var(--color-on-bright); border:none; cursor:pointer; transition:filter var(--dur-fast); display:inline-flex; align-items:center; gap:7px; }
.fix-btn:hover { filter:brightness(1.08); }
/* the deliberately-absent override, rendered as a struck-through reassurance */
.no-override { font-family:var(--font-mono); font-size:10px; color:var(--color-text-dim); display:inline-flex; align-items:center; gap:6px; }
.no-override s { color:var(--color-text-dim); opacity:.6; }

/* ── JUDGE BLOCK CARD — the QUAL-01 centerpiece ── */
.judge-block { margin-top:var(--space-5); border:1px solid hsl(0 72% 51% / .45); border-radius:var(--radius-lg); background:var(--color-surface); overflow:hidden; }
.jb-head { display:flex; align-items:center; gap:var(--space-3); padding:var(--space-4); background:var(--color-danger-dim); border-bottom:1px solid hsl(0 72% 51% / .35); }
.jb-head .jb-glyph { width:30px; height:30px; border-radius:50%; background:var(--color-surface); border:1px solid hsl(0 72% 51% / .4); display:grid; place-items:center; font-size:15px; color:var(--color-danger); }
.jb-head .jb-title { font-family:var(--font-headline); font-weight:600; font-size:var(--text-md); color:var(--color-danger); }
.jb-head .jb-model { font-family:var(--font-mono); font-size:9.5px; color:var(--color-text-muted); margin-left:auto; display:inline-flex; align-items:center; gap:6px; }
.jb-head .jb-model .iv { color:var(--color-accent-violet); }

.jb-criteria { padding:var(--space-2) var(--space-4) var(--space-4); }
.jb-crit-cap { font-family:var(--font-mono); font-size:9px; color:var(--color-text-dim); text-transform:uppercase; letter-spacing:.06em; margin:var(--space-3) 0 var(--space-2); }
.crit-row { display:grid; grid-template-columns:24px 1fr 64px; gap:var(--space-3); align-items:center; padding:var(--space-3); border:1px solid var(--color-border-soft); border-radius:var(--radius-md); margin-bottom:8px; background:var(--color-surface-hi); }
.crit-row.fail { border-color:hsl(0 72% 51% / .4); }
.crit-icon { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:11px; }
.crit-row.fail .crit-icon { background:var(--color-danger-dim); color:var(--color-danger); }
.crit-row.pass .crit-icon { background:var(--color-success-dim); color:var(--color-success); }
.crit-body .crit-name { font-family:var(--font-mono); font-size:12px; font-weight:500; color:var(--color-text); }
.crit-body .crit-evidence { font-size:11.5px; color:var(--color-text-muted); margin-top:3px; line-height:1.5; }
.crit-row.pass .crit-evidence { color:var(--color-text-dim); }
.crit-score { text-align:right; }
.crit-score .cs-num { font-family:var(--font-mono); font-size:15px; font-weight:600; }
.crit-row.fail .cs-num { color:var(--color-danger); }
.crit-row.pass .cs-num { color:var(--color-success); }
.crit-score .cs-lab { font-family:var(--font-mono); font-size:8px; color:var(--color-text-dim); }

<div class="sketch-toolbar">

    <span class="cy-lab">publish lifecycle</span>
    <div class="toolbar-toggle" id="stToggle">

      <button data-s="block_business" onclick="setState('block_business')">5a · early block (business_requirement)</button>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   DOMAIN MODEL — continues the 018/019 vendor-risk workflow being
   PUBLISHED. Real enums only. Everything server-authored is rendered
   verbatim (never re-derived). Domain-agnostic: vendor-risk is example
   CONTENT, the gauntlet shape is universal.
   ═══════════════════════════════════════════════════════════════ */

const WF = { name:'Vendor-risk portfolio review', slug:'vendor-risk-portfolio-review',
  project:'Vendor Risk — 2026 Reviews', dial:'STRICT · citations strict · output valid · freshness ≤90d · judge' };

// the author's representative kickoff prompt — the SINGLE PublishRequest field
const GOLDEN_INPUT_DEFAULT =
  "Run the Q2 vendor-risk portfolio review across all 2026 assessments. " +
  "For each vendor: score residual risk, cite every figure to its source assessment, " +
  "and render the executive brief from vendor-risk-brief.docx.";

// independent judge model (never the run model) — resolve_judge_model → Settings.harness_judge_model
const JUDGE_MODEL = 'claude-opus-4-8';
const RUN_MODEL   = 'claude-sonnet-4-6';

/* THE 8 REAL ORDERED STAGES (BRIEF §3.1) — follow the CODE not the stale 4-stage SUMMARY.
   golden_run_id only becomes non-null at stage 3+. */
const STAGES = [
  { key:'owner',     label:'Owner check',          num:'0',   what:'RLS-resolve + you own it',                          run:false, code:'not_found' },
  { key:'defvalid',  label:'Definition valid',     num:'0b',  what:'re-validates as a WorkflowDefinition',              run:false, code:'definition_invalid' },
  { key:'breq',      label:'Business requirement',  num:'1',   what:'exactly one declared (the D-13 invariant)',         run:false, code:'business_requirement' },
  { key:'lint',      label:'Structural lint',       num:'2',   what:'reachable · terminal · inputs satisfied · no orphans', run:false, code:'lint' },
  { key:'interact',  label:'Interactive-phase check',num:'2.5', what:"human-pause phases can't validate synchronously",   run:false, code:'interactive_phase' },
  { key:'golden',    label:'Golden run on your KB', num:'3',   what:'a REAL harness run against the project KB',          run:true,  code:'golden_run_timeout / golden_run_error' },
  { key:'sgate',     label:'Structural gate',       num:'3b',  what:'citations / integrity checked during the run',      run:true,  code:'structural_gate' },
  { key:'judge',     label:'Independent judge',     num:'4',   what:'an independent model grades the deliverable',       run:true,  code:'judge' },
  { key:'flip',      label:'Publish (flip to published)',num:'5', what:'freeze this version · fork a new draft',          run:false, code:'already_published' },
];

/* SERVER-AUTHORED PublishVerdict snapshots per state — EXACTLY 5 fields each.
   named_failures is rendered verbatim (BRIEF §3.2/§3.3). */
const VERDICTS = {
  success: {
    published:true, version:1, golden_run_id:'a7f3c1d2-90e4-4b18-bf2a-6c5d9e108f44',
    blocked_stage:null, named_failures:[],
    http:200,
  },
  block_judge: {
    published:false, version:null, golden_run_id:'a7f3c1d2-90e4-4b18-bf2a-6c5d9e108f44',
    blocked_stage:'judge',
    // judge block = per-criterion {criterion,score,evidence} for each FAILED criterion + a trailing {summary}.
    // This is EXACTLY what PublishVerdict.named_failures carries (BRIEF §3.3) — the passing criteria +
    // raw JudgeVerdict booleans are NOT here; they live in the judge_verdict governance receipt and are
    // deliberately NOT rendered in this card (BRIEF: "Do NOT render raw JudgeVerdict booleans").
    named_failures:[
      { criterion:'grounded_in_evidence', score:0.42, evidence:'3 of 12 figures are uncited — residual-risk scores for 3 vendors trace to no source assessment.' },
      { summary:'The brief answers the business requirement and was produced by the workflow itself, not delegated — but a quarter of its quantitative claims are not grounded in a cited source. Under a STRICT citation policy that is a hard fail: the deliverable cannot be trusted as-is. Re-publish after the analysis phase cites every figure it reports.' },
    ],
    http:200,
  },
  block_business: {
    published:false, version:null, golden_run_id:null,      // PRE-RUN block → no golden_run_id
    blocked_stage:'business_requirement',
    named_failures:[
      { message:'This workflow declares no business_requirement. The publish judge has nothing to grade against, so publishing is blocked before any run.' },
    ],
    http:400,   // business_requirement → 400 with the whole verdict in `detail`
  },
  block_lint: {
    published:false, version:null, golden_run_id:null,      // PRE-RUN block → no golden_run_id
    blocked_stage:'lint',
    named_failures:[
      { code:'INPUT_UNSATISFIED', phase_slug:'search-kb', message:"phase 'search-kb' reads input key 'vendor_list' that no earlier phase or workflow input provides." },
      { code:'NO_TERMINAL', phase_slug:null, message:'no phase emits a deliverable — the workflow has no terminal llm_emit phase.' },
    ],
    http:200,   // lint → 200 with the PublishVerdict body (read blocked_stage)
  },
  block_honest: {
    published:false, version:null, golden_run_id:'a7f3c1d2-90e4-4b18-bf2a-6c5d9e108f44',
    blocked_stage:'judge',
    // un-producible verdict → the single honest-failure line, verbatim
    named_failures:[
      'the judge produced no verdict (judge model returned no structured output after 2 attempts) — honest failure, not a silent pass',
    ],
    http:200,
  },
};

const HTTP_TEXT = { 200:'200 OK · read blocked_stage', 400:'400 · business_requirement (verdict in detail)', 404:'404 · not_found (no existence leak)', 409:'409 · already_published' };

let CUR_V='B', CUR_STATE='resting', C_EXPANDED=false, A_BLOCK_OPEN=true, GI_VALUE=GOLDEN_INPUT_DEFAULT;

/* ── helpers ── */
function isBlock(s){ return s.startsWith('block_'); }
function verdictFor(s){ return VERDICTS[s] || null; }
// which stage index is "reached" for the ladder, given the current state
function ladderState(stageKey){
  const v = verdictFor(CUR_STATE);
  if(CUR_STATE==='resting') return 'idle';
  if(CUR_STATE==='running'){
    // golden run is the active stage; everything before it done; after it pending
    const order = STAGES.map(s=>s.key);
    const gi = order.indexOf('golden'), si = order.indexOf(stageKey);
    if(si < gi) return 'done';
    if(si === gi) return 'running';
    return 'pending';
  }
  if(CUR_STATE==='success'){ return 'done'; }
  // a block: stages before the blocked one are done, the blocked one is blocked, rest pending
  const blockKeyMap = { judge:'judge', business_requirement:'breq', lint:'lint' };
  const blockedKey = blockKeyMap[v.blocked_stage] || v.blocked_stage;
  const order = STAGES.map(s=>s.key);
  const bi = order.indexOf(blockedKey), si = order.indexOf(stageKey);
  if(si < bi) return 'done';
  if(si === bi) return 'blocked';
  return 'pending';
}
function statetagFor(st){
  if(st==='done') return `<span class="l-statetag t-done">✓ pass</span>`;
  if(st==='running') return `<span class="l-statetag t-running"><span class="mini-dots"><i></i><i></i><i></i></span> running</span>`;
  if(st==='blocked') return `<span class="l-statetag t-blocked">✕ blocked</span>`;
  if(st==='pending') return `<span class="l-statetag t-pending">○ not reached</span>`;
  return `<span class="l-statetag t-pending">○ queued</span>`;
}
// roll-up "x done / 1 blocked / y not reached"
function rollup(){
  if(CUR_STATE==='resting') return '8 stages queued';
  let done=0, blocked=0, running=0, pending=0;
  STAGES.forEach(s=>{ const st=ladderState(s.key); if(st==='done')done++; else if(st==='blocked')blocked++; else if(st==='running')running++; else pending++; });
  const parts=[];
  if(done)parts.push(`${done} passed`);
  if(running)parts.push(`${running} running`);
  if(blocked)parts.push(`${blocked} BLOCKED`);
  if(pending)parts.push(`${pending} not reached`);
  return parts.join(' · ');
}

/* ═══════════════ RESTING publish form (shared) ═══════════════ */
function publishFormHTML(){
  return `<div class="publish-card">
    <div class="pc-h">◆ Publish “${WF.name}”</div>
    <div class="pc-sub">Publishing runs the full <b>8-stage gauntlet</b> — including a <b>real golden run</b> of this workflow against your project KB and an <b>independent judge</b> of the result. It can honestly block. Publishing freezes this as a version; a later tweak forks a new one.</div>
    <div class="gi-label">golden_input
      <span class="info">ⓘ<span class="pop">The single field of a PublishRequest. Your representative kickoff prompt — the golden run executes it against <b>${WF.project}</b> exactly as a real run would. Choose something typical, not a corner case.</span></span>
    </div>
    <textarea class="gi-input" id="giInput" oninput="GI_VALUE=this.value; syncPublishBtn();" placeholder="Describe a representative kickoff for this workflow…">${GI_VALUE}</textarea>
    <div class="gi-hint">The golden run uses this as <span class="mono">inputs.kickoff_prompt</span>. The judge grades the deliverable it produces against the workflow's business_requirement.</div>
    <div class="gi-foot">
      <span class="dial-chip">⚑ ${WF.dial}</span>
      <span class="spacer"></span>
      <button class="publish-btn" id="publishBtn" onclick="setState('running')" ${GI_VALUE.trim()?'':'disabled'}>
        Publish ▸ run the gauntlet
      </button>
    </div>
  </div>
  <div class="http-legend">
    <div class="hl-cap">the four HTTP outcomes publish can return — read the verdict body on a 200</div>
    <div class="hl-row"><span class="hl-code c200">200</span><span class="hl-text">${HTTP_TEXT[200]} — success OR a gauntlet block (judge / lint / golden-run): read <span class="mono">blocked_stage</span> to tell them apart. This is the primary "gauntlet failed" surface.</span></div>
    <div class="hl-row"><span class="hl-code c4xx">404</span><span class="hl-text">${HTTP_TEXT[404]} — you don't own it (or it doesn't exist). Cross-user collapses to the same 404 — no existence leak.</span></div>
    <div class="hl-row"><span class="hl-code c4xx">409</span><span class="hl-text">${HTTP_TEXT[409]} — this version is already published (a concurrent double-publish lost the race). Tweak forks a new draft version.</span></div>
    <div class="hl-row"><span class="hl-code c4xx">400</span><span class="hl-text">${HTTP_TEXT[400]} — the D-13 invariant: no declared business_requirement, so the judge has nothing to grade.</span></div>
  </div>`;
}
function syncPublishBtn(){ const b=document.getElementById('publishBtn'); if(b) b.disabled=!GI_VALUE.trim(); }

/* ═══════════════ THE 8-STAGE LADDER (shared by A & B) ═══════════════ */
function ladderHTML(opts){
  opts = opts||{};
  const items = STAGES.map((s,i)=>{
    const st = ladderState(s.key);
    const cls = st==='done'?'done':st==='running'?'running':st==='blocked'?'blocked':'pending';
    const bullet = st==='done'?'✓':st==='blocked'?'✕':st==='running'?'●':s.num;
    // the golden-run wait panel renders right under the running golden stage (variant B emphasis)
    const showWait = opts.longWait && s.key==='golden' && st==='running';
    // expand-in-place block detail under the blocked stage (variant A) — a REAL toggle
    const isInlineStage = opts.inlineBlock && st==='blocked';
    const open = isInlineStage && A_BLOCK_OPEN;
    return `<li class="${cls} ${s.key==='judge'?'judge-stage':''} ${open?'a-open':''}">
      <span class="lnode">${bullet}</span>
      <div class="lrow ${isInlineStage?'clickable':''}" ${isInlineStage?'role="button" tabindex="0" aria-expanded="'+(open?'true':'false')+'" onclick="toggleABlock()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleABlock();}"':''}>
        <span class="l-num">${s.num}</span>
        <span class="l-name">${s.label}</span>
        <span class="l-what">${s.what}</span>
        ${statetagFor(st)}
        ${isInlineStage?`<span class="l-expand" aria-hidden="true">▸ ${open?'hide':'detail'}</span>`:''}
      </div>
      ${showWait?goldenWaitHTML():''}
      ${isInlineStage?`<div class="block-detail ${open?'':'collapsed'}">${verdictFieldsHTML(verdictFor(CUR_STATE))}<div style="margin-top:var(--space-4)">${blockDetailHTML()}</div>${blockAffordancesHTML(verdictFor(CUR_STATE))}</div>`:''}
    </li>`;
  }).join('');
  return `<div class="gauntlet-h">
      <span class="gh-title">The publish gauntlet</span>
      <span class="gh-rollup">${rollup()}</span>
    </div>
    <div class="gauntlet-cap">8 ordered stages · run order is server-fixed · the dial cannot remove the judge (stage 4). A judge fail is a hard wall — no override.</div>
    <ul class="ladder">${items}</ul>`;
}

/* ═══════════════ THE COMPACT PROGRESS-SPINE (variant B) ═══════════════
   B reduces the 8 stages to a single horizontal pip strip so the golden-run
   WAIT can be the hero of the canvas — distinct from A's full vertical ladder. */
function spineHTML(){
  const pips = STAGES.map((s,i)=>{
    const st = ladderState(s.key);
    const cls = st==='done'?'done':st==='running'?'running':st==='blocked'?'blocked':'';
    const conn = i>0 ? '<span class="sp-conn"></span>' : '';
    return `${conn}<span class="sp-pip ${cls}" title="${s.label} — ${s.what}"><span class="sp-dot"></span>${s.num}</span>`;
  }).join('');
  return `<div class="gauntlet-h">
      <span class="gh-title">The publish gauntlet</span>
      <span class="gh-rollup">${rollup()}</span>
    </div>
    <div class="gauntlet-cap">8 ordered stages · the spine tracks position · the golden run (stage 3) is the long synchronous wait below.</div>
    <div class="spine">${pips}</div>`;
}

/* ═══════════════ LONG GOLDEN-RUN WAIT (the real synchronous block) ═══════════════ */
function goldenWaitHTML(hero){
  return `<div class="goldenrun-wait${hero?' hero':''}">
    <div class="grw-h"><span class="live-dot"></span> Publishing… running the golden run on your KB</div>
    <div class="grw-sub">We're executing the whole workflow for real against <b>${WF.project}</b> with your golden_input — same harness, same tools, same model (<span class="mono">${RUN_MODEL}</span>) — so the judge grades a <b>real</b> deliverable, not a dry-run. This is synchronous and can take a while.</div>
    <div class="grw-bar progress-bar" style="margin-top:14px"></div>
    <div class="grw-meta">
      <span>elapsed 0:38 · wall budget harness_publish_max_seconds</span>
      <span>step 4 / ~7 · ◆ rendering vendor-risk-brief.docx</span>
    </div>
    <div class="grw-honest">↳ honest wait: background-job publish isn't built yet, so this blocks the request. Don't close the tab — the verdict comes back inline when the run + judge finish.</div>
  </div>`;
}

/* ═══════════════ BLOCK DETAIL (the verdict + named_failures, rendered verbatim) ═══════════════
   Branches on the block kind:
   - judge          → the JUDGE BLOCK card (per-criterion rows + summary)  [centerpiece]
   - judge (honest) → the single un-producible-verdict line
   - lint / business_requirement → the named_failures list (pre-run, NO run link) */
function blockDetailHTML(){
  const v = verdictFor(CUR_STATE);
  const stage = v.blocked_stage;
  let body='';
  if(stage==='judge'){
    body = CUR_STATE==='block_honest' ? judgeHonestHTML(v) : judgeCardHTML(v);
  } else {
    body = preRunFailuresHTML(v);
  }
  return body;
}

/* ── JUDGE BLOCK CARD — QUAL-01 centerpiece ── */
function judgeCardHTML(v){
  const fails = v.named_failures.filter(f=>f.criterion);
  const summaryObj = v.named_failures.find(f=>f.summary);
  const critRow = (c, kind) => {
    const pct = Math.round(c.score*100);
    return `<div class="crit-row ${kind}">
      <div class="crit-icon">${kind==='fail'?'✕':'✓'}</div>
      <div class="crit-body">
        <div class="crit-name">${c.criterion}</div>
        <div class="crit-evidence">${c.evidence}</div>
      </div>
      <div class="crit-score">
        <div class="cs-num">${c.score.toFixed(2)}</div>
        <div class="cs-lab">score</div>
        <div class="cs-bar"><i style="width:${pct}%"></i></div>
      </div>
    </div>`;
  };
  return `<div class="judge-block">
    <div class="jb-head">
      <div class="jb-glyph">⚖</div>
      <div>
        <div class="jb-title">The independent judge blocked this</div>
        <div style="font-size:11px;color:var(--color-text-muted);margin-top:2px">The golden run succeeded — but the judge would not pass its result.</div>
      </div>
      <div class="jb-model">judged by <span class="iv">${JUDGE_MODEL}</span> · independent of the run model</div>
    </div>
    <div class="jb-criteria">
      <div class="jb-crit-cap">failed criteria — what blocked publish</div>
      ${fails.map(c=>critRow(c,'fail')).join('')}
    </div>
    <div class="jb-summary">
      <div class="jbs-lab">judge summary (one paragraph, server-authored)</div>
      <div class="jbs-text">${summaryObj.summary}</div>
    </div>
    <div class="verbatim-cap"><span class="vc-glyph">▦</span> rendered verbatim from <span class="mono">named_failures</span> (failed criteria + summary) — not re-derived in the client. The passing criteria + raw JudgeVerdict booleans live in the governance receipt, not here.</div>
  </div>`;
}

/* ── judge produced NO verdict — the single honest-failure line ── */
function judgeHonestHTML(v){
  return `<div class="judge-block">
    <div class="jb-head">
      <div class="jb-glyph">⚖</div>
      <div>
        <div class="jb-title">The judge could not produce a verdict</div>
        <div style="font-size:11px;color:var(--color-text-muted);margin-top:2px">Treated as a block, never a pass.</div>
      </div>
      <div class="jb-model">judge model <span class="iv">${JUDGE_MODEL}</span></div>
    </div>
    <div class="jb-honest"><span class="hf-glyph">⚠</span> ${v.named_failures[0]}</div>
    <div class="verbatim-cap"><span class="vc-glyph">▦</span> the single line of <span class="mono">named_failures</span>, rendered verbatim. An un-producible verdict fails CLOSED — it does not silently pass.</div>
  </div>`;
}

/* ── pre-run failures (lint / business_requirement): list, NO golden-run link ── */
function preRunFailuresHTML(v){
  const rows = v.named_failures.map(f=>{
    const code = f.code ? `<span class="code-chip">${f.code}</span>` : '';
    const phase = f.phase_slug ? `<span class="l-num" style="margin-left:6px">phase: ${f.phase_slug}</span>` : '';
    return `<div class="crit-row fail" style="grid-template-columns:24px 1fr">
      <div class="crit-icon">✕</div>
      <div class="crit-body">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${code}${phase}</div>
        <div class="crit-evidence" style="margin-top:6px">${f.message}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="judge-block">
    <div class="jb-head" style="background:var(--color-danger-dim)">
      <div class="jb-glyph">${v.blocked_stage==='lint'?'⚑':'⛔'}</div>
      <div>
        <div class="jb-title">${v.blocked_stage==='lint'?'Structural lint blocked this' : 'No business requirement to judge against'}</div>
        <div style="font-size:11px;color:var(--color-text-muted);margin-top:2px">${v.blocked_stage==='lint'?'Caught before any run — these are valid strings the schema accepts, but the graph is broken.':'Blocked at stage 1, before any run could start.'}</div>
      </div>
      <div class="jb-model"><span class="code-chip">${v.blocked_stage}</span></div>
    </div>
    <div class="jb-criteria">
      <div class="jb-crit-cap">named_failures — rendered verbatim (server-authored)</div>
      ${rows}
    </div>
    <div class="no-run-note">↳ no “open the golden run” link here: this blocked at stage ${v.blocked_stage==='lint'?'2':'1'}, before stage 3, so <span class="mono">golden_run_id</span> is <span class="v-null">null</span>. There is no run to open.</div>
    <div class="verbatim-cap"><span class="vc-glyph">▦</span> rendered verbatim from <span class="mono">named_failures</span> — not re-derived.</div>
  </div>`;
}

/* ═══════════════ THE 5-FIELD VERDICT GRID (rendered, never re-derived) ═══════════════ */
function verdictFieldsHTML(v){
  const boolHTML = b => b ? `<span class="v-bool-true">true</span>` : `<span class="v-bool-false">false</span>`;
  const nullable = (val, cls) => (val===null||val===undefined) ? `<span class="v-null">null</span>` : `<span class="${cls||''}">${val}</span>`;
  const nfCount = v.named_failures.length;
  return `<div class="verdict-fields">
    <div class="vf-row"><span class="vf-key">published</span><span class="vf-val">${boolHTML(v.published)}</span></div>
    <div class="vf-row"><span class="vf-key">version</span><span class="vf-val">${nullable(v.version)}</span></div>
    <div class="vf-row"><span class="vf-key">golden_run_id</span><span class="vf-val">${nullable(v.golden_run_id)}</span></div>
    <div class="vf-row"><span class="vf-key">blocked_stage</span><span class="vf-val">${nullable(v.blocked_stage, 'v-block')}</span></div>
    <div class="vf-row"><span class="vf-key">named_failures</span><span class="vf-val">${nfCount===0?'<span class="v-null">[] (empty)</span>':`list · ${nfCount} item${nfCount>1?'s':''} (rendered above)`}</span></div>
  </div>`;
}

/* ═══════════════ SUCCESS VERDICT ═══════════════ */
function successVerdictHTML(v){
  return `<div class="verdict success">
    <div class="verdict-top">
      <div class="verdict-icon">✓</div>
      <div style="flex:1">
        <div class="verdict-title">Published — version ${v.version}</div>
        <div class="verdict-line">The golden run passed the structural gate and the independent judge passed the deliverable. This version is now frozen (immutable). A later tweak forks a new draft → version ${v.version+1}.</div>
        <div style="margin-top:var(--space-2)"><span class="http-badge s200">${HTTP_TEXT[200]}</span></div>
      </div>
    </div>
    ${verdictFieldsHTML(v)}
    <a class="run-link" href="#" onclick="runLinkClick(event)">▦ View the golden run · ${v.golden_run_id.slice(0,8)}…</a>
    <div class="fix-strip">
      <span class="fx-note">Want to change something? Open the published workflow and tweak it — that forks <b>version ${v.version+1}</b> as a fresh draft. Publishing it runs a brand-new golden run + judge.</span>
      <button class="fix-btn ghost publish-btn" onclick="setState('resting')">Tweak → new version</button>
    </div>
  </div>`;
}

/* ═══════════════ SUCCESS — EXPAND-IN-PLACE (variant A) ═══════════════
   A's success mirrors its block thesis: a compact confirmation that opens UNDER the
   final 'flip to published' node, not a standalone card. Still RENDERS the 5-field
   verdict + the run link (verdict is rendered, never re-derived). */
function successInPlaceHTML(v){
  return `<div class="verdict success" style="margin-left:0">
    <div class="verdict-top">
      <div class="verdict-icon">✓</div>
      <div style="flex:1">
        <div class="verdict-title">Published — version ${v.version} <span class="code-chip ok" style="vertical-align:middle">blocked_stage: null</span></div>
        <div class="verdict-line">The golden run passed the structural gate and the independent judge passed the deliverable. This version is now frozen (immutable). A later tweak forks a new draft → version ${v.version+1}.</div>
        <div style="margin-top:var(--space-2)"><span class="http-badge s200">${HTTP_TEXT[200]}</span></div>
      </div>
    </div>
    ${verdictFieldsHTML(v)}
    <a class="run-link" href="#" onclick="runLinkClick(event)">▦ View the golden run · ${v.golden_run_id.slice(0,8)}…</a>
    <div class="fix-strip">
      <span class="fx-note">Tweak the published workflow → forks <b>version ${v.version+1}</b> as a fresh draft (a brand-new golden run + judge on its publish).</span>
      <button class="fix-btn ghost publish-btn" onclick="setState('resting')">Tweak → new version</button>
    </div>
  </div>`;
}

/* ── shared block affordances: the run-link (ONLY when golden_run_id non-null) + the
   no-override fix-strip. Reused by B's standalone card AND A's in-place expansion so
   both surface the same run-link gating and "no publish anyway" wall. ── */
function blockAffordancesHTML(v){
  const isJudge = v.blocked_stage==='judge';
  const hasRun = v.golden_run_id!==null;
  return `${hasRun
      ? `<a class="run-link" href="#" onclick="runLinkClick(event)">▦ Open the golden run that was judged · ${v.golden_run_id.slice(0,8)}…</a>`
      : `<div class="no-run-note">↳ <span class="mono">golden_run_id</span> is <span class="v-null">null</span> — this blocked before stage 3, so there is no run to open. (A pre-run block never has a run link.)</div>`}
    <div class="fix-strip">
      <span class="fx-note">${isJudge
        ? 'The only path forward is to fix the deliverable and re-publish — each attempt is a brand-new golden run and a fresh judge verdict.'
        : 'Fix the workflow and re-publish. The gauntlet re-runs from the top.'}</span>
      <span class="no-override" title="There is intentionally no override.">no override · <s>publish anyway</s></span>
      <button class="fix-btn" onclick="setState('resting')">↻ Fix &amp; re-publish</button>
    </div>`;
}

/* ═══════════════ BLOCK VERDICT (judge / honest / pre-run) ═══════════════ */
function blockVerdictHTML(v){
  const isJudge = v.blocked_stage==='judge';
  const title = isJudge ? (CUR_STATE==='block_honest'?'Blocked — the judge produced no verdict':'Blocked by the independent judge')
    : v.blocked_stage==='lint' ? 'Blocked at structural lint'
    : 'Blocked — no business requirement';
  const line = isJudge ? 'The golden run finished, but the deliverable did not pass the judge. This is a hard wall — there is no “publish anyway.” Fix what the judge flagged and re-publish (a fresh golden run + judge each time).'
    : v.blocked_stage==='lint' ? 'The workflow graph itself is broken, so publish stopped before any run could start.'
    : 'Publishing needs exactly one declared business_requirement for the judge to grade against. It blocked at stage 1.';
  const httpClass = v.http===200 ? 's200' : 's4xx';
  return `<div class="verdict block">
    <div class="verdict-top">
      <div class="verdict-icon">✕</div>
      <div style="flex:1">
        <div class="verdict-title">${title} <span class="code-chip" style="vertical-align:middle">${v.blocked_stage}</span></div>
        <div class="verdict-line">${line}</div>
        <div style="margin-top:var(--space-2)"><span class="http-badge ${httpClass}">${HTTP_TEXT[v.http]||(v.http+' OK')}</span></div>
      </div>
    </div>
    ${verdictFieldsHTML(v)}
    ${blockDetailHTML()}
    ${blockAffordancesHTML(v)}
  </div>`;
}

/* ═══════════════ VARIANT A — staged checklist that fills top-to-bottom ═══════════════
   The ladder is the hero; the blocked stage EXPANDS IN PLACE (inlineBlock).
   Resting shows the publish form; running shows the long-wait inline. */
function variantA(){
  if(CUR_STATE==='resting'){
    return `<div class="canvas">${publishFormHTML()}</div>`;
  }
  // running / success / block → the full vertical ladder is the hero; detail expands AT the stage.
  // success expands in place under the final 'flip to published' node (NOT B's standalone card),
  // keeping A's "fills top-to-bottom, detail opens at the stage" thesis consistent for block AND success.
  let tail='';
  if(CUR_STATE==='success'){
    tail = `<div class="block-detail" style="margin-top:var(--space-4)">${successInPlaceHTML(verdictFor('success'))}</div>`;
  }
  return `<div class="canvas">
    ${ladderHTML({ longWait:true, inlineBlock:true })}
    ${tail}
  </div>`;
}

/* ═══════════════ VARIANT B — progress-spine + prominent long-wait, then a verdict card ★ ═══════════════
   The spine reads as a focused progress strip; the golden-run WAIT is the most
   prominent state; the verdict is a separate card below (block or success). */
function variantB(){
  if(CUR_STATE==='resting'){
    return `<div class="canvas">${publishFormHTML()}</div>`;
  }
  // RUNNING is B's starred reason to exist: collapse the ladder to a compact spine
  // and let the golden-run WAIT dominate the canvas as a hero panel.
  if(CUR_STATE==='running'){
    return `<div class="canvas">
      ${spineHTML()}
      <div style="margin-top:var(--space-2)">${goldenWaitHTML(true)}</div>
    </div>`;
  }
  const v = verdictFor(CUR_STATE);
  let verdictBlock='';
  if(CUR_STATE==='success') verdictBlock = successVerdictHTML(v);
  else if(isBlock(CUR_STATE)) verdictBlock = blockVerdictHTML(v);
  // On a resolved verdict, B keeps the spine compact and the verdict as its own standalone card.
  return `<div class="canvas">
    ${spineHTML()}
    ${verdictBlock?`<div style="margin-top:var(--space-5)">${verdictBlock}</div>`:''}
  </div>`;
}

/* ═══════════════ VARIANT C — verdict-first compact banner → expands ═══════════════
   A single pass/block banner up top; click to disclose the staged breakdown
   + judge critique. Resting still shows the publish form. */
function variantC(){
  if(CUR_STATE==='resting'){
    return `<div class="canvas">${publishFormHTML()}</div>`;
  }
  if(CUR_STATE==='running'){
    // mid-run, C shows the wait as its own banner-shaped panel (no verdict yet)
    return `<div class="canvas wide">
      <div class="banner block" style="cursor:default;border-color:hsl(38 92% 60% / .45);background:var(--color-warning-dim)">
        <div class="bn-icon" style="color:var(--color-warning)">◷</div>
        <div class="bn-body">
          <div class="bn-title" style="color:var(--color-warning)">Publishing… running the golden run on your KB</div>
          <div class="bn-line">Synchronous — the verdict appears here when the real run + judge finish.</div>
        </div>
      </div>
      <div style="margin-top:var(--space-4)">${goldenWaitHTML()}</div>
      <div style="margin-top:var(--space-5)">${ladderHTML({ longWait:false, inlineBlock:false })}</div>
    </div>`;
  }
  const v = verdictFor(CUR_STATE);
  const success = CUR_STATE==='success';
  const bannerTitle = success ? `Published — version ${v.version}` :
    (v.blocked_stage==='judge' ? (CUR_STATE==='block_honest'?'Blocked — judge produced no verdict':'Blocked by the independent judge') :
     v.blocked_stage==='lint' ? 'Blocked at structural lint' : 'Blocked — no business requirement');
  const bannerLine = success ? 'Golden run passed · judge passed · this version is frozen.' :
    'A hard wall — no override. Expand to see exactly what blocked, and where.';
  const codechip = success ? '' : `<span class="bn-codechip code-chip">${v.blocked_stage}</span>`;
  return `<div class="canvas wide">
    <div class="banner ${success?'success':'block'} ${C_EXPANDED?'expanded':''}" onclick="toggleC()">
      <div class="bn-icon">${success?'✓':'✕'}</div>
      <div class="bn-body">
        <div class="bn-title">${bannerTitle}${codechip}</div>
        <div class="bn-line">${bannerLine}</div>
      </div>
      <span class="bn-chev">▸</span>
    </div>
    <div class="c-disclosure ${C_EXPANDED?'open':'closed'}">
      <div class="c-disc-inner">
        ${ladderHTML({ longWait:false, inlineBlock:false })}
        <div style="margin-top:var(--space-6)">${verdictFieldsHTML(v)}</div>
        ${success
          ? `<a class="run-link" href="#" onclick="runLinkClick(event)">▦ View the golden run · ${v.golden_run_id.slice(0,8)}…</a>
             <div class="fix-strip"><span class="fx-note">Tweak forks version ${v.version+1} — a new golden run + judge.</span><button class="fix-btn ghost publish-btn" onclick="setState('resting')">Tweak → new version</button></div>`
          : `<div style="margin-top:var(--space-5)">${blockDetailHTML()}</div>
             ${v.golden_run_id
                ? `<a class="run-link" href="#" onclick="runLinkClick(event)">▦ Open the golden run that was judged · ${v.golden_run_id.slice(0,8)}…</a>`
                : `<div class="no-run-note">↳ <span class="mono">golden_run_id</span> is <span class="v-null">null</span> — blocked before stage 3, no run to open.</div>`}
             <div class="fix-strip">
               <span class="fx-note">${v.blocked_stage==='judge'?'Fix the deliverable and re-publish — a fresh golden run + judge each attempt.':'Fix the workflow and re-publish.'}</span>
               <span class="no-override">no override · <s>publish anyway</s></span>
               <button class="fix-btn" onclick="setState('resting')">↻ Fix &amp; re-publish</button>
             </div>`}
      </div>
    </div>
  </div>`;
}

/* ═══════════════ HEAD (shared) ═══════════════ */
function headHTML(){
  return `<div class="builder-head">
    <span class="bh-title">◆ Publish · ${WF.name} <span class="netnew">NET-NEW · no publish UI today</span></span>
    <span class="spacer"></span>
    <span class="immut-chip">🔒 immutable on publish · tweak forks a new version</span>
    <span class="dial-chip" title="the strictness dial 018 set — read back here">⚑ ${WF.dial}</span>
  </div>`;
}

/* ── run-link click: visible feedback (a real one would navigate to the run thread) ── */
function runLinkClick(e){
  e.preventDefault(); e.stopPropagation();
  const el=e.currentTarget; const orig=el.innerHTML;
  el.innerHTML='▸ opening the golden run thread…';
  setTimeout(()=>{ el.innerHTML=orig; }, 1600);
}

/* ═══════════════ RENDER ═══════════════ */
function render(){
  let body;
  if(CUR_V==='A') body = variantA();
  else if(CUR_V==='B') body = variantB();
  else body = variantC();
  document.getElementById('shell').innerHTML = headHTML() + body;
}
/* C's thesis is "compact verdict-first banner → expand on demand". Default it COLLAPSED on a
   resolved verdict so the compact banner is what the evaluator sees first — and auto-expand ONLY
   the judge hard-wall (block_judge), the one moment that warrants immediate detail. */
function defaultCExpanded(){ return CUR_STATE==='block_judge'; }
function setVariant(v){ CUR_V=v; C_EXPANDED = defaultCExpanded(); A_BLOCK_OPEN = true; document.querySelectorAll('.variant-tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v)); render(); }
function setState(s){ CUR_STATE=s; C_EXPANDED = defaultCExpanded(); A_BLOCK_OPEN = true; document.querySelectorAll('#stToggle button').forEach(b=>b.classList.toggle('on',b.dataset.s===s)); render(); }
function toggleC(){ C_EXPANDED=!C_EXPANDED; render(); }
/* variant A — a REAL expand/collapse of the blocked stage's detail, in place */
function toggleABlock(){ A_BLOCK_OPEN=!A_BLOCK_OPEN; render(); }
render();
</script>
</body>
</html>
