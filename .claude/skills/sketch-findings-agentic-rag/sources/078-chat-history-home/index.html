const NAV_RAIL = [["message","Chat",true],["file","Documents"],["skills","Skills"],["workflow","Workflows"],["shield","Governance"],["sliders","Control Room"],["activity","Analytics"],["settings","Settings"]];
const NAV_SIDE = [["message","Chat",true],["file","Documents"],["skills","Skills"],["workflow","Workflows"],["shield","Governance"],["settings","Settings"]];

function relDate(d){ if(d===0)return 'Today'; if(d===1)return '1d'; if(d<7)return d+'d'; if(d<30)return Math.round(d/7)+'w'; return Math.round(d/30)+'mo'; }
function groupByDate(ts){ const b=[['Today',t=>t.d===0],['Yesterday',t=>t.d===1],['Last 7 days',t=>t.d>=2&&t.d<=7],['Last 30 days',t=>t.d>=8&&t.d<=30],['Older',t=>t.d>30]];
  return b.map(([label,fn])=>({label,items:ts.filter(fn)})).filter(g=>g.items.length); }
function groupByFolder(ts){ const order=['Finance','Engineering','Product','Personal']; const g=order.map(n=>({label:n,folder:true,items:ts.filter(t=>t.f===n)}));
  const un=ts.filter(t=>!t.f); if(un.length) g.push({label:'Unfiled',folder:true,items:un}); return g.filter(x=>x.items.length); }

function rowCompact(t, mode){
  const meta = mode==='folder' ? `<span class="r-meta">${relDate(t.d)}</span>`
    : (t.f?`<span class="r-meta">${svg('folder')}${t.f}</span>`:`<span class="r-meta unfiled">Unfiled</span>`);
  return `<button class="row" data-title="${t.t.toLowerCase()}"><span class="r-title">${t.t}</span>${meta}</button>`;
}
function rowCard(t){
  return `<button class="card" data-title="${t.t.toLowerCase()}"><span class="r-title">${t.t}</span>
    <span class="c-snip">${t.s}</span>
    <span class="c-meta">${t.f?`<span class="r-meta">${svg('folder')}${t.f}</span>`:`<span class="r-meta unfiled">Unfiled</span>`}<span class="r-meta">${svg('clock')}${relDate(t.d)} ago</span></span></button>`;
}
function groupsHTML(mode, kind){
  const groups = mode==='folder'?groupByFolder(THREADS):groupByDate(THREADS);
  return groups.map(g=>`<div class="grp"><div class="grp-head">${g.folder?svg('folder','gh-fi'):''}<span class="gh-name">${g.label}</span><span class="grp-count">${g.items.length}</span></div>
    <div class="grp-body ${kind==='card'?'as-cards':''}">${g.items.map(t=>kind==='card'?rowCard(t):rowCompact(t,mode)).join('')}</div></div>`).join('')
    + `<div class="th-empty">No chats match your search.</div>`;
}

/* ── Variant A: two-tier ── */
function variantA(){
  const rail = NAV_RAIL.map(([ic,label,active])=>`<button class="rail-btn ${active?'active':''}">${svg(ic)}<span class="tip">${label}</span></button>`).join('');
  return `<div class="frame">
    <div class="frame-caption"><span class="fc-note"><b>Two-tier.</b> Nav is a permanent 58px icon rail (8 surfaces here — add more, it never touches history). The whole next column is chat history. <span class="room-tag">${svg('clock')} full-height list — nav growth can't shrink it</span></span></div>
    <div class="app-frame">
      <div class="rail"><div class="logo">${svg('sparkles')}</div><div class="rail-nav">${rail}</div><div class="avatar">FD</div></div>
      <div class="history-col">
        <div class="hc-top">
          <div class="hc-title"><h2>Chats</h2><button class="btn-new" onclick="newChat()">${svg('plus')}New</button></div>
          <div class="search" id="siA"><span>${svg('search')}</span><input placeholder="Search ${TOTAL} chats…" oninput="filt('hlA','siA',this.value)"></div>
        </div>
        <div class="hc-list" id="hlA">${groupsHTML('date','compact')}</div>
      </div>
      <div class="chat-context">
        <div class="cc-top"><span class="cc-chip">Deep · Claude Opus 4.8</span><span class="cc-chip">General</span></div>
        <div class="cc-body"><div class="cc-hint"><h3>Q3 revenue variance analysis</h3><p>Nav lives in the rail — history owns the column.</p></div></div>
        <div class="cc-composer">Ask anything…</div>
      </div>
    </div></div>`;
}

/* ── Variant B: history page ── */
function variantB(){
  const nav = NAV_SIDE.map(([ic,label,active])=>`<button class="sb-item ${active?'active':''}">${svg(ic)}<span>${label}</span></button>`).join('');
  const recent = THREADS.slice(0,5).map(t=>`<button class="row" onclick="toast('Opened: '+this.querySelector('.r-title').textContent)"><span class="r-title">${t.t}</span></button>`).join('');
  return `<div class="frame">
    <div class="frame-caption"><span class="fc-note"><b>History page.</b> Sidebar keeps only <b>Recent 5</b> + “See all” — the 280+ live on a roomy, searchable Chats page (like Documents). <span class="room-tag">${svg('clock')} a whole page for history, not a 300px slot</span></span></div>
    <div class="app-frame">
      <div class="sidebar">
        <div class="sb-head"><div class="logo">${svg('sparkles')}</div><span class="wordmark">Agentic RAG</span></div>
        <div class="sb-nav">${nav}</div>
        <div class="sb-recent"><div class="rh"><span>Recent</span><button class="btn-new" style="height:26px;padding:0 8px;font-size:11px" onclick="newChat()">${svg('plus')}New</button></div>
          ${recent}<button class="sb-seeall" onclick="showVariant('b')">See all ${TOTAL} chats →</button></div>
        <div class="sb-foot"><div class="avatar">FD</div><div><div class="n">fhdmrd</div><div class="s">Operator</div></div></div>
      </div>
      <div class="chats-page">
        <div class="cp-head"><div class="cp-titlerow"><h1>Chats</h1>
          <div class="cp-tools"><div class="search cp-search" id="siB"><span>${svg('search')}</span><input placeholder="Search ${TOTAL} chats…" oninput="filt('clB','siB',this.value)"></div>
            <div class="seg"><button class="seg-btn active" onclick="setMode('B','date',this)">Date</button><button class="seg-btn" onclick="setMode('B','folder',this)">Folder</button></div></div></div></div>
        <div class="cp-scroll" id="clB">${groupsHTML('date','card')}</div>
      </div>
    </div></div>`;
}

/* ── Variant C: command palette ── */
function variantC(){
  const nav = NAV_SIDE.map(([ic,label,active])=>`<button class="sb-item ${active?'active':''}">${svg(ic)}<span>${label}</span></button>`).join('');
  const recent = THREADS.slice(0,4).map(t=>`<button class="row"><span class="r-title">${t.t}</span></button>`).join('');
  return `<div class="frame">
    <div class="frame-caption"><span class="fc-note"><b>Command palette.</b> Sidebar stays tiny (recent 4). Hit <b>⌘K</b> (or the button) to open a full finder over all ${TOTAL} — type to jump anywhere. <span class="room-tag">${svg('clock')} sidebar never holds the backlog</span></span></div>
    <div class="app-frame" id="frameC">
      <div class="sidebar">
        <div class="sb-head"><div class="logo">${svg('sparkles')}</div><span class="wordmark">Agentic RAG</span></div>
        <div class="sb-nav">${nav}</div>
        <button class="sb-cmdk" onclick="openCmdk('c')">${svg('search')}Search all chats<span class="kbd">⌘K</span></button>
        <div class="sb-recent"><div class="rh"><span>Recent</span></div>${recent}</div>
        <div class="sb-foot"><div class="avatar">FD</div><div><div class="n">fhdmrd</div><div class="s">Operator</div></div></div>
      </div>
      <div class="chat-context">
        <div class="cc-top"><span class="cc-chip">Deep · Claude Opus 4.8</span><span class="cc-chip">General</span></div>
        <div class="cc-body"><div class="ctx-cta"><div class="cc-hint"><h3>Find any chat instantly</h3><p>The sidebar stays out of the way. Everything is one keystroke away.</p></div>
          <button class="ctx-open" onclick="openCmdk('c')">${svg('search')}Search all ${TOTAL} chats <span class="kbd">⌘K</span></button></div></div>
      </div>
      <div class="cbar open" id="cbar_c">
        <div class="cbar-bg" onclick="closeCmdk()"></div>
        <div class="cmdk" role="dialog" aria-label="Search chats">
          <div class="cmdk-search">${svg('search')}<input id="cmdkInput_c" placeholder="Search ${TOTAL} chats…" oninput="filt('cmdkRes_c','x',this.value)"><span class="kbd-hint">esc</span></div>
          <div class="cmdk-results" id="cmdkRes_c">${groupsHTML('date','compact')}</div>
          <div class="cmdk-foot"><span><span class="k">↑↓</span>navigate</span><span><span class="k">↵</span>open</span><span><span class="k">esc</span>close</span></div>
        </div>
      </div>
    </div></div>`;
}

/* ── Synthesis: A's rail + C's ⌘K ── */
function variantD(){
  const rail = NAV_RAIL.map(([ic,label,active])=>`<button class="rail-btn ${active?'active':''}">${svg(ic)}<span class="tip">${label}</span></button>`).join('');
  return `<div class="frame">
    <div class="frame-caption"><span class="fc-note"><b>Synthesis — Rail + ⌘K.</b> Nav in the permanent icon rail; history owns the full column (browse + inline filter); <b>⌘K</b> (or the chip in the search box) opens a global finder to jump anywhere. <span class="room-tag">${svg('clock')} room to browse AND a keystroke to jump</span></span></div>
    <div class="app-frame" id="frameD">
      <div class="rail"><div class="logo">${svg('sparkles')}</div><div class="rail-nav">${rail}</div><div class="avatar">FD</div></div>
      <div class="history-col">
        <div class="hc-top">
          <div class="hc-title"><h2>Chats</h2><button class="btn-new" onclick="newChat()">${svg('plus')}New</button></div>
          <div class="search" id="siD"><span>${svg('search')}</span><input placeholder="Filter this list…" oninput="filt('hlD','siD',this.value)"><button class="cmdk-chip" onclick="openCmdk('d')" title="Search all chats (⌘K)"><span class="kbd-hint">⌘K</span></button></div>
        </div>
        <div class="hc-list" id="hlD">${groupsHTML('date','compact')}</div>
      </div>
      <div class="chat-context">
        <div class="cc-top"><span class="cc-chip">Deep · Claude Opus 4.8</span><span class="cc-chip">General</span></div>
        <div class="cc-body"><div class="cc-hint"><h3>Q3 revenue variance analysis</h3><p>Browse in the column, or press ⌘K to jump anywhere across all ${TOTAL}.</p></div></div>
        <div class="cc-composer">Ask anything…</div>
      </div>
      <div class="cbar" id="cbar_d">
        <div class="cbar-bg" onclick="closeCmdk()"></div>
        <div class="cmdk" role="dialog" aria-label="Search all chats">
          <div class="cmdk-search">${svg('search')}<input id="cmdkInput_d" placeholder="Search all ${TOTAL} chats…" oninput="filt('cmdkRes_d','x',this.value)"><span class="kbd-hint">esc</span></div>
          <div class="cmdk-results" id="cmdkRes_d">${groupsHTML('date','compact')}</div>
          <div class="cmdk-foot"><span><span class="k">↑↓</span>navigate</span><span><span class="k">↵</span>open</span><span><span class="k">esc</span>close</span></div>
        </div>
      </div>
    </div></div>`;
}

document.getElementById('variant-a').innerHTML = variantA();
document.getElementById('variant-b').innerHTML = variantB();
document.getElementById('variant-c').innerHTML = variantC();
document.getElementById('variant-d').innerHTML = variantD();

/* ── Interactivity ── */
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function filt(listId, _wrap, q){
  q=(q||'').trim(); const list=document.getElementById(listId);
  const rx=q?new RegExp('('+esc(q)+')','ig'):null; let any=false;
  list.querySelectorAll('.row, .card').forEach(r=>{
    const title=r.querySelector('.r-title'); const hit=!q||r.dataset.title.includes(q.toLowerCase());
    r.style.display=hit?'':'none'; if(hit)any=true;
    const orig=title.textContent; title.innerHTML=(q&&hit)?orig.replace(rx,'<mark>$1</mark>'):orig;
  });
  list.querySelectorAll('.grp').forEach(g=>{ const vis=[...g.querySelectorAll('.row,.card')].some(r=>r.style.display!=='none'); g.style.display=vis?'':'none'; });
  const e=list.querySelector('.th-empty'); if(e)e.classList.toggle('show',!any);
  // first-match highlight for palette
  if(listId.indexOf('cmdkRes')===0){ list.querySelectorAll('.row.hi').forEach(x=>x.classList.remove('hi')); const f=[...list.querySelectorAll('.row')].find(r=>r.style.display!=='none'); if(f)f.classList.add('hi'); }
}
function setMode(v, mode, btn){
  const listId = v==='B'?'clB':null; if(!listId)return;
  document.getElementById(listId).innerHTML = groupsHTML(mode, 'card');
  btn.parentNode.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  const inp=document.querySelector('#siB input'); if(inp)inp.value='';
}
function openCmdk(v){ const c=document.getElementById('cbar_'+v); if(!c)return; c.classList.add('open'); setTimeout(()=>{const i=document.getElementById('cmdkInput_'+v); if(i)i.focus();},60); }
function closeCmdk(){ document.querySelectorAll('.cbar.open').forEach(c=>c.classList.remove('open')); }
function newChat(){ toast('New chat started'); }
function showVariant(id, ev){
  ['a','b','c','d'].forEach(x=>document.getElementById('variant-'+x).style.display='none');
  document.getElementById('variant-'+id).style.display='block';
  document.querySelectorAll('.variant-tab').forEach(t=>t.classList.remove('active'));
  const map={a:0,b:1,c:2,d:3};
  if(ev && ev.currentTarget) ev.currentTarget.classList.add('active');
  else document.querySelectorAll('.variant-tab')[map[id]].classList.add('active');
}
function setVp(w){ document.getElementById('stage').style.maxWidth=w; }
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
    const vis = document.getElementById('variant-c').style.display!=='none' ? 'c'
              : document.getElementById('variant-d').style.display!=='none' ? 'd' : null;
    if(vis){ e.preventDefault(); openCmdk(vis); }
  }
  if(e.key==='Escape') closeCmdk();
});
let _tt; function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),1600); }
</script>
