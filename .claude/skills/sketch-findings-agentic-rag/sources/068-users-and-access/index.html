<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 068 — Users &amp; Access (Phase 148)</title>
<link rel="stylesheet" href="../themes/default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { overflow-x: hidden; }
  #stage { margin: 0 auto; transition: max-width var(--dur-slow) var(--ease-out); }
  .variant { display: none; }
  .variant.active { display: block; animation: fadeSlideUp var(--dur-slow) var(--ease-out); }
  .variant-meta { padding: 10px 20px 0; font-size: var(--text-sm); color: var(--color-text-muted); max-width: 1080px; }
  .variant-meta b { color: var(--color-text); font-weight: 600; }

  .app-frame {
    height: calc(100vh - 118px); min-height: 680px; margin: 12px 20px 20px;
    border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    overflow: hidden; background: var(--color-bg); box-shadow: var(--shadow-lg);
    position: relative; display: flex; flex-direction: column;
  }

  /* ── locked 061-B band ── */
  .op-band { background: linear-gradient(180deg, hsl(38 92% 60% / 0.07), transparent), var(--color-bg-elev1); border-bottom: 1px solid hsl(38 92% 60% / 0.25); padding: 14px 22px 0; flex: 0 0 auto; }
  .band-top { display: flex; align-items: center; gap: 12px; }
  .band-title { display: flex; align-items: center; gap: 9px; font-family: var(--font-headline); font-weight: 800; font-size: var(--text-lg); color: var(--color-text); }
  .band-title svg { width: 18px; height: 18px; color: var(--color-warning); }
  .band-identity { font-size: var(--text-xs); color: var(--color-text-dim); }
  .band-top .spacer { flex: 1; }
  .op-chip { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: var(--color-warning); background: var(--color-warning-dim); border: 1px solid hsl(38 92% 60% / 0.3); border-radius: var(--radius-sm); padding: 2px 7px; }
  .rec-marker { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--color-text-dim); white-space: nowrap; border-radius: var(--radius-full); padding: 3px 10px; transition: all var(--dur-base) var(--ease-out); }
  .rec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-success); box-shadow: 0 0 6px hsl(142 71% 45% / 0.6); flex: 0 0 6px; }
  .rec-marker.flash { background: var(--color-warning-dim); color: var(--color-warning); }
  .rec-marker.flash .rec-dot { background: var(--color-warning); animation: brandPulse 0.5s var(--ease-out) 2; }
  .back-link { font-size: var(--text-sm); color: var(--color-text-muted); cursor: pointer; border-radius: var(--radius-sm); padding: 4px 8px; }
  .back-link:hover { color: var(--color-text); background: var(--color-accent); }
  .band-tabs { display: flex; gap: 2px; margin-top: 12px; flex-wrap: wrap; }
  .band-tab { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; font-size: var(--text-sm); color: var(--color-text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all var(--dur-fast) var(--ease-out); user-select: none; }
  .band-tab:hover { color: var(--color-text); }
  .band-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
  .band-tab.locked { color: var(--color-text-dim); cursor: not-allowed; }
  .band-tab .lock { font-size: 10px; opacity: 0.6; }

  .body-scroll { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .section-head { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; flex-wrap: wrap; }
  .section-head h2 { margin: 0; font-family: var(--font-headline); font-size: var(--text-lg); font-weight: 800; color: var(--color-text); }
  .live-badge { font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--color-success); background: var(--color-success-dim); border-radius: var(--radius-sm); padding: 2px 6px; }
  .head-spacer { flex: 1; }
  .sub-line { font-size: var(--text-sm); color: var(--color-text-dim); margin: 0 0 16px; }
  .sub-line b { color: var(--color-text-muted); font-weight: 600; }

  .search-box { display: inline-flex; align-items: center; gap: 8px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 6px 12px; }
  .search-box input { background: transparent; border: none; outline: none; color: var(--color-text); font-family: var(--font-sans); font-size: var(--text-sm); width: 190px; }
  .search-box input::placeholder { color: var(--color-text-dim); }
  .search-box .icon { color: var(--color-text-dim); font-size: 12px; }

  /* status + role chips */
  .u-status { font-family: var(--font-mono); font-size: 10px; border-radius: var(--radius-full); padding: 2px 9px; white-space: nowrap; }
  .u-status.active { color: var(--color-success); background: var(--color-success-dim); }
  .u-status.disabled { color: var(--color-danger); background: var(--color-danger-dim); border: 1px solid hsl(0 72% 51% / 0.3); }
  .u-role { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--color-warning); background: var(--color-warning-dim); border: 1px solid hsl(38 92% 60% / 0.3); border-radius: var(--radius-full); padding: 2px 9px; white-space: nowrap; }
  .u-you { font-family: var(--font-mono); font-size: 10px; color: var(--color-primary); background: var(--color-primary-dim); border-radius: var(--radius-full); padding: 2px 8px; }

  .avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-headline); font-weight: 700; font-size: 12px; color: var(--color-text); background: var(--color-muted); border: 1px solid var(--color-border); flex: 0 0 30px; text-transform: uppercase; }
  .avatar.op { border-color: hsl(38 92% 60% / 0.45); color: var(--color-warning); background: var(--color-warning-dim); }
  .avatar.off { opacity: 0.5; }

  .last-active { font-size: var(--text-xs); color: var(--color-text-dim); font-family: var(--font-mono); white-space: nowrap; }
  .last-active.recent { color: var(--color-success); }
  .last-active.never { font-style: italic; }

  /* ── A: instrument table ── */
  .u-table { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: visible; background: var(--color-surface); }
  .ut-head, .ut-row { display: grid; grid-template-columns: minmax(220px, 1.4fr) 120px 110px 96px minmax(180px, 1fr); gap: 14px; align-items: center; padding: 10px 16px; }
  .ut-head { background: var(--color-bg-elev1); border-bottom: 1px solid var(--color-border); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-dim); font-family: var(--font-mono); border-radius: var(--radius-md) var(--radius-md) 0 0; }
  .ut-row { border-bottom: 1px solid var(--color-border-soft); transition: background var(--dur-fast) var(--ease-out); position: relative; }
  .ut-row:last-child { border-bottom: none; }
  .ut-row:hover { background: var(--color-bg-elev1); }
  .ut-row.off { background: hsl(0 72% 51% / 0.03); }
  .ut-row.off .u-id .em { color: var(--color-text-dim); }
  .u-id { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .u-id .em { color: var(--color-text); font-size: var(--text-sm); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .u-id .sub { font-size: var(--text-xs); color: var(--color-text-dim); }
  .u-actions { display: flex; gap: 7px; justify-content: flex-end; flex-wrap: wrap; }

  .act-btn { font-size: var(--text-xs); color: var(--color-text-dim); background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 5px 12px; cursor: pointer; transition: all var(--dur-fast) var(--ease-out); white-space: nowrap; }
  .act-btn:hover { color: var(--color-danger); border-color: hsl(0 72% 51% / 0.5); background: var(--color-danger-dim); }
  .act-btn.enable:hover { color: var(--color-success); border-color: hsl(142 71% 45% / 0.5); background: var(--color-success-dim); }
  .act-btn.op-grant:hover { color: var(--color-warning); border-color: hsl(38 92% 60% / 0.5); background: var(--color-warning-dim); }
  .act-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .act-btn:disabled:hover { color: var(--color-text-dim); border-color: var(--color-border); background: transparent; }

  /* confirm sheet (064-B victim-naming heritage) */
  .confirm-sheet { position: absolute; right: 14px; top: calc(100% - 6px); z-index: 40; width: 340px; background: var(--color-surface-hi); border: 1px solid hsl(0 72% 51% / 0.4); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 15px 16px; animation: fadeSlideUp var(--dur-base) var(--ease-out); cursor: default; }
  .confirm-sheet.warn { border-color: hsl(38 92% 60% / 0.45); }
  .confirm-sheet h4 { margin: 0 0 6px; font-family: var(--font-headline); font-size: var(--text-base); color: var(--color-text); }
  .confirm-sheet p { margin: 0 0 12px; font-size: var(--text-sm); color: var(--color-text-muted); line-height: 1.5; }
  .confirm-sheet p b { color: var(--color-text); }
  .confirm-sheet .fine { font-size: var(--text-xs); color: var(--color-text-dim); margin: -4px 0 12px; }
  .confirm-sheet .row { display: flex; gap: 8px; justify-content: flex-end; }
  .cs-cancel { font-size: var(--text-sm); color: var(--color-text-muted); background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 6px 13px; cursor: pointer; }
  .cs-cancel:hover { color: var(--color-text); }
  .cs-go { font-size: var(--text-sm); color: #fff; background: var(--color-danger); border: 1px solid var(--color-danger); border-radius: var(--radius-sm); padding: 6px 13px; cursor: pointer; font-weight: 600; }
  .cs-go:hover { filter: brightness(1.1); }
  .cs-go.warn { background: hsl(38 80% 45%); border-color: hsl(38 80% 45%); }
  .sheet-scrim { position: fixed; inset: 0; z-index: 30; }

  .receipt { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-warning); animation: fadeSlideUp var(--dur-base) var(--ease-out); white-space: nowrap; }

  /* ── B: expandable rows ── */
  .exp-row { border-bottom: 1px solid var(--color-border-soft); }
  .exp-row:last-child { border-bottom: none; }
  .exp-head { display: grid; grid-template-columns: minmax(220px, 1.4fr) 120px 110px 30px; gap: 14px; align-items: center; padding: 10px 16px; cursor: pointer; transition: background var(--dur-fast) var(--ease-out); }
  .exp-head:hover { background: var(--color-bg-elev1); }
  .exp-caret { color: var(--color-text-dim); font-size: 11px; text-align: right; transition: transform var(--dur-fast) var(--ease-out); }
  .exp-row.open .exp-caret { transform: rotate(90deg); }
  .exp-body { display: none; padding: 4px 16px 16px 57px; animation: fadeSlideUp var(--dur-base) var(--ease-out); position: relative; }
  .exp-row.open .exp-body { display: block; }
  .exp-row.open { background: var(--color-bg-elev1); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; max-width: 620px; }
  .fact { background: var(--color-surface); border: 1px solid var(--color-border-soft); border-radius: var(--radius-sm); padding: 8px 11px; }
  .fact .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-dim); font-family: var(--font-mono); margin-bottom: 3px; }
  .fact .v { font-size: var(--text-sm); color: var(--color-text); }
  .mini-activity { max-width: 620px; margin-bottom: 12px; }
  .mini-activity h5 { margin: 0 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-dim); font-family: var(--font-mono); font-weight: 500; }
  .mini-activity .r { display: flex; gap: 10px; font-size: var(--text-xs); color: var(--color-text-muted); padding: 3px 0; }
  .mini-activity .r .t { font-family: var(--font-mono); color: var(--color-text-dim); flex: 0 0 92px; }
  .mini-activity .more { font-size: var(--text-xs); color: var(--color-primary); cursor: pointer; margin-top: 4px; display: inline-block; }
  .mini-activity .more:hover { text-decoration: underline; }

  /* ── C: roster + detail panel ── */
  .c-split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); min-height: 430px; }
  .c-roster { border-right: 1px solid var(--color-border); }
  .c-row { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-bottom: 1px solid var(--color-border-soft); cursor: pointer; transition: background var(--dur-fast) var(--ease-out); }
  .c-row:hover { background: var(--color-bg-elev1); }
  .c-row.sel { background: var(--color-primary-dim); }
  .c-row .em { color: var(--color-text); font-size: var(--text-sm); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .c-detail { padding: 18px; position: relative; }
  .c-detail h3 { margin: 0 0 2px; font-family: var(--font-headline); font-size: var(--text-md); color: var(--color-text); overflow-wrap: anywhere; }
  .c-detail .chips { display: flex; gap: 6px; margin: 8px 0 14px; flex-wrap: wrap; }
  .c-detail .facts { grid-template-columns: 1fr 1fr; }
  .c-detail .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .c-detail .stack .act-btn { text-align: center; padding: 8px 12px; font-size: var(--text-sm); }
  .c-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--color-text-dim); font-size: var(--text-sm); }

  .scope-flag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--color-accent-violet); background: hsl(258 90% 66% / 0.12); border-radius: var(--radius-sm); padding: 2px 6px; }

  /* the disabled-user lived beat */
  .locked-out { margin-top: 16px; border: 1px dashed hsl(0 72% 51% / 0.4); border-radius: var(--radius-md); padding: 13px 16px; background: hsl(0 72% 51% / 0.04); animation: fadeSlideUp var(--dur-base) var(--ease-out); }
  .locked-out h5 { margin: 0 0 5px; font-size: var(--text-xs); font-family: var(--font-mono); color: var(--color-danger); text-transform: uppercase; letter-spacing: 0.06em; }
  .locked-out p { margin: 0; font-size: var(--text-sm); color: var(--color-text-muted); }

  .foot-note { margin-top: 14px; font-size: var(--text-xs); color: var(--color-text-dim); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .foot-note b { color: var(--color-text-muted); font-family: var(--font-mono); font-weight: 500; }
  .wire-flag { font-family: var(--font-mono); font-size: 10px; color: var(--color-accent-violet); background: hsl(258 90% 66% / 0.12); border-radius: var(--radius-sm); padding: 2px 6px; }

  /* visibility stub (069's home — composition hint only) */
  .vis-stub { margin-top: 26px; border-top: 1px solid var(--color-border-soft); padding-top: 18px; opacity: 0.65; }
  .vis-stub h3 { margin: 0 0 4px; font-family: var(--font-headline); font-size: var(--text-base); font-weight: 700; color: var(--color-text); }
  .vis-stub p { margin: 0; font-size: var(--text-xs); color: var(--color-text-dim); }
</style>
</head>
<body>

<div class="variant-nav">
  <span class="label">Sketch 068 · Users &amp; Access — list · last-active · disable/enable</span>
  <button class="variant-tab active" onclick="showVariant('a', event)">A: Instrument table <span class="star">★</span></button>
  <button class="variant-tab" onclick="showVariant('b', event)">B: Expandable rows</button>
  <button class="variant-tab" onclick="showVariant('c', event)">C: Roster + detail panel</button>
</div>

<div id="stage"></div>

<div class="sketch-toolbar">
  <span>068</span>
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">Deep Midnight</option>
  </select>
  <button onclick="setStage('768px')" title="tablet">💻</button>
  <button onclick="setStage('none')" title="desktop">🖥</button>
</div>

<script>
const ME = 'fhdmrd@gmail.com';
const NOW = Date.now();
const MIN = 60000, HR = 3600000, DAY = 86400000;

const BASE_USERS = [
  { id:'u_01', email: ME,               created: NOW-420*DAY, last: NOW-4*MIN,   status:'active',   op:true,  docs:214, threads:187, note:'env-bootstrap' },
  { id:'u_02', email:'maria@acme.co',   created: NOW-190*DAY, last: NOW-12*MIN,  status:'active',   op:false, docs:58,  threads:341 },
  { id:'u_03', email:'sam@acme.co',     created: NOW-160*DAY, last: NOW-2*HR,    status:'active',   op:false, docs:31,  threads:122 },
  { id:'u_04', email:'priya@acme.co',   created: NOW-120*DAY, last: NOW-1*DAY,   status:'active',   op:false, docs:97,  threads:76 },
  { id:'u_05', email:'leo@acme.co',     created: NOW-88*DAY,  last: NOW-6*DAY,   status:'active',   op:false, docs:12,  threads:44 },
  { id:'u_06', email:'jin@acme.co',     created: NOW-61*DAY,  last: NOW-19*DAY,  status:'active',   op:false, docs:5,   threads:9 },
  { id:'u_07', email:'contractor@ext.io', created: NOW-30*DAY, last: NOW-26*DAY, status:'disabled', op:false, docs:3,   threads:6, disabledAt: NOW-3*DAY, disabledBy: ME },
  { id:'u_08', email:'newhire@acme.co', created: NOW-2*DAY,   last: null,        status:'active',   op:false, docs:0,   threads:0 },
];

const ACTIVITY = {
  u_02: [['12 min ago','Searched the knowledge base · “renewal terms”'],['38 min ago','Ran code in the sandbox'],['1 h ago','Started a chat']],
  u_03: [['2 h ago','Uploaded a document · sales-pipeline.xlsx'],['3 h ago','Edited document metadata'],['Yesterday','Started a chat']],
  u_04: [['Yesterday','Used a skill · contract-summarizer'],['2 d ago','Saved a view'],['2 d ago','Searched the knowledge base']],
  u_05: [['6 d ago','Started a chat'],['8 d ago','Uploaded a document · onboarding-notes.md']],
  u_06: [['19 d ago','Searched the knowledge base'],['21 d ago','Started a chat']],
  u_07: [['26 d ago','Started a chat'],['29 d ago','Uploaded a document']],
  u_08: [],
  u_01: [['4 min ago','Opened the Control Plane'],['1 h ago','Ran code in the sandbox']],
};

/* per-variant state (deep copy users so demos are independent) */
const V = {};
['a','b','c'].forEach(v => V[v] = {
  users: BASE_USERS.map(u => ({...u})),
  q: '', open: null, sel: 'u_02', sheet: null,   /* sheet: {uid, kind} */
});

function fmtAgo(t){
  if (t == null) return 'never signed in';
  const d = NOW - t;
  if (d < HR) return Math.max(1,Math.round(d/MIN)) + ' min ago';
  if (d < DAY) return Math.round(d/HR) + ' h ago';
  if (d < 30*DAY) return Math.round(d/DAY) + ' d ago';
  return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function agoClass(t){ if (t==null) return 'never'; return (NOW-t) < HR ? 'recent' : ''; }
function initials(email){ return email.slice(0,2); }
function fmtDate(t){ return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function shield(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>'; }

function band(v){
  return `<div class="op-band">
    <div class="band-top">
      <div class="band-title">${shield()} Control Room</div>
      <span class="op-chip">OPERATOR</span>
      <span class="band-identity">${ME}</span>
      <span class="spacer"></span>
      <span class="rec-marker" id="rec-${v}"><span class="rec-dot"></span> every action recorded</span>
      <span class="back-link">‹ Back to app</span>
    </div>
    <div class="band-tabs">
      <span class="band-tab">Control Plane</span>
      <span class="band-tab active">Users &amp; Access</span>
      <span class="band-tab locked">Model Registry <span class="lock">🔒</span></span>
      <span class="band-tab locked">Secrets <span class="lock">🔒</span></span>
      <span class="band-tab">Audit log</span>
    </div>
  </div>`;
}

function recFlash(v){
  const rec = document.getElementById('rec-'+v);
  if (!rec) return;
  rec.classList.remove('flash'); void rec.offsetWidth; rec.classList.add('flash');
  setTimeout(()=>rec.classList.remove('flash'), 1600);
}

function visibleUsers(v){
  const st = V[v];
  let arr = st.users.filter(u => u.email.toLowerCase().includes(st.q.toLowerCase()));
  arr.sort((a,b) => (b.last||0) - (a.last||0));
  return arr;
}

/* ── the graded confirm sheets (naming the victim — 064-B rule) ── */
function sheetHtml(v, u, kind){
  if (kind === 'disable'){
    return `<div class="confirm-sheet" onclick="event.stopPropagation()">
      <h4>Disable this user?</h4>
      <p><b>${u.email}</b> loses access <b>immediately</b> — sign-in refused, API calls refused, any run they have in flight is cancelled. Their documents, chats and settings are kept, untouched.</p>
      <p class="fine">Reversible — you can enable them again right here. Recorded with your name.</p>
      <div class="row"><button class="cs-cancel" onclick="closeSheet('${v}')">Keep access</button>
      <button class="cs-go" onclick="doDisable('${v}','${u.id}')">Disable user</button></div>
    </div>`;
  }
  if (kind === 'grant'){
    return `<div class="confirm-sheet warn" onclick="event.stopPropagation()">
      <h4>Make this user an operator?</h4>
      <p><b>${u.email}</b> gains the Control Room: they can see <b>every user's activity</b>, kill anyone's runs, disable users, and change platform-wide settings.</p>
      <p class="fine">Reversible. Recorded with your name — and everything they do as operator is recorded too.</p>
      <div class="row"><button class="cs-cancel" onclick="closeSheet('${v}')">Cancel</button>
      <button class="cs-go warn" onclick="doGrant('${v}','${u.id}')">Grant operator</button></div>
    </div>`;
  }
  /* revoke */
  return `<div class="confirm-sheet warn" onclick="event.stopPropagation()">
    <h4>Remove operator access?</h4>
    <p><b>${u.email}</b> keeps their normal account but loses the Control Room. Their past operator actions stay in the audit trail forever.</p>
    <div class="row"><button class="cs-cancel" onclick="closeSheet('${v}')">Cancel</button>
    <button class="cs-go warn" onclick="doRevoke('${v}','${u.id}')">Remove operator</button></div>
  </div>`;
}

function openSheet(v, uid, kind, ev){ if (ev) ev.stopPropagation(); V[v].sheet = {uid, kind}; render(v); }
function closeSheet(v){ V[v].sheet = null; render(v); }
document.addEventListener('click', () => ['a','b','c'].forEach(v => { if (V[v].sheet){ V[v].sheet=null; render(v); } }));

function doDisable(v, uid){
  const u = V[v].users.find(x=>x.id===uid);
  u.status = 'disabled'; u.disabledAt = Date.now(); u.disabledBy = ME; u.receipt = 'Disabled · recorded';
  V[v].sheet = null; recFlash(v); render(v);
  setTimeout(()=>{ u.receipt = null; render(v); }, 4200);
}
function doEnable(v, uid, ev){
  if (ev) ev.stopPropagation();
  const u = V[v].users.find(x=>x.id===uid);
  u.status = 'active'; u.disabledAt = null; u.receipt = 'Enabled · recorded';
  recFlash(v); render(v);
  setTimeout(()=>{ u.receipt = null; render(v); }, 4200);
}
function doGrant(v, uid){
  const u = V[v].users.find(x=>x.id===uid);
  u.op = true; u.receipt = 'Operator granted · recorded';
  V[v].sheet = null; recFlash(v); render(v);
  setTimeout(()=>{ u.receipt = null; render(v); }, 4200);
}
function doRevoke(v, uid){
  const u = V[v].users.find(x=>x.id===uid);
  u.op = false; u.receipt = 'Operator removed · recorded';
  V[v].sheet = null; recFlash(v); render(v);
  setTimeout(()=>{ u.receipt = null; render(v); }, 4200);
}

/* action cluster shared by variants */
function actionsFor(v, u, stacked){
  const st = V[v];
  if (u.receipt) return `<span class="receipt">✎ ${u.receipt}</span>`;
  const isMe = u.email === ME;
  const bits = [];
  if (u.status === 'active'){
    bits.push(`<button class="act-btn" ${isMe?'disabled title="You cannot disable yourself"':''} onclick="openSheet('${v}','${u.id}','disable',event)">Disable</button>`);
  } else {
    bits.push(`<button class="act-btn enable" onclick="doEnable('${v}','${u.id}',event)">Enable</button>`);
  }
  if (u.op){
    bits.push(`<button class="act-btn op-grant" ${isMe?'disabled title="You cannot remove your own operator access"':''} onclick="openSheet('${v}','${u.id}','revoke',event)">Remove operator</button>`);
  } else if (u.status === 'active'){
    bits.push(`<button class="act-btn op-grant" onclick="openSheet('${v}','${u.id}','grant',event)">Make operator</button>`);
  }
  const sheet = (st.sheet && st.sheet.uid === u.id) ? sheetHtml(v, u, st.sheet.kind) : '';
  return bits.join('') + sheet;
}

function statusChips(u){
  const s = u.status === 'active'
    ? `<span class="u-status active">active</span>`
    : `<span class="u-status disabled" title="disabled ${fmtDate(u.disabledAt)} by ${u.disabledBy||'an operator'}">disabled</span>`;
  const op = u.op ? `<span class="u-role">⛨ operator</span>` : '';
  const you = u.email === ME ? `<span class="u-you">you</span>` : '';
  return s + op + you;
}

/* ── A: instrument table ── */
function tableA(v){
  const users = visibleUsers(v);
  const rows = users.map(u => `<div class="ut-row ${u.status==='disabled'?'off':''}">
    <div class="u-id"><span class="avatar ${u.op?'op':''} ${u.status==='disabled'?'off':''}">${initials(u.email)}</span>
      <div style="min-width:0"><div class="em">${u.email}</div><div class="sub">joined ${fmtDate(u.created)} · ${u.docs} docs · ${u.threads} chats</div></div></div>
    <span class="last-active ${agoClass(u.last)}">${fmtAgo(u.last)}</span>
    <div>${u.status==='active' ? `<span class="u-status active">active</span>` : `<span class="u-status disabled" title="disabled ${fmtDate(u.disabledAt)}">disabled</span>`}</div>
    <div>${u.op ? `<span class="u-role">⛨ op</span>` : ''}${u.email===ME ? ` <span class="u-you">you</span>` : ''}</div>
    <div class="u-actions">${actionsFor(v, u)}</div>
  </div>`).join('');
  return `<div class="u-table">
    <div class="ut-head"><span>User</span><span>Last active</span><span>Status</span><span>Role</span><span style="text-align:right">Actions</span></div>
    ${rows}</div>`;
}

/* ── B: expandable rows ── */
function tableB(v){
  const st = V[v];
  const users = visibleUsers(v);
  return `<div class="u-table">` + users.map(u => {
    const open = st.open === u.id;
    return `<div class="exp-row ${open?'open':''} ${u.status==='disabled'?'off':''}">
      <div class="exp-head" onclick="toggleOpen('${v}','${u.id}')">
        <div class="u-id"><span class="avatar ${u.op?'op':''} ${u.status==='disabled'?'off':''}">${initials(u.email)}</span>
          <div style="min-width:0"><div class="em">${u.email}</div></div></div>
        <span class="last-active ${agoClass(u.last)}">${fmtAgo(u.last)}</span>
        <div style="display:flex;gap:5px;flex-wrap:wrap">${statusChips(u)}</div>
        <span class="exp-caret">›</span>
      </div>
      ${open ? `<div class="exp-body">
        <div class="facts">
          <div class="fact"><div class="k">Joined</div><div class="v">${fmtDate(u.created)}</div></div>
          <div class="fact"><div class="k">Last active</div><div class="v">${fmtAgo(u.last)}</div></div>
          <div class="fact"><div class="k">Documents</div><div class="v">${u.docs}</div></div>
          <div class="fact"><div class="k">Chats</div><div class="v">${u.threads}</div></div>
        </div>
        ${u.status==='disabled' ? `<div class="locked-out" style="margin:0 0 12px;max-width:620px"><h5>What this user sees</h5><p>Sign-in refused with “This account is disabled — contact your administrator.” Their API calls return the same refusal. Nothing of theirs was deleted.</p></div>` : ''}
        <div class="mini-activity">
          <h5>Recent activity</h5>
          ${(ACTIVITY[u.id]||[]).length
            ? (ACTIVITY[u.id].map(([t,w]) => `<div class="r"><span class="t">${t}</span><span>${w}</span></div>`).join('')
               + `<span class="more">Full history in the audit log ›</span>`)
            : `<div class="r"><span style="color:var(--color-text-dim);font-style:italic">No activity yet</span></div>`}
        </div>
        <div class="u-actions" style="justify-content:flex-start;position:relative">${actionsFor(v, u)}</div>
      </div>` : ''}
    </div>`;
  }).join('') + `</div>`;
}
function toggleOpen(v, uid){ const st=V[v]; st.open = (st.open===uid? null : uid); st.sheet=null; render(v); }

/* ── C: roster + detail panel ── */
function tableC(v){
  const st = V[v];
  const users = visibleUsers(v);
  const sel = st.users.find(u => u.id === st.sel);
  const roster = users.map(u => `<div class="c-row ${st.sel===u.id?'sel':''} ${u.status==='disabled'?'off':''}" onclick="selectUser('${v}','${u.id}')">
      <span class="avatar ${u.op?'op':''} ${u.status==='disabled'?'off':''}">${initials(u.email)}</span>
      <span class="em">${u.email}</span>
      <span class="last-active ${agoClass(u.last)}">${fmtAgo(u.last)}</span>
      ${u.status==='disabled'?'<span class="u-status disabled">off</span>':''}
    </div>`).join('');
  const detail = sel ? `<div class="c-detail">
      <h3>${sel.email}</h3>
      <div class="chips">${statusChips(sel)}</div>
      <div class="facts">
        <div class="fact"><div class="k">Joined</div><div class="v">${fmtDate(sel.created)}</div></div>
        <div class="fact"><div class="k">Last active</div><div class="v">${fmtAgo(sel.last)}</div></div>
        <div class="fact"><div class="k">Documents</div><div class="v">${sel.docs}</div></div>
        <div class="fact"><div class="k">Chats</div><div class="v">${sel.threads}</div></div>
      </div>
      <div class="mini-activity" style="margin-top:14px">
        <h5>Recent activity</h5>
        ${(ACTIVITY[sel.id]||[]).length
          ? (ACTIVITY[sel.id].slice(0,3).map(([t,w]) => `<div class="r"><span class="t">${t}</span><span>${w}</span></div>`).join('')
             + `<span class="more">Full history in the audit log ›</span>`)
          : `<div class="r"><span style="color:var(--color-text-dim);font-style:italic">No activity yet</span></div>`}
      </div>
      ${sel.status==='disabled' ? `<div class="locked-out"><h5>What this user sees</h5><p>Sign-in refused with “This account is disabled.” Nothing of theirs was deleted.</p></div>` : ''}
      <div class="stack" style="position:relative">${actionsFor(v, sel, true)}</div>
    </div>` : `<div class="c-empty">Select a user</div>`;
  return `<div class="c-split"><div class="c-roster scrollbar-thin" style="overflow-y:auto;max-height:520px">${roster}</div>${detail}</div>`;
}
function selectUser(v, uid){ V[v].sel = uid; V[v].sheet = null; render(v); }

/* ── assembly ── */
const BODY = { a: tableA, b: tableB, c: tableC };
function render(v){
  const host = document.getElementById('users-'+v);
  const st = V[v];
  const users = visibleUsers(v);
  const nDisabled = st.users.filter(u=>u.status==='disabled').length;
  if (host) host.innerHTML = BODY[v](v);
  const cnt = document.getElementById('count-'+v);
  if (cnt) cnt.textContent = `${st.users.length} users · ${st.users.filter(u=>u.op).length} operators · ${nDisabled} disabled`;
}

function frame(v){
  return `<div class="app-frame">${band(v)}
    <div class="body-scroll scrollbar-thin">
      <div class="section-head">
        <h2>Users &amp; Access</h2><span class="live-badge">live</span>
        <span style="font-size:var(--text-xs);color:var(--color-text-dim)" id="count-${v}"></span>
        <span class="head-spacer"></span>
        <div class="search-box"><span class="icon">⌕</span><input placeholder="Find a user…" oninput="setQ('${v}', this.value)"></div>
      </div>
      <p class="sub-line">Everyone with an account, newest activity first. <b>Disable</b> ends a user's access immediately and reversibly — their data stays. Operator access <span class="scope-flag">possible scope — ratify at discuss</span> is granted and removed here too.</p>
      <div id="users-${v}"></div>
      <div class="vis-stub">
        <h3>Feature visibility</h3>
        <p>Which advanced features end users can see — sketched separately (069). It lives on this tab, below the roster: who has access, then what they can see.</p>
      </div>
      <div class="foot-note">
        <span>Disable/enable ride the auth ban mechanism; <b>last-active</b> comes from sign-in records. The list spans all users via the service-role client — read paths explicitly filtered.</span>
        <span class="wire-flag">net-new · 148 · user admin API</span>
      </div>
    </div>
  </div>`;
}
function setQ(v, q){ V[v].q = q; render(v); }

const META = {
  a: '<b>A — Instrument table.</b> The whole roster in one dense scan — identity + joined/docs/chats, last-active, status, role, actions on every row. Disable opens the 064-B victim-naming confirm sheet; Enable is direct (restorative). Fastest for "find the user, act."',
  b: '<b>B — Expandable rows.</b> The 055-B grammar: a calm three-column roster; a row expands IN PLACE to facts + recent activity (deep-link to the audit browser) + the actions. The "what does a disabled user see" answer lives in the expansion. Investigation-first.',
  c: '<b>C — Roster + detail panel.</b> The app\'s own push/split shape (027-A heritage): compact roster left, a persistent user card right with facts, activity, and stacked actions. Feels like the Documents page — but is a second pattern inside one Control Room.',
};

const stage = document.getElementById('stage');
['a','b','c'].forEach(v => {
  const wrap = document.createElement('div');
  wrap.className = 'variant' + (v==='a'?' active':'');
  wrap.id = 'variant-'+v;
  wrap.innerHTML = `<p class="variant-meta">${META[v]}</p>` + frame(v);
  stage.appendChild(wrap);
  render(v);
});

function showVariant(id, ev){
  document.querySelectorAll('.variant').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.variant-nav .variant-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('variant-'+id).classList.add('active');
  if (ev) ev.target.classList.add('active');
}
function setStage(w){ document.getElementById('stage').style.maxWidth = (w==='none')?'none':w; }
</script>
</body>
</html>
