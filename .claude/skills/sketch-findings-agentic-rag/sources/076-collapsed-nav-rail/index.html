<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 076 · Collapsed Nav Rail</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  /* ── Stage / composition ───────────────────────────────── */
  #stage { max-width: none; margin: 0 auto; padding: 26px; transition: max-width var(--dur-base) var(--ease-out); }
  .variant { }
  .frame { }
  .frame-caption {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 12px; margin-bottom: 12px; padding: 0 2px;
  }
  .fc-note { font-size: var(--text-sm); color: var(--color-text-muted); }
  .fc-note b { color: var(--color-text); font-weight: 600; }
  .kbd {
    display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px;
    padding: 0 5px; margin: 0 2px; border: 1px solid var(--color-border); border-bottom-width: 2px;
    border-radius: 5px; background: var(--color-surface); font-family: var(--font-mono);
    font-size: 11px; color: var(--color-text-muted);
  }
  .seg { display: inline-flex; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 3px; }
  .seg-btn {
    border: 0; background: transparent; color: var(--color-text-muted); cursor: pointer;
    font-family: inherit; font-size: var(--text-xs); font-weight: 600; padding: 5px 14px; border-radius: var(--radius-full);
    transition: all var(--dur-fast) var(--ease-out);
  }
  .seg-btn:hover { color: var(--color-text); }
  .seg-btn.active { background: var(--color-primary-dim); color: var(--color-primary); box-shadow: inset 0 0 0 1px var(--color-primary-glow); }
  .seg-btn.today.active { background: var(--color-danger-dim); color: hsl(0 72% 71%); box-shadow: inset 0 0 0 1px hsl(0 72% 51% / 0.4); }

  .app-frame {
    display: flex; height: 620px; border: 1px solid var(--color-border);
    border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-lg);
    background: var(--color-bg);
  }

  /* ── Nav panel ─────────────────────────────────────────── */
  .nav-panel {
    position: relative; width: 256px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--color-bg-elev1); border-right: 1px solid var(--color-border);
    transition: width var(--dur-slow) var(--ease-out); overflow: visible;
  }
  .nav-panel.collapsed { width: 64px; }

  .np-toggle {
    position: absolute; top: 15px; z-index: 20; width: 32px; height: 32px; display: grid; place-items: center;
    border: 0; border-radius: var(--radius-md); background: transparent; color: var(--color-text-muted);
    cursor: pointer; transition: all var(--dur-base) var(--ease-out); right: 12px;
  }
  .nav-panel.collapsed .np-toggle { right: auto; left: 16px; }
  .np-toggle:hover { background: var(--color-accent); color: var(--color-text); }
  .np-toggle .tg-close { display: block; }
  .np-toggle .tg-open { display: none; }
  .nav-panel.collapsed .np-toggle .tg-close { display: none; }
  .nav-panel.collapsed .np-toggle .tg-open { display: block; }

  .np-header { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 16px; flex-shrink: 0; }
  .nav-panel.collapsed .np-header { justify-content: flex-start; padding: 0 16px; }
  .np-logo { width: 32px; height: 32px; border-radius: var(--radius-md); display: grid; place-items: center;
    background: linear-gradient(135deg, var(--color-primary-strong), var(--color-accent-violet));
    box-shadow: 0 2px 10px hsl(239 84% 67% / 0.35); flex-shrink: 0; }
  .np-logo svg { width: 17px; height: 17px; color: #fff; }
  .np-wordmark { font-family: var(--font-headline); font-weight: 600; font-size: 15px; letter-spacing: -0.01em;
    color: var(--color-text); white-space: nowrap; }

  .np-nav { padding: 4px 0 6px; display: flex; flex-direction: column; gap: 2px; }
  .np-item {
    position: relative; display: flex; align-items: center; gap: 12px; height: 40px; margin: 0 12px;
    padding: 0 10px; border: 0; border-radius: var(--radius-md); background: transparent;
    color: var(--color-text-muted); cursor: pointer; font-family: inherit; font-size: var(--text-sm);
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .np-item:hover { background: var(--color-accent); color: var(--color-text); }
  .np-item.active { background: var(--color-primary-dim); color: var(--color-primary); font-weight: 500; }
  .np-item svg { width: 19px; height: 19px; flex-shrink: 0; }
  .nav-panel.collapsed .np-item { margin: 0 auto; width: 40px; padding: 0; justify-content: center; }

  /* Rail actions (New Chat / Search / Recents) */
  .np-actions {
    margin: 8px 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
    border-top: 1px solid var(--color-border-soft); border-bottom: 1px solid var(--color-border-soft);
    transition: background var(--dur-base);
  }
  .np-newchat {
    position: relative; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px;
    border: 1px solid var(--color-primary-glow); border-radius: var(--radius-md);
    background: var(--color-primary-dim); color: var(--color-primary); font-weight: 600; font-size: var(--text-sm);
    font-family: inherit; cursor: pointer; transition: all var(--dur-fast) var(--ease-out);
  }
  .np-newchat:hover { background: hsl(239 100% 82% / 0.22); box-shadow: var(--shadow-glow-primary); }
  .np-newchat svg { width: 17px; height: 17px; flex-shrink: 0; }
  .nav-panel.collapsed .np-newchat { width: 40px; margin: 0 auto; padding: 0; justify-content: center; }

  .np-search-input { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px;
    border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); }
  .np-search-input svg { width: 15px; height: 15px; color: var(--color-text-dim); flex-shrink: 0; }
  .np-search-input input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
    color: var(--color-text); font-family: inherit; font-size: var(--text-sm); }
  .np-search-input input::placeholder { color: var(--color-text-dim); }

  .np-rail-btn {
    position: relative; width: 40px; height: 40px; margin: 0 auto; display: flex; align-items: center;
    justify-content: center; border: 1px solid var(--color-border); border-radius: var(--radius-md);
    background: var(--color-surface); color: var(--color-text-muted); cursor: pointer;
    transition: all var(--dur-fast) var(--ease-out);
  }
  .np-rail-btn:hover { background: var(--color-accent); color: var(--color-text); border-color: var(--color-primary-glow); }
  .np-rail-btn svg { width: 17px; height: 17px; }

  /* show/hide by collapse state */
  .only-collapsed { display: none !important; }
  .nav-panel.collapsed .only-collapsed { display: flex !important; }
  .nav-panel.collapsed .only-expanded { display: none !important; }

  /* Threads */
  .np-threads { flex: 1; overflow-y: auto; padding: 4px 12px 12px; transition: opacity var(--dur-base); }
  .nav-panel.collapsed .np-threads { opacity: 0; pointer-events: none; }
  .th-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 8px;
    border-bottom: 1px solid var(--color-border-soft); margin-bottom: 6px; }
  .th-head > span:first-child { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--color-text-muted); }
  .th-count { font-size: 10px; font-family: var(--font-mono); color: var(--color-text-dim); background: var(--color-muted); padding: 1px 7px; border-radius: var(--radius-full); }
  .th-list { display: flex; flex-direction: column; gap: 1px; }
  .th-row { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left;
    padding: 8px 10px; border: 0; border-radius: var(--radius-md); background: transparent; cursor: pointer;
    color: var(--color-text-muted); font-family: inherit; transition: all var(--dur-fast) var(--ease-out); }
  .th-row:hover { background: var(--color-accent); color: var(--color-text); }
  .th-row.active { background: var(--color-primary-dim); }
  .th-title { font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; color: inherit; }
  .th-folder { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--color-text-dim); }
  .th-folder svg { width: 11px; height: 11px; }

  /* Footer */
  .np-footer { flex-shrink: 0; padding: 12px; border-top: 1px solid var(--color-border-soft);
    display: flex; align-items: center; gap: 10px; }
  .nav-panel.collapsed .np-footer { justify-content: center; padding: 12px 0; }
  .np-avatar { width: 30px; height: 30px; border-radius: var(--radius-full); flex-shrink: 0; display: grid;
    place-items: center; font-size: 11px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--color-accent-violet), var(--color-primary-strong)); }
  .np-acct-info { line-height: 1.15; overflow: hidden; }
  .np-acct-name { font-size: var(--text-sm); color: var(--color-text); white-space: nowrap; }
  .np-acct-sub { font-size: 10px; color: var(--color-text-dim); white-space: nowrap; }
  .np-foot-btn { margin-left: auto; width: 30px; height: 30px; display: grid; place-items: center; border: 0;
    border-radius: var(--radius-md); background: transparent; color: var(--color-text-muted); cursor: pointer; transition: all var(--dur-fast); }
  .np-foot-btn:hover { background: var(--color-accent); color: var(--color-text); }
  .np-foot-btn svg { width: 17px; height: 17px; }

  /* Labels hidden when collapsed */
  .np-label { transition: opacity var(--dur-fast) var(--ease-out); }
  .nav-panel.collapsed .np-label { display: none; }

  /* Tooltips (collapsed hover) */
  .tip { position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%) translateX(-4px);
    background: var(--color-surface-hi); border: 1px solid var(--color-border); color: var(--color-text);
    font-size: var(--text-xs); padding: 5px 9px; border-radius: 6px; white-space: nowrap; opacity: 0;
    pointer-events: none; transition: all var(--dur-fast) var(--ease-out); box-shadow: var(--shadow-md); z-index: 70; }
  .nav-panel:not(.collapsed) .tip { display: none; }
  .nav-panel.collapsed .np-item:hover .tip,
  .nav-panel.collapsed .np-newchat:hover .tip,
  .nav-panel.collapsed .np-rail-btn:hover .tip { opacity: 1; transform: translateY(-50%); }
  .np-recents:hover .tip { opacity: 0 !important; } /* flyout replaces tip */

  /* Recents flyout (variant C) */
  .recents-flyout { position: absolute; left: calc(100% + 12px); top: -6px; width: 250px; padding: 8px;
    background: var(--color-surface-hi); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); opacity: 0; transform: translateX(-6px); pointer-events: none;
    transition: all var(--dur-base) var(--ease-out); z-index: 65; text-align: left; }
  .np-recents:hover .recents-flyout, .recents-flyout:hover { opacity: 1; transform: none; pointer-events: auto; }
  .fly-head { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--color-text-dim); padding: 4px 8px 8px; }
  .fly-row { display: block; width: 100%; text-align: left; padding: 8px 8px; border: 0; border-radius: var(--radius-sm);
    background: transparent; color: var(--color-text-muted); font-family: inherit; font-size: var(--text-sm);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: all var(--dur-fast); }
  .fly-row:hover { background: var(--color-accent); color: var(--color-text); }
  .fly-foot { padding: 8px 8px 4px; margin-top: 4px; border-top: 1px solid var(--color-border-soft); }
  .fly-foot button { border: 0; background: transparent; color: var(--color-primary); font-family: inherit;
    font-size: var(--text-xs); font-weight: 600; cursor: pointer; padding: 0; }

  /* ── TODAY (broken) mode — reproduce the real bug ─────────── */
  /* Today: collapsed rail loses New Chat / Search / Recents (they live inside the opacity-0 chats region). */
  .frame.show-today .nav-panel.collapsed .np-actions { visibility: hidden; }
  .frame.show-today .app-frame { box-shadow: 0 0 0 1px hsl(0 72% 51% / 0.35), var(--shadow-lg); }
  .today-flag { display: none; }
  .frame.show-today .today-flag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs);
    color: hsl(0 72% 71%); background: var(--color-danger-dim); border: 1px solid hsl(0 72% 51% / 0.3);
    padding: 3px 10px; border-radius: var(--radius-full); }

  /* ── Chat context (faint, right) ─────────────────────────── */
  .chat-context { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--color-bg); opacity: 0.9; }
  .cc-top { height: 56px; border-bottom: 1px solid var(--color-border-soft); display: flex; align-items: center; gap: 10px; padding: 0 20px; }
  .cc-chip { font-size: var(--text-xs); color: var(--color-text-muted); background: var(--color-surface); border: 1px solid var(--color-border); padding: 4px 10px; border-radius: var(--radius-full); }
  .cc-body { flex: 1; display: grid; place-items: center; padding: 24px; }
  .cc-hint { text-align: center; color: var(--color-text-dim); max-width: 340px; }
  .cc-hint h3 { font-family: var(--font-headline); font-weight: 600; color: var(--color-text-muted); font-size: var(--text-lg); margin: 0 0 6px; }
  .cc-hint p { margin: 0; font-size: var(--text-sm); }
  .cc-composer { margin: 0 20px 22px; height: 48px; border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    background: var(--color-surface); display: flex; align-items: center; padding: 0 16px; color: var(--color-text-dim); font-size: var(--text-sm); }

  /* Toast */
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 16px); opacity: 0;
    background: var(--color-surface-hi); border: 1px solid var(--color-primary-glow); color: var(--color-text);
    font-size: var(--text-sm); padding: 10px 18px; border-radius: var(--radius-full); box-shadow: var(--shadow-lg);
    pointer-events: none; transition: all var(--dur-base) var(--ease-out); z-index: 9998; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="variant-nav">
  <span class="label">Sketch 076 · Rail</span>
  <button class="variant-tab" onclick="showVariant('a', event)">A · New Chat only</button>
  <button class="variant-tab active" onclick="showVariant('b', event)">B · + Search <span class="star">★</span></button>
  <button class="variant-tab" onclick="showVariant('c', event)">C · + Recents peek</button>
</div>

<div id="stage">
  <div id="variant-a" class="variant" style="display:none"></div>
  <div id="variant-b" class="variant"></div>
  <div id="variant-c" class="variant" style="display:none"></div>
</div>

<div class="sketch-toolbar">
  <span>view</span>
  <button onclick="setVp('375px')">▯</button>
  <button onclick="setVp('900px')">▭</button>
  <button onclick="setVp('none')">▬</button>
  <select id="theme-switcher" onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">Deep Midnight</option>
  </select>
</div>

<div id="toast"></div>

<script>
/* ── Icons (lucide-style) ─────────────────────────────────── */
const P = {
  panelClose: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 9l-3 3 3 3"/>',
  panelOpen:  '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M13 9l3 3-3 3"/>',
  sparkles:   '<path d="M12 3l1.6 5.1L19 10l-5.4 1.9L12 17l-1.6-5.1L5 10l5.4-1.9z"/>',
  message:    '<path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>',
  file:       '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  skills:     '<path d="M12 3l1.6 5.1L19 10l-5.4 1.9L12 17l-1.6-5.1L5 10l5.4-1.9z"/><path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z"/>',
  workflow:   '<rect x="3" y="3" width="8" height="8" rx="2"/><path d="M7 11v3a2 2 0 0 0 2 2h4"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
  shield:     '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  settings:   '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  plus:       '<path d="M12 5v14M5 12h14"/>',
  search:     '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  clock:      '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  folder:     '<path d="M4 20a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4.9l2 3H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2z"/>',
  moon:       '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
};
function svg(name, cls) {
  return '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+P[name]+'</svg>';
}

/* ── Data (real Thread shape: title / folder_id / updated_at) ─ */
const THREADS = [
  { t:"Q3 revenue variance analysis",        f:"Finance" },
  { t:"Debug embedding drift after re-index", f:"Engineering" },
  { t:"Draft investor update — July",         f:"Finance" },
  { t:"Summarize the SOC 2 controls doc",     f:"Product" },
  { t:"Compare GPT-5.6 vs Opus for extraction", f:"Engineering" },
  { t:"Why is retrieval missing figures?",    f:"Engineering" },
  { t:"Onboarding checklist for new PM",      f:"Product" },
  { t:"Weekly metrics rollup",                f:"Finance" },
  { t:"Customer churn hypotheses",            f:"Product" },
  { t:"Board deck outline",                   f:"Finance" },
  { t:"Refactor ingestion pipeline notes",    f:"Engineering" },
  { t:"Fix citation footer overflow",         f:"Engineering" },
  { t:"Grocery + travel planning",            f:"Personal" }
];
const NAV = [
  ["message","Chat",true], ["file","Documents",false], ["skills","Skills",false],
  ["workflow","Workflows",false], ["shield","Governance",false], ["settings","Settings",false]
];

/* ── Builders ─────────────────────────────────────────────── */
function panelHTML(v, opts) {
  const nav = NAV.map(([ic,label,active]) =>
    `<button class="np-item ${active?'active':''}">${svg(ic)}<span class="np-label">${label}</span><span class="tip">${label}</span></button>`
  ).join('');

  const rows = THREADS.map((t,i) =>
    `<button class="th-row ${i===0?'active':''}" data-title="${t.t.toLowerCase()}">
       <span class="th-title">${t.t}</span>
       <span class="th-folder">${svg('folder')}${t.f}</span>
     </button>`
  ).join('');

  const searchBlock = opts.search ? `
    <div class="np-search-input only-expanded">${svg('search')}<input type="text" placeholder="Search chats…" oninput="filterThreads('${v}', this.value)"></div>
    <button class="np-rail-btn only-collapsed" onclick="expandSearch('${v}')" aria-label="Search chats">${svg('search')}<span class="tip">Search chats</span></button>` : '';

  const recentsBlock = opts.recents ? `
    <button class="np-rail-btn np-recents only-collapsed" aria-label="Recent chats">${svg('clock')}<span class="tip">Recent</span>
      <div class="recents-flyout" onclick="event.stopPropagation()">
        <div class="fly-head">Recent chats</div>
        ${THREADS.slice(0,6).map(t=>`<button class="fly-row" onclick="openThread('${t.t.replace(/'/g,"")}')">${t.t}</button>`).join('')}
        <div class="fly-foot"><button onclick="toggleCollapse('${v}')">See all ${THREADS.length} →</button></div>
      </div>
    </button>` : '';

  return `
  <aside class="nav-panel collapsed" id="np-${v}">
    <button class="np-toggle" onclick="toggleCollapse('${v}')" aria-label="Toggle navigation">${svg('panelClose','tg-close')}${svg('panelOpen','tg-open')}</button>

    <div class="np-header">
      <div class="np-logo">${svg('sparkles')}</div>
      <span class="np-wordmark np-label">Agentic RAG</span>
    </div>

    <div class="np-nav">${nav}</div>

    <div class="np-actions">
      <button class="np-newchat" onclick="newChat()">${svg('plus')}<span class="np-label">New Chat</span><span class="tip">New Chat</span></button>
      ${searchBlock}
      ${recentsBlock}
    </div>

    <div class="np-threads scrollbar-thin">
      <div class="th-head"><span>Chats</span><span class="th-count">${THREADS.length}</span></div>
      <div class="th-list" id="thl-${v}">${rows}</div>
    </div>

    <div class="np-footer">
      <div class="np-avatar">FD</div>
      <div class="np-acct-info np-label"><div class="np-acct-name">fhdmrd</div><div class="np-acct-sub">Operator</div></div>
      <button class="np-foot-btn np-label" title="Theme" aria-label="Toggle theme">${svg('moon')}</button>
    </div>
  </aside>`;
}

function frameHTML(v, opts) {
  return `
  <div class="frame" id="frame-${v}">
    <div class="frame-caption">
      <span class="fc-note">Panel starts <b>collapsed</b> — hit <span class="kbd">›</span> to expand. New Chat${opts.search?' + Search':''}${opts.recents?' + Recents':''} stay reachable in the rail.
        <span class="today-flag">${svg('clock')} Today: New Chat is gone until you expand</span>
      </span>
      <div class="seg">
        <button class="seg-btn active" onclick="setMode('${v}','proposed',this)">Proposed rail</button>
        <button class="seg-btn today" onclick="setMode('${v}','today',this)">Today (broken)</button>
      </div>
    </div>
    <div class="app-frame">
      ${panelHTML(v, opts)}
      <main class="chat-context">
        <div class="cc-top"><span class="cc-chip">Deep · Claude Opus 4.8</span><span class="cc-chip">General</span></div>
        <div class="cc-body"><div class="cc-hint"><h3>Q3 revenue variance analysis</h3><p>Your knowledge base is connected. Ask anything, or start a new chat from the rail.</p></div></div>
        <div class="cc-composer">Ask anything…</div>
      </main>
    </div>
  </div>`;
}

/* ── Mount ────────────────────────────────────────────────── */
document.getElementById('variant-a').innerHTML = frameHTML('a', { search:false, recents:false });
document.getElementById('variant-b').innerHTML = frameHTML('b', { search:true,  recents:false });
document.getElementById('variant-c').innerHTML = frameHTML('c', { search:true,  recents:true  });

/* ── Interactivity ────────────────────────────────────────── */
function toggleCollapse(v) { document.getElementById('np-'+v).classList.toggle('collapsed'); }
function expandSearch(v) {
  const np = document.getElementById('np-'+v);
  np.classList.remove('collapsed');
  setTimeout(() => { const i = np.querySelector('.np-search-input input'); if (i) i.focus(); }, 340);
}
function setMode(v, mode, btn) {
  const frame = document.getElementById('frame-'+v);
  frame.classList.toggle('show-today', mode === 'today');
  btn.parentNode.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (mode === 'today') document.getElementById('np-'+v).classList.add('collapsed');
}
function filterThreads(v, q) {
  q = (q || '').trim().toLowerCase();
  document.querySelectorAll('#thl-'+v+' .th-row').forEach(r => {
    r.style.display = (!q || r.dataset.title.includes(q)) ? '' : 'none';
  });
}
function newChat() { toast('New chat started'); }
function openThread(name) { toast('Opened: ' + name); }
function showVariant(id, ev) {
  ['a','b','c'].forEach(x => document.getElementById('variant-'+x).style.display = 'none');
  document.getElementById('variant-'+id).style.display = 'block';
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  if (ev) ev.target.classList.add('active');
}
function setVp(w) { document.getElementById('stage').style.maxWidth = w; }
let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 1600);
}
</script>
</body>
</html>
