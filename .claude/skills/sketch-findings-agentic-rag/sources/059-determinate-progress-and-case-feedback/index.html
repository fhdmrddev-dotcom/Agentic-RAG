<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 059 — Determinate Progress &amp; Case Feedback</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  .stage { max-width: 1080px; margin: 0 auto; padding: 20px; transition: max-width var(--dur-base) var(--ease-out); }
  .context-strip {
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding: 10px 20px;
    border-bottom:1px solid var(--color-border-soft); background: var(--color-bg-elev1); font-size: var(--text-xs);
  }
  .context-strip .q { color: var(--color-text-muted); max-width: 700px; }
  .sim-controls { margin-left:auto; display:flex; gap:6px; }
  .sim-btn {
    background: var(--color-accent); color: var(--color-text); border:1px solid var(--color-border);
    border-radius: var(--radius-sm); padding: 4px 10px; font-size: var(--text-xs); cursor:pointer; font-family: var(--font-sans);
  }
  .sim-btn:hover { border-color: var(--color-primary-glow); color: var(--color-primary); }
  .sim-btn.primary { background: var(--color-primary-dim); color: var(--color-primary); border-color: var(--color-primary-glow); }

  /* studio shell */
  .studio { border:1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); overflow:hidden; box-shadow: var(--shadow-md); }
  .studio-header { display:flex; align-items:center; gap:12px; padding: 12px 18px; border-bottom:1px solid var(--color-border-soft); background: var(--color-bg-elev1); }
  .back-link { color: var(--color-text-dim); font-size: var(--text-sm); cursor:pointer; }
  .skill-name { font-family: var(--font-headline); font-weight:700; font-size: var(--text-md); }
  .ver-chip { font-family: var(--font-mono); font-size:10px; color: var(--color-text-muted); background: var(--color-muted); padding:2px 7px; border-radius: var(--radius-full); }
  .live-chip { font-size:9px; font-weight:700; letter-spacing:.08em; color: var(--color-success); background: var(--color-success-dim); padding:2px 8px; border-radius: var(--radius-full); }
  .gate-strip { margin-left:auto; font-size: var(--text-xs); color: var(--color-text-muted); }
  .gate-strip .ok { color: var(--color-success); }
  .studio-tabs { display:flex; gap:2px; padding: 0 14px; border-bottom:1px solid var(--color-border-soft); background: var(--color-bg-elev1); }
  .studio-tab { padding: 9px 14px; font-size: var(--text-sm); color: var(--color-text-muted); cursor:pointer; border:none; background:none; border-bottom:2px solid transparent; font-family: var(--font-sans); }
  .studio-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight:600; }
  .tab-body { padding: 16px 18px 22px; }

  .runbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:16px; }
  .runbar select { background: var(--color-bg); color: var(--color-text); border:1px solid var(--color-border); border-radius: var(--radius-sm); padding: 5px 8px; font-size: var(--text-xs); }
  .btn { display:inline-flex; align-items:center; gap:6px; border-radius: var(--radius-sm); cursor:pointer; font-size: var(--text-xs); font-weight:600; padding: 6px 12px; border:1px solid transparent; font-family: var(--font-sans); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background: var(--color-primary-strong); color:#fff; }

  /* run rows */
  .history { display:flex; flex-direction:column; gap:8px; }
  .run-row {
    display:flex; align-items:center; gap:10px; width:100%; border:1px solid var(--color-border);
    background: var(--color-bg); padding: 9px 12px; border-radius: var(--radius-md); cursor:pointer;
    text-align:left; color: var(--color-text); font-family: var(--font-sans); font-size: var(--text-xs);
  }
  .run-row:hover { border-color: var(--color-primary-glow); }
  .run-row.open { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .run-row.livey { border-color: var(--color-primary-glow); }
  .run-body { border:1px solid var(--color-border); border-top:none; background: var(--color-muted); border-radius: 0 0 var(--radius-md) var(--radius-md); padding: 12px; font-size: var(--text-xs); }
  .pmark { width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; flex:none; font-family: var(--font-mono); background:#D97757; }
  .model-name { font-weight:600; }
  .ver { font-family: var(--font-mono); font-size:10px; color: var(--color-text-dim); }
  .rollup { margin-left:auto; display:flex; align-items:center; gap:10px; font-weight:600; font-size:11px; white-space:nowrap; }
  .rollup .dur { font-family: var(--font-mono); font-weight:400; color: var(--color-text-dim); font-size:10px; }
  .ok-t { color: var(--color-success); } .mix-t { color: var(--color-warning); } .bad-t { color: var(--color-danger); }
  .run-t { color: var(--color-primary); display:inline-flex; align-items:center; gap:6px; }
  .pulse-dot { width:6px; height:6px; border-radius:50%; background: var(--color-primary); animation: brandPulse 1.5s infinite; }

  /* A: thin determinate bar in-row */
  .row-live { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
  .row-live .lbl { display:flex; justify-content:space-between; font-size:10px; color: var(--color-text-muted); font-family: var(--font-mono); }
  .ubar { height:3px; border-radius:2px; background: var(--color-primary-dim); overflow:hidden; }
  .ubar > i { display:block; height:100%; background: linear-gradient(90deg, var(--color-primary-strong), var(--color-accent-violet)); transition: width .4s var(--ease-out); }

  /* B: segmented unit pips */
  .pips { display:flex; align-items:center; gap:3px; flex:1; }
  .pip-group { display:flex; gap:2px; padding:2px 3px; border-radius:4px; background: var(--color-bg-elev1); border:1px solid var(--color-border-soft); }
  .pip { width:10px; height:10px; border-radius:3px; background: var(--color-muted); border:1px solid var(--color-border); transition: all var(--dur-base) var(--ease-out); }
  .pip.done { background: var(--color-primary-strong); border-color: transparent; }
  .pip.act { border-color: var(--color-primary); animation: pulseGlow 1.4s infinite; }
  .pip.judge { width:13px; height:13px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:7px; }
  .pip.judge.done { background: var(--color-accent-violet); }
  .pips .cap { font-family: var(--font-mono); font-size:10px; color: var(--color-text-muted); margin-left:6px; }

  /* live checklist (expanded body) */
  .check { display:flex; flex-direction:column; gap:3px; font-family: var(--font-mono); font-size:11px; }
  .check .cl { display:flex; align-items:center; gap:8px; color: var(--color-text-muted); }
  .check .cl .st { width:14px; text-align:center; }
  .check .cl.done .st { color: var(--color-success); }
  .check .cl.act { color: var(--color-text); }
  .check .cl.act .st { color: var(--color-primary); }
  .check .cl .d { margin-left:auto; color: var(--color-text-dim); font-size:10px; }
  .spin { display:inline-block; animation: brandPulse 1s infinite; }

  /* finished case cards (real RunCaseDetail anatomy) */
  .case-card { border-top:1px solid var(--color-border-soft); padding-top:10px; margin-top:10px; }
  .case-card:first-child { border-top:none; margin-top:0; padding-top:0; }
  .case-h { display:flex; align-items:baseline; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .case-h .cp { font-weight:600; font-size: var(--text-xs); }
  .case-h .exp { font-size:10px; color: var(--color-text-dim); width:100%; }
  .arms { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (max-width:640px){ .arms { grid-template-columns:1fr; } }
  .arm { border:1px solid var(--color-border); border-radius: var(--radius-md); padding: 9px 10px; display:flex; flex-direction:column; gap:5px; background: var(--color-bg); }
  .arm.with { border-color: hsl(239 100% 82% / 0.3); background: hsl(239 100% 82% / 0.04); }
  .arm-h { display:flex; align-items:center; gap:8px; }
  .arm-lbl { font-size:9px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color: var(--color-text-muted); }
  .arm.with .arm-lbl { color: var(--color-primary); }
  .vchip { font-size:9px; font-weight:700; padding:1px 8px; border-radius: var(--radius-full); }
  .v-pass { background: var(--color-success-dim); color: var(--color-success); }
  .v-fail { background: var(--color-danger-dim); color: var(--color-danger); }
  .arm .why { font-size:10px; color: var(--color-text-muted); line-height:1.5; }
  .arm .why b { color: var(--color-text); font-weight:600; }
  .arm .meta { font-family: var(--font-mono); font-size:9px; color: var(--color-text-dim); display:flex; gap:10px; margin-top:auto; }
  .arm .meta .dur-new { color: var(--color-primary); }
  .rate { display:flex; align-items:center; gap:5px; font-size:9px; color: var(--color-text-dim); text-transform:uppercase; letter-spacing:.05em; }
  .rate button { background:none; border:1px solid var(--color-border); border-radius:4px; color: var(--color-text-dim); cursor:pointer; padding:1px 5px; font-size:10px; }
  .rate button:hover { color: var(--color-text); }
  .rate button.on-up { border-color: var(--color-success); color: var(--color-success); }

  /* case_feedback treatments */
  .fb-inline {
    border-left:2px dashed var(--color-accent-violet); padding: 5px 10px; margin: 6px 0 2px;
    font-size:11px; color: var(--color-text-muted); background: hsl(258 90% 66% / 0.05); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .fb-inline b { color: var(--color-accent-violet); font-weight:600; }
  .fb-tag {
    font-size:9px; font-weight:700; padding:1px 8px; border-radius: var(--radius-full); cursor:pointer;
    background: hsl(258 90% 66% / 0.12); color: var(--color-accent-violet); border:1px solid hsl(258 90% 66% / 0.3);
  }
  .fb-digest { margin-top:12px; border:1px solid hsl(258 90% 66% / 0.25); background: hsl(258 90% 66% / 0.05); border-radius: var(--radius-md); padding: 10px 12px; }
  .fb-digest h5 { margin:0 0 6px; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color: var(--color-accent-violet); }
  .fb-digest h5 span { text-transform:none; letter-spacing:0; color: var(--color-text-dim); font-weight:400; }
  .fb-digest .fl { display:flex; gap:8px; font-size:11px; color: var(--color-text-muted); padding:3px 0; line-height:1.5; }
  .fb-digest .fl .n { font-family: var(--font-mono); color: var(--color-text-dim); flex:none; }
  .judge-line { font-family: var(--font-mono); font-size:10px; color: var(--color-text-dim); margin-bottom:8px; }
</style>
</head>
<body>

<div class="variant-nav">
  <span class="label">Sketch 059 · Determinate Progress &amp; Case Feedback</span>
  <button class="variant-tab active" onclick="showVariant('a', event)">A: Thin unit bar <span class="star">★</span></button>
  <button class="variant-tab" onclick="showVariant('b', event)">B: Segmented pips</button>
  <button class="variant-tab" onclick="showVariant('c', event)">C: Quiet % + rich checklist</button>
</div>

<div class="context-strip">
  <span class="q"><b>Design question:</b> a running eval row gets DETERMINATE progress (units = cases × 2 arms + judge, EVAL-05c), every arm gets a wall-clock duration (EVAL-05e), and the judge's never-blocking <code>case_feedback</code> (EVAL-05d) lands per case. Where does each live?</span>
  <span class="sim-controls">
    <button class="sim-btn primary" onclick="startRun()">▶ Start a run</button>
    <button class="sim-btn" onclick="finishRun()">⏩ Finish now</button>
    <button class="sim-btn" onclick="resetRun()">↺ Reset</button>
  </span>
</div>

<div class="stage" id="stage">
  <div id="variant-a" class="variant"></div>
  <div id="variant-b" class="variant" style="display:none"></div>
  <div id="variant-c" class="variant" style="display:none"></div>
</div>

<div class="sketch-toolbar">
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">Aether Deep Midnight</option>
  </select>
  <button onclick="setW(375)">📱</button>
  <button onclick="setW(768)">▤</button>
  <button onclick="setW(0)">🖥</button>
</div>

<script>
/* Units: c1-with, c1-without, c2-with, c2-without, c3-with, c3-without, judge = 7 */
const CASES = [
  { prompt:'Summarize the Q3 enterprise refund policy and cite its source document',
    exp:'Cites refund-policy-2026.pdf; states the 45-day window' },
  { prompt:'A customer asks for a refund on day 50 — draft the reply',
    exp:'Declines per policy; offers the store-credit escalation path' },
  { prompt:'List the two exceptions to the standard refund window',
    exp:'Names hardware-fault + billing-error exceptions only' },
];
const UNIT_LABELS = ['case 1/3 · with arm','case 1/3 · without arm','case 2/3 · with arm','case 2/3 · without arm','case 3/3 · with arm','case 3/3 · without arm','judge grading 6 arms'];
const UNITS = 7;
// live per-unit durations, revealed as each arm completes (EVAL-05e visible DURING the run)
const LIVE_DUR = ['0:21','0:14','0:26','0:17','0:19','0:15','0:18'];

// The finished exemplar run — verdicts + per-arm durations + judge case_feedback.
const FIN = {
  model:'claude-haiku-4-5', rollup:'2/3 passed', tone:'mix-t', total:'1:12',
  cases:[
    { w:{v:'PASS',s:0.88,why:'Cited <b>refund-policy-2026.pdf</b> and stated the 45-day window verbatim.',dur:'0:21',tok:'812 → 214'},
      o:{v:'FAIL',s:0.42,why:'Answered from memory — no citation, window stated as “about a month.”',dur:'0:14',tok:'644 → 187'},
      fb:null },
    { w:{v:'FAIL',s:0.55,why:'Declined the refund but skipped the escalation path the expected behavior names.',dur:'0:26',tok:'901 → 244'},
      o:{v:'FAIL',s:0.49,why:'Declined with no policy grounding.',dur:'0:17',tok:'702 → 198'},
      fb:'The expected behavior is hard to anchor — “offers the store-credit escalation path” names an outcome the source document describes in three different ways. Consider quoting the exact clause the reply must contain.' },
    { w:{v:'PASS',s:0.86,why:'Named both exceptions with sources.',dur:'0:19',tok:'788 → 165'},
      o:{v:'PASS',s:0.79,why:'Named both exceptions correctly without the skill.',dur:'0:15',tok:'610 → 149'},
      fb:'Both arms pass this case comfortably — it does not discriminate skill from no-skill. A harder variant would ask for the exception clauses verbatim with their effective dates.' },
  ]
};

let live = null, timer = null;
const open = { a:{fin:true}, b:{fin:true}, c:{fin:true} };

function showVariant(id, ev) {
  document.querySelectorAll('.variant').forEach(x=>x.style.display='none');
  document.querySelectorAll('.variant-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('variant-'+id).style.display='block';
  ev.target.classList.add('active');
}

/* ── shared fragments ── */
function shell(v, inner) {
  return `<div class="studio">
    <div class="studio-header">
      <span class="back-link">‹ Skills</span><span class="skill-name">doc-summarizer</span>
      <span class="ver-chip">v4</span><span class="live-chip">LIVE</span>
      <span class="gate-strip"><span class="ok">✓</span> Gate met · eval passed on v4</span>
    </div>
    <div class="studio-tabs"><button class="studio-tab active">Evals</button><button class="studio-tab">Triggering</button><button class="studio-tab">Versions</button></div>
    <div class="tab-body">
      <div class="runbar">
        <select><option>Anthropic</option></select><select><option>claude-haiku-4-5</option></select>
        <button class="btn btn-primary" ${live?'disabled':''} onclick="startRun()">▶ Run eval</button>
        ${live?'<span style="font-size:10px;color:var(--color-text-dim)">a run is live — one eval per skill</span>':''}
      </div>
      <div class="history">${inner}</div>
    </div>
  </div>`;
}

function armCard(kind, a, showRate) {
  return `<div class="arm ${kind==='with'?'with':''}">
    <div class="arm-h"><span class="arm-lbl">${kind==='with'?'With skill':'Without skill'}</span>
      <span class="vchip ${a.v==='PASS'?'v-pass':'v-fail'}">${a.v} · ${a.s.toFixed(2)}</span></div>
    <p class="why"><b>Judge:</b> ${a.why}</p>
    <div class="meta"><span>${a.tok} tok</span><span class="dur-new">⏱ ${a.dur}</span>
      ${showRate?`<span class="rate" style="margin-left:auto">your rating
        <button onclick="this.classList.toggle('on-up');event.stopPropagation()">👍</button><button onclick="event.stopPropagation()">👎</button></span>`:''}</div>
  </div>`;
}

/* finished body — case_feedback placement varies per variant */
function finBody(v) {
  const cards = FIN.cases.map((c,i) => {
    let fbTop = '', fbTag = '', fbInline = '';
    if (c.fb) {
      if (v==='a') fbInline = `<div class="fb-inline"><b>◇ Judge on this case:</b> ${c.fb} <span style="color:var(--color-text-dim)">(feedback only — never blocks the run)</span></div>`;
      if (v==='b') fbTag = `<span class="fb-tag" onclick="event.stopPropagation();toggleFb('${v}',${i})">◇ weak case ▾</span>`;
    }
    const fbOpenB = v==='b' && open.b['fb'+i] ? `<div class="fb-inline"><b>◇ Judge on this case:</b> ${c.fb}</div>` : '';
    return `<div class="case-card">
      <div class="case-h"><span class="cp">${c.prompt}</span>${fbTag}<span class="exp">${c.exp}</span></div>
      ${fbInline}${fbOpenB}
      <div class="arms">${armCard('with', c.w, true)}${armCard('without', c.o, false)}</div>
    </div>`;
  }).join('');
  const digest = v==='c' ? `<div class="fb-digest">
      <h5>◇ Case quality · <span>judge feedback — advisory, never blocks a run</span></h5>
      ${FIN.cases.map((c,i)=>c.fb?`<div class="fl"><span class="n">case ${i+1}</span><span>${c.fb}</span></div>`:'').join('')}
    </div>` : '';
  return `<div class="judge-line">judge claude-opus-4-8 · graded 6 arms in 0:18 · run total ⏱ ${FIN.total}</div>${cards}${digest}`;
}

function finRow(v) {
  const isOpen = !!open[v]['fin'];
  return `<button class="run-row ${isOpen?'open':''}" onclick="toggleRow('${v}','fin')">
    <span class="pmark">A</span><span class="model-name">${FIN.model}</span><span class="ver">ver 4f2a91c8</span><span class="ver">Jul 3</span>
    <span class="rollup"><span class="${FIN.tone}">${FIN.rollup}</span><span class="dur">⏱ ${FIN.total}</span></span>
  </button>${isOpen?`<div class="run-body">${finBody(v)}</div>`:''}`;
}

/* live row per variant */
function liveRow(v) {
  if (!live) return '';
  const u = live.u;
  const pct = Math.round(u/UNITS*100);
  const lbl = u < UNITS ? UNIT_LABELS[u] : 'finalizing';
  let mid;
  if (v==='a') {
    mid = `<span class="row-live"><span class="lbl"><span>${lbl}</span><span>${u}/${UNITS} · ${pct}%</span></span><span class="ubar"><i style="width:${pct}%"></i></span></span>`;
  } else if (v==='b') {
    const pip = i => `<span class="pip ${i<u?'done':''} ${i===u?'act':''}"></span>`;
    mid = `<span class="pips">
      <span class="pip-group">${pip(0)}${pip(1)}</span>
      <span class="pip-group">${pip(2)}${pip(3)}</span>
      <span class="pip-group">${pip(4)}${pip(5)}</span>
      <span class="pip judge ${6<u?'done':''} ${u===6?'act':''}">⚖</span>
      <span class="cap">${lbl}</span></span>`;
  } else {
    mid = `<span style="flex:1"></span><span class="ver" style="font-size:10px">${lbl} · <b style="color:var(--color-text)">${u}/${UNITS} units · ${pct}%</b></span>`;
  }
  const isOpen = open[v]['live'] !== false;
  return `<button class="run-row livey ${isOpen?'open':''}" onclick="toggleRow('${v}','live',true)">
    <span class="pmark">A</span><span class="model-name">${FIN.model}</span><span class="ver">ver 4f2a91c8</span>
    ${mid}
    <span class="rollup"><span class="run-t"><span class="pulse-dot"></span>running · 0:${String(live.sec).padStart(2,'0')}</span></span>
  </button>${isOpen?`<div class="run-body">${liveChecklist()}</div>`:''}`;
}

/* the expanded live body — per-arm checklist with durations appearing as arms land */
function liveChecklist() {
  const u = live.u;
  const lines = UNIT_LABELS.map((l,i) => {
    const done = i < u, act = i === u;
    return `<div class="cl ${done?'done':''} ${act?'act':''}">
      <span class="st">${done?'✓':(act?'<span class="spin">●</span>':'·')}</span>
      <span>${l}</span>
      <span class="d">${done?('⏱ '+LIVE_DUR[i]):(act?'running…':'queued')}</span></div>`;
  }).join('');
  return `<div class="check">${lines}</div>
    <p style="margin:8px 0 0;font-size:10px;color:var(--color-text-dim)">Verdicts land when the run finalizes — no mid-run pass/fail is shown.</p>`;
}

function renderAll() {
  ['a','b','c'].forEach(v => {
    document.getElementById('variant-'+v).innerHTML = shell(v, liveRow(v) + finRow(v));
  });
}
function toggleRow(v, key, defOpen) {
  if (defOpen && open[v][key] === undefined) open[v][key] = false;
  else open[v][key] = !open[v][key];
  renderAll();
}
function toggleFb(v, i) { open.b['fb'+i] = !open.b['fb'+i]; renderAll(); }

function startRun() {
  if (live) return;
  live = { u:0, sec:0 };
  timer = setInterval(() => {
    live.sec++;
    if (live.sec % 2 === 0) live.u = Math.min(UNITS, live.u + 1);
    if (live.u >= UNITS && live.sec % 2 === 0) { finishRun(); return; }
    renderAll();
  }, 600);
  renderAll();
}
function finishRun() { if (timer) clearInterval(timer); timer = null; live = null; renderAll(); }
function resetRun() { finishRun(); ['a','b','c'].forEach(v => open[v] = {fin:true}); renderAll(); }
function setW(w){ document.getElementById('stage').style.maxWidth = w ? w+'px' : '1080px'; }

renderAll();
</script>
</body>
</html>
