<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 067 — Audit Browser (Phase 148)</title>
<link rel="stylesheet" href="../themes/default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { overflow-x: hidden; }
  #stage { margin: 0 auto; transition: max-width var(--dur-slow) var(--ease-out); }
  .variant { display: none; }
  .variant.active { display: block; animation: fadeSlideUp var(--dur-slow) var(--ease-out); }
  .variant-meta { padding: 10px 20px 0; font-size: var(--text-sm); color: var(--color-text-muted); max-width: 1080px; }
  .variant-meta b { color: var(--color-text); font-weight: 600; }

  .app-frame {
    height: calc(100vh - 118px); min-height: 680px; margin: 12px 20px 20px;
    border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    overflow: hidden; background: var(--color-bg); box-shadow: var(--shadow-lg);
    position: relative; display: flex; flex-direction: column;
  }

  /* ── locked 061-B band ── */
  .op-band { background: linear-gradient(180deg, hsl(38 92% 60% / 0.07), transparent), var(--color-bg-elev1); border-bottom: 1px solid hsl(38 92% 60% / 0.25); padding: 14px 22px 0; flex: 0 0 auto; }
  .band-top { display: flex; align-items: center; gap: 12px; }
  .band-title { display: flex; align-items: center; gap: 9px; font-family: var(--font-headline); font-weight: 800; font-size: var(--text-lg); color: var(--color-text); }
  .band-title svg { width: 18px; height: 18px; color: var(--color-warning); }
  .band-identity { font-size: var(--text-xs); color: var(--color-text-dim); }
  .band-top .spacer { flex: 1; }
  .op-chip { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: var(--color-warning); background: var(--color-warning-dim); border: 1px solid hsl(38 92% 60% / 0.3); border-radius: var(--radius-sm); padding: 2px 7px; }
  .rec-marker { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--color-text-dim); white-space: nowrap; border-radius: var(--radius-full); padding: 3px 10px; transition: all var(--dur-base) var(--ease-out); }
  .rec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-success); box-shadow: 0 0 6px hsl(142 71% 45% / 0.6); flex: 0 0 6px; }
  .rec-marker.flash { background: var(--color-warning-dim); color: var(--color-warning); }
  .rec-marker.flash .rec-dot { background: var(--color-warning); animation: brandPulse 0.5s var(--ease-out) 2; }
  .back-link { font-size: var(--text-sm); color: var(--color-text-muted); cursor: pointer; border-radius: var(--radius-sm); padding: 4px 8px; }
  .back-link:hover { color: var(--color-text); background: var(--color-accent); }
  .band-tabs { display: flex; gap: 2px; margin-top: 12px; flex-wrap: wrap; }
  .band-tab { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; font-size: var(--text-sm); color: var(--color-text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all var(--dur-fast) var(--ease-out); user-select: none; }
  .band-tab:hover { color: var(--color-text); }
  .band-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
  .band-tab.locked { color: var(--color-text-dim); cursor: not-allowed; }
  .band-tab .lock { font-size: 10px; opacity: 0.6; }
  .band-tab .pill { font-family: var(--font-mono); font-size: 10px; background: var(--color-muted); color: var(--color-text-muted); border-radius: var(--radius-full); padding: 1px 7px; }

  .body-scroll { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .section-head { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; flex-wrap: wrap; }
  .section-head h2 { margin: 0; font-family: var(--font-headline); font-size: var(--text-lg); font-weight: 800; color: var(--color-text); }
  .live-badge { font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--color-success); background: var(--color-success-dim); border-radius: var(--radius-sm); padding: 2px 6px; }
  .head-spacer { flex: 1; }
  .sub-line { font-size: var(--text-sm); color: var(--color-text-dim); margin: 0 0 14px; }
  .sub-line b { color: var(--color-text-muted); font-weight: 600; }

  .tech-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--color-text-dim); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 3px 10px; cursor: pointer; user-select: none; transition: all var(--dur-fast) var(--ease-out); }
  .tech-toggle:hover { color: var(--color-text-muted); }
  .tech-toggle.on { color: var(--color-primary); border-color: var(--color-primary-glow); background: var(--color-primary-dim); }

  /* ── source switch ── */
  .source-switch { display: inline-flex; background: var(--color-muted); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 3px; gap: 2px; }
  .source-switch button { display: inline-flex; align-items: center; gap: 7px; background: transparent; border: none; color: var(--color-text-muted); font-family: var(--font-sans); font-size: var(--text-sm); padding: 6px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--dur-fast) var(--ease-out); }
  .source-switch button:hover { color: var(--color-text); }
  .source-switch button.on { background: var(--color-surface-hi); color: var(--color-text); font-weight: 600; box-shadow: var(--shadow-sm); }
  .source-switch .n { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-dim); }
  .src-tech { font-family: var(--font-mono); font-size: 10px; color: var(--color-accent-violet); margin-left: 8px; }

  /* ── filter strip (029-A chip heritage) ── */
  .filter-strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 14px 0 10px; }
  .f-where { font-size: var(--text-xs); color: var(--color-text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .f-chip { display: inline-flex; align-items: center; gap: 7px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 5px 12px; font-size: var(--text-sm); color: var(--color-text); cursor: pointer; transition: all var(--dur-fast) var(--ease-out); position: relative; }
  .f-chip:hover { border-color: var(--color-primary-glow); }
  .f-chip .k { color: var(--color-text-dim); }
  .f-chip .x { color: var(--color-text-dim); font-size: 12px; padding: 0 2px; border-radius: 3px; }
  .f-chip .x:hover { color: var(--color-danger); }
  .f-add { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px dashed var(--color-border); border-radius: var(--radius-full); padding: 5px 12px; font-size: var(--text-sm); color: var(--color-text-dim); cursor: pointer; }
  .f-add:hover { color: var(--color-text-muted); border-color: var(--color-text-dim); }
  .writes-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 5px 12px; font-size: var(--text-sm); color: var(--color-text-dim); cursor: pointer; user-select: none; }
  .writes-chip.on { color: var(--color-warning); border-color: hsl(38 92% 60% / 0.4); background: var(--color-warning-dim); }

  /* popovers */
  .pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; min-width: 240px; background: var(--color-surface-hi); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 12px 14px; animation: fadeSlideUp var(--dur-fast) var(--ease-out); cursor: default; }
  .pop h5 { margin: 0 0 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-dim); font-family: var(--font-mono); font-weight: 500; }
  .pop .grp { margin-bottom: 10px; }
  .pop label { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--color-text-muted); padding: 3px 0; cursor: pointer; }
  .pop label:hover { color: var(--color-text); }
  .pop label input { accent-color: var(--color-primary-strong); }
  .pop label .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--color-text-dim); }
  .pop .code { font-family: var(--font-mono); font-size: 10px; color: var(--color-accent-violet); }
  .pop-actions { display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--color-border-soft); padding-top: 9px; margin-top: 4px; }
  .pop-actions button { font-size: var(--text-xs); background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text-muted); padding: 4px 10px; cursor: pointer; }
  .pop-actions button:hover { color: var(--color-text); }
  .pop-actions .primary { background: var(--color-primary-dim); color: var(--color-primary); border-color: var(--color-primary-glow); }

  /* date presets */
  .date-presets { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  .date-presets button { font-size: var(--text-xs); background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-full); color: var(--color-text-muted); padding: 4px 11px; cursor: pointer; }
  .date-presets button.on { background: var(--color-primary-dim); color: var(--color-primary); border-color: var(--color-primary-glow); }
  .date-custom { display: flex; gap: 8px; align-items: center; font-size: var(--text-xs); color: var(--color-text-dim); }
  .date-custom input { background: var(--color-muted); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text); font-family: var(--font-mono); font-size: 11px; padding: 4px 7px; color-scheme: dark; }
  .date-resolved { margin-top: 9px; font-size: var(--text-xs); color: var(--color-text-dim); }
  .date-resolved b { color: var(--color-text-muted); font-family: var(--font-mono); font-weight: 500; }

  /* count + export row */
  .count-row { display: flex; align-items: center; gap: 12px; margin: 4px 0 10px; flex-wrap: wrap; }
  .count-line { font-size: var(--text-sm); color: var(--color-text-muted); }
  .count-line b { color: var(--color-text); font-family: var(--font-mono); font-weight: 600; }
  .count-line.zero { color: var(--color-warning); }
  .export-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--color-text-muted); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; transition: all var(--dur-fast) var(--ease-out); }
  .export-btn:hover { color: var(--color-text); border-color: var(--color-primary-glow); }
  .export-btn b { font-family: var(--font-mono); font-weight: 600; color: var(--color-text); }
  .export-btn.busy { color: var(--color-text-dim); pointer-events: none; }
  .export-done { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-success); animation: fadeSlideUp var(--dur-base) var(--ease-out); }

  /* ── table (A + C) ── */
  .audit-table { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); }
  .at-head { display: grid; gap: 14px; padding: 9px 16px; background: var(--color-bg-elev1); border-bottom: 1px solid var(--color-border); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-dim); font-family: var(--font-mono); }
  .at-row { display: grid; gap: 14px; align-items: baseline; padding: 9px 16px; border-bottom: 1px solid var(--color-border-soft); font-size: var(--text-sm); transition: background var(--dur-fast) var(--ease-out); }
  .at-row:last-child { border-bottom: none; }
  .at-row:hover { background: var(--color-bg-elev1); }
  .at-row.fresh { animation: fadeSlideUp var(--dur-base) var(--ease-out); background: var(--color-warning-dim); }
  .grid-op { grid-template-columns: 130px 1fr 130px; }
  .grid-plat { grid-template-columns: 130px 180px 1fr; }
  .at-when { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-dim); white-space: nowrap; }
  .at-user { color: var(--color-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .at-user:hover { color: var(--color-primary); cursor: pointer; }
  .at-what { color: var(--color-text); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .at-what .pen { color: var(--color-warning); flex: 0 0 auto; }
  .at-what .extra { color: var(--color-text-dim); font-size: var(--text-xs); }
  .at-what .code { font-family: var(--font-mono); font-size: 10px; color: var(--color-accent-violet); background: hsl(258 90% 66% / 0.1); border-radius: var(--radius-sm); padding: 1px 6px; }
  .at-actor { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-dim); text-align: right; white-space: nowrap; }

  /* pagination */
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 0 2px; font-size: var(--text-sm); color: var(--color-text-muted); }
  .pager button { background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text-muted); font-size: var(--text-sm); padding: 5px 12px; cursor: pointer; }
  .pager button:hover:not(:disabled) { color: var(--color-text); border-color: var(--color-primary-glow); }
  .pager button:disabled { opacity: 0.35; cursor: default; }
  .pager .pg { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-dim); }

  /* load-more (B) */
  .load-more { display: block; margin: 14px auto 2px; background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-full); color: var(--color-text-muted); font-size: var(--text-sm); padding: 7px 20px; cursor: pointer; }
  .load-more:hover { color: var(--color-text); border-color: var(--color-primary-glow); }

  /* ── feed (B) ── */
  .day-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 8px 2px 6px; background: var(--color-bg); }
  .day-head .d { font-family: var(--font-headline); font-weight: 700; font-size: var(--text-sm); color: var(--color-text); }
  .day-head .n { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-dim); }
  .day-head .rule { flex: 1; height: 1px; background: var(--color-border-soft); }
  .feed-row { display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: var(--radius-sm); font-size: var(--text-sm); }
  .feed-row:hover { background: var(--color-bg-elev1); }
  .feed-row .t { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-dim); flex: 0 0 52px; }
  .feed-row .pen { color: var(--color-warning); flex: 0 0 auto; }
  .feed-row .who { color: var(--color-text-muted); flex: 0 0 auto; }
  .feed-row .what { color: var(--color-text); min-width: 0; }
  .feed-row .extra { color: var(--color-text-dim); font-size: var(--text-xs); }
  .feed-row .code { font-family: var(--font-mono); font-size: 10px; color: var(--color-accent-violet); background: hsl(258 90% 66% / 0.1); border-radius: var(--radius-sm); padding: 1px 6px; }

  /* ── query rail (C) ── */
  .c-split { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
  .q-rail { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 14px 15px; position: sticky; top: 0; }
  .q-rail h5 { margin: 12px 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-dim); font-family: var(--font-mono); font-weight: 500; }
  .q-rail h5:first-child { margin-top: 0; }
  .q-rail label { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--color-text-muted); padding: 2.5px 0; cursor: pointer; }
  .q-rail label:hover { color: var(--color-text); }
  .q-rail label input { accent-color: var(--color-primary-strong); }
  .q-rail label .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--color-text-dim); }
  .q-rail select { width: 100%; background: var(--color-muted); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text); font-family: var(--font-sans); font-size: var(--text-sm); padding: 6px 8px; }
  .q-clear { margin-top: 12px; width: 100%; font-size: var(--text-xs); background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text-dim); padding: 5px 0; cursor: pointer; }
  .q-clear:hover { color: var(--color-text-muted); }

  .empty { text-align: center; color: var(--color-text-dim); padding: 54px 20px; font-size: var(--text-base); }
  .empty .big { font-size: var(--text-lg); color: var(--color-text-muted); margin-bottom: 6px; }
  .empty button { margin-top: 12px; font-size: var(--text-xs); background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-full); color: var(--color-text-muted); padding: 5px 14px; cursor: pointer; }

  .foot-note { margin-top: 14px; font-size: var(--text-xs); color: var(--color-text-dim); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .foot-note b { color: var(--color-text-muted); font-family: var(--font-mono); font-weight: 500; }
  .wire-flag { font-family: var(--font-mono); font-size: 10px; color: var(--color-accent-violet); background: hsl(258 90% 66% / 0.12); border-radius: var(--radius-sm); padding: 2px 6px; }

  .cross-note { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: var(--text-xs); color: var(--color-text-dim); background: var(--color-surface); border: 1px solid var(--color-border-soft); border-radius: var(--radius-sm); padding: 7px 12px; animation: fadeSlideUp var(--dur-base) var(--ease-out); }
  .cross-note .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-success); flex: 0 0 6px; }
</style>
</head>
<body>

<div class="variant-nav">
  <span class="label">Sketch 067 · Audit Browser — filters · pagination · CSV</span>
  <button class="variant-tab active" onclick="showVariant('a', event)">A: Filter strip + table <span class="star">★</span></button>
  <button class="variant-tab" onclick="showVariant('b', event)">B: Investigation feed</button>
  <button class="variant-tab" onclick="showVariant('c', event)">C: Query rail + results</button>
</div>

<div id="stage"></div>

<div class="sketch-toolbar">
  <span>067</span>
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">Deep Midnight</option>
  </select>
  <button onclick="setStage('768px')" title="tablet">💻</button>
  <button onclick="setStage('none')" title="desktop">🖥</button>
</div>

<script>
const ME = 'fhdmrd@gmail.com';
const NOW = Date.now();
const DAY = 86400000, HR = 3600000, MIN = 60000;

/* ── the REAL platform audit_log action_type vocabulary (mig 030 + 071 CHECK) ── */
const P_ACTIONS = {
  'document.upload':            { label:'Uploaded a document',                group:'Documents' },
  'document.delete':            { label:'Deleted a document',                 group:'Documents', hot:true },
  'metadata.update':            { label:'Edited document metadata',           group:'Documents' },
  'metadata.field.create':      { label:'Created a metadata field',           group:'Documents' },
  'search.query':               { label:'Searched the knowledge base',        group:'Chat & agent' },
  'code.execute':               { label:'Ran code in the sandbox',            group:'Chat & agent' },
  'skill.load':                 { label:'Used a skill',                       group:'Chat & agent' },
  'thread.create':              { label:'Started a chat',                     group:'Chat & agent' },
  'thread.delete':              { label:'Deleted a chat',                     group:'Chat & agent', hot:true },
  'memory.remember':            { label:'Saved a memory',                     group:'Chat & agent' },
  'memory.recall':              { label:'Recalled a memory',                  group:'Chat & agent' },
  'view.create':                { label:'Saved a view',                       group:'Organizing' },
  'view.delete':                { label:'Deleted a view',                     group:'Organizing' },
  'relationship.create':        { label:'Linked two documents',               group:'Organizing' },
  'relationship.delete':        { label:'Removed a document link',            group:'Organizing' },
  'classification.apply':       { label:'Accepted a classification suggestion', group:'Organizing' },
  'classification.rule.create': { label:'Created a classification rule',      group:'Organizing' },
  'settings.update':            { label:'Changed their settings',             group:'Other' },
  'feedback.submit':            { label:'Sent feedback',                      group:'Other' },
};

/* ── operator_audit_log actions (146/147 shipped vocabulary + the 148 arrivals) ── */
const O_ACTIONS = {
  'control_plane.visit':   { label:'Opened the Control Plane',  write:false },
  'control_plane.refresh': { label:'Refreshed system health',   write:false },
  'audit.view':            { label:'Opened the audit log',      write:false },
  'audit.view_platform':   { label:'Viewed platform activity',  write:false },
  'audit.export':          { label:'Exported audit rows (CSV)', write:false },
  'run.kill':              { label:'Killed a run',              write:true },
  'flag.set':              { label:'Turned a capability off',   write:true },
  'maintenance.set':       { label:'Changed maintenance mode',  write:true },
  'user.disable':          { label:'Disabled a user',           write:true },
  'user.enable':           { label:'Enabled a user',            write:true },
  'visibility.set':        { label:'Changed feature visibility', write:true },
};

const USERS = ['maria@acme.co','sam@acme.co','priya@acme.co','leo@acme.co','jin@acme.co', ME];

/* deterministic pseudo-random so the demo is stable */
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry(148);
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }

const FILES = ['Q3-risk-register.docx','vendor-contract-acme.pdf','meridian-brief.md','sales-pipeline.xlsx','onboarding-notes.md','compliance-checklist.pdf'];
const QUERIES = ['renewal terms','risk appetite statement','Q3 revenue targets','incident postmortem','security exceptions'];

/* ~150 platform rows over 14 days */
const PLAT = [];
(function(){
  const codes = Object.keys(P_ACTIONS);
  const weights = { 'search.query':7,'thread.create':5,'code.execute':4,'document.upload':4,'skill.load':3,'metadata.update':3 };
  const bag = [];
  codes.forEach(c => { const w = weights[c] || 1; for(let i=0;i<w;i++) bag.push(c); });
  for (let i=0;i<150;i++){
    const code = pick(bag);
    const t = NOW - Math.floor(rnd()*rnd()*14*DAY) - Math.floor(rnd()*10*MIN);
    let extra = '';
    if (code.startsWith('document.') || code.startsWith('metadata.update')) extra = pick(FILES);
    if (code === 'search.query') extra = '“' + pick(QUERIES) + '”';
    if (code === 'skill.load') extra = pick(['weekly-report-writer','contract-summarizer','data-cleaner']);
    PLAT.push({ t, user: pick(USERS.slice(0,5)), code, extra });
  }
  PLAT.sort((a,b)=>b.t-a.t);
})();

/* ~40 operator rows over 14 days (146/147-real vocabulary) */
const OPS = [];
(function(){
  const script = [
    ['control_plane.visit','Opened the Control Plane',0],
    ['control_plane.refresh','Refreshed system health',0],
    ['audit.view','Opened the audit log',0],
    ['run.kill','Killed maria’s run on GPT-5 (2m 14s in)',1],
    ['flag.set','Turned OFF web search for everyone',1],
    ['flag.set','Turned web search back ON',1],
    ['maintenance.set','Turned ON maintenance mode',1],
    ['maintenance.set','Turned OFF maintenance mode',1],
    ['control_plane.visit','Opened the Control Plane',0],
    ['audit.export','Exported 87 audit rows (CSV)',0],
    ['run.kill','Recovered a stuck run (Kimi K2, no response for 4 min)',1],
  ];
  for (let i=0;i<40;i++){
    const s = script[Math.floor(rnd()*script.length)];
    const t = NOW - Math.floor(rnd()*rnd()*14*DAY) - Math.floor(rnd()*3*HR);
    OPS.push({ t, user: ME, code: s[0], label: s[1], write: !!s[2] });
  }
  OPS.sort((a,b)=>b.t-a.t);
})();

/* ── per-variant state ── */
const V = {};
['a','b','c'].forEach(v => V[v] = {
  source:'op', types:new Set(), preset:'7d', from:null, to:null,
  user:'', writesOnly:false, page:1, shown:30, tech:false, platSeen:false, openPop:null,
});

const PAGE_SIZE = 14;

function windowOf(st){
  const midnight = new Date(NOW); midnight.setHours(0,0,0,0);
  if (st.preset==='today') return [midnight.getTime(), NOW];
  if (st.preset==='7d')    return [NOW-7*DAY, NOW];
  if (st.preset==='30d')   return [NOW-30*DAY, NOW];
  if (st.preset==='custom' && (st.from||st.to)) {
    const f = st.from ? new Date(st.from).getTime() : 0;
    const t = st.to ? new Date(st.to).getTime()+DAY-1 : NOW;
    return [f,t];
  }
  return [0, NOW];
}

function filtered(v){
  const st = V[v];
  const [f,t] = windowOf(st);
  let rows = (st.source==='op' ? OPS : PLAT).filter(r => r.t>=f && r.t<=t);
  if (st.types.size) rows = rows.filter(r => st.types.has(r.code));
  if (st.source==='plat' && st.user) rows = rows.filter(r => r.user===st.user);
  if (st.source==='op' && st.writesOnly) rows = rows.filter(r => r.write);
  return rows;
}

function fmtWhen(t){ return new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtTime(t){ return new Date(t).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(t){ return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function dayLabel(t){
  const d = new Date(t); d.setHours(0,0,0,0);
  const today = new Date(NOW); today.setHours(0,0,0,0);
  const diff = Math.round((today-d)/DAY);
  if (diff===0) return 'Today'; if (diff===1) return 'Yesterday';
  return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
function shield(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>'; }

function band(v, activeTab){
  return `<div class="op-band">
    <div class="band-top">
      <div class="band-title">${shield()} Control Room</div>
      <span class="op-chip">OPERATOR</span>
      <span class="band-identity">${ME}</span>
      <span class="spacer"></span>
      <span class="rec-marker" id="rec-${v}"><span class="rec-dot"></span> every action recorded</span>
      <span class="back-link">‹ Back to app</span>
    </div>
    <div class="band-tabs">
      <span class="band-tab">Control Plane</span>
      <span class="band-tab">Users &amp; Access</span>
      <span class="band-tab locked">Model Registry <span class="lock">🔒</span></span>
      <span class="band-tab locked">Secrets <span class="lock">🔒</span></span>
      <span class="band-tab active">Audit log <span class="pill">${OPS.length + PLAT.length}</span></span>

}

function recFlash(v){
  const rec = document.getElementById('rec-'+v);
  if (!rec) return;
  rec.classList.remove('flash'); void rec.offsetWidth; rec.classList.add('flash');
  setTimeout(()=>rec.classList.remove('flash'), 1600);
}

/* ── shared micro-views ── */
function sourceSwitch(v){
  const st = V[v];
  const tech = st.tech ? `<span class="src-tech">${st.source==='op'?'operator_audit_log':'audit_log'}</span>` : '';
  return `<div style="display:flex;align-items:center;flex-wrap:wrap">
    <div class="source-switch">
      <button class="${st.source==='op'?'on':''}" onclick="setSource('${v}','op')">Operator actions <span class="n">${OPS.length}</span></button>
      <button class="${st.source==='plat'?'on':''}" onclick="setSource('${v}','plat')">Platform activity <span class="n">${PLAT.length}</span></button>
    </div>${tech}</div>`;
}

function typeChipLabel(st){
  if (!st.types.size) return null;
  const arr = [...st.types];
  const first = st.source==='op' ? O_ACTIONS[arr[0]].label : P_ACTIONS[arr[0]].label;
  return arr.length===1 ? first : `${first} +${arr.length-1}`;
}

function presetLabel(st){
  if (st.preset==='today') return 'Today';
  if (st.preset==='7d') return 'Last 7 days';
  if (st.preset==='30d') return 'Last 30 days';
  if (st.preset==='custom') return (st.from?fmtDate(new Date(st.from).getTime()):'…') + ' – ' + (st.to?fmtDate(new Date(st.to).getTime()):'now');
  return 'All time';
}

function typePopover(v){
  const st = V[v];
  if (st.source==='op'){
    const codes = Object.keys(O_ACTIONS);
    return `<div class="pop" onclick="event.stopPropagation()">
      <h5>Action type — operator</h5>
      <div class="grp">${codes.map(c => `<label><input type="checkbox" ${st.types.has(c)?'checked':''} onchange="toggleType('${v}','${c}')"> ${O_ACTIONS[c].write?'✎ ':''}${O_ACTIONS[c].label}${st.tech?` <span class="code">${c}</span>`:''}</label>`).join('')}</div>
      <div class="pop-actions"><button onclick="clearTypes('${v}')">Clear</button><button class="primary" onclick="closePop('${v}')">Done</button></div>
    </div>`;
  }
  const groups = {};
  Object.entries(P_ACTIONS).forEach(([c,a]) => { (groups[a.group] = groups[a.group]||[]).push(c); });
  return `<div class="pop" style="min-width:290px" onclick="event.stopPropagation()">
    <h5>Action type — platform</h5>
    ${Object.entries(groups).map(([g,codes]) => `<div class="grp"><h5>${g}</h5>${codes.map(c =>
      `<label><input type="checkbox" ${st.types.has(c)?'checked':''} onchange="toggleType('${v}','${c}')"> ${P_ACTIONS[c].label}${st.tech?` <span class="code">${c}</span>`:''}</label>`).join('')}</div>`).join('')}
    <div class="pop-actions"><button onclick="clearTypes('${v}')">Clear</button><button class="primary" onclick="closePop('${v}')">Done</button></div>
  </div>`;
}

function datePopover(v){
  const st = V[v];
  const [f,t] = windowOf(st);
  const presets = [['today','Today'],['7d','7 days'],['30d','30 days'],['all','All time']];
  return `<div class="pop" style="min-width:300px" onclick="event.stopPropagation()">
    <h5>Date range</h5>
    <div class="date-presets">${presets.map(([k,l]) => `<button class="${st.preset===k?'on':''}" onclick="setPreset('${v}','${k}')">${l}</button>`).join('')}</div>
    <div class="date-custom">from <input type="date" value="${st.from||''}" onchange="setCustom('${v}','from',this.value)"> to <input type="date" value="${st.to||''}" onchange="setCustom('${v}','to',this.value)"></div>
    <div class="date-resolved">→ showing <b>${fmtDate(f)} – ${fmtDate(t)}</b></div>
    <div class="pop-actions"><button class="primary" onclick="closePop('${v}')">Done</button></div>
  </div>`;
}

function userPopover(v){
  const st = V[v];
  return `<div class="pop" onclick="event.stopPropagation()">
    <h5>User</h5>
    <div class="grp">${USERS.slice(0,5).map(u => `<label><input type="radio" name="user-${v}" ${st.user===u?'checked':''} onchange="setUser('${v}','${u}')"> ${u}</label>`).join('')}</div>
    <div class="pop-actions"><button onclick="setUser('${v}','')">Anyone</button><button class="primary" onclick="closePop('${v}')">Done</button></div>
  </div>`;
}

function filterStrip(v){
  const st = V[v];
  const chips = [];
  const tl = typeChipLabel(st);
  chips.push(tl
    ? `<span class="f-chip" onclick="openPop('${v}','type',event)"><span class="k">action</span> ${tl} <span class="x" onclick="event.stopPropagation();clearTypes('${v}')">✕</span>${st.openPop==='type'?typePopover(v):''}</span>`
    : `<button class="f-add" onclick="openPop('${v}','type',event)">＋ action type${st.openPop==='type'?typePopover(v):''}</button>`);
  chips.push(`<span class="f-chip" onclick="openPop('${v}','date',event)"><span class="k">when</span> ${presetLabel(st)}${st.openPop==='date'?datePopover(v):''}</span>`);
  if (st.source==='plat'){
    chips.push(st.user
      ? `<span class="f-chip" onclick="openPop('${v}','user',event)"><span class="k">user</span> ${st.user} <span class="x" onclick="event.stopPropagation();setUser('${v}','')">✕</span>${st.openPop==='user'?userPopover(v):''}</span>`
      : `<button class="f-add" onclick="openPop('${v}','user',event)">＋ user${st.openPop==='user'?userPopover(v):''}</button>`);
  } else {
    chips.push(`<span class="writes-chip ${st.writesOnly?'on':''}" onclick="toggleWrites('${v}')">✎ changes only</span>`);
  }
  return `<div class="filter-strip"><span class="f-where">Show</span>${chips.join('')}</div>`;
}

function countRow(v, rows){
  const st = V[v];
  const fname = `audit-${st.source==='op'?'operator':'platform'}-${new Date(NOW).toISOString().slice(0,10)}.csv`;
  return `<div class="count-row">
    <span class="count-line ${rows.length===0?'zero':''}"><b>${rows.length}</b> matching · newest first</span>
    <button class="export-btn" id="exp-${v}" onclick="doExport('${v}')" ${rows.length===0?'disabled':''}>⬇ Export CSV · <b>${rows.length}</b> rows</button>
    <span id="expdone-${v}"></span>
  </div>`;
}

function rowWhat(v, r){
  const st = V[v];
  const isOp = st.source==='op';
  const write = isOp ? r.write : ['document.delete','thread.delete','view.delete','relationship.delete'].includes(r.code) ? false : false;
  const label = isOp ? r.label : P_ACTIONS[r.code].label;
  const pen = (isOp && r.write) ? `<span class="pen" title="a change was written">✎</span>` : '';
  const extra = (!isOp && r.extra) ? `<span class="extra">${r.extra}</span>` : '';
  const code = st.tech ? `<span class="code">${r.code}</span>` : '';
  return `${pen}<span>${label}</span>${extra}${code}`;
}

function emptyState(v){
  return `<div class="empty"><div class="big">No matches in this window</div>Widen the date range or clear a filter — nothing was recorded that matches.<br><button onclick="clearAll('${v}')">Clear all filters</button></div>`;
}

function platNote(v){
  const st = V[v];
  if (st.source!=='plat') return '';
  return `<div class="cross-note"><span class="dot"></span> You are viewing what users did. Looking at user activity is itself recorded — “Viewed platform activity” just landed in your operator ledger.</div>`;
}

/* ── A: filter strip + table + pages ── */
function tableView(v, rows){
  const st = V[v];
  const isOp = st.source==='op';
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (st.page > pages) st.page = pages;
  const slice = rows.slice((st.page-1)*PAGE_SIZE, st.page*PAGE_SIZE);
  if (!rows.length) return emptyState(v);
  const head = isOp
    ? `<div class="at-head grid-op"><span>When</span><span>What</span><span style="text-align:right">Operator</span></div>`
    : `<div class="at-head grid-plat"><span>When</span><span>User</span><span>What</span></div>`;
  const body = slice.map(r => isOp
    ? `<div class="at-row grid-op ${r.fresh?'fresh':''}"><span class="at-when">${fmtWhen(r.t)}</span><span class="at-what">${rowWhat(v,r)}</span><span class="at-actor">${r.user}</span></div>`
    : `<div class="at-row grid-plat"><span class="at-when">${fmtWhen(r.t)}</span><span class="at-user" title="filter to this user" onclick="setUser('${v}','${r.user}')">${r.user}</span><span class="at-what">${rowWhat(v,r)}</span></div>`
  ).join('');
  const pager = pages>1 ? `<div class="pager">
      <button ${st.page===1?'disabled':''} onclick="setPage('${v}',${st.page-1})">‹ Prev</button>
      <span class="pg">page ${st.page} of ${pages}</span>
      <button ${st.page===pages?'disabled':''} onclick="setPage('${v}',${st.page+1})">Next ›</button>
    </div>` : '';
  return `<div class="audit-table">${head}${body}</div>${pager}`;
}

/* ── B: day-grouped feed + load more ── */
function feedView(v, rows){
  const st = V[v];
  if (!rows.length) return emptyState(v);
  const slice = rows.slice(0, st.shown);
  const groups = [];
  slice.forEach(r => {
    const d = dayLabel(r.t);
    if (!groups.length || groups[groups.length-1].d !== d) groups.push({d, rows:[]});
    groups[groups.length-1].rows.push(r);
  });
  const isOp = st.source==='op';
  const html = groups.map(g => `
    <div class="day-head"><span class="d">${g.d}</span><span class="n">${g.rows.length}</span><span class="rule"></span></div>
    ${g.rows.map(r => `<div class="feed-row">
        <span class="t">${fmtTime(r.t)}</span>
        ${(isOp && r.write)?'<span class="pen" title="a change was written">✎</span>':''}
        <span class="who">${isOp? '' : r.user+' ·'}</span>
        <span class="what">${isOp ? r.label : P_ACTIONS[r.code].label}</span>
        ${(!isOp && r.extra)?`<span class="extra">${r.extra}</span>`:''}
        ${st.tech?`<span class="code">${r.code}</span>`:''}
      </div>`).join('')}`).join('');
  const remaining = rows.length - slice.length;
  const more = remaining>0 ? `<button class="load-more" onclick="loadMore('${v}')">Show 30 more · ${remaining} remaining</button>` : '';
  return html + more;
}

/* ── C: query rail + results ── */
function railView(v, rows){
  const st = V[v];
  const isOp = st.source==='op';
  const [f,t] = windowOf(st);
  const inWindow = (st.source==='op' ? OPS : PLAT).filter(r => r.t>=f && r.t<=t);
  const countOf = c => inWindow.filter(r=>r.code===c).length;
  let typesHtml = '';
  if (isOp){
    typesHtml = `<h5>Action type</h5>` + Object.keys(O_ACTIONS).map(c =>
      `<label><input type="checkbox" ${st.types.has(c)?'checked':''} onchange="toggleType('${v}','${c}')"> ${O_ACTIONS[c].write?'✎ ':''}${O_ACTIONS[c].label}<span class="cnt">${countOf(c)||''}</span></label>`).join('');
  } else {
    const groups = {};
    Object.entries(P_ACTIONS).forEach(([c,a]) => { (groups[a.group]=groups[a.group]||[]).push(c); });
    typesHtml = Object.entries(groups).map(([g,codes]) => `<h5>${g}</h5>` + codes.map(c =>
      `<label><input type="checkbox" ${st.types.has(c)?'checked':''} onchange="toggleType('${v}','${c}')"> ${P_ACTIONS[c].label}<span class="cnt">${countOf(c)||''}</span></label>`).join('')).join('');
  }
  const userSel = !isOp ? `<h5>User</h5><select onchange="setUser('${v}',this.value)">
      <option value="">Anyone</option>${USERS.slice(0,5).map(u=>`<option ${st.user===u?'selected':''}>${u}</option>`).join('')}</select>` : '';
  const presets = [['today','Today'],['7d','7 days'],['30d','30 days'],['all','All']];
  return `<div class="c-split">
    <div class="q-rail scrollbar-thin" style="max-height:100%">
      <h5>Date range</h5>
      <div class="date-presets">${presets.map(([k,l]) => `<button class="${st.preset===k?'on':''}" onclick="setPreset('${v}','${k}')">${l}</button>`).join('')}</div>
      <div class="date-resolved">→ <b>${fmtDate(f)} – ${fmtDate(t)}</b></div>
      ${userSel}
      ${typesHtml}
      <button class="q-clear" onclick="clearAll('${v}')">Clear all filters</button>
    </div>
    <div>${platNote(v)}${countRow(v, rows)}${tableView(v, rows)}</div>
  </div>`;
}

/* ── assembly per variant ── */
function browserBody(v){
  const st = V[v];
  const rows = filtered(v);
  if (v==='c'){
    return `${sourceSwitch(v)}<div style="height:14px"></div>${railView(v, rows)}`;
  }
  const strip = filterStrip(v);
  const list = v==='a' ? tableView(v, rows) : feedView(v, rows);
  return `${sourceSwitch(v)}${strip}${platNote(v)}${countRow(v, rows)}${list}`;
}

function render(v){
  const host = document.getElementById('browser-'+v);
  if (host) host.innerHTML = browserBody(v);
  const tt = document.getElementById('tech-'+v);
  if (tt) tt.classList.toggle('on', V[v].tech);
}

function frame(v){
  return `<div class="app-frame">${band(v)}
    <div class="body-scroll scrollbar-thin">
      <div class="section-head">
        <h2>Audit log</h2><span class="live-badge">live</span>
        <span class="head-spacer"></span>
        <span class="tech-toggle" id="tech-${v}" onclick="toggleTech('${v}')">⌥ Technical names</span>
      </div>
      <p class="sub-line">Who did what, and when — <b>operator actions</b> and <b>platform activity</b>, one browser. Filter it, page through it, take the filtered set with you as CSV.</p>
      <div id="browser-${v}"></div>
      <div class="foot-note">
        <span>Reads span all users via the service-role client — every read path is explicitly filtered, and viewing platform activity is itself recorded.</span>
        <span class="wire-flag">net-new · 148 · filters + pagination + CSV</span>
      </div>
    </div>
  </div>`;
}

/* ── interactions ── */
function setSource(v, s){
  const st = V[v];
  if (st.source === s) return;
  st.source = s; st.types = new Set(); st.user=''; st.writesOnly=false; st.page=1; st.shown=30; st.openPop=null;
  if (s==='plat' && !st.platSeen){
    st.platSeen = true;
    OPS.unshift({ t: Date.now(), user: ME, code:'audit.view_platform', label:'Viewed platform activity', write:false, fresh:true });
    recFlash(v);
  }
  render(v);
}
function toggleType(v, c){ const st=V[v]; st.types.has(c)?st.types.delete(c):st.types.add(c); st.page=1; st.shown=30; render(v); }
function clearTypes(v){ V[v].types=new Set(); V[v].page=1; V[v].openPop=null; render(v); }
function setPreset(v, p){ V[v].preset=p; V[v].from=null; V[v].to=null; V[v].page=1; V[v].shown=30; render(v); }
function setCustom(v, k, val){ const st=V[v]; st[k]=val||null; st.preset='custom'; st.page=1; render(v); }
function setUser(v, u){ V[v].user=u; V[v].page=1; V[v].shown=30; V[v].openPop=null; render(v); }
function toggleWrites(v){ V[v].writesOnly=!V[v].writesOnly; V[v].page=1; render(v); }
function setPage(v, p){ V[v].page=p; render(v); }
function loadMore(v){ V[v].shown+=30; render(v); }
function toggleTech(v){ V[v].tech=!V[v].tech; render(v); }
function clearAll(v){ const st=V[v]; st.types=new Set(); st.user=''; st.writesOnly=false; st.preset='all'; st.from=null; st.to=null; st.page=1; st.shown=30; render(v); }
function openPop(v, which, ev){ if(ev) ev.stopPropagation(); V[v].openPop = (V[v].openPop===which? null : which); render(v); }
function closePop(v){ V[v].openPop=null; render(v); }
document.addEventListener('click', () => ['a','b','c'].forEach(v => { if (V[v].openPop){ V[v].openPop=null; render(v); } }));

/* CSV export — really downloads the filtered set, and the export lands in the ledger */
function doExport(v){
  const st = V[v];
  const rows = filtered(v);
  const btn = document.getElementById('exp-'+v);
  btn.classList.add('busy'); btn.innerHTML = '⏳ Preparing ' + rows.length + ' rows…';
  setTimeout(() => {
    const isOp = st.source==='op';
    const head = isOp ? 'created_at,operator,action,label,is_write' : 'created_at,user,action_type,label,detail';
    const lines = rows.map(r => isOp
      ? [new Date(r.t).toISOString(), r.user, r.code, '"'+r.label.replace(/"/g,'""')+'"', r.write].join(',')
      : [new Date(r.t).toISOString(), r.user, r.code, '"'+P_ACTIONS[r.code].label+'"', '"'+(r.extra||'').replace(/"/g,'""')+'"'].join(','));
    const blob = new Blob([head+'\n'+lines.join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `audit-${isOp?'operator':'platform'}-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    /* the export is itself recorded — the 062-A receipt beat */
    OPS.unshift({ t: Date.now(), user: ME, code:'audit.export', label:`Exported ${rows.length} audit rows (CSV) · ${presetLabel(st)}`, write:false, fresh:true });
    recFlash(v);
    render(v);
    const done = document.getElementById('expdone-'+v);
    if (done){ done.innerHTML = `<span class="export-done">✓ ${a.download} — the export itself was recorded</span>`; setTimeout(()=>{ if(done) done.innerHTML=''; }, 5200); }
  }, 700);
}

/* ── variants ── */
const META = {
  a: '<b>A — Filter strip + table.</b> The 029-A chip grammar over a paged instrument table: “Show [action] [when] [user]”, a live match count, page ‹ › controls, and an Export button that always names how many rows leave. Least net-new — the shipped minimal Audit tab grows in place.',
  b: '<b>B — Investigation feed.</b> The same filters, but results read as a story: rows grouped under day headers (Today / Yesterday / …), time-only stamps, “Show 30 more” instead of pages. Optimized for “what happened yesterday?” scanning rather than precise slicing.',
  c: '<b>C — Query rail + results.</b> A log-explorer: a persistent left rail with every action type (with live counts in the window), date presets, and user — the whole query visible at once. Most powerful for a deep investigation, most chrome for a quick glance.',
};

const stage = document.getElementById('stage');
['a','b','c'].forEach(v => {
  const wrap = document.createElement('div');
  wrap.className = 'variant' + (v==='a'?' active':'');
  wrap.id = 'variant-'+v;
  wrap.innerHTML = `<p class="variant-meta">${META[v]}</p>` + frame(v);
  stage.appendChild(wrap);
  render(v);
});

function showVariant(id, ev){
  document.querySelectorAll('.variant').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.variant-nav .variant-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('variant-'+id).classList.add('active');
  if (ev) ev.target.classList.add('active');
}
function setStage(w){ document.getElementById('stage').style.maxWidth = (w==='none')?'none':w; }
</script>
</body>
