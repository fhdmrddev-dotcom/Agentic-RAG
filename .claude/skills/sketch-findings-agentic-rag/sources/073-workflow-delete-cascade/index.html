<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 073 — Workflow Delete &amp; Cascade</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  body { font-family: var(--font-sans); color: var(--color-text); background: var(--color-bg); padding-top: 46px; min-height: 100vh; }

  /* Faux workflow card w/ the ⋯ menu that opens delete */
  .page { position: relative; z-index: 1; padding: var(--space-8); max-width: 720px; }
  .page h1 { font-family: var(--font-headline); font-size: var(--text-xl); margin: 0 0 var(--space-2); }
  .page .sub { color: var(--color-text-muted); font-size: var(--text-sm); margin: 0 0 var(--space-6); }
  .wf-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4) var(--space-5); display: flex; align-items: center; gap: var(--space-4); }
  .wf-card .t { font-weight: 600; }
  .wf-card .meta { color: var(--color-text-muted); font-size: var(--text-xs); margin-top: 3px; }
  .wf-card .grow { flex: 1; }
  .pill { font-size: var(--text-xs); color: var(--color-primary); background: var(--color-primary-dim); border-radius: var(--radius-full); padding: 2px 9px; font-weight: 600; }
  .menu-btn { background: transparent; border: 1px solid var(--color-border); color: var(--color-text-muted); border-radius: var(--radius-sm); padding: 5px 11px; cursor: pointer; font-size: 16px; line-height: 1; transition: all var(--dur-fast); }
  .menu-btn:hover { color: var(--color-text); background: var(--color-accent); }
  .menu { position: absolute; background: var(--color-surface-hi); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 5px; min-width: 150px; z-index: 50; display: none; }
  .menu.show { display: block; animation: fade var(--dur-fast); }
  .menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; background: transparent; border: 0; color: var(--color-text); font-size: var(--text-sm); padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-sans); }
  .menu button:hover { background: var(--color-accent); }
  .menu button.danger { color: var(--color-danger); }
  .menu button.danger:hover { background: var(--color-danger-dim); }
  @keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; } }

  /* Confirm sheet */
  .stage { position: fixed; inset: 46px 0 0 0; z-index: 100; display: grid; place-items: center; background: rgba(0,0,0,0.62); backdrop-filter: blur(3px); padding: var(--space-6); }
  .sheet { width: min(500px, 94vw); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; animation: pop var(--dur-base) var(--ease-out); }
  @keyframes pop { from { transform: translateY(8px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }
  .sh-head { display: flex; align-items: center; gap: 11px; padding: var(--space-5) var(--space-5) var(--space-3); }
  .sh-head .warn { width: 34px; height: 34px; border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--color-danger-dim); color: var(--color-danger); flex-shrink: 0; }
  .sh-head h3 { margin: 0; font-family: var(--font-headline); font-size: var(--text-md); }
  .sh-head .target { color: var(--color-text-muted); font-size: var(--text-xs); margin-top: 2px; }
  .sh-body { padding: 0 var(--space-5) var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
  .lead { font-size: var(--text-sm); color: var(--color-text); line-height: 1.5; }

  /* Cascade / preserve lists */
  .cascade { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
  .cas-group { padding: 11px 13px; display: flex; flex-direction: column; gap: 8px; }
  .cas-group + .cas-group { border-top: 1px solid var(--color-border-soft); }
  .cas-title { font-size: var(--text-xs); font-weight: 700; letter-spacing: .3px; text-transform: uppercase; color: var(--color-text-dim); }
  .cas-line { display: flex; align-items: center; gap: 9px; font-size: var(--text-sm); }
  .cas-line .ic { width: 18px; text-align: center; }
  .removed .cas-title { color: var(--color-danger); }
  .removed .cas-line { color: var(--color-text); }
  .removed { background: hsl(0 72% 51% / 0.05); }
  .kept .cas-title { color: var(--color-success); }
  .kept { background: hsl(142 71% 45% / 0.05); }
  .count { font-weight: 700; }
  .muted { color: var(--color-text-muted); font-size: var(--text-xs); }

  /* In-flight warning banner */
  .inflight { display: none; align-items: flex-start; gap: 9px; background: var(--color-warning-dim); border: 1px solid hsl(38 92% 60% / .4); border-radius: var(--radius-sm); padding: 10px 12px; font-size: var(--text-xs); color: var(--color-text); }
  .inflight.show { display: flex; }
  .inflight b { color: var(--color-warning); }

  /* Type-to-confirm */
  .confirm-type label { font-size: var(--text-xs); color: var(--color-text-muted); display: block; margin-bottom: 6px; }
  .confirm-type code { color: var(--color-text); font-family: var(--font-mono); background: var(--color-bg); padding: 1px 5px; border-radius: 4px; }
  .confirm-type input { width: 100%; font-family: var(--font-mono); font-size: var(--text-sm); color: var(--color-text); background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 9px 11px; }
  .confirm-type input:focus { outline: none; border-color: var(--color-danger); box-shadow: 0 0 0 3px var(--color-danger-dim); }

  /* Two-door */
  .doors { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  .door { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4); cursor: pointer; transition: all var(--dur-base) var(--ease-out); }
  .door:hover { border-color: var(--color-primary-glow); background: var(--color-accent); }
  .door.selected { border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary-dim); }
  .door.danger-door:hover { border-color: hsl(0 72% 51% / .5); background: var(--color-danger-dim); }
  .door.danger-door.selected { border-color: var(--color-danger); box-shadow: 0 0 0 2px var(--color-danger-dim); }
  .door .dh { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: var(--text-sm); }
  .door .dd { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 7px; line-height: 1.5; }
  .door .tagr { color: var(--color-success); font-size: 10px; font-weight: 700; }
  .door.danger-door .dh { color: var(--color-danger); }

  .sh-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-5); border-top: 1px solid var(--color-border); background: var(--color-bg-elev1); }
  .rec-note { font-size: 10px; color: var(--color-text-dim); display: flex; align-items: center; gap: 5px; }
  .btn { font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 600; cursor: pointer; border-radius: var(--radius-sm); padding: 8px 15px; border: 1px solid transparent; transition: all var(--dur-fast); }
  .btn-ghost { background: transparent; border-color: var(--color-border); color: var(--color-text-muted); }
  .btn-ghost:hover { color: var(--color-text); background: var(--color-accent); }
  .btn-danger { background: var(--color-danger); color: #fff; }
  .btn-danger:hover { filter: brightness(1.1); }
  .btn-danger:disabled { opacity: .4; cursor: not-allowed; filter: none; }
  .btn-primary { background: var(--color-primary-strong); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-row { display: flex; gap: var(--space-2); }
  .wire-flag { font-size: 9px; font-weight: 800; color: var(--color-accent-violet); background: hsl(258 90% 66% / .13); border: 1px solid hsl(258 90% 66% / .35); padding: 1px 6px; border-radius: var(--radius-full); }

  /* Success toast (post-delete honesty) */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; background: var(--color-surface-hi); border: 1px solid var(--color-border); border-left: 3px solid var(--color-success); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 12px 16px; font-size: var(--text-sm); display: none; align-items: center; gap: 10px; }
  .toast.show { display: flex; animation: fade var(--dur-base); }

  #variant-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; height: 46px; background: var(--color-bg-elev1); border-bottom: 1px solid var(--color-border); display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  #variant-nav .brand { font-size: 11px; color: var(--color-text-dim); font-family: var(--font-mono); margin-right: 8px; }
  .variant-tab { font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--color-text-muted); background: transparent; border: 1px solid transparent; padding: 6px 12px; border-radius: var(--radius-sm); transition: all var(--dur-fast); }
  .variant-tab:hover { color: var(--color-text); }
  .variant-tab.active { color: var(--color-text); background: var(--color-accent); border-color: var(--color-border); }

  #tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-family: system-ui; font-size: 12px; background: rgba(0,0,0,0.72); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: 0.42; transition: opacity var(--dur-base); display: flex; align-items: center; gap: 10px; }
  #tools:hover { opacity: 1; }
  #tools select, #tools button { font-size: 11px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; cursor: pointer; }
</style>
</head>
<body>

<div id="variant-nav">
  <span class="brand">073 · workflow-delete-cascade</span>
  <button class="variant-tab active" onclick="pick('a', this)">A: Victim-naming sheet ★ Selected</button>
  <button class="variant-tab" onclick="pick('b', this)">B: Type-to-confirm</button>
  <button class="variant-tab" onclick="pick('c', this)">C: Archive vs Delete</button>
</div>

<!-- Faux page + card w/ ⋯ menu (shared) -->
<div class="page">
  <h1>Workflows</h1>
  <p class="sub">Deleting is reached from a published workflow's ⋯ menu. Open it, then choose Delete.</p>
  <div class="wf-card">
    <div>
      <div class="t">Vendor-risk portfolio review <span class="pill">Published · v4</span></div>
      <div class="meta">Last run 2h ago · 5 runs · versions v3, v4</div>
    </div>
    <div class="grow"></div>
    <div style="position:relative">
      <button class="menu-btn" onclick="toggleMenu(event)">⋯</button>
      <div class="menu" id="menu">
        <button>✎ Open in Builder</button>
        <button>⑂ Tweak (new draft)</button>
        <button>▶ Run</button>
        <button class="danger" onclick="openDelete()">🗑 Delete workflow</button>
      </div>
    </div>
  </div>
</div>

<div class="stage" id="stage" style="display:none">
  <div class="sheet" id="sheet"><!-- filled per variant --></div>
</div>

<div class="toast" id="toast">✓ <span id="toast-msg"></span></div>

<div id="tools">
  <span>🎛</span>
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'"><option value="default">Deep Midnight</option></select>
  <button onclick="INFLIGHT=!INFLIGHT; alert('In-flight run: '+(INFLIGHT?'ON — a run is streaming now':'OFF')); if(document.getElementById('stage').style.display!=='none') openDelete()">⚡ in-flight run</button>
</div>

<script>
  let VARIANT = 'a';
  let INFLIGHT = false;
  const WF = { name: 'Vendor-risk portfolio review', versions: 2, runs: 5, threads: 5 };

  function pick(v, btn) {
    VARIANT = v;
    document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    if (document.getElementById('stage').style.display !== 'none') openDelete();
    else openDelete(); // always show the sheet so the variant is visible
  }
  function toggleMenu(e) { e.stopPropagation(); document.getElementById('menu').classList.toggle('show'); }
  document.addEventListener('click', () => document.getElementById('menu').classList.remove('show'));

  // Shared building blocks
  function cascadeBlock() {
    return '<div class="cascade">' +
      '<div class="cas-group removed"><div class="cas-title">Permanently removed</div>' +
        '<div class="cas-line"><span class="ic">📄</span>The workflow definition</div>' +
        '<div class="cas-line"><span class="ic">🏷</span><span class="count">' + WF.versions + '</span>&nbsp;versions <span class="muted">(v3, v4)</span></div>' +
        '<div class="cas-line"><span class="ic">▷</span><span class="count">' + WF.runs + '</span>&nbsp;past run records</div>' +
      '</div>' +
      '<div class="cas-group kept"><div class="cas-title">Kept — not touched</div>' +
        '<div class="cas-line"><span class="ic">💬</span><span class="count">' + WF.threads + '</span>&nbsp;chat threads <span class="muted">become normal chats — transcripts &amp; files stay</span></div>' +
        '<div class="cas-line"><span class="ic">📁</span>Your knowledge base &amp; folders</div>' +
      '</div></div>';
  }
  function inflightBanner() {
    return '<div class="inflight ' + (INFLIGHT ? 'show' : '') + '">⚡&nbsp;<span><b>1 run is streaming right now.</b> Deleting will cancel it first (the same safe path that heals stuck runs), then remove the workflow.</span></div>';
  }
  function recNote() { return '<span class="rec-note">✎ recorded with your name in the audit log</span>'; }

  function openDelete() {
    document.getElementById('menu').classList.remove('show');
    const stage = document.getElementById('stage');
    const sheet = document.getElementById('sheet');
    stage.style.display = 'grid';

    if (VARIANT === 'a') {
      sheet.innerHTML =
        '<div class="sh-head"><div class="warn">🗑</div><div><h3>Delete this workflow?</h3><div class="target">' + WF.name + ' · Published v4</div></div></div>' +
        '<div class="sh-body">' +
          '<p class="lead">This can\'t be undone. Here\'s exactly what happens:</p>' +
          inflightBanner() +
          cascadeBlock() +
        '</div>' +
        '<div class="sh-foot">' + recNote() + '<div class="btn-row">' +
          '<button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>' +
          '<button class="btn btn-danger" onclick="doDelete()">Delete workflow</button>' +
        '</div></div>';
    }

    else if (VARIANT === 'b') {
      sheet.innerHTML =
        '<div class="sh-head"><div class="warn">🗑</div><div><h3>Delete this workflow?</h3><div class="target">' + WF.name + ' · Published v4</div></div></div>' +
        '<div class="sh-body">' +
          '<p class="lead">This can\'t be undone.</p>' +
          inflightBanner() +
          cascadeBlock() +
          '<div class="confirm-type"><label>Type <code>' + WF.name + '</code> to confirm</label>' +
            '<input id="confirm-input" autocomplete="off" spellcheck="false" placeholder="' + WF.name + '" oninput="checkType()"></div>' +
        '</div>' +
        '<div class="sh-foot">' + recNote() + '<div class="btn-row">' +
          '<button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>' +
          '<button class="btn btn-danger" id="del-btn" disabled onclick="doDelete()">Delete workflow</button>' +
        '</div></div>';
    }

    else { // c — two-door
      sheet.innerHTML =
        '<div class="sh-head"><div class="warn" style="background:var(--color-primary-dim);color:var(--color-primary)">⌦</div><div><h3>Remove this workflow</h3><div class="target">' + WF.name + ' · Published v4</div></div></div>' +
        '<div class="sh-body">' +
          '<p class="lead">Two ways to remove it — pick one:</p>' +
          '<div class="doors">' +
            '<div class="door selected" id="door-archive" onclick="chooseDoor(\'archive\')">' +
              '<div class="dh">🗄 Archive <span class="tagr">REVERSIBLE</span></div>' +
              '<div class="dd">Hides it from the library and stops new runs. Versions, past runs &amp; threads stay. Restore anytime.</div></div>' +
            '<div class="door danger-door" id="door-delete" onclick="chooseDoor(\'delete\')">' +
              '<div class="dh">🗑 Delete forever</div>' +
              '<div class="dd">Removes the definition + <b>' + WF.versions + '</b> versions + <b>' + WF.runs + '</b> run records. Threads become normal chats. Can\'t be undone.</div></div>' +
          '</div>' +
          '<div id="door-detail"></div>' +
        '</div>' +
        '<div class="sh-foot">' + recNote() + '<div class="btn-row">' +
          '<button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>' +
          '<button class="btn btn-primary" id="door-cta" onclick="doArchive()">🗄 Archive workflow</button>' +
        '</div></div>';
      chooseDoor('archive');
    }
  }

  function checkType() {
    const ok = document.getElementById('confirm-input').value.trim() === WF.name;
    document.getElementById('del-btn').disabled = !ok;
  }

  function chooseDoor(which) {
    document.getElementById('door-archive').classList.toggle('selected', which === 'archive');
    document.getElementById('door-delete').classList.toggle('selected', which === 'delete');
    const cta = document.getElementById('door-cta');
    const detail = document.getElementById('door-detail');
    if (which === 'archive') {
      cta.className = 'btn btn-primary'; cta.textContent = '🗄 Archive workflow'; cta.onclick = doArchive;
      detail.innerHTML = '';
    } else {
      cta.className = 'btn btn-danger'; cta.textContent = '🗑 Delete forever'; cta.onclick = doDelete;
      detail.innerHTML = inflightBanner();
    }
  }

  function closeSheet() { document.getElementById('stage').style.display = 'none'; }
  function toast(msg) {
    document.getElementById('toast-msg').textContent = msg;
    const t = document.getElementById('toast'); t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
  }
  function doDelete() { closeSheet(); toast(INFLIGHT ? 'Run cancelled, then “' + WF.name + '” deleted' : '“' + WF.name + '” deleted — 5 threads kept as chats'); }
  function doArchive() { closeSheet(); toast('“' + WF.name + '” archived — restore anytime from Archived'); }

  // Auto-open the sheet on load so the variant is immediately visible.
  openDelete();
</script>
</body>
</html>
