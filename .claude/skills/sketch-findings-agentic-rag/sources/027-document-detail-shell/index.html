<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sketch 027 — Document Detail Shell</title>
<link rel="stylesheet" href="../themes/default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { padding-top: 52px; }

  /* ─── App chrome (shared) ─── */
  .nav-rail {
    width: 52px; background: var(--color-bg-elev1);
    border-right: 1px solid var(--color-border);
    display: flex; flex-direction: column; align-items: center;
    gap: var(--space-3); padding-top: var(--space-4); flex-shrink: 0;
  }
  .nav-rail .ni {
    width: 36px; height: 36px; border-radius: var(--radius-md);
    display: grid; place-items: center; color: var(--color-text-dim);
    font-size: 17px; cursor: pointer; transition: all var(--dur-fast) var(--ease-out);
  }
  .nav-rail .ni.active { background: var(--color-primary-dim); color: var(--color-primary); }
  .nav-rail .ni:hover:not(.active) { background: var(--color-accent); color: var(--color-text); }

  .page-head {
    display: flex; align-items: baseline; gap: var(--space-3);
    padding: var(--space-5) var(--space-6) var(--space-3);
  }
  .page-head h1 { font-family: var(--font-headline); font-size: var(--text-xl); margin: 0; font-weight: 700; }
  .page-head .crumb { color: var(--color-text-dim); font-size: var(--text-sm); }

  /* ─── Document list (shared table) ─── */
  .doc-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .doc-table thead th {
    text-align: left; font-weight: 500; color: var(--color-text-dim);
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.06em;
    padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border);
  }
  .doc-row td { padding: var(--space-3); border-bottom: 1px solid var(--color-border-soft); }
  .doc-row { cursor: pointer; transition: background var(--dur-fast) var(--ease-out); }
  .doc-row:hover { background: var(--color-muted); }
  .doc-row.selected { background: var(--color-primary-dim); }
  .doc-row.selected td:first-child { box-shadow: inset 2px 0 0 var(--color-primary); }
  .doc-name { font-weight: 500; color: var(--color-text); display: flex; align-items: center; gap: var(--space-2); }
  .doc-ico { font-size: 15px; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--font-mono); font-size: 10px; padding: 1px 6px;
    border-radius: var(--radius-full); background: var(--color-primary-dim); color: var(--color-primary);
  }
  .pill.warn { background: var(--color-warning-dim); color: var(--color-warning); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--color-success); }

  /* ─── Confidence chip (the 112 primitive — refined in 028) ─── */
  .conf {
    display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    padding: 2px 8px; border-radius: var(--radius-full); white-space: nowrap;
    border: 1px solid transparent;
  }
  .conf .g { font-size: 11px; }
  .conf.high { background: var(--color-success-dim); color: var(--color-success); border-color: hsl(142 71% 45% / 0.3); }
  .conf.med  { background: var(--color-warning-dim); color: var(--color-warning); border-color: hsl(38 92% 60% / 0.3); }
  .conf.low  { background: var(--color-danger-dim);  color: var(--color-danger);  border-color: hsl(0 72% 51% / 0.35); }
  .conf.manual { background: var(--color-primary-dim); color: var(--color-primary); border-color: var(--color-primary-glow); }
  .conf.none { background: transparent; color: var(--color-text-dim); border-color: var(--color-border); }

  /* ─── Metadata field rows (shared inner content) ─── */
  .meta-grid { display: flex; flex-direction: column; }
  .field-row {
    display: grid; grid-template-columns: 116px 1fr auto; align-items: center;
    gap: var(--space-3); padding: var(--space-2) 0;
    border-bottom: 1px solid var(--color-border-soft);
  }
  .field-row:last-child { border-bottom: none; }
  .field-key { font-size: var(--text-xs); color: var(--color-text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .field-key .custom-dot { color: var(--color-accent-violet); margin-left: 4px; }
  .field-val { font-size: var(--text-sm); color: var(--color-text); min-width: 0; }
  .field-val.tentative { font-style: italic; color: var(--color-text-muted); text-decoration: underline dashed hsl(0 72% 51% / 0.5); text-underline-offset: 3px; }
  .field-val.empty { color: var(--color-text-dim); font-style: italic; }
  .field-val .topics { display: flex; flex-wrap: wrap; gap: 4px; }
  .field-val .topic { background: var(--color-accent); color: var(--color-text-muted); padding: 1px 7px; border-radius: var(--radius-full); font-size: 11px; }
  .edit-btn {
    opacity: 0; background: transparent; border: none; color: var(--color-text-dim);
    cursor: pointer; font-size: 12px; padding: 3px 5px; border-radius: var(--radius-sm);
    transition: all var(--dur-fast) var(--ease-out); justify-self: end; grid-column: 3;
  }
  .field-row:hover .edit-btn { opacity: 1; }
  .edit-btn:hover { background: var(--color-accent); color: var(--color-primary); }
  .field-mid { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); grid-column: 2; min-width: 0; }
  .field-mid .field-val { overflow: hidden; text-overflow: ellipsis; }

  .edit-input {
    width: 100%; background: var(--color-bg); color: var(--color-text);
    border: 1px solid var(--color-primary); border-radius: var(--radius-sm);
    padding: 4px 8px; font-family: var(--font-sans); font-size: var(--text-sm);
    box-shadow: var(--shadow-glow-primary); outline: none;
  }
  .edit-actions { display: flex; gap: 4px; margin-top: 6px; grid-column: 2 / 4; }
  .btn-mini {
    font-size: var(--text-xs); padding: 3px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted); cursor: pointer;
  }
  .btn-mini.primary { background: var(--color-primary); color: hsl(216 45% 6%); border-color: var(--color-primary); font-weight: 600; }
  .btn-mini:hover { border-color: var(--color-primary); }

  /* ─── Accordion sections (shared shell) ─── */
  .sec { border-bottom: 1px solid var(--color-border); }
  .sec-head {
    display: flex; align-items: center; gap: var(--space-2); width: 100%;
    padding: var(--space-3) 0; background: none; border: none; cursor: pointer;
    color: var(--color-text); font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 600;
  }
  .sec-head .chev { color: var(--color-text-dim); transition: transform var(--dur-fast) var(--ease-out); font-size: 11px; }
  .sec.collapsed .chev { transform: rotate(-90deg); }
  .sec-head .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-dim); }
  .sec-head .soon { margin-left: auto; font-size: 10px; color: var(--color-accent-violet); background: hsl(258 90% 66% / 0.12); padding: 2px 7px; border-radius: var(--radius-full); font-family: var(--font-mono); }
  .sec-body { padding-bottom: var(--space-4); animation: fadeSlideUp var(--dur-base) var(--ease-out); }
  .sec.collapsed .sec-body { display: none; }
  .placeholder { color: var(--color-text-dim); font-size: var(--text-sm); padding: var(--space-3); background: var(--color-bg); border: 1px dashed var(--color-border); border-radius: var(--radius-md); }

  .save-toast {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    background: var(--color-success); color: hsl(216 45% 6%); font-weight: 600;
    font-size: var(--text-sm); padding: 8px 18px; border-radius: var(--radius-full);
    box-shadow: var(--shadow-lg); z-index: 9998; opacity: 0; pointer-events: none;
    transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
  }
  .save-toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .audit-note { font-size: 10px; color: var(--color-text-dim); font-family: var(--font-mono); margin-top: 2px; }

  /* ════════ VARIANT A — Right-side push/split panel ════════ */
  #variant-a .app { display: flex; height: calc(100vh - 52px); }
  #variant-a .main { display: grid; grid-template-columns: minmax(0,1fr) var(--detail-w, 430px); flex: 1; min-width: 0; transition: grid-template-columns var(--dur-slow) var(--ease-out); }
  #variant-a .main.closed { --detail-w: 0px; }
  #variant-a .list-col { min-width: 0; overflow: auto; padding: 0 var(--space-2) var(--space-6); }
  #variant-a .detail-col {
    border-left: 1px solid var(--color-border); background: var(--color-surface);
    overflow: hidden auto; min-width: 0;
  }
  #variant-a .detail-inner { width: 430px; padding: var(--space-4) var(--space-5); }
  .detail-head { display: flex; align-items: flex-start; gap: var(--space-3); padding-bottom: var(--space-3); border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-2); }
  .detail-head .fico { font-size: 22px; }
  .detail-head .ttl { font-family: var(--font-headline); font-size: var(--text-md); font-weight: 700; line-height: 1.3; word-break: break-word; }
  .detail-head .sub { font-size: var(--text-xs); color: var(--color-text-dim); font-family: var(--font-mono); margin-top: 2px; }
  .detail-head .x { margin-left: auto; background: none; border: none; color: var(--color-text-dim); cursor: pointer; font-size: 17px; padding: 2px 6px; border-radius: var(--radius-sm); }
  .detail-head .x:hover { background: var(--color-accent); color: var(--color-text); }

  /* ════════ VARIANT B — Full-page detail view ════════ */
  #variant-b .fp-back { display: inline-flex; align-items: center; gap: 6px; color: var(--color-text-muted); background: none; border: none; cursor: pointer; font-size: var(--text-sm); padding: var(--space-3) var(--space-6) 0; }
  #variant-b .fp-back:hover { color: var(--color-primary); }
  #variant-b .fp-hero { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--color-border); }
  #variant-b .fp-hero .fico { font-size: 40px; }
  #variant-b .fp-hero h1 { font-family: var(--font-headline); font-size: var(--text-2xl); margin: 0; }
  #variant-b .fp-hero .meta-sub { color: var(--color-text-dim); font-size: var(--text-sm); font-family: var(--font-mono); margin-top: 4px; }
  #variant-b .fp-hero .actions { margin-left: auto; display: flex; gap: var(--space-2); }
  #variant-b .fp-body { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--space-6); padding: var(--space-6); max-width: 1100px; }
  #variant-b .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); }
  #variant-b .card h2 { font-family: var(--font-headline); font-size: var(--text-md); margin: 0 0 var(--space-3); }
  @media (max-width: 880px) { #variant-b .fp-body { grid-template-columns: 1fr; } }

  /* ════════ VARIANT C — Centered modal (foil) ════════ */
  #variant-c .scrim { position: fixed; inset: 52px 0 0 0; background: hsl(216 45% 2% / 0.7); backdrop-filter: blur(3px); display: grid; place-items: start center; padding-top: 5vh; z-index: 200; }
  #variant-c .modal { width: min(560px, 92vw); max-height: 82vh; overflow: auto; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: var(--space-5); }
  #variant-c .behind { padding: 0 var(--space-6); opacity: 0.5; }
  .btn-sm { font-size: var(--text-xs); padding: 5px 12px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted); cursor: pointer; }
  .btn-sm:hover { border-color: var(--color-primary); color: var(--color-text); }
</style>
</head>
<body>

<!-- Variant nav -->
<div class="variant-nav">
  <span class="label">Sketch 027 · Detail Shell</span>
  <button class="variant-tab active" onclick="showVariant('a', event)">A · Right-side panel ★ Selected</button>
  <button class="variant-tab" onclick="showVariant('b', event)">B · Full-page view</button>
  <button class="variant-tab" onclick="showVariant('c', event)">C · Modal (foil)</button>
</div>

<!-- ════════════════ VARIANT A ════════════════ -->
<div id="variant-a" class="variant">
  <div class="app">
    <div class="nav-rail">
      <div class="ni">💬</div>
      <div class="ni active">📄</div>
      <div class="ni">🔀</div>
      <div class="ni">🧩</div>
      <div class="ni" style="margin-top:auto;margin-bottom:16px">⚙️</div>
    </div>
    <div class="main" id="a-main">
      <div class="list-col">
        <div class="page-head"><h1>Documents</h1><span class="crumb">Project Meridian · 5 files</span></div>
        <table class="doc-table">
          <thead><tr><th>Name</th><th>Type</th><th>Chunks</th><th>Status</th></tr></thead>
          <tbody id="a-rows"></tbody>
        </table>
      </div>
      <div class="detail-col">
        <div class="detail-inner" id="a-detail"></div>
      </div>
    </div>
  </div>
</div>

<!-- ════════════════ VARIANT B ════════════════ -->
<div id="variant-b" class="variant" style="display:none">
  <!-- list state -->
  <div id="b-list">
    <div class="page-head"><h1>Documents</h1><span class="crumb">Project Meridian · 5 files · click a row to open its detail page</span></div>
    <div style="padding:0 var(--space-6)">
      <table class="doc-table">
        <thead><tr><th>Name</th><th>Type</th><th>Chunks</th><th>Status</th></tr></thead>
        <tbody id="b-rows"></tbody>
      </table>
    </div>
  </div>
  <!-- detail state -->
  <div id="b-detail" style="display:none"></div>
</div>

<!-- ════════════════ VARIANT C ════════════════ -->
<div id="variant-c" class="variant" style="display:none">
  <div class="behind">
    <div class="page-head"><h1>Documents</h1><span class="crumb">Project Meridian · 5 files</span></div>
    <table class="doc-table">
      <thead><tr><th>Name</th><th>Type</th><th>Chunks</th><th>Status</th></tr></thead>
      <tbody id="c-rows"></tbody>
    </table>
  </div>
  <div class="scrim" id="c-scrim" style="display:none"><div class="modal" id="c-modal"></div></div>
</div>

<div class="save-toast" id="toast">✓ Saved · audit row written</div>

<!-- Sketch toolbar -->
<div class="sketch-toolbar">
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">Deep Midnight</option>
  </select>
  <button onclick="setVp(420)">📱</button>
  <button onclick="setVp(820)">▭</button>
  <button onclick="setVp(0)">🖥</button>
</div>

<script>
// ─────────── Shared data: the real "Project Meridian" PM corpus ───────────
const DOCS = {
  charter: {
    icon: '📕', name: 'Project Charter.pdf', type: 'PDF', chunks: 14, ttl: 'charter',
    fields: [
      { key: 'Title',         val: 'Project Meridian Charter',                 conf: 0.96 },
      { key: 'Author',        val: null,                                       conf: 0.0 },
      { key: 'Date',          val: '2026-01-14',                               conf: 0.71 },
      { key: 'Document type', val: 'charter',                                  conf: 0.92 },
      { key: 'Language',      val: 'English',                                  conf: 0.99 },
      { key: 'Topics',        val: ['governance','scope','stakeholders'],      conf: 0.64, arr: true },
      { key: 'Project phase', val: 'Initiation',                              conf: 0.44, custom: true },
      { key: 'Owner',         val: 'PMO',                                      conf: 0.33, custom: true },
      { key: 'Summary',       val: 'Defines scope, objectives, and governance for the Meridian rollout across the EMEA region.', conf: 0.81, long: true },
    ],
  },
  risk: {
    icon: '📊', name: 'Risk Register.xlsx', type: 'XLSX', chunks: 9, ttl: 'register',
    fields: [
      { key: 'Title',         val: 'Meridian Risk Register',                   conf: 0.88 },
      { key: 'Author',        val: 'A. Okafor',                                conf: 0.52 },
      { key: 'Date',          val: '2026-03-02',                               conf: 0.67 },
      { key: 'Document type', val: 'register',                                 conf: 0.90 },
      { key: 'Topics',        val: ['risk','mitigation'],                      conf: 0.58, arr: true },
      { key: 'Risk level',    val: 'High',                                     conf: 0.29, custom: true },
      { key: 'Department',    val: null,                                       conf: 0.0, custom: true },
    ],
  },
  week8: {
    icon: '📘', name: 'Week 8 Status Notes.docx', type: 'DOCX', chunks: 6, ttl: 'status',
    fields: [
      { key: 'Title',         val: 'Week 8 Status — GREEN',                    conf: 0.93 },
      { key: 'Author',        val: 'A. Okafor',                                conf: 0.79 },
      { key: 'Date',          val: '2026-02-28',                               conf: 0.84 },
      { key: 'Document type', val: 'status report',                            conf: 0.86 },
      { key: 'Topics',        val: ['weekly','progress'],                      conf: 0.6, arr: true },
      { key: 'RAG status',    val: 'Green',                                    conf: 0.41, custom: true },
    ],
  },
  week9: {
    icon: '📙', name: 'Week 9 Status Notes.docx', type: 'DOCX', chunks: 7, ttl: 'status',
    fields: [
      { key: 'Title',         val: 'Week 9 Status — AMBER',                    conf: 0.91 },
      { key: 'Author',        val: 'A. Okafor',                                conf: 0.77 },
      { key: 'Date',          val: '2026-03-06',                               conf: 0.82 },
      { key: 'Document type', val: 'status report',                            conf: 0.85 },
      { key: 'RAG status',    val: 'Amber',                                    conf: 0.36, custom: true },
    ],
  },
  log: {
    icon: '📗', name: 'Sprint & Task Log.md', type: 'MD', chunks: 11, ttl: 'log',
    fields: [
      { key: 'Title',         val: 'Sprint & Task Log',                        conf: 0.74 },
      { key: 'Author',        val: null,                                       conf: 0.0 },
      { key: 'Date',          val: '2026-03-09',                               conf: 0.55 },
      { key: 'Document type', val: 'task log',                                 conf: 0.69 },
      { key: 'Topics',        val: ['sprint','tasks'],                         conf: 0.47, arr: true },
    ],
  },
};
const ORDER = ['charter','risk','week8','week9','log'];

// ─────────── Confidence tiering (thresholds are settings-driven) ───────────
function tier(c) {
  if (c >= 0.8)  return { cls:'high', g:'✓', word:'High' };
  if (c >= 0.5)  return { cls:'med',  g:'◑', word:'Med'  };
  return { cls:'low', g:'⚠', word:'Low' };
}
function confChip(f) {
  if (f.manual) return `<span class="conf manual" title="Set by you — authoritative"><span class="g">✎</span>Edited · you</span>`;
  if (f.val == null || (f.arr && f.val.length === 0)) return `<span class="conf none"><span class="g">—</span>not extracted</span>`;
  const t = tier(f.conf);
  return `<span class="conf ${t.cls}"><span class="g">${t.g}</span>${Math.round(f.conf*100)} · ${t.word}</span>`;
}
function valHtml(f) {
  if (f.val == null || (f.arr && f.val.length === 0))
    return `<span class="field-val empty">— not extracted</span>`;
  if (f.arr)
    return `<span class="field-val"><span class="topics">${f.val.map(t=>`<span class="topic">${t}</span>`).join('')}</span></span>`;
  const tentative = !f.manual && f.conf < 0.5 ? ' tentative' : '';
  return `<span class="field-val${tentative}">${escapeHtml(f.val)}</span>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ─────────── Render the metadata field grid (shared inner content) ───────────
function renderFields(docKey, scope) {
  const doc = DOCS[docKey];
  return `<div class="meta-grid">` + doc.fields.map((f, i) => {
    const custom = f.custom ? `<span class="custom-dot" title="Custom field">◆</span>` : '';
    return `
      <div class="field-row" data-i="${i}">
        <div class="field-key">${f.key}${custom}</div>
        <div class="field-mid">
          ${valHtml(f)}
          ${confChip(f)}
        </div>
        ${f.arr ? '' : `<button class="edit-btn" onclick="startEdit('${scope}','${docKey}',${i})" title="Edit / override">✎</button>`}
      </div>`;
  }).join('') + `</div>`;
}

// ─────────── Shared shell sections (proves 117 + 118 slot in) ───────────
function shellSections(docKey, scope) {
  return `
    <div class="sec" id="${scope}-sec-meta">
      <button class="sec-head" onclick="toggleSec('${scope}-sec-meta')"><span class="chev">▾</span>Metadata<span class="count">${DOCS[docKey].fields.length} fields</span></button>
      <div class="sec-body">${renderFields(docKey, scope)}</div>
    </div>
    <div class="sec collapsed" id="${scope}-sec-rel">
      <button class="sec-head" onclick="toggleSec('${scope}-sec-rel')"><span class="chev">▾</span>Relationships<span class="soon">Phase 117</span></button>
      <div class="sec-body"><div class="placeholder">Typed links (supersedes · amends · references) will live here — same shell, added in Phase 117.</div></div>
    </div>
    <div class="sec collapsed" id="${scope}-sec-class">
      <button class="sec-head" onclick="toggleSec('${scope}-sec-class')"><span class="chev">▾</span>Classification<span class="soon">Phase 118</span></button>
      <div class="sec-body"><div class="placeholder">Auto-classification suggestions (accept / dismiss) will surface here — Phase 118.</div></div>
    </div>
    <div class="sec collapsed" id="${scope}-sec-ver">
      <button class="sec-head" onclick="toggleSec('${scope}-sec-ver')"><span class="chev">▾</span>Versions<span class="count">v1</span></button>
      <div class="sec-body"><div class="placeholder">Existing version history folds in as one more section.</div></div>
    </div>`;
}

// ─────────── List rows ───────────
function rowsHtml(scope, selectFn) {
  return ORDER.map(k => {
    const d = DOCS[k];
    return `<tr class="doc-row" data-k="${k}" onclick="${selectFn}('${k}')">
      <td><span class="doc-name"><span class="doc-ico">${d.icon}</span>${d.name}</span></td>
      <td><span class="pill">${d.type}</span></td>
      <td class="text-muted">${d.chunks}</td>
      <td><span class="status-dot"></span> <span class="text-muted" style="font-size:11px">completed</span></td>
    </tr>`;
  }).join('');
}

// ════════ Variant A logic ════════
let aSel = 'charter';
function renderA() {
  document.getElementById('a-rows').innerHTML = rowsHtml('a', 'selectA');
  markSelected('a-rows', aSel);
  const d = DOCS[aSel];
  document.getElementById('a-detail').innerHTML = `
    <div class="detail-head">
      <span class="fico">${d.icon}</span>
      <div><div class="ttl">${d.name}</div><div class="sub">${d.type} · ${d.chunks} chunks · v1</div></div>
      <button class="x" onclick="closeA()" title="Close panel">✕</button>
    </div>
    ${shellSections(aSel, 'a')}`;
}
function selectA(k){ aSel = k; document.getElementById('a-main').classList.remove('closed'); renderA(); }
function closeA(){ document.getElementById('a-main').classList.add('closed'); }

// ════════ Variant B logic ════════
function selectB(k){
  const d = DOCS[k];
  document.getElementById('b-list').style.display = 'none';
  const det = document.getElementById('b-detail');
  det.style.display = 'block';
  det.innerHTML = `
    <button class="fp-back" onclick="backB()">← Documents</button>
    <div class="fp-hero">
      <span class="fico">${d.icon}</span>
      <div><h1>${d.name}</h1><div class="meta-sub">${d.type} · ${d.chunks} chunks · v1 · completed</div></div>
      <div class="actions"><button class="btn-sm">↻ Re-extract</button><button class="btn-sm">🗑 Delete</button></div>
    </div>
    <div class="fp-body">
      <div class="card"><h2>Metadata</h2>${renderFields(k, 'b')}</div>
      <div style="display:flex;flex-direction:column;gap:var(--space-4)">
        <div class="card"><h2>Relationships <span class="soon">Phase 117</span></h2><div class="placeholder">Typed links added in Phase 117 — same page.</div></div>
        <div class="card"><h2>Classification <span class="soon">Phase 118</span></h2><div class="placeholder">Suggestions in Phase 118.</div></div>
      </div>
    </div>`;
  det.dataset.k = k;
}
function backB(){ document.getElementById('b-detail').style.display='none'; document.getElementById('b-list').style.display='block'; }

// ════════ Variant C logic ════════
function selectC(k){
  const d = DOCS[k];
  document.getElementById('c-scrim').style.display = 'grid';
  document.getElementById('c-modal').innerHTML = `
    <div class="detail-head">
      <span class="fico">${d.icon}</span>
      <div><div class="ttl">${d.name}</div><div class="sub">${d.type} · ${d.chunks} chunks</div></div>
      <button class="x" onclick="closeC()">✕</button>
    </div>
    ${shellSections(k, 'c')}`;
  document.getElementById('c-modal').dataset.k = k;
}
function closeC(){ document.getElementById('c-scrim').style.display='none'; }

// ─────────── Inline edit (shared across variants) ───────────
let editState = null;
function startEdit(scope, docKey, i) {
  const f = DOCS[docKey].fields[i];
  const row = document.querySelector(`#${scope}-sec-meta .field-row[data-i="${i}"]`)
           || document.querySelectorAll(`#variant-${scope==='b'?'b':scope} .field-row`)[i]
           || [...document.querySelectorAll('.field-row')].find(r => r.dataset.i==i && r.closest('.variant').style.display!=='none');
  if (!row) return;
  const mid = row.querySelector('.field-mid');
  editState = { scope, docKey, i, html: mid.innerHTML };
  mid.innerHTML = `<input class="edit-input" id="edit-input" value="${f.val ? escapeHtml(f.val) : ''}" placeholder="(empty — add a value)" />`;
  const acts = document.createElement('div');
  acts.className = 'edit-actions';
  acts.innerHTML = `<button class="btn-mini primary" onclick="saveEdit()">Save</button><button class="btn-mini" onclick="cancelEdit()">Cancel</button><span class="audit-note">↪ writes metadata.update audit row</span>`;
  row.appendChild(acts);
  const inp = document.getElementById('edit-input');
  inp.focus(); inp.select();
  inp.addEventListener('keydown', e => { if (e.key==='Enter') saveEdit(); if (e.key==='Escape') cancelEdit(); });
  row.querySelector('.edit-btn')?.style && (row.querySelector('.edit-btn').style.opacity = 0);
}
function saveEdit() {
  if (!editState) return;
  const v = document.getElementById('edit-input').value.trim();
  const f = DOCS[editState.docKey].fields[editState.i];
  f.val = v === '' ? null : v;
  f.manual = v !== '';
  rerender(editState.scope, editState.docKey);
  editState = null;
  toast();
}
function cancelEdit() {
  if (!editState) return;
  rerender(editState.scope, editState.docKey);
  editState = null;
}
function rerender(scope, docKey) {
  if (scope === 'a') renderA();
  else if (scope === 'b') selectB(docKey);
  else if (scope === 'c') selectC(docKey);
}

// ─────────── Helpers ───────────
function toggleSec(id){ document.getElementById(id).classList.toggle('collapsed'); }
function markSelected(tbodyId, k){
  document.querySelectorAll(`#${tbodyId} .doc-row`).forEach(r => r.classList.toggle('selected', r.dataset.k===k));
}
function toast(){ const t=document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function setVp(w){ document.querySelectorAll('.variant').forEach(v=>{ v.style.maxWidth = w? w+'px':''; v.style.margin = w?'0 auto':''; v.style.borderInline = w?'1px solid var(--color-border)':''; }); }

function showVariant(id, e){
  document.querySelectorAll('.variant').forEach(v=>v.style.display='none');
  document.querySelectorAll('.variant-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('variant-'+id).style.display='block';
  e.target.classList.add('active');
}

// init
renderA();
document.getElementById('b-rows').innerHTML = rowsHtml('b','selectB');
document.getElementById('c-rows').innerHTML = rowsHtml('c','selectC');
selectC('risk'); // open modal on the cramped doc to show the foil
</script>
</body>
</html>
