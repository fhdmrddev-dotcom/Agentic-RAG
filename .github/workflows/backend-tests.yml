# CI workflow for the FastAPI backend test suite.
# Phase 061 (D-061-14): boots Redis from docker-compose.dev.yml before
# pytest so the run-backed streaming binding tests have a real Redis
# to talk to (no fakeredis — Streams semantics drift).
name: backend-tests

on:
  push:
    branches: [master, main, develop, "release/**"]
    paths:
      - "backend/**"
      - "supabase/migrations/**"
      - ".github/workflows/backend-tests.yml"
      # Phase 253-03 / WR-08. These two live under scripts/ but are READ by backend unit
      # tests, so without them the one change that breaks a fence is the one change that
      # does not run it. Held there by tests/unit/test_253_ci_path_coverage.py, which
      # DERIVES this set from the test modules rather than trusting this list.
      - "scripts/full-schema-supplement.sql"        # tests/unit/test_253_supplement_column_parity.py
      - "scripts/check-greenfield-privileges.py"    # tests/unit/test_253_greenfield_sql_lexer.py
  pull_request:
    paths:
      - "backend/**"
      - "supabase/migrations/**"
      # Phase 253-03 / WR-08 — see the push arm above. ⚠ `.github/workflows/backend-tests.yml`
      # is deliberately NOT added here: that asymmetry is pre-existing and outside this
      # gap-closure round's locked scope. It is PINNED by
      # test_253_ci_path_coverage.py::test_the_workflows_own_file_is_in_the_push_arm_only
      # so a future reader meets a fact rather than an accident.
      - "scripts/full-schema-supplement.sql"        # tests/unit/test_253_supplement_column_parity.py
      - "scripts/check-greenfield-privileges.py"    # tests/unit/test_253_greenfield_sql_lexer.py

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      # Phase 061 (D-061-14): boot Redis from docker-compose.dev.yml.
      # Streams semantics drift between Redis and fakeredis; tests run
      # against the real thing.
      - name: Start Redis (docker-compose)
        run: docker compose -f docker-compose.dev.yml up -d redis

      # CR-03: host-port-based readiness probe instead of `docker exec <container_name>`.
      # docker-compose container names depend on the compose project prefix and the
      # `container_name:` field — both of which can drift. The host port published by
      # docker-compose.dev.yml (6379:6379) is stable.
      - name: Wait for Redis
        run: |
          sudo apt-get install -y --no-install-recommends redis-tools
          for i in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready"; exit 0
            fi
            sleep 1
          done
          echo "Redis did not become ready in 30s"; exit 1

      - name: Run pytest
        run: |
          cd backend
          source venv/bin/activate
          pytest tests -q
        env:
          REDIS_URL: redis://localhost:6379
          # Supabase test substrate: integration tests that hit real
          # Postgres are conditionally skipped if SUPABASE_URL is unset.
          # CI baseline runs unit + mock-Supabase integration tests only.

      - name: Stop Redis
        if: always()
        run: docker compose -f docker-compose.dev.yml down redis
