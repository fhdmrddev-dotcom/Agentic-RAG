# CI workflow for the React frontend test suite + Playwright E2E.
# Phase 075.4 Plan 05 Task 5 — mirrors .github/workflows/backend-tests.yml
# structure (D-061-14 Redis boot pattern reused verbatim).
#
# Two jobs:
#   1. vitest      — runs npm test (unit + component tests, fast).
#   2. playwright  — depends on vitest; boots Redis + backend + uvicorn,
#                    waits for /health to ping ok, then runs the 6 E2E
#                    scenarios that Plan 06 ships.
#
# Threat T-075.4-08 mitigation: LANGSMITH_API_KEY flows through
# secrets.LANGSMITH_API_KEY, which GitHub Actions auto-redacts in step
# output. The "LangSmith key redaction note" step makes that contract
# explicit so future maintainers don't accidentally log the raw value.
name: frontend-tests

on:
  push:
    branches: [master, main, develop, "release/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/**"

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install + test
        run: |
          cd frontend
          npm ci
          npm test

      # Phase 155 (A11Y-01 / D-02 + operator decision D-155-01-A): enforce the
      # jsx-a11y regression gate in CI. `npm run lint:a11y` = `eslint . -c
      # eslint.a11y.config.js` — the accessibility-SCOPED lint (jsx-a11y
      # recommended rules only), NOT the full `eslint .` which also surfaces
      # ~160 pre-existing non-a11y errors (no-explicit-any / no-unused-vars /
      # react-refresh / import/first / react-hooks) that are out of Phase 155's
      # scope (D-06 scope line). Reuses the node_modules installed by the
      # "Install + test" step above so an a11y regression cannot silently merge.
      # The full `npm run lint` script is kept in package.json for the future
      # general lint-debt cleanup phase; CI just does not gate on it here.
      - name: Lint (jsx-a11y as errors)
        run: |
          cd frontend
          npm run lint:a11y

  playwright:
    runs-on: ubuntu-latest
    needs: vitest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Phase 061 (D-061-14): boot Redis from docker-compose.dev.yml (same
      # pattern as backend-tests.yml so streams semantics match between
      # the unit/integration baseline and the E2E suite).
      - name: Start Redis (docker-compose)
        run: docker compose -f docker-compose.dev.yml up -d redis

      - name: Wait for Redis
        run: |
          sudo apt-get install -y --no-install-recommends redis-tools
          for i in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready"; exit 0
            fi
            sleep 1
          done
          echo "Redis did not become ready in 30s"; exit 1

      - name: Install backend deps
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Start backend
        run: |
          cd backend
          source venv/bin/activate
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "Backend ready"; exit 0
            fi
            sleep 1
          done
          echo "Backend did not become ready"; exit 1
        env:
          REDIS_URL: redis://localhost:6379

      - name: Install Playwright + run E2E
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}

      - name: LangSmith key redaction note
        if: always()
        run: echo "GitHub Actions auto-redacts secrets.* references in step outputs."

      - name: Stop Redis
        if: always()
        run: docker compose -f docker-compose.dev.yml down redis
