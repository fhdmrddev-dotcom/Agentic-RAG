# frontend/nginx.conf — Source: RECOVERED_VPS_Deployment_Guide.md Step 10 [ported],
#   retargeted from the host guide's 127.0.0.1:8000 to the compose service name backend:8000.
# Destined for /etc/nginx/conf.d/default.conf inside the nginx:1.27-alpine runtime stage
# (all-in-one docker-compose.prod.yml, Phase 157 D-03).
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;                 # document uploads (nginx default 1MB -> 413)

    root /usr/share/nginx/html;                 # nginx:alpine default web root (Vite dist copied here)
    index index.html;

    # Phase 276 — the public docs entry. /docs and every /docs/* deep link serve docs.html, so a
    # pasted link refreshes into the docs page (G4-4). Docs assets live under /docs-assets/ and are
    # real files, so they resolve through `location /` below. Mirrors vercel.json + devRouting.ts.
    location = /docs {
        try_files /docs.html =404;
    }
    location /docs/ {
        try_files $uri /docs.html;
    }

    # Phase 276 (folds RESEARCH Pitfall 12, pre-existing since Phase 226): the app is its own entry
    # (app.html) since the landing/app split, but this file predated the split, so on a onebox
    # /app returned the LANDING. These are the app paths the landing host hands to the app
    # (vercel.json redirects + App.tsx's literal pathname checks).
    location = /app {
        try_files $uri /app.html;
    }
    location /app/ {
        try_files $uri /app.html;
    }
    location = /setup {
        try_files $uri /app.html;
    }
    location = /invite {
        try_files $uri /app.html;
    }
    location /admin/spend {
        try_files $uri /app.html;
    }

    location / {
        try_files $uri $uri/ /index.html;       # SPA client-side routing fallback
    }

    # Deferred DNS so nginx boots even if the backend container's name is not resolvable
    # yet (Pitfall 6). 127.0.0.11 is Docker's embedded DNS on a user-defined network.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8000;

    # Phase 307 — OAuth discovery for AI tools. The issuer is https://<host>/api, so RFC 8414 /
    # RFC 9728 path insertion puts both documents at the ORIGIN ROOT
    # (/.well-known/oauth-authorization-server/api, /.well-known/oauth-protected-resource/api/mcp),
    # where `location /` would serve the SPA. These paths are passed UNCHANGED (no rewrite, no URI
    # on proxy_pass): the backend registers them literally. Must sit after `set $backend_upstream`.
    location ^~ /.well-known/oauth- {
        proxy_pass $backend_upstream;          # variable upstream, no URI part: path passed as-is
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/openid-configuration { return 404; }   # never the SPA (307 F-9)
    # The consent page an AI tool's sign-in lands on. Anti-framing + no Referer (T-307-05 / -07).
    # `try_files /app.html =404` serves the file IN this location: a `$uri /app.html` fallback is an
    # internal redirect and would DROP these add_header lines (307 F-10).
    location ^~ /app/connect/ {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /app.html =404;
    }

    location /api/ {
        # Strip the /api/ prefix before forwarding: /api/threads -> /threads,
        # /api/health -> /health (backend routes are unprefixed).
        #
        # NOTE: with a VARIABLE upstream (required for the deferred-DNS resolver above),
        # nginx does NOT auto-strip via a trailing slash on proxy_pass — per nginx's
        # documented proxy_pass semantics the directive URI is "passed literally" when the
        # host is a variable, so `proxy_pass $backend_upstream/;` would forward `/` for
        # every request instead of stripping /api/. The rewrite below is nginx's sanctioned
        # way to strip a prefix with a variable upstream (see 157-02-SUMMARY "Deviations").
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;    # 293-REVIEW WR-01: absolute inbound file links

        proxy_buffering off;                    # SSE: don't buffer the stream
        proxy_cache off;
        proxy_read_timeout 300s;                # SSE: long-lived streaming connections
        chunked_transfer_encoding on;
    }
}
