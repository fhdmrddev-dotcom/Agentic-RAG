# frontend/nginx.conf — Source: RECOVERED_VPS_Deployment_Guide.md Step 10 [ported],
#   retargeted from the host guide's 127.0.0.1:8000 to the compose service name backend:8000.
# Destined for /etc/nginx/conf.d/default.conf inside the nginx:1.27-alpine runtime stage
# (all-in-one docker-compose.prod.yml, Phase 157 D-03).
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;                 # document uploads (nginx default 1MB -> 413)

    root /usr/share/nginx/html;                 # nginx:alpine default web root (Vite dist copied here)
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;       # SPA client-side routing fallback
    }

    # Deferred DNS so nginx boots even if the backend container's name is not resolvable
    # yet (Pitfall 6). 127.0.0.11 is Docker's embedded DNS on a user-defined network.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8000;

    location /api/ {
        # Strip the /api/ prefix before forwarding: /api/threads -> /threads,
        # /api/health -> /health (backend routes are unprefixed).
        #
        # NOTE: with a VARIABLE upstream (required for the deferred-DNS resolver above),
        # nginx does NOT auto-strip via a trailing slash on proxy_pass — per nginx's
        # documented proxy_pass semantics the directive URI is "passed literally" when the
        # host is a variable, so `proxy_pass $backend_upstream/;` would forward `/` for
        # every request instead of stripping /api/. The rewrite below is nginx's sanctioned
        # way to strip a prefix with a variable upstream (see 157-02-SUMMARY "Deviations").
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;                    # SSE: don't buffer the stream
        proxy_cache off;
        proxy_read_timeout 300s;                # SSE: long-lived streaming connections
        chunked_transfer_encoding on;
    }
}
