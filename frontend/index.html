<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Syrel — Enterprise AI with document citations, deterministic publish gauntlet, autonomous workflows, and human-in-the-loop approvals." />
    <title>Syrel — AI Knowledge &amp; Autonomous Workflows</title>
    <!-- Brand set (276-07, D-27): every path is same-origin; og:image is made absolute at build
         from VITE_APP_URL by plugins/brandMeta.ts. Regenerate the PNGs with
         `node scripts/generate-brand-rasters.cjs`. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#06090F" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Syrel" />
    <meta property="og:title" content="Syrel — AI Knowledge &amp; Autonomous Workflows" />
    <meta property="og:description" content="Syrel — Enterprise AI with document citations, deterministic publish gauntlet, autonomous workflows, and human-in-the-loop approvals." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Syrel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/brand/og-image.png" />
    <!-- Google Fonts: Inter + Manrope + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Prevent FOUC: apply saved theme before first paint
      (function() {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-cyan-500/30">
    <div id="landing-root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
