<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 150 — The seeded canvas arrives (Phase 187 / VOCAB-02)</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* ══════════════════════════════════════════════════════════════════════════════
   SKETCH 150 — you describe a workflow, the AI drafts it. What does ARRIVAL feel
   like, and how does the auto-applied grounding become legible instead of magic?

   THE HONESTY CONSTRAINT THAT SHAPES EVERY VARIANT (audited 2026-08-01):
   generation is SINGLE-SHOT, not streamed. `generate_workflow_definition`
   (workflow_authoring.py:217) makes EXACTLY one provider call on a valid first emit
   (two only on a first-pass ValidationError, never three) and returns the WHOLE
   definition or an honest error — it never yields a partial. The builder's own state
   machine is `empty → composing → drafted` (WorkflowBuilderPage.tsx:11).

   So a node-by-node reveal is PACING, NOT PROGRESS. The work is already finished when
   the first node lands. Variant A is built and labelled as exactly that, because this
   project's rule is that a surface never implies an event it did not receive.

   SC#3 — "a seeded grounded node auto-gets its citation/confidence gate,
   safe-by-construction" — is the thing that must become VISIBLE here. The corner seal
   appears on steps the user never marked. Nothing today explains why.
   ══════════════════════════════════════════════════════════════════════════════ */

html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans);
}
.variant-nav, .lead, .bar { flex-shrink: 0; }
.variant-nav {
  display: flex; gap: 6px; align-items: center; padding: 10px 24px;
  background: var(--color-bg-elev1); border-bottom: 1px solid var(--color-border);
}
.variant-tab {
  border: 1px solid transparent; background: transparent; color: var(--color-text-dim);
  font-family: var(--font-sans); font-size: 12.5px; padding: 6px 14px;
  border-radius: 999px; cursor: pointer; transition: all .15s ease;
}
.variant-tab:hover { color: var(--color-text); background: var(--color-muted); }
.variant-tab.active {
  background: var(--color-surface-hi); color: var(--color-text);
  border-color: var(--color-border); box-shadow: var(--shadow-sm);
}
.lead {
  padding: 12px 24px; font-size: 12.5px; color: var(--color-text-muted); line-height: 1.65;
  border-bottom: 1px solid var(--color-border); background: var(--color-bg-elev1);
}
.lead b { color: var(--color-text); font-weight: 600; }
.lead code { font-family: var(--font-mono); font-size: 11px; color: var(--color-primary); }
.lead .warn { color: hsl(38 92% 72%); font-weight: 600; }
.lead .good { color: hsl(142 71% 62%); font-weight: 600; }

.bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 24px; border-bottom: 1px solid var(--color-border);
}
.bar .lbl {
  font-family: var(--font-mono); font-size: 10px; color: var(--color-text-dim);
  text-transform: uppercase; letter-spacing: .09em;
}
.btn {
  border: 1px solid var(--color-border); background: var(--color-muted);
  color: var(--color-text); font-size: 12px; padding: 6px 13px;
  border-radius: 8px; cursor: pointer; transition: all .15s ease;
}
.btn:hover { background: var(--color-accent); border-color: var(--color-text-dim); }
.btn.go {
  background: linear-gradient(135deg, hsl(239 84% 67% / .9), hsl(258 90% 66% / .9));
  border-color: transparent; color: #fff;
}
.spacer { flex: 1; }

/* ── the describe screen (the calm first screen, decision #11/#12) ────────── */
.describe {
  position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 90px 24px 0;
}
.describe h2 {
  font-family: var(--font-headline); font-size: 21px; font-weight: 600;
  margin: 0 0 8px; color: var(--color-text);
}
.describe .hint { font-size: 12.5px; color: var(--color-text-muted); margin: 0 0 20px; }
.describe textarea {
  width: 100%; box-sizing: border-box; min-height: 110px; resize: vertical;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); padding: 14px 16px; color: var(--color-text);
  font-family: var(--font-sans); font-size: 13.5px; line-height: 1.6;
}
.describe textarea:focus { outline: none; border-color: hsl(239 100% 82% / .5); }

/* ── the stage ───────────────────────────────────────────────────────────── */
.stage { position: relative; flex: 1; min-height: 0; overflow: auto; }
.amb { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.amb::before, .amb::after {
  content: ''; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45;
}
.amb::before { width: 520px; height: 520px; left: 6%; top: -14%; background: hsl(239 84% 45% / .2); }
.amb::after  { width: 460px; height: 460px; right: 4%; bottom: -18%; background: hsl(258 90% 50% / .14); }

.flow {
  position: relative; z-index: 1; display: flex; align-items: flex-start;
  gap: 34px; padding: 88px 40px 40px; flex-wrap: wrap; row-gap: 84px;
}

/* ── THE NODE — shipped 137-B ────────────────────────────────────────────── */
.nodebox {
  position: relative; width: 260px; min-height: 104px; flex-shrink: 0;
  opacity: 0; transform: translateY(10px) scale(.97);
  transition: opacity .42s var(--ease-out, ease), transform .42s var(--ease-out, ease);
}
.nodebox.in { opacity: 1; transform: none; }
.card {
  position: relative; margin: 0 auto; width: 248px; min-height: 104px;
  border-radius: 22px; padding: 42px 20px 20px; text-align: center;
  background: hsl(220 30% 100% / .045); backdrop-filter: blur(8px);
  border: 1px solid var(--color-border-soft);
  box-shadow: 0 1px 0 hsl(220 30% 100% / .06) inset, 0 18px 36px -22px rgba(0,0,0,.95);
  transition: border-color .3s ease, box-shadow .3s ease;
}
.nodebox.grounded .card { border-color: hsl(220 30% 100% / .34); }
.ttl {
  font-family: var(--font-headline); font-weight: 600; font-size: 14px; line-height: 1.25;
  color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sub { margin-top: 4px; font-size: 11px; line-height: 1.45; color: var(--color-text-muted); }
.badges { margin-top: 8px; display: flex; gap: 6px; justify-content: center; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 999px;
  padding: 2px 9px; font-size: 10.5px; font-weight: 500;
  color: hsl(38 92% 68%); background: hsl(38 92% 60% / .14); border: 1px solid hsl(38 92% 60% / .32);
}
.mark {
  position: absolute; left: 50%; top: -26px; transform: translateX(-50%);
  width: 62px; height: 62px; display: grid; place-items: center; pointer-events: none; z-index: 4;
}
.mark::before {
  content: ''; position: absolute; inset: -3px; border-radius: 50%; z-index: 0;
  background: radial-gradient(circle, var(--t, hsl(220 30% 100% / .18)), transparent 68%);
}
.mark::after {
  content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 36px; height: 8px; border-radius: 50%; background: rgba(0,0,0,.5); filter: blur(5px);
}
.mark svg { position: relative; z-index: 2; filter: drop-shadow(0 9px 13px rgba(0,0,0,.8)); }

.seal {
  position: absolute; top: 11px; right: 17px; width: 20px; height: 20px;
  border-radius: 50%; display: grid; place-items: center; z-index: 6; font-size: 10px;
  color: var(--color-text); background: hsl(220 30% 100% / .1);
  border: 1px solid hsl(220 30% 100% / .34);
}
/* the seal's one moment of attention — it appears because the AI applied it, and
   that is the ONE thing SC#3 needs the user to notice. Fires once, then rests. */
.nodebox.sealpulse .seal { animation: sealin .9s var(--ease-out, ease) 1; }
@keyframes sealin {
  0%   { transform: scale(.4); box-shadow: 0 0 0 0 hsl(220 30% 100% / .5); }
  55%  { transform: scale(1.15); box-shadow: 0 0 0 7px hsl(220 30% 100% / 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 hsl(220 30% 100% / 0); }
}

.conn {
  flex-shrink: 0; width: 34px; height: 104px; display: grid; place-items: center;
  margin: 0 -34px; opacity: 0; transition: opacity .4s ease;
}
.conn.in { opacity: 1; }

/* ── C · the "AI-drafted until you touch it" treatment ───────────────────── */
.nodebox.draft .card {
  border-style: dashed; border-color: hsl(239 100% 82% / .45);
  background: hsl(239 84% 67% / .05);
}
.draftmark {
  position: absolute; left: -8px; top: 6px; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; z-index: 8; font-size: 10px; font-weight: 700;
  background: hsl(239 84% 67% / .22); color: hsl(239 100% 86%);
  border: 1px solid hsl(239 100% 82% / .5);
}
.nodebox:not(.draft) .draftmark { display: none; }
.reviewed {
  position: absolute; left: -8px; top: 6px; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; z-index: 8; font-size: 11px;
  background: hsl(142 71% 45% / .2); color: hsl(142 71% 68%);
  border: 1px solid hsl(142 71% 45% / .45);
}
.nodebox.draft .reviewed { display: none; }
.nodebox.pristine .reviewed { display: none; }

/* ── B · the seed receipt ────────────────────────────────────────────────── */
.receipt {
  position: relative; z-index: 3; margin: 0 40px 30px; max-width: 720px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); padding: 16px 18px;
  box-shadow: 0 18px 40px -24px rgba(0,0,0,.95);
  opacity: 0; transform: translateY(-8px); transition: all .45s ease;
}
.receipt.in { opacity: 1; transform: none; }
.receipt h4 {
  margin: 0 0 4px; font-size: 13.5px; font-weight: 600; color: var(--color-text);
  display: flex; align-items: center; gap: 8px;
}
.receipt .close {
  margin-left: auto; background: none; border: 0; color: var(--color-text-dim);
  cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px;
}
.receipt .close:hover { color: var(--color-text); }
.receipt p { margin: 0 0 12px; font-size: 12px; color: var(--color-text-muted); line-height: 1.6; }
.receipt ul { margin: 0; padding: 0; list-style: none; }
.receipt li {
  display: flex; gap: 10px; align-items: flex-start; padding: 7px 0;
  border-top: 1px solid var(--color-border-soft); font-size: 12px; line-height: 1.5;
}
.receipt li .g {
  flex-shrink: 0; width: 19px; height: 19px; border-radius: 50%; display: grid;
  place-items: center; font-size: 9.5px; background: hsl(220 30% 100% / .1);
  border: 1px solid hsl(220 30% 100% / .34); color: var(--color-text);
}
.receipt li b { color: var(--color-text); font-weight: 600; }
.receipt li span.why { color: var(--color-text-muted); }
.receipt .foot {
  margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--color-border-soft);
  font-size: 11.5px; color: var(--color-text-dim); line-height: 1.55;
}

/* ── A · the honest pacing note ──────────────────────────────────────────── */
.pacing {
  position: relative; z-index: 3; margin: 0 40px 22px; max-width: 720px;
  padding: 11px 14px; border-radius: 10px; font-size: 12px; line-height: 1.6;
  background: hsl(38 92% 60% / .08); border: 1px solid hsl(38 92% 60% / .3);
  color: var(--color-text-muted);
}
.pacing b { color: hsl(38 92% 72%); }
.pacing code { font-family: var(--font-mono); font-size: 11px; color: var(--color-primary); }

/* composing state */
.composing {
  position: relative; z-index: 1; padding: 100px 40px; text-align: center;
  font-size: 13px; color: var(--color-text-muted);
}
.composing .dots { display: inline-flex; gap: 5px; margin-left: 8px; }
.composing .dots i {
  width: 5px; height: 5px; border-radius: 50%; background: var(--color-primary);
  animation: bob 1.1s ease-in-out infinite;
}
.composing .dots i:nth-child(2) { animation-delay: .16s }
.composing .dots i:nth-child(3) { animation-delay: .32s }
@keyframes bob { 0%,100% { opacity:.25; transform: translateY(0) } 50% { opacity:1; transform: translateY(-4px) } }

/* ── the comparison rail (the 148 lesson: never make them remember) ──────── */
.rail {
  position: sticky; bottom: 0; z-index: 20; background: var(--color-bg-elev1);
  border-top: 1px solid var(--color-border); padding: 13px 24px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
}
.rail .col { font-size: 11.5px; line-height: 1.55; color: var(--color-text-muted); }
.rail .col h5 {
  margin: 0 0 5px; font-size: 11.5px; font-weight: 600; color: var(--color-text-dim);
  display: flex; align-items: center; gap: 6px;
}
.rail .col.on h5 { color: var(--color-primary); }
.rail .col b { color: var(--color-text); }
.rail .col .ans { color: hsl(142 71% 62%); }
.rail .col .no { color: hsl(0 72% 70%); }

#sketch-tools {
  position: fixed; bottom: 92px; right: 12px; z-index: 9999; font-family: system-ui;
  font-size: 11px; background: rgba(0,0,0,.78); color: #fff; padding: 8px 10px;
  border-radius: 8px; opacity: .35; transition: opacity .2s; display: flex; gap: 8px;
}
#sketch-tools:hover { opacity: 1; }
#sketch-tools select, #sketch-tools button {
  background: #222; color: #fff; border: 1px solid #444; border-radius: 5px;
  font-size: 11px; padding: 3px 7px; cursor: pointer;
}
.variant { display: none; }
.variant.active { display: block; }
</style>
</head>
<body>

<div class="variant-nav">
  <button class="variant-tab active" onclick="showVariant('a', this)">A: Staged placement</button>
  <button class="variant-tab" onclick="showVariant('b', this)">B: All at once + seed receipt</button>
  <button class="variant-tab" onclick="showVariant('c', this)">C: AI-drafted until touched</button>
</div>

<div class="lead" id="lead"></div>

<div class="bar">
  <button class="btn go" onclick="play()">▶ Describe &amp; draft</button>
  <button class="btn" onclick="reset()">↶ Back to the describe screen</button>
  <span class="spacer"></span>
  <span class="lbl" style="text-transform:none;letter-spacing:0">
    Titles from 148-C · seal shows where <code>available_tools ∩ KB_TOOLS</code> is non-empty
  </span>
</div>

<div class="stage" id="stage">
  <div class="amb"></div>
  <div id="variant-a" class="variant active"><div id="body-a"></div></div>
  <div id="variant-b" class="variant"><div id="body-b"></div></div>
  <div id="variant-c" class="variant"><div id="body-c"></div></div>
</div>

<div class="rail" id="rail"></div>

<div id="sketch-tools">
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">Default</option>
  </select>
  <button onclick="setW(375)">P</button>
  <button onclick="setW(768)">T</button>
  <button onclick="setW(0)">Full</button>
</div>

<script src="../themes/phase-icons-3d.js"></script>
<script>
/* The prompt a procurement lead would actually type. */
const PROMPT = "Every quarter I need to review the supplier contracts coming up for renewal, "
  + "check each one against our pricing policy, get the contract owner to sign off, and produce "
  + "a summary deck for the board.";

/* What the generator returns — ONE response, all five steps at once. */
const SEED = [
  { type:'programmatic',    title:'Prepare the inputs',            sub:'A fixed step the server runs',
    grounded:false, armed:false },
  { type:'llm_agent',       title:'Search Supplier Contracts',     sub:'Reads only the Supplier Contracts folder',
    grounded:true,  armed:false, why:'it reads your documents (search_documents)' },
  { type:'llm_agent',       title:'Run the pricing policy check',  sub:'Applies your saved rules to each contract',
    grounded:true,  armed:false, why:'it reads your documents (search_documents)' },
  { type:'llm_human_input', title:'Wait for your approval',        sub:'Pauses here until you answer',
    grounded:false, armed:true },
  { type:'llm_emit',        title:'Board-ready renewal pack',      sub:'Fills your template and produces the file',
    grounded:false, armed:false },
];

const TINT = {
  llm_agent:'hsl(239 90% 70% / .40)', llm_emit:'hsl(258 90% 70% / .40)',
  programmatic:'hsl(200 85% 62% / .36)', llm_batch_agents:'hsl(170 80% 55% / .34)',
  llm_human_input:'hsl(38 92% 62% / .38)', llm_single:'hsl(220 30% 100% / .22)',
};

const LEADS = {
  a: 'Nodes land <b>one at a time</b> after the response arrives. It reads as consideration and gives the eye somewhere to start. <span class="warn">But the work is already finished when the first node lands</span> — generation is a single provider call (<code>workflow_authoring.py:217</code>), so this is <b>pacing, not progress</b>. The amber note on the canvas is the honesty tax A has to pay; judge whether the feel is worth carrying it.',
  b: 'The whole canvas appears at once — matching what actually happened — and a <b>seed receipt</b> says what was made and, crucially, <b>what was locked and why</b>. This is the surface that makes <span class="good">SC#3 legible</span>: two steps got a citation gate the user never asked for, and the receipt is the only place that ever explains it. Dismissible; the canvas underneath is the real product.',
  c: 'Every seeded node arrives marked <b>AI-drafted</b> (dashed border, ✦) and clears to a <span class="good">✓ reviewed</span> state the moment you touch it. It answers a question the other two do not: <b>which of these have I actually looked at?</b> Click any node to review it. The cost: it spends the card’s left mark — the corner <a style="color:inherit">verdict</a> slot — and adds a state to every node that must eventually resolve.',
};

let current = 'a';
let receiptOpen = true;

function nodeHTML(s, i, variant) {
  const draft = variant === 'c';
  return '<div class="nodebox'+(s.grounded?' grounded':'')+(draft?' draft pristine':'')
    +'" data-i="'+i+'"'+(draft?' onclick="review('+i+')"':'')+' style="cursor:'+(draft?'pointer':'default')+'">'
    + '<div class="card">'
    +   '<div class="ttl">'+s.title+'</div><div class="sub">'+s.sub+'</div>'
    +   (s.armed?'<div class="badges"><span class="badge">✋ Waits for you</span></div>':'')
    + '</div>'
    + '<div class="mark" style="--t:'+TINT[s.type]+'">'+icon3d(s.type,34)+'</div>'
    + (s.grounded?'<div class="seal" title="Must prove it — '+s.why+'">◈</div>':'')
    + (draft?'<div class="draftmark" title="AI-drafted — not reviewed yet">✦</div>'
            +'<div class="reviewed" title="You reviewed this">✓</div>':'')
    + '</div>';
}
const CONN = '<div class="conn"><svg width="34" height="12">'
  + '<line x1="0" y1="6" x2="26" y2="6" stroke="hsl(220 20% 40%)" stroke-width="1.5"/>'
  + '<path d="M26 2 L32 6 L26 10 Z" fill="hsl(220 20% 40%)"/></svg></div>';

function describeHTML() {
  return '<div class="describe"><h2>What do you need done?</h2>'
    + '<p class="hint">Describe it the way you would to a colleague. You can change everything afterwards.</p>'
    + '<textarea readonly>'+PROMPT+'</textarea></div>';
}

function receiptHTML() {
  const locked = SEED.filter(s => s.grounded);
  return '<div class="receipt'+(receiptOpen?'':' hidden')+'" id="receipt">'
    + '<h4>Here’s what I built — 5 steps'
    +   '<button class="close" onclick="closeReceipt()" title="Dismiss">✕</button></h4>'
    + '<p>Two of them read your documents, so I set them to <b>must prove it</b>. '
    +   'You can’t turn that off — but you can see exactly where it applies.</p>'
    + '<ul>' + locked.map(s =>
        '<li><span class="g">◈</span><div><b>'+s.title+'</b> — <span class="why">'+s.why+'</span></div></li>'
      ).join('') + '</ul>'
    + '<div class="foot">Everything else is yours to change. Nothing is saved or published yet.</div>'
    + '</div>';
}

function flowHTML(variant) {
  return '<div class="flow">' + SEED.map((s,i)=>nodeHTML(s,i,variant)).join(CONN) + '</div>';
}

function bodyFor(variant, state) {
  if (state === 'empty')     return describeHTML();
  if (state === 'composing') return '<div class="composing">Reading your description and drafting the steps'
                                  + '<span class="dots"><i></i><i></i><i></i></span></div>';
  if (variant === 'a') return '<div class="pacing"><b>Honesty note (part of the sketch, not the product):</b> '
      + 'the definition arrived in <code>ONE</code> response — <code>generate_workflow_definition</code> makes a single '
      + 'provider call and returns the whole draft. These nodes are being <b>paced</b>, not streamed. Nothing is still '
      + 'being decided while you watch.</div>' + flowHTML('a');
  if (variant === 'b') return receiptHTML() + flowHTML('b');
  return flowHTML('c');
}

function render(state) {
  ['a','b','c'].forEach(v => document.getElementById('body-'+v).innerHTML = bodyFor(v, state));
  document.getElementById('lead').innerHTML = LEADS[current];
  renderRail();
}

function renderRail() {
  const cols = [
    { k:'a', h:'A · Staged placement', rows:[
      ['Where do I start reading?', 'ans', 'yes — the eye follows the sequence'],
      ['Why is that step locked?',  'no',  'never explained'],
      ['What have I reviewed?',     'no',  'no record'] ] },
    { k:'b', h:'B · All at once + receipt', rows:[
      ['Where do I start reading?', 'ans', 'the receipt orients you'],
      ['Why is that step locked?',  'ans', 'named, with the reason'],
      ['What have I reviewed?',     'no',  'no record'] ] },
    { k:'c', h:'C · Drafted until touched', rows:[
      ['Where do I start reading?', 'ans', 'anything still ✦ unreviewed'],
      ['Why is that step locked?',  'no',  'the seal is still unexplained'],
      ['What have I reviewed?',     'ans', 'the whole point'] ] },
  ];
  document.getElementById('rail').innerHTML = cols.map(c =>
      '<div class="col'+(c.k===current?' on':'')+'"><h5>'+c.h+'</h5>'
    + c.rows.map(r => '<div><b>'+r[0]+'</b> <span class="'+r[1]+'">'+r[2]+'</span></div>').join('')
    + '</div>').join('');
}

function play() {
  render('composing');
  setTimeout(() => {
    render('drafted');
    const boxes = document.querySelectorAll('#variant-'+current+' .nodebox');
    const conns = document.querySelectorAll('#variant-'+current+' .conn');
    const rcpt  = document.getElementById('receipt');
    if (current === 'a') {
      /* paced — deliberately visible as pacing */
      boxes.forEach((b,i) => setTimeout(() => {
        b.classList.add('in');
        if (SEED[i].grounded) setTimeout(()=>b.classList.add('sealpulse'), 260);
        if (conns[i]) conns[i].classList.add('in');
      }, i * 340));
    } else {
      boxes.forEach((b,i) => { b.classList.add('in'); if (SEED[i].grounded) setTimeout(()=>b.classList.add('sealpulse'), 320); });
      conns.forEach(c => c.classList.add('in'));
      if (rcpt) setTimeout(()=>rcpt.classList.add('in'), 120);
    }
  }, 1150);
}

function reset() { receiptOpen = true; render('empty'); }
function closeReceipt() {
  receiptOpen = false;
  const r = document.getElementById('receipt');
  if (r) { r.style.opacity='0'; r.style.transform='translateY(-8px)'; setTimeout(()=>r.remove(), 300); }
}
function review(i) {
  const n = document.querySelector('#variant-c .nodebox[data-i="'+i+'"]');
  if (!n) return;
  n.classList.remove('draft','pristine');
}
function showVariant(id, btn) {
  current = id;
  document.querySelectorAll('.variant').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.variant-nav .variant-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('variant-'+id).classList.add('active');
  btn.classList.add('active');
  document.getElementById('lead').innerHTML = LEADS[id];
  renderRail();
}
function setW(w) {
  document.querySelectorAll('.flow').forEach(f => f.style.maxWidth = w ? w+'px' : '');
}

render('empty');
</script>
</body>
</html>
