<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sketch 028 — Confidence + Inline Edit</title>
<link rel="stylesheet" href="../themes/default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { padding-top: 52px; }
  :root { --conf-low-text: hsl(0 80% 80%); }

  /* ── App chrome ── */
  .app { display: flex; height: calc(100vh - 52px); }
  .nav-rail { width: 52px; background: var(--color-bg-elev1); border-right: 1px solid var(--color-border);
    display: flex; flex-direction: column; align-items: center; gap: var(--space-3); padding-top: var(--space-4); flex-shrink: 0; }
  .nav-rail .ni { width: 36px; height: 36px; border-radius: var(--radius-md); display: grid; place-items: center;
    color: var(--color-text-dim); font-size: 17px; cursor: pointer; }
  .nav-rail .ni.active { background: var(--color-primary-dim); color: var(--color-primary); }
  .main { display: grid; grid-template-columns: minmax(0,1fr) 460px; flex: 1; min-width: 0; }
  .list-col { min-width: 0; overflow: auto; padding: var(--space-3) var(--space-3) var(--space-8); }
  .page-head { display: flex; align-items: baseline; gap: var(--space-3); padding: var(--space-3) var(--space-3) var(--space-4); }
  .page-head h1 { font-family: var(--font-headline); font-size: var(--text-lg); margin: 0; font-weight: 700; }
  .page-head .crumb { color: var(--color-text-dim); font-size: var(--text-xs); }

  .doc-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .doc-table thead th { text-align: left; font-weight: 500; color: var(--color-text-dim); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.06em; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); }
  .doc-row td { padding: var(--space-3); border-bottom: 1px solid var(--color-border-soft); }
  .doc-row { cursor: pointer; }
  .doc-row:hover { background: var(--color-muted); }
  .doc-row.selected { background: var(--color-primary-dim); }
  .doc-row.selected td:first-child { box-shadow: inset 2px 0 0 var(--color-primary); }
  .doc-name { font-weight: 500; display: flex; align-items: center; gap: var(--space-2); }
  .needs-badge { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--color-warning);
    background: var(--color-warning-dim); padding: 1px 6px; border-radius: var(--radius-full); }

  /* ── Detail panel (027-A shell) ── */
  .detail-col { border-left: 1px solid var(--color-border); background: var(--color-surface); overflow: hidden auto; }
  .detail-inner { padding: var(--space-4) var(--space-5) var(--space-12); }
  .detail-head { display: flex; align-items: flex-start; gap: var(--space-3); padding-bottom: var(--space-3);
    border-bottom: 1px solid var(--color-border); }
  .detail-head .fico { font-size: 22px; }
  .detail-head .ttl { font-family: var(--font-headline); font-size: var(--text-md); font-weight: 700; line-height: 1.3; }
  .detail-head .sub { font-size: var(--text-xs); color: var(--color-text-dim); font-family: var(--font-mono); margin-top: 2px; }
  .detail-head .tools { margin-left: auto; display: flex; gap: 4px; }
  .detail-head .ib { background: none; border: none; color: var(--color-text-dim); cursor: pointer; font-size: 13px;
    padding: 3px 7px; border-radius: var(--radius-sm); }
  .detail-head .ib:hover { background: var(--color-accent); color: var(--color-text); }

  /* ── Honesty banner ── */
  .honesty-banner { display: flex; align-items: center; gap: var(--space-2); margin: var(--space-3) 0;
    padding: var(--space-2) var(--space-3); background: hsl(220 30% 9%); border-radius: var(--radius-md);
    font-size: var(--text-xs); color: var(--color-text-muted); }
  .honesty-banner .spark { color: var(--color-accent-violet); }
  .honesty-banner b { color: var(--color-warning); font-weight: 600; }

  /* ── Section head ── */
  .sec-head { display: flex; align-items: center; gap: var(--space-2); width: 100%; padding: var(--space-3) 0;
    background: none; border: none; cursor: pointer; color: var(--color-text); font-size: var(--text-xs);
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; }
  .sec-head .chev { color: var(--color-text-dim); font-size: 10px; transition: transform var(--dur-fast); }
  .sec.collapsed .chev { transform: rotate(-90deg); }
  .sec.collapsed .sec-body { display: none; }
  .sec-head .warn-count { font-family: var(--font-mono); font-size: 10px; color: var(--color-warning);
    background: var(--color-warning-dim); padding: 1px 7px; border-radius: var(--radius-full); }
  .sec-head .ok-count { font-family: var(--font-mono); font-size: 11px; color: var(--color-success); }
  .sec-head .soon { font-size: 10px; color: var(--color-accent-violet); background: hsl(258 90% 66% / 0.12);
    padding: 2px 7px; border-radius: var(--radius-full); font-family: var(--font-mono); }
  .sec { border-bottom: 1px solid var(--color-border); }
  .placeholder { color: var(--color-text-dim); font-size: var(--text-sm); padding: var(--space-3);
    background: var(--color-bg); border: 1px dashed var(--color-border); border-radius: var(--radius-md); }

  /* ── Triage toolbar ── */
  .triage { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2); }
  .tbtn { font-size: 11px; padding: 3px 9px; border-radius: var(--radius-full); border: 1px solid var(--color-border);
    background: transparent; color: var(--color-text-muted); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .tbtn:hover { border-color: var(--color-primary); color: var(--color-text); }
  .tbtn.on { background: var(--color-primary-dim); color: var(--color-primary); border-color: var(--color-primary-glow); }
  .group-sub { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-dim);
    margin: var(--space-2) 0 2px; }

  /* ── Field rows ── */
  .meta-grid { display: flex; flex-direction: column; }
  .field-row { display: grid; grid-template-columns: 2px 1fr; gap: var(--space-3); padding: var(--space-2) 0 var(--space-2);
    border-bottom: 1px solid var(--color-border-soft); }
  .field-row:last-child { border-bottom: none; }
  .spine { width: 2px; border-radius: 2px; background: transparent; }
  .nospine .spine { display: none; }
  .nospine .field-row { grid-template-columns: 1fr; }
  .spine.high { background: hsl(142 71% 45% / 0.6); }
  .spine.med  { background: hsl(38 92% 60% / 0.6); }
  .spine.low  { background: hsl(0 80% 80% / 0.6); }
  .spine.manual { background: var(--color-primary); }
  .spine.empty, .spine.noscore { background: hsl(220 20% 16% / 0.6); }
  .field-body { min-width: 0; }
  .field-key { font-size: 10px; color: var(--color-text-dim); text-transform: uppercase; letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
  .field-key .custom { color: var(--color-accent-violet); font-size: 10px; }
  .field-line { display: flex; align-items: center; gap: var(--space-2); justify-content: space-between; min-width: 0; }
  .val-btn { background: none; border: none; padding: 2px 2px; margin: -2px -2px; text-align: left; cursor: text;
    color: var(--color-text); font-family: var(--font-sans); font-size: var(--text-sm); border-radius: var(--radius-sm);
    min-width: 0; flex: 1; display: inline-flex; align-items: center; gap: 6px; }
  .val-btn:hover { background: var(--color-muted); }
  .val-btn .pencil { opacity: 0; color: var(--color-text-dim); font-size: 11px; }
  .field-row:hover .val-btn .pencil { opacity: 0.6; }
  .val-tentative { font-style: italic; color: var(--color-text-muted); }
  .val-tentative .tri { color: var(--conf-low-text); font-size: 11px; }
  .topics { display: flex; flex-wrap: wrap; gap: 4px; }
  .topic { background: var(--color-accent); color: var(--color-text-muted); padding: 1px 7px; border-radius: var(--radius-full); font-size: 11px; }
  .add-btn { width: 100%; text-align: left; padding: 5px 9px; border: 1px dashed var(--color-border); background: transparent;
    color: var(--color-text-dim); font-style: italic; font-size: var(--text-sm); border-radius: var(--radius-md); cursor: text;
    display: flex; align-items: center; gap: 6px; }
  .add-btn:hover { border-color: var(--color-primary); color: var(--color-text-muted); }
  .prov-sub { font-size: 10px; font-style: italic; color: var(--color-text-dim); margin-top: 3px; }

  /* ── Confidence chip ── */
  .chip { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; font-family: var(--font-mono);
    font-size: 10px; font-weight: 500; letter-spacing: 0.04em; padding: 2px 8px; border-radius: var(--radius-full);
    border: 1px solid transparent; white-space: nowrap; }
  .chip.high { background: var(--color-success-dim); color: var(--color-success); border-color: hsl(142 71% 45% / 0.3); }
  .chip.med  { background: var(--color-warning-dim); color: var(--color-warning); border-color: hsl(38 92% 60% / 0.3); }
  .chip.low  { background: var(--color-danger-dim); color: var(--conf-low-text); border-color: hsl(0 72% 51% / 0.4); }
  .chip.manual { background: transparent; color: var(--color-text-muted); border-color: var(--color-border); }
  .chip.noscore { background: transparent; color: var(--color-text-dim); border-color: var(--color-border); border-style: dashed; }
  .chip.hint { background: var(--color-primary-dim); color: var(--color-primary); border-color: var(--color-primary-glow); }
  .chip .num { font-variant-numeric: tabular-nums; opacity: 0.85; }
  .chip-pop { animation: checkPop 0.35s var(--ease-bounce); }
  /* decrescendo high = hairline check only */
  .chip.deco-high { background: transparent; border: none; color: var(--color-text-dim); padding: 2px 2px; gap: 3px; }

  /* ── Inline editor ── */
  .edit-wrap { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .edit-input { width: 100%; background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-primary);
    border-radius: var(--radius-sm); padding: 5px 8px; font-family: var(--font-sans); font-size: var(--text-sm);
    box-shadow: var(--shadow-glow-primary); outline: none; }
  textarea.edit-input { min-height: 64px; resize: vertical; }
  .edit-actions { display: flex; align-items: center; gap: 6px; }
  .btn-mini { font-size: 11px; padding: 3px 11px; border-radius: var(--radius-sm); border: 1px solid var(--color-border);
    background: var(--color-surface); color: var(--color-text-muted); cursor: pointer; }
  .btn-mini.primary { background: var(--color-primary); color: hsl(216 45% 6%); border-color: var(--color-primary); font-weight: 600; }
  .btn-mini:disabled { opacity: 0.4; cursor: not-allowed; }
  .edit-audit-note { font-size: 10px; color: var(--color-text-dim); font-family: var(--font-mono); margin-left: auto; }

  .receipt { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--color-success);
    margin-top: 4px; animation: fadeSlideUp var(--dur-slow) var(--ease-out); }
  .receipt .sh { font-size: 12px; }
  .err-alert { font-size: 11px; color: var(--conf-low-text); background: var(--color-danger-dim);
    border: 1px solid hsl(0 72% 51% / 0.3); border-radius: var(--radius-sm); padding: 4px 8px; margin-top: 4px; }

  .row-pulse { animation: pulseGlow 1.2s var(--ease-out) 2; border-radius: var(--radius-sm); }

  /* ── Build notes drawer ── */
  .notes { margin-top: var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md);
    background: var(--color-bg); padding: var(--space-3) var(--space-4); }
  .notes h4 { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-text-dim); margin: 0 0 var(--space-2); }
  .notes ul { margin: 0; padding-left: 18px; font-size: var(--text-xs); color: var(--color-text-muted); line-height: 1.7; }
  .notes .net { color: var(--color-accent-violet); font-weight: 600; }
  .notes .ok { color: var(--color-success); font-weight: 600; }
  .notes.collapsed .notes-body { display: none; }
  .notes-toggle { cursor: pointer; }
</style>
</head>
<body>

<div class="variant-nav">
  <span class="label">028 · Confidence + Edit</span>
  <button class="variant-tab active" onclick="show('a',event)">A · Trust-gutter + scored chips ★ Selected</button>
  <button class="variant-tab" onclick="show('b',event)">B · Decrescendo (quiet at High)</button>
  <button class="variant-tab" onclick="show('c',event)">C · Dense triage (needs-review first)</button>
</div>

<div id="variant-a" class="variant"></div>
<div id="variant-b" class="variant" style="display:none"></div>
<div id="variant-c" class="variant" style="display:none"></div>

<div class="sketch-toolbar">
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">Deep Midnight</option>
  </select>
  <button onclick="setVp(440)">📱</button>
  <button onclick="setVp(0)">🖥</button>
</div>

<script>
// ───────────────────────── data ─────────────────────────
// metadata + the per-field `_confidence` map (Phase 111). conf=null => no score
// stored for that field; val=null => field genuinely absent (exclude_none).
const DOCS = {
  charter: { icon:'📕', name:'Project Charter.pdf', type:'PDF', chunks:14, fields:[
    { key:'Title',         val:'Project Meridian Charter', conf:0.96 },
    { key:'Author',        val:null,                       conf:0.0 },
    { key:'Date',          val:'2026-01-14',               conf:0.63 },
    { key:'Document type', val:'charter',                  conf:0.92 },
    { key:'Language',      val:'English',                  conf:0.99 },
    { key:'Topics',        val:['governance','scope','stakeholders'], conf:0.58, arr:true },
    { key:'Project phase', val:'Initiation', conf:0.41, custom:true },
    { key:'Owner',         val:'PMO',        conf:0.34, custom:true },
    { key:'Region',        val:'EMEA',       conf:null, custom:true },   // extracted, no score
    { key:'Summary',       val:'Defines scope, objectives, and governance for the Meridian rollout across the EMEA region.', conf:0.81, long:true },
  ]},
  risk: { icon:'📊', name:'Risk Register.xlsx', type:'XLSX', chunks:9, fields:[
    { key:'Title',         val:'Meridian Risk Register', conf:0.88 },
    { key:'Author',        val:'A. Okafor',              conf:0.52 },
    { key:'Date',          val:'2026-03-02',             conf:0.67 },
    { key:'Document type', val:'register',               conf:0.90 },
    { key:'Risk level',    val:'High',  conf:0.29, custom:true },
    { key:'Department',    val:null,    conf:0.0,  custom:true },
  ]},
};
const ORDER = ['charter','risk'];
let sel = 'charter';

// per-variant config
const VARS = {
  a: { spine:true,  chipMode:'full', sort:'schema',     filter:false, label:'a' },
  b: { spine:false, chipMode:'deco', sort:'schema',     filter:false, label:'b' },
  c: { spine:false, chipMode:'full', sort:'needsfirst', filter:false, label:'c' },
};
// editable triage state per variant
const STATE = { a:{sort:'schema',filter:false}, b:{sort:'schema',filter:false}, c:{sort:'needsfirst',filter:false} };
let edit = null; // {v, fi}

// thresholds — settings-driven in the real app (a 112 decision; the 0.54/0.38 in
// the codebase are RETRIEVAL buckets, a different system). Sketch uses legible cuts.
const T_HIGH = 0.75, T_MED = 0.5;
function tierOf(f){
  if (f.manual) return 'manual';
  if (f.val == null || (f.arr && f.val.length===0)) return 'empty';
  if (f.conf == null) return 'noscore';
  if (f.conf >= T_HIGH) return 'high';
  if (f.conf >= T_MED)  return 'med';
  return 'low';
}
const needsReview = t => t === 'low' || t === 'empty';
function reviewCount(doc){ return doc.fields.filter(f => needsReview(tierOf(f))).length; }

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ───────────────────────── chip ─────────────────────────
const GLYPH = { high:'✓', med:'●', low:'⚠', manual:'✎', noscore:'✦' };
const WORD  = { high:'High', med:'Med', low:'Low' };
function chip(f, mode, popped){
  const t = tierOf(f);
  const pop = popped ? ' chip-pop' : '';
  if (t === 'manual')  return `<span class="chip manual${pop}" title="Edited by you · just now · written to metadata (audit logged)">${GLYPH.manual} Edited</span>`;
  if (t === 'noscore') return `<span class="chip noscore" title="Extracted, but no confidence score was stored for this field">${GLYPH.noscore} Extracted</span>`;
  if (t === 'empty')   return ``; // no chip — absence has no confidence
  // scored tiers
  const score = `<span class="num">${f.conf.toFixed(2)}</span>`;
  if (mode === 'deco' && t === 'high')
    return `<span class="chip deco-high" title="High · ${f.conf.toFixed(2)}">${GLYPH.high}<span class="sr">High</span></span>`;
  return `<span class="chip ${t}">${GLYPH[t]} ${WORD[t]} · ${score}</span>`;
}

// ───────────────────────── value ─────────────────────────
function valHtml(f){
  const t = tierOf(f);
  if (t === 'empty')
    return `<button class="add-btn" data-add>＋ Not extracted — add ${esc(f.key.toLowerCase())}</button>`;
  if (f.arr){
    const pills = f.val.map(x=>`<span class="topic">${esc(x)}</span>`).join('');
    return `<button class="val-btn"><span class="topics">${pills}</span><span class="pencil">✎</span></button>`;
  }
  if (t === 'low')
    return `<button class="val-btn"><span class="val-tentative"><span class="tri">⚠</span> ${esc(f.val)}</span><span class="pencil">✎</span></button>`;
  return `<button class="val-btn"><span>${esc(f.val)}</span><span class="pencil">✎</span></button>`;
}

// ───────────────────────── rows ─────────────────────────
function fieldRow(v, fi, f){
  const cfg = VARS[v]; const st = STATE[v];
  const t = tierOf(f);
  const custom = f.custom ? `<span class="custom" title="Custom field">◆</span>` : '';
  const isEditing = edit && edit.v===v && edit.fi===fi;
  const popped = f._justSaved;
  let mid;
  if (isEditing){
    const tag = f.long ? 'textarea' : 'input';
    const cur = f.val && !f.arr ? esc(f.val) : (f.arr ? esc(f.val.join(', ')) : '');
    mid = `<div class="edit-wrap">
      <${tag} class="edit-input" id="ei-${v}" ${f.long?'':'value="'+cur+'"'}>${f.long?cur:''}</${tag}>
      <div class="edit-actions">
        <span class="chip hint">✎ will become · Edited</span>
        <button class="btn-mini primary" onclick="saveEdit()">Save</button>
        <button class="btn-mini" onclick="cancelEdit()">Cancel</button>
        <span class="edit-audit-note">↪ writes metadata.update audit row</span>
      </div></div>`;
  } else {
    mid = `<div class="field-line">${valHtml(f)}${chip(f, cfg.chipMode, popped)}</div>`;
    if (t === 'manual') mid += `<div class="prov-sub">Edited by you · just now</div>`;
    if (f._receipt) mid += `<div class="receipt"><span class="sh">🛡</span> Saved · audit logged</div>`;
    if (f._err) mid += `<div class="err-alert">⚠ Couldn't save — your change wasn't recorded. Try again.</div>`;
  }
  return `<div class="field-row${popped?' row-pulse':''}" data-fi="${fi}" data-tier="${t}">
    <div class="spine ${t}"></div>
    <div class="field-body">
      <div class="field-key">${esc(f.key)}${custom}</div>
      ${mid}
    </div>
  </div>`;
}

function metaBody(v){
  const doc = DOCS[sel]; const st = STATE[v];
  let idx = doc.fields.map((f,i)=>i);
  if (st.filter) idx = idx.filter(i => needsReview(tierOf(doc.fields[i])));
  // sort
  const rank = f => { const t=tierOf(f); return ({low:0,empty:1,med:2,noscore:3,high:4,manual:5})[t]; };
  let html = '';
  if (st.sort === 'needsfirst'){
    const needs = idx.filter(i=>needsReview(tierOf(doc.fields[i])));
    const rest  = idx.filter(i=>!needsReview(tierOf(doc.fields[i])));
    if (needs.length) html += `<div class="group-sub" style="color:var(--color-warning)">⚠ Needs review (${needs.length})</div>`
      + needs.map(i=>fieldRow(v,i,doc.fields[i])).join('');
    if (rest.length && !st.filter) html += `<div class="group-sub">Extracted</div>`
      + rest.map(i=>fieldRow(v,i,doc.fields[i])).join('');
  } else {
    html = idx.map(i=>fieldRow(v,i,doc.fields[i])).join('');
  }
  return `<div class="meta-grid">${html||'<div class="placeholder">All fields reviewed ✓</div>'}</div>`;
}

// ───────────────────────── panel ─────────────────────────
function panel(v){
  const doc = DOCS[sel]; const st = STATE[v]; const n = reviewCount(doc);
  const edited = doc.fields.some(f=>f.manual);
  return `
  <div class="detail-inner ${VARS[v].spine?'':'nospine'}">
    <div class="detail-head">
      <span class="fico">${doc.icon}</span>
      <div><div class="ttl">${doc.name}</div><div class="sub">${doc.type} · ${doc.chunks} chunks · v1</div></div>
      <div class="tools"><button class="ib" title="Build notes" onclick="toggleNotes('${v}')">ⓘ</button><button class="ib" title="Close">✕</button></div>
    </div>

    <div class="honesty-banner">
      <span class="spark">✦</span>
      <span>AI-extracted metadata · ${n>0?`<b>${n} need review</b>`:'all reviewed'}${edited?' · last verified by you · just now':''}</span>
    </div>

    <div class="sec" id="sec-meta-${v}">
      <button class="sec-head" onclick="toggleSec('sec-meta-${v}')">
        <span class="chev">▾</span> Metadata
        ${n>0?`<span class="warn-count">${n}</span>`:`<span class="ok-count">✓</span>`}
      </button>
      <div class="sec-body">
        <div class="triage">
          <button class="tbtn ${st.sort==='needsfirst'?'on':''}" onclick="toggleSort('${v}')">↑ Review low first</button>
          <button class="tbtn ${st.filter?'on':''}" onclick="toggleFilter('${v}')">⧩ Only needs-review</button>
          ${n>0?`<button class="tbtn" onclick="jumpNext('${v}')">Jump to next ↓</button>`:''}
        </div>
        ${metaBody(v)}
      </div>
    </div>

    <div class="sec collapsed" id="sec-rel-${v}">
      <button class="sec-head" onclick="toggleSec('sec-rel-${v}')"><span class="chev">▾</span> Relationships <span class="soon">Phase 117</span></button>
      <div class="sec-body"><div class="placeholder">Typed links — same shell, Phase 117.</div></div>
    </div>
    <div class="sec collapsed" id="sec-class-${v}">
      <button class="sec-head" onclick="toggleSec('sec-class-${v}')"><span class="chev">▾</span> Classification <span class="soon">Phase 118</span></button>
      <div class="sec-body"><div class="placeholder">Auto-classification suggestions — Phase 118.</div></div>
    </div>

    <div class="notes collapsed" id="notes-${v}">
      <h4 class="notes-toggle" onclick="this.parentElement.classList.toggle('collapsed')">ⓘ Build notes — what's real vs net-new ▾</h4>
      <div class="notes-body"><ul>
        <li><span class="ok">REAL today:</span> per-field confidence is stored in <code>documents.metadata._confidence</code> (Phase 111) — the chips render on real data.</li>
        <li><span class="ok">REAL today:</span> empty fields are genuinely absent (<code>exclude_none</code>) → shown as "Not extracted", never a fake blank.</li>
        <li><span class="ok">REAL today:</span> the <code>metadata.update</code> audit action is already allow-listed.</li>
        <li><span class="net">NET-NEW (112):</span> the "save edited field" endpoint — there is NO metadata-PATCH route today (metadata is written only at upload). The receipt must not claim "audit logged" until this is wired.</li>
        <li><span class="net">NET-NEW (112):</span> a per-field <code>source: user|extracted</code> marker so re-extraction never silently overwrites your edits.</li>
        <li><span class="net">NET-NEW (112):</span> persistence path for editing custom-field values.</li>
        <li>Chip tier thresholds are settings-driven (a 112 decision). "Edited" stays NEUTRAL (no green, no score) — green would falsely imply model confidence. A value with no score → "Extracted", never a fabricated "High".</li>
      </ul></div>
    </div>
  </div>`;
}

function render(){
  for (const v of ['a','b','c']){
    document.getElementById('variant-'+v).innerHTML = `<div class="app">
      <div class="nav-rail"><div class="ni">💬</div><div class="ni active">📄</div><div class="ni">🔀</div><div class="ni">🧩</div></div>
      <div class="main">
        <div class="list-col">
          <div class="page-head"><h1>Documents</h1><span class="crumb">Project Meridian</span></div>
          <table class="doc-table"><thead><tr><th>Name</th><th>Status</th></tr></thead><tbody>
          ${ORDER.map(k=>{const d=DOCS[k];const n=reviewCount(d);return `<tr class="doc-row ${k===sel?'selected':''}" onclick="pick('${k}')">
            <td><span class="doc-name">${d.icon} ${d.name}</span></td>
            <td>${n>0?`<span class="needs-badge">${n} review</span>`:'<span class="text-dim" style="font-size:11px">✓ clean</span>'}</td></tr>`;}).join('')}
          </tbody></table>
        </div>
        <div class="detail-col">${panel(v)}</div>
      </div></div>`;
  }
  if (edit){ const el=document.getElementById('ei-'+edit.v); if(el){ el.focus(); el.select&&el.select();
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!edit.long){saveEdit();} if(e.key==='Escape'){cancelEdit();} }); } }
}

// ───────────────────────── interactions ─────────────────────────
function pick(k){ sel=k; edit=null; clearTransient(); render(); }
function toggleSec(id){ document.getElementById(id).classList.toggle('collapsed'); }
function toggleNotes(v){ const n=document.getElementById('notes-'+v); n.classList.toggle('collapsed'); n.scrollIntoView({behavior:'smooth',block:'nearest'}); }
function toggleSort(v){ STATE[v].sort = STATE[v].sort==='needsfirst'?'schema':'needsfirst'; render(); }
function toggleFilter(v){ STATE[v].filter = !STATE[v].filter; render(); }
function jumpNext(v){
  const rows=[...document.querySelectorAll('#variant-'+v+' .field-row')];
  const target=rows.find(r=>r.dataset.tier==='low'||r.dataset.tier==='empty');
  if(target){ target.scrollIntoView({behavior:'smooth',block:'center'}); target.classList.add('row-pulse'); setTimeout(()=>target.classList.remove('row-pulse'),2400); }
}

// event delegation for value-button / add-button clicks
document.addEventListener('click', e=>{
  const vb = e.target.closest('.val-btn,.add-btn'); if(!vb) return;
  const variant = e.target.closest('.variant'); if(!variant) return;
  const v = variant.id.split('-')[1];
  const row = e.target.closest('.field-row'); if(!row) return;
  startEdit(v, +row.dataset.fi);
});

function startEdit(v, fi){ clearTransient(); edit={v,fi,long:DOCS[sel].fields[fi].long}; render(); }
function cancelEdit(){ edit=null; render(); }
function saveEdit(){
  if(!edit) return;
  const el=document.getElementById('ei-'+edit.v); const val=el.value.trim();
  const f=DOCS[sel].fields[edit.fi];
  clearTransient();
  if(val===''){ edit=null; render(); return; }
  f.val = val; f.manual = true; f._justSaved = true; f._receipt = true;
  edit=null; render();
  setTimeout(()=>{ f._justSaved=false; f._receipt=false; render(); }, 3000);
}
function clearTransient(){ for(const k of ORDER) DOCS[k].fields.forEach(f=>{f._justSaved=false;f._receipt=false;f._err=false;}); }

function show(id,e){ document.querySelectorAll('.variant').forEach(x=>x.style.display='none');
  document.querySelectorAll('.variant-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('variant-'+id).style.display='block'; e.target.classList.add('active'); }
function setVp(w){ document.querySelectorAll('.variant').forEach(v=>{ v.style.maxWidth=w?w+'px':''; v.style.margin=w?'0 auto':''; }); }

render();
</script>
</body>
</html>
