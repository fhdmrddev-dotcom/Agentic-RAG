<style>
/* ───────────────────────────────────────────────────────────────
   Sketch 023 — App Linkage Map (the whole-app IA reference for 018–022)
   Derived from APP-LINKAGE-MAP.md §1/§2/§5: 16 nodes · 23 redirects + 3 self-loops
   (26 edge entries total) · 11 open decisions. NOTE: the doc §2 carries 24 rows;
   the HTML SPLITS a few compound rows into separate edges (e.g. Publish-success and
   the gauntlet "Tweak" / conversational-tweak each become their own edge), so the
   26 count is an artifact of edge-splitting, NOT a literal 1:1 transcription.

   THE LOAD-BEARING TRUTH (encoded as UI, not invented):
     • There is NO router, NO URL. Every redirect = a useState<ActiveView>
       switch, an intra-page state change, a modal, or create-thread-then-switch.
     • A workflow is a MODE OF A THREAD, never page-resident. Run =
       create thread + set workflow mode + switch to Chat view.
     • NET-NEW surfaces (Workflows view, Builder, draft-CRUD, Launch dialog,
       detail pane) are visually distinct from EXISTING app surfaces.
     • OPEN DECISIONS (OD-1..OD-11) ride the edges as small 'open' markers —
       never silently resolved.
   ─────────────────────────────────────────────────────────────── */

body { padding-top: 52px; }

.stage { max-width: 1180px; margin: 0 auto; padding: var(--space-6) var(--space-8) 96px; }

/* ── shared header / intro ── */
.intro { display:flex; align-items:flex-start; gap:var(--space-4); margin-bottom:var(--space-4); }
.intro h1 { font-family:var(--font-headline); font-size:var(--text-2xl); margin:0 0 4px; }
.intro .sub { color:var(--color-text-dim); font-size:var(--text-sm); line-height:1.5; max-width:760px; }
.intro .sub b { color:var(--color-text-muted); }

/* legend (calm, always-visible non-color-alone key) */
.legend { display:flex; gap:var(--space-3); flex-wrap:wrap; align-items:center; margin:var(--space-3) 0 var(--space-5);
  padding:var(--space-3) var(--space-4); border-radius:var(--radius-md); background:var(--color-bg-elev1);
  border:1px solid var(--color-border); font-size:11.5px; }
.legend .lg { display:inline-flex; align-items:center; gap:6px; color:var(--color-text-muted); }
.legend .swatch { width:14px; height:14px; border-radius:4px; flex-shrink:0; border:1px solid var(--color-border); }
.legend .swatch.existing { background:var(--color-surface); border-style:solid; }
.legend .swatch.netnew { background:hsl(258 90% 66% / .15); border-color:hsl(258 90% 66% / .5); border-style:dashed; }
.legend .swatch.mixed { background:hsl(38 92% 60% / .1); border-color:hsl(38 92% 60% / .4); }
.legend .swatch.dead { background:transparent; border-style:dotted; border-color:var(--color-text-dim); }
.legend .swatch.thread { background:var(--color-warning-dim); border-color:hsl(38 92% 60% / .45); }
.legend .lg .od-dot { display:inline-grid; place-items:center; width:15px; height:15px; border-radius:50%;
  background:var(--color-warning-dim); border:1px solid var(--color-warning); color:var(--color-warning);
  font-family:var(--font-mono); font-size:8px; font-weight:700; }
.legend .sep { width:1px; height:16px; background:var(--color-border); }
.legend .od-chip { font-family:var(--font-mono); font-size:9px; font-weight:600; padding:1px 5px; border-radius:var(--radius-full);
  color:var(--color-warning); background:var(--color-warning-dim); border:1px solid hsl(38 92% 60% / .35); cursor:help; transition:all var(--dur-fast); }
.legend .od-chip:hover { border-color:var(--color-warning); color:var(--color-text); }

/* ── kind glyph chip (used in node bodies + lists; non-color-alone) ── */
.kind { font-family:var(--font-mono); font-size:8px; font-weight:600; letter-spacing:.04em; padding:1px 6px;
  border-radius:var(--radius-full); border:1px solid; text-transform:uppercase; cursor:help; }
.kind.existing { color:var(--color-text-muted); background:var(--color-muted); border-color:var(--color-border); }
.kind.netnew   { color:var(--color-accent-violet); background:hsl(258 90% 66% / .15); border-color:hsl(258 90% 66% / .45); }
.kind.dead     { color:var(--color-text-dim); background:transparent; border-color:var(--color-text-dim); border-style:dotted; }
.kind.thread   { color:var(--color-warning); background:var(--color-warning-dim); border-color:hsl(38 92% 60% / .4); }
.kind.mixed    { color:var(--color-warning); background:hsl(38 92% 60% / .1); border-color:hsl(38 92% 60% / .4); }

/* ════════════════════ VARIANT A — LINKAGE GRAPH ════════════════════ */
.graph-wrap { display:grid; grid-template-columns: 1fr 326px; gap:var(--space-5); }
.graph-stage { position:relative; border:1px solid var(--color-border); border-radius:var(--radius-lg);
  background:var(--color-bg-elev1); overflow:hidden; min-height:660px; }
.graph-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
.graph-svg .edge-line { stroke:var(--color-border); stroke-width:1.6; fill:none; transition:stroke var(--dur-base), stroke-width var(--dur-base), opacity var(--dur-base); }
.graph-svg .edge-line.netnew { stroke:hsl(258 90% 66% / .45); stroke-dasharray:5 4; }
.graph-svg .edge-line.thread { stroke:hsl(38 92% 60% / .5); }
.graph-svg .edge-line.dead { stroke:var(--color-text-dim); stroke-dasharray:2 4; opacity:.4; }
.graph-svg .edge-line.dim { opacity:.12; }
.graph-svg .edge-line.hot { stroke:var(--color-primary); stroke-width:2.4; opacity:1; }
.graph-svg .edge-line.hot.out { stroke:var(--color-primary); }
.graph-svg .edge-line.hot.in  { stroke:var(--color-success); }
.gnode { position:absolute; z-index:2; transform:translate(-50%,-50%); width:148px;
  border-radius:var(--radius-md); background:var(--color-surface); border:1px solid var(--color-border);
  padding:8px 10px; cursor:pointer; transition:all var(--dur-fast) var(--ease-out); box-shadow:var(--shadow-sm); }
.gnode:hover { border-color:var(--color-primary-glow); box-shadow:var(--shadow-md); transform:translate(-50%,-50%) scale(1.03); }
.gnode.netnew { border-style:dashed; border-color:hsl(258 90% 66% / .45); background:hsl(258 90% 66% / .06); }
.gnode.dead { border-style:dotted; opacity:.55; }
.gnode.thread { border-color:hsl(38 92% 60% / .4); background:var(--color-warning-dim); }
.gnode.mixed { border-color:hsl(38 92% 60% / .4); }
.gnode.sel { border-color:var(--color-primary); box-shadow:0 0 0 2px var(--color-primary-glow), var(--shadow-md); transform:translate(-50%,-50%) scale(1.05); }
.gnode.dim { opacity:.32; }
.gnode .gn-top { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.gnode .gn-id { font-family:var(--font-mono); font-size:8.5px; color:var(--color-text-dim); }
.gnode .gn-name { font-size:11.5px; font-weight:600; line-height:1.25; }
.gnode .gn-sub { font-size:9px; color:var(--color-text-dim); margin-top:2px; font-family:var(--font-mono); }
.gnode .gn-od { position:absolute; top:-7px; right:-7px; display:grid; place-items:center; width:16px; height:16px;
  border-radius:50%; background:var(--color-warning-dim); border:1px solid var(--color-warning); color:var(--color-warning);
  font-family:var(--font-mono); font-size:7px; font-weight:700; }

/* edge trigger labels riding the lines */
.edge-label { position:absolute; z-index:3; transform:translate(-50%,-50%); pointer-events:auto;
  font-size:8.5px; font-family:var(--font-mono); color:var(--color-text-dim); background:var(--color-bg);
  padding:1px 5px; border-radius:var(--radius-sm); border:1px solid var(--color-border-soft); white-space:nowrap;
  max-width:128px; overflow:hidden; text-overflow:ellipsis; transition:all var(--dur-base); opacity:.85; cursor:default; }
.edge-label.dim { opacity:.1; }
.edge-label.hot { opacity:1; color:var(--color-primary); border-color:var(--color-primary-glow); background:var(--color-surface-hi); z-index:5; }
.edge-label.od { color:var(--color-warning); border-color:hsl(38 92% 60% / .4); }
.edge-label .od-tag { color:var(--color-warning); font-weight:600; cursor:help; }

/* side inspector */
.inspector { border:1px solid var(--color-border); border-radius:var(--radius-lg); background:var(--color-surface);
  padding:var(--space-4); align-self:start; position:sticky; top:64px; max-height:calc(100vh - 84px); overflow-y:auto; }
.inspector .ins-empty { color:var(--color-text-dim); font-size:12.5px; line-height:1.6; text-align:center; padding:var(--space-8) var(--space-3); }
.inspector .ins-empty .ie-ic { font-size:30px; opacity:.4; margin-bottom:var(--space-3); }
.ins-head { display:flex; align-items:flex-start; gap:var(--space-2); margin-bottom:var(--space-2); }
.ins-head .ins-id { font-family:var(--font-mono); font-size:10px; color:var(--color-text-dim); }
.ins-head .ins-name { font-family:var(--font-headline); font-size:var(--text-md); font-weight:600; line-height:1.25; }
.ins-where { font-size:11px; color:var(--color-text-muted); line-height:1.5; margin:var(--space-2) 0 var(--space-3);
  padding:var(--space-2) var(--space-3); border-radius:var(--radius-sm); background:var(--color-muted); border:1px solid var(--color-border-soft); }
.ins-where .mono { font-family:var(--font-mono); font-size:10px; color:var(--color-accent-violet); }
.ins-sec { font-size:9.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--color-text-dim);
  font-family:var(--font-mono); margin:var(--space-4) 0 var(--space-2); display:flex; align-items:center; gap:6px; }
.ins-sec .cnt { color:var(--color-text-muted); }
.ins-edge { display:flex; align-items:flex-start; gap:8px; padding:7px var(--space-3); border-radius:var(--radius-sm);
  background:var(--color-bg); border:1px solid var(--color-border-soft); margin-bottom:5px; font-size:11.5px; cursor:pointer;
  transition:border-color var(--dur-fast); }
.ins-edge:hover { border-color:var(--color-primary-glow); }
.ins-edge .ie-arrow { color:var(--color-primary); flex-shrink:0; font-family:var(--font-mono); }
.ins-edge.in .ie-arrow { color:var(--color-success); }
.ins-edge .ie-body { flex:1; }
.ins-edge .ie-to { font-weight:600; }
.ins-edge .ie-trig { display:block; color:var(--color-text-dim); font-family:var(--font-mono); font-size:9.5px; margin-top:2px; }
.ins-edge .ie-mech { display:block; color:var(--color-text-muted); font-size:10.5px; margin-top:3px; line-height:1.45; }
.ins-edge .ie-od { display:inline-block; margin-top:4px; font-family:var(--font-mono); font-size:8.5px; font-weight:600;
  color:var(--color-warning); background:var(--color-warning-dim); border:1px solid hsl(38 92% 60% / .4);
  padding:1px 6px; border-radius:var(--radius-full); cursor:help; }
.ins-none { font-size:11px; color:var(--color-text-dim); font-style:italic; padding:2px 0; }

/* ════════════════════ VARIANT B — JOURNEY FLOW ════════════════════ */
.flow-lanes { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(150px,1fr); gap:0; align-items:stretch;
  border:1px solid var(--color-border); border-radius:var(--radius-lg); background:var(--color-bg-elev1); overflow-x:auto; }
.lane { display:flex; flex-direction:column; border-right:1px solid var(--color-border-soft); position:relative; padding:var(--space-3); min-width:150px; }
.lane:last-child { border-right:none; }
.lane .lane-h { font-size:9px; text-transform:uppercase; letter-spacing:.07em; color:var(--color-text-dim);
  font-family:var(--font-mono); text-align:center; margin-bottom:var(--space-3); }
.stage-card { border:1px solid var(--color-border); border-radius:var(--radius-md); background:var(--color-surface);
  padding:var(--space-3); cursor:pointer; transition:all var(--dur-fast) var(--ease-out); position:relative; }
.stage-card:hover { border-color:var(--color-primary-glow); box-shadow:var(--shadow-sm); transform:translateY(-1px); }
.stage-card.netnew { border-style:dashed; border-color:hsl(258 90% 66% / .45); background:hsl(258 90% 66% / .05); }
.stage-card.mixed { border-color:hsl(38 92% 60% / .4); background:hsl(38 92% 60% / .07); }
.stage-card.thread { border-color:hsl(38 92% 60% / .4); background:var(--color-warning-dim); }
.stage-card.sel { border-color:var(--color-primary); box-shadow:0 0 0 2px var(--color-primary-glow); }
.stage-card .sc-glyph { font-size:18px; }
.stage-card .sc-name { font-weight:600; font-size:12px; margin-top:4px; line-height:1.25; }
.stage-card .sc-sketch { font-family:var(--font-mono); font-size:8.5px; color:var(--color-text-dim); margin-top:3px; }
.stage-card .sc-od { position:absolute; top:-7px; right:-7px; display:grid; place-items:center; width:16px; height:16px;
  border-radius:50%; background:var(--color-warning-dim); border:1px solid var(--color-warning); color:var(--color-warning);
  font-family:var(--font-mono); font-size:7px; font-weight:700; }
.lane-arrow { text-align:center; color:var(--color-text-dim); font-size:13px; margin:var(--space-2) 0; }
.branch { margin-top:var(--space-3); padding-top:var(--space-3); border-top:1px dashed var(--color-border-soft); }
.branch-h { font-size:8.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--color-text-dim); font-family:var(--font-mono); margin-bottom:6px; }
.branch-chip { display:block; font-size:10.5px; padding:5px 8px; border-radius:var(--radius-sm); margin-bottom:5px;
  background:var(--color-bg); border:1px solid var(--color-border-soft); color:var(--color-text-muted); line-height:1.4; cursor:pointer; transition:border-color var(--dur-fast); }
.branch-chip:hover { border-color:var(--color-primary-glow); }
.branch-chip .bc-trig { color:var(--color-warning); font-family:var(--font-mono); font-size:9px; }
.branch-chip .bc-od { color:var(--color-warning); font-family:var(--font-mono); font-size:8.5px; font-weight:600; }
.flow-detail { margin-top:var(--space-5); border:1px solid var(--color-border); border-radius:var(--radius-lg);
  background:var(--color-surface); padding:var(--space-4); min-height:88px; }
.flow-detail .fd-empty { color:var(--color-text-dim); font-size:12px; text-align:center; padding:var(--space-3); }
.flow-detail .fd-name { font-family:var(--font-headline); font-weight:600; font-size:var(--text-md); display:flex; align-items:center; gap:8px; }
.flow-detail .fd-where { font-size:11.5px; color:var(--color-text-muted); line-height:1.55; margin-top:var(--space-2); }
.flow-detail .fd-where .mono { font-family:var(--font-mono); font-size:10px; color:var(--color-accent-violet); }

/* ════════════════════ VARIANT C — LAYERED IA ════════════════════ */
.ia-homes { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-4); margin-bottom:var(--space-5); }
.home-col { border:1px solid var(--color-border); border-radius:var(--radius-lg); background:var(--color-bg-elev1); padding:var(--space-3); }
.home-col .hc-h { display:flex; align-items:center; gap:8px; padding:var(--space-2) var(--space-2) var(--space-3); border-bottom:1px solid var(--color-border-soft); margin-bottom:var(--space-3); }
.home-col .hc-glyph { width:28px; height:28px; border-radius:var(--radius-md); display:grid; place-items:center; font-size:14px; flex-shrink:0; }
.home-col.authoring .hc-glyph { background:hsl(258 90% 66% / .15); color:var(--color-accent-violet); }
.home-col.library .hc-glyph { background:var(--color-primary-dim); color:var(--color-primary); }
.home-col.execution .hc-glyph { background:var(--color-warning-dim); color:var(--color-warning); }
.home-col .hc-title { font-family:var(--font-headline); font-weight:600; font-size:12.5px; }
.home-col .hc-sub { font-size:9.5px; color:var(--color-text-dim); font-family:var(--font-mono); margin-top:1px; }
.ia-layer { margin-bottom:var(--space-5); }
.ia-layer-h { font-size:9.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--color-text-dim);
  font-family:var(--font-mono); margin:0 0 var(--space-2); display:flex; align-items:center; gap:8px; }
.ia-layer-h .lh-line { flex:1; height:1px; background:var(--color-border-soft); }
.ia-top-row { display:flex; gap:var(--space-2); flex-wrap:wrap; }
.ia-view { flex:1; min-width:128px; border:1px solid var(--color-border); border-radius:var(--radius-md);
  background:var(--color-surface); padding:var(--space-3); cursor:pointer; transition:all var(--dur-fast); }
.ia-view:hover { border-color:var(--color-primary-glow); }
.ia-view.netnew { border-style:dashed; border-color:hsl(258 90% 66% / .45); background:hsl(258 90% 66% / .05); }
.ia-view.sel { border-color:var(--color-primary); box-shadow:0 0 0 2px var(--color-primary-glow); }
.ia-view .iv-top { display:flex; align-items:center; gap:6px; }
.ia-view .iv-name { font-weight:600; font-size:12px; }
.ia-view .iv-sub { font-size:9.5px; color:var(--color-text-dim); margin-top:3px; }
.ia-nest { margin-top:var(--space-2); margin-left:var(--space-6); padding-left:var(--space-4);
  border-left:2px solid hsl(258 90% 66% / .3); display:flex; flex-direction:column; gap:var(--space-2); }
.ia-sub { border:1px dashed hsl(258 90% 66% / .4); border-radius:var(--radius-md); background:hsl(258 90% 66% / .05);
  padding:var(--space-2) var(--space-3); cursor:pointer; transition:all var(--dur-fast); position:relative; }
.ia-sub:hover { border-color:var(--color-primary-glow); }
.ia-sub.sel { border-style:solid; border-color:var(--color-primary); box-shadow:0 0 0 2px var(--color-primary-glow); }
.ia-sub.thread { border-color:hsl(38 92% 60% / .45); background:var(--color-warning-dim); }
.ia-sub.mixed { border-style:solid; border-color:hsl(38 92% 60% / .4); background:hsl(38 92% 60% / .07); }
.ia-sub .is-top { display:flex; align-items:center; gap:6px; }
.ia-sub .is-name { font-weight:600; font-size:11.5px; }
.ia-sub .is-redir { font-size:10px; color:var(--color-text-muted); margin-top:3px; line-height:1.4; }
.ia-sub .is-redir .mono { font-family:var(--font-mono); font-size:9px; color:var(--color-accent-violet); }
.ia-sub .is-od { position:absolute; top:-7px; right:-7px; display:grid; place-items:center; width:16px; height:16px;
  border-radius:50%; background:var(--color-warning-dim); border:1px solid var(--color-warning); color:var(--color-warning);
  font-family:var(--font-mono); font-size:7px; font-weight:700; }
.ia-sub .is-home { font-family:var(--font-mono); font-size:8px; padding:1px 5px; border-radius:var(--radius-full); margin-left:auto; }
.is-home.authoring { color:var(--color-accent-violet); background:hsl(258 90% 66% / .12); border:1px solid hsl(258 90% 66% / .35); }
.is-home.library { color:var(--color-primary); background:var(--color-primary-dim); border:1px solid var(--color-primary-glow); }
.is-home.execution { color:var(--color-warning); background:var(--color-warning-dim); border:1px solid hsl(38 92% 60% / .35); }
.ia-deadnote { font-size:10.5px; color:var(--color-text-dim); margin-top:var(--space-4); padding:var(--space-3);
  border-radius:var(--radius-md); border:1px dotted var(--color-text-dim); background:transparent; line-height:1.5; }
.ia-deadnote b { color:var(--color-text-muted); }

/* ── shared OD popover + ⓘ tiered guidance ── */
.info-dot { display:inline-grid; place-items:center; width:14px; height:14px; border-radius:50%; border:1px solid var(--color-border);
  color:var(--color-text-dim); font-size:9px; font-family:var(--font-mono); cursor:help; vertical-align:middle; transition:all var(--dur-fast); }
.info-dot:hover { border-color:var(--color-primary); color:var(--color-primary); }
.info-pop { position:fixed; z-index:9600; max-width:340px; background:var(--color-surface-hi); border:1px solid var(--color-primary-glow);
  border-radius:var(--radius-md); box-shadow:var(--shadow-lg); padding:var(--space-3) var(--space-4); font-size:12px; line-height:1.55;
  color:var(--color-text-muted); display:none; }
.info-pop.show { display:block; animation:fadeSlideUp var(--dur-fast) var(--ease-out); }
.info-pop b { color:var(--color-text); }
.info-pop .od-id { font-family:var(--font-mono); font-size:10px; color:var(--color-warning); font-weight:600; }
.info-pop .rec { display:block; margin-top:6px; padding-top:6px; border-top:1px dashed var(--color-border-soft); color:var(--color-text-muted); }
.info-pop .rec b { color:var(--color-success); }
.info-pop code { font-family:var(--font-mono); font-size:10.5px; color:var(--color-accent-violet); }

/* dismissible honesty banner */
.honesty-banner { display:flex; align-items:flex-start; gap:var(--space-3); padding:var(--space-3) var(--space-4); border-radius:var(--radius-md);
  background:hsl(258 90% 66% / .08); border:1px solid hsl(258 90% 66% / .3); font-size:12px; color:var(--color-text-muted);
  margin:0 0 var(--space-4); line-height:1.5; }
.honesty-banner.hidden { display:none; }
.honesty-banner .hb-g { color:var(--color-accent-violet); font-size:15px; }

/* EDGES — from §2A (existing) + §2B (new). dir trigger lifted verbatim; mech compressed honest.

const EDGES = [

  { id:'e11', from:'N10', to:'N11', trig:'doRun() — confirm launch', mech:'CREATES new thread, sets active_workflow_run_id, redirects in: setSelectedThread + ensure setViewingThread fires. Backend path UNDECIDED', cls:'thread', od:'OD-9', key:true },

  { id:'e15', from:'N7',  to:'N8',  trig:'draft grounded + grey-areas cleared → "Continue"', mech:'post-draft flow 018 describe → 019 refine. Handoff trigger underspecified', cls:'netnew', od:'OD-2' },
  { id:'e16', from:'N8',  to:'N9',  trig:'"Publish" (lint-clean, all bound)', mech:'runs 8-stage gauntlet; on success freezes version immutable + forks a new draft to edit', cls:'netnew', od:null },
  { id:'e17', from:'N9',  to:'N6',  trig:'gauntlet PASSES (golden run + judge)', mech:'success verdict. Doc: auto-return to Workflows page w/ Run CTA — but 020 success offers NO back-link today', cls:'netnew', od:'OD-1', key:true },
  { id:'e18', from:'N9',  to:'N8',  trig:'"Tweak → new version" (success/block)', mech:'should standardize → Builder 019 (fresh draft v(n+1)); 020 button jumps to "resting" form (sketch-local)', cls:'netnew', od:'OD-5' },
  { id:'e19', from:'N9',  to:'N11', trig:'"View the golden run" (golden_run_id set)', mech:'runLinkClick opens the golden-run thread; gated on stage 3+ reached', cls:'thread', od:null },
  { id:'e20', from:'N11', to:'N12', trig:'run kicked off → mode flip', mech:'composer passes workflow_definition_id (ChatArea.tsx:331); SSE/mount reconcile sets WorkflowLock keyed by thread id', cls:'thread', od:null, key:true },

  { id:'e24', from:'N6',  to:'N6',  trig:'select a project in the rail', mech:'setProject(id) → GET /workflows/published?project_folder_id=… — intra-page state, no nav', cls:'existing', od:null, self:true },
  { id:'e25', from:'N6',  to:'N6',  trig:'"🗺️ Map / Where things go"', mech:'toggleMap() overlay, Esc closes — informational, no nav', cls:'existing', od:null, self:true },

/* OPEN DECISIONS — §5, verbatim gap + recommended resolution */
const OD = {
  'OD-1': { q:'Where does Publish SUCCESS return to?', gap:'021 implies publish flows onward to Run/Workflows, but 020 success offers NO "back to Workflows" + NO "Run" — only "View golden run" + "Tweak".', rec:'Auto-return to the Workflows page with the just-published version on the published shelf, a "Published v(n) ✓ · Run it" toast, and a Run CTA. Closes the author→first-Run dead-end.' },
  'OD-2': { q:'Is the Builder one route or two?', gap:'013 = ONE 4-stage cycler; 103 splits into 018 (describe) + 019 (refine). The 018→019 handoff trigger is never specified as a user action.', rec:'One continuous builder route, two stages. 018→019 fires once the draft is grounded AND grey-areas cleared; a "Continue / Refine by form" button is the explicit action. One URL-less surface.' },
  'OD-3': { q:'How do you get BACK from the Builder to the page?', gap:'No sketch (013/018/019/020) defines back / cancel-draft / breadcrumb. The journey is only forward.', rec:'Auto-save-draft-and-exit: a persistent "← Workflows" breadcrumb that saves the draft and returns. "Discard draft" in an overflow. Never trap the author.' },
  'OD-4': { q:'Is there a "Run" inside the Builder?', gap:'Deliberately NO (013/018/019 are hand-off only) — but with OD-3 a just-published author has no path to first Run.', rec:'Keep the builder Run-free (three-homes rule); close the gap via OD-1 (publish success returns to the page with a Run CTA). The Run home stays the Workflows page.' },
  'OD-5': { q:'"Tweak → new version" lands WHERE — builder or resting form?', gap:'021 + 022 say Tweak forks into the Builder (019). But 020\'s "Tweak" button calls setState("resting") → the publish form. Mechanic disagrees across sketches.', rec:'Standardize Tweak → Builder (019) as the cross-sketch contract. 020\'s "resting" jump is sketch-local scaffolding; the real destination is the builder with a fresh draft v(n+1).' },
  'OD-6': { q:'AppDock is dead code.', gap:'Fully built, never rendered; a 3rd stale nav array + a stale "// From AppDock" comment. Adding "workflows" forces: sync the 4th array, or delete first.', rec:'Delete AppDock before adding the entry (or in the same change), and extract a shared NAV_ITEMS constant consumed by NavPanel + the mobile drawer. Removes divergence risk permanently.' },
  'OD-7': { q:'Nav icon/name collision.', gap:'021 uses ⚙ for BOTH "Workflows" and "Settings".', rec:'Distinct icon for Workflows — lucide Workflow or GitBranch. Keep the gear for Settings only. Cosmetic but a real IA defect to fix at build.' },
  'OD-8': { q:'Escape-hatch parallel thread is variant-specific.', gap:'"Open a new thread while it runs" exists only in 022 variant A. 022\'s winner is null (undecided). The cross-thread nav contract depends on this.', rec:'Pick variant A\'s escape hatch as the contract: a locked running thread can always spawn a sibling Deep thread (unread dot). Reuses existing thread-create plumbing; matches "mode of a thread".' },
  'OD-9': { q:'Run handoff backend path is undecided.', gap:'012 names two: reuse POST /threads/{id}/messages with workflow_definition_id vs a new POST /workflows/{id}/run. 021 just says "reuses run/stream/lock/resume."', rec:'Reuse POST /threads/{id}/messages with workflow_definition_id for v2.9 — exactly what the composer Harness path already does (ChatArea.tsx:331), so page-launch + composer-launch share one code path.' },
  'OD-10':{ q:'Draft-vs-published Run parity.', gap:'021 shows Run on BOTH published AND draft/seed cards ("Run-draft"), but 020 frames the gauntlet as the gate that proves runnability, and 022 runs a published workflow.', rec:'A draft cannot be Run directly — PUBLISH IS THE TEST. No "Run-draft" on the page. A draft\'s golden run IS the publish gauntlet (golden run + judge = its only trial run). Drafts expose Open + Publish only; Run appears ONLY once published. Protects QUAL-01 — no unguarded path bypasses the judge gate.' },
  'OD-11':{ q:'Where does the read-only graph live?', gap:'Workflows-page-only vs also replacing the run-time PhaseTimeline. G-5 warns against re-touching recent 094/101.1 PhaseTimeline/PhaseCard.', rec:'Graph is a Builder/Workflows-page-only surface (019); do NOT replace the run-time vertical PhaseTimeline (G-5 hot-file). The run thread keeps its proven accordion.' },
};

/* ── node positions for the graph (variant A) — laid out as 3 honest zones:
   nav chrome (left) · existing app views (lower) · workflow studio (right arc).
   x/y are % of the stage. ── */
const POS = {

  N1:{x:33, y:50}, N12:{x:33, y:78},                    // chat + panel (execution home)
  N2:{x:24, y:14}, N3:{x:40, y:12}, N4:{x:55, y:9}, N5:{x:68, y:14}, // existing app views (top arc)
  N6:{x:54, y:48},                                       // Workflows page (the hinge)
  N13:{x:54, y:72},                                      // detail pane
  N7:{x:74, y:30}, N8:{x:88, y:44},                      // builder describe → refine
  N9:{x:88, y:66},                                       // publish gauntlet
  N10:{x:54, y:28},                                      // launch dialog (above page)

/* ════════════════════════════════════════════════════════════════ */
let CUR_V='A', SELECTED=null, BANNER=true, FLOW_SEL=null, IA_SEL=null;
/* All 11 open decisions ADOPTED by the operator on 2026-06-14 ("publish is the test").
   This is the authoritative navigation contract for Phase 103. OD markers are rendered
   as ADOPTED, not open. */
const OD_STATUS = 'adopted', OD_ADOPTED_ON = '2026-06-14';

const KIND_LABEL = { existing:'existing', netnew:'NET-NEW', dead:'DEAD code', thread:'mode of a thread', mixed:'mixed' };

function kindChip(kind){
  return `<span class="kind ${kind}" onmouseenter="showInfo(event,'kind-${kind}')" onmouseleave="hideInfo()">${KIND_LABEL[kind]}</span>`;
}
function odDot(odId, inline){
  if(!odId) return '';
  return `<span class="${inline?'od-inline':''}" style="${inline?'':''}" onmouseenter="showInfo(event,'${odId}')" onmouseleave="hideInfo()"
    title="decision ${odId} — ADOPTED (operator, 2026-06-14)">${odId}</span>`;
}

/* ─────────── shared intro + legend + banner ─────────── */
function introHTML(title, sub){
  return `<div class="intro">
    <span style="font-size:26px;line-height:1">🗺️</span>
    <div><h1>App Linkage Map <span style="font-size:var(--text-sm);color:var(--color-text-dim);font-weight:400">· Phase 103</span></h1>
      <div class="sub">${sub}</div></div>
  </div>`;
}
function legendHTML(){
  return `<div class="legend">
    <span class="lg"><span class="swatch existing"></span>existing surface</span>
    <span class="lg"><span class="swatch netnew"></span>NET-NEW (dashed)</span>
    <span class="lg"><span class="swatch mixed"></span>mixed (live route + net-new UI)</span>
    <span class="lg"><span class="swatch thread"></span>mode of a thread</span>
    <span class="lg"><span class="swatch dead"></span>dead code (dotted)</span>
    <span class="sep"></span>
    <span class="lg"><span class="od-dot">OD</span>decision — ALL 11 ADOPTED (operator, 2026-06-14); hover for the gap + the adopted resolution</span>
    <span class="sep"></span>
    <span class="lg" style="gap:4px;flex-wrap:wrap">
      <span style="color:var(--color-success);font-family:var(--font-mono);font-size:10px">all 11 adopted ✓:</span>
      ${Object.keys(OD).map(k=>`<span class="od-chip" onmouseenter="showInfo(event,'${k}')" onmouseleave="hideInfo()">${k}</span>`).join('')}
    </span>
  </div>`;
}
function bannerHTML(){
  if(!BANNER) return '';
  return `<div class="honesty-banner">
    <span class="hb-g">⬡</span>
    <span>There is <b>no router, no URL</b>. Every redirect here is a <b>useState&lt;ActiveView&gt;</b> switch, an intra-page state change, a modal, or a <b>create-thread-then-switch</b>. A workflow is a <b>mode of a thread</b>, never page-resident — <b>Run = create thread + set workflow mode + switch to Chat</b>. Net-new surfaces are dashed; the one live backend is <span style="font-family:var(--font-mono);font-size:11px">GET /workflows/published</span> + <span style="font-family:var(--font-mono);font-size:11px">POST /workflows/{id}/publish</span>.</span>
    <span class="hb-x" onclick="dismissBanner()">✕</span>
  </div>`;
}
function dismissBanner(){ BANNER=false; render(); }

/* ════════════════ VARIANT A — LINKAGE GRAPH ════════════════ */
function edgesOf(nodeId){
  return {
    out: EDGES.filter(e=>e.from===nodeId && e.to!==nodeId),
    in:  EDGES.filter(e=>e.to===nodeId && e.from!==nodeId),
    self:EDGES.filter(e=>e.from===nodeId && e.to===nodeId),
  };
}

function renderA(){
  const sub = `Every surface is a node; every redirect is a labelled directed edge (the trigger rides the line). <b>Click a node</b> to highlight its in/out edges and list where you can go from there. Existing vs NET-NEW are visually distinct — the decisions ride the edges as <b>OD</b> markers, <b style="color:var(--color-success)">all 11 ADOPTED (operator, 2026-06-14)</b>.`;
  return `<div class="stage">
    ${introHTML('', sub)}
    ${legendHTML()}
    ${bannerHTML()}
    <div class="graph-wrap">
      <div class="graph-stage" id="graphStage">
        <svg class="graph-svg" id="graphSvg" preserveAspectRatio="none"></svg>
      </div>
      <div class="inspector" id="inspector">${inspectorHTML()}</div>
    </div>
    <div class="callout"><b>The hinge is N6 (Workflows page).</b> It is the only NET-NEW first-class view — every authoring + launch edge fans out from it, and Run (e11) is the single edge that leaves the page for a thread. Notice the three self-loops on N6/N11 (project filter, map overlay, the pause) — intra-surface state, never a route.</div>
  </div>`;
}

function inspectorHTML(){
  if(!SELECTED){
    return `<div class="ins-empty"><div class="ie-ic">🗺️</div>
      Click any node to inspect it.<br><br>You'll see <b>where it lives today</b>, every <b>outbound</b> redirect (where you can go), and every <b>inbound</b> edge (how you arrive) — each with its real trigger + mechanic, and any open decision on the hop.</div>`;
  }
  const n = NODES[SELECTED];
  const { out, in:ins, self } = edgesOf(SELECTED);
  const edgeRow = (e, dir) => {
    const other = dir==='out' ? NODES[e.to] : NODES[e.from];
    const arrow = dir==='out' ? '→' : '←';
    return `<div class="ins-edge ${dir}" onclick="selectNode('${dir==='out'?e.to:e.from}')">
      <span class="ie-arrow">${arrow}</span>
      <span class="ie-body">
        <span class="ie-to">${other.id} · ${other.name}</span> ${kindChip(other.kind)}
        <span class="ie-trig">${dir==='out'?'when':'via'}: ${e.trig}</span>
        <span class="ie-mech">${e.mech}</span>
        ${e.od?`<span class="ie-od" onmouseenter="showInfo(event,'${e.od}')" onmouseleave="hideInfo()">⚑ ${e.od} — adopted</span>`:''}
      </span></div>`;
  };
  return `<div class="ins-head"><div><div class="ins-id">${n.id}</div><div class="ins-name">${n.name}</div></div>
      <span style="margin-left:auto">${kindChip(n.kind)}</span></div>
    <div style="font-size:9.5px;color:var(--color-text-dim);font-family:var(--font-mono);margin-bottom:2px">${n.sub}</div>
    <div class="ins-where">${n.where}</div>

    <div class="ins-sec">From here you can go to <span class="cnt">· ${out.length}</span></div>
    ${out.length? out.map(e=>edgeRow(e,'out')).join('') : '<div class="ins-none">terminal — no outbound redirects</div>'}

    <div class="ins-sec">You arrive here from <span class="cnt">· ${ins.length}</span></div>
    ${ins.length? ins.map(e=>edgeRow(e,'in')).join('') : '<div class="ins-none">entry point — no inbound edges</div>'}

    ${self.length?`<div class="ins-sec">In-place (self) actions <span class="cnt">· ${self.length}</span></div>
      ${self.map(e=>`<div class="ins-edge" style="cursor:default"><span class="ie-arrow" style="color:var(--color-text-dim)">↻</span>
        <span class="ie-body"><span class="ie-to">stays on ${n.name}</span>
        <span class="ie-trig">when: ${e.trig}</span><span class="ie-mech">${e.mech}</span>
        ${e.od?`<span class="ie-od" onmouseenter="showInfo(event,'${e.od}')" onmouseleave="hideInfo()">⚑ ${e.od} — adopted</span>`:''}</span></div>`).join('')}`:''}`;
}

function nodesLayer(){
  return Object.values(NODES).map(n=>{
    const p = POS[n.id];
    const odsForNode = EDGES.filter(e=>e.from===n.id && e.od).map(e=>e.od);
    const odBadge = odsForNode.length ? `<span class="gn-od" onmouseenter="showInfo(event,'${odsForNode[0]}')" onmouseleave="hideInfo()" title="adopted decision on an outbound edge (operator, 2026-06-14)">⚑</span>` : '';
    return `<div class="gnode ${n.kind}" id="gn-${n.id}" style="left:${p.x}%;top:${p.y}%" onclick="selectNode('${n.id}')">
      ${odBadge}
      <div class="gn-top"><span class="gn-id">${n.id}</span>${kindChip(n.kind)}</div>
      <div class="gn-name">${n.name}</div>
      <div class="gn-sub">${n.sub}</div>
    </div>`;
  }).join('');
}

/* compute SVG edges + label positions after nodes are in the DOM (need pixel coords) */
function drawGraphEdges(){
  const stage = document.getElementById('graphStage');
  const svg = document.getElementById('graphSvg');
  if(!stage || !svg) return;
  const W = stage.clientWidth, H = stage.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  // remove old labels
  stage.querySelectorAll('.edge-label').forEach(el=>el.remove());

  const sel = SELECTED;
  const drawn = EDGES.filter(e=>!e.self);
  let svgInner = `<defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.2" orient="auto">
      <path d="M0,0 L6,3.2 L0,6.4 Z" fill="var(--color-border)"/></marker>
    <marker id="arrowHotOut" markerWidth="8" markerHeight="8" refX="6.5" refY="3.4" orient="auto">
      <path d="M0,0 L6.5,3.4 L0,6.8 Z" fill="var(--color-primary)"/></marker>
    <marker id="arrowHotIn" markerWidth="8" markerHeight="8" refX="6.5" refY="3.4" orient="auto">
      <path d="M0,0 L6.5,3.4 L0,6.8 Z" fill="var(--color-success)"/></marker>
  </defs>`;

  drawn.forEach(e=>{
    const a = POS[e.from], b = POS[e.to];
    if(!a||!b) return;
    let x1=a.x/100*W, y1=a.y/100*H, x2=b.x/100*W, y2=b.y/100*H;
    // pull endpoints toward node edge (~ half node ~ 74px wide / 30px tall)
    const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len;
    x1+=ux*40; y1+=uy*22; x2-=ux*44; y2-=uy*24;
    // gentle curve via control point offset perpendicular
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const off = (parseInt(e.id.slice(1))%2? 1:-1) * Math.min(46, len*0.14);
    const cx=mx - uy*off, cy=my + ux*off;

    let cls = `edge-line ${e.cls}`;
    if(e.dead) cls+=' dead';
    let marker='url(#arrow)';
    const involved = sel && (e.from===sel || e.to===sel);
    if(sel){
      if(involved){
        if(e.from===sel){ cls+=' hot out'; marker='url(#arrowHotOut)'; }
        else { cls+=' hot in'; marker='url(#arrowHotIn)'; }
      } else cls+=' dim';
    }
    svgInner += `<path class="${cls}" d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" marker-end="${marker}"/>`;

    // label at curve midpoint
    const lx = 0.25*x1 + 0.5*cx + 0.25*x2;
    const ly = 0.25*y1 + 0.5*cy + 0.25*y2;
    let lcls='edge-label';
    if(sel){ lcls += involved ? ' hot' : ' dim'; }
    if(e.od) lcls+=' od';
    const odTag = e.od ? ` <span class="od-tag" onmouseenter="showInfo(event,'${e.od}')" onmouseleave="hideInfo()">⚑${e.od}</span>` : '';
    const deadTag = e.dead ? '⊘ ' : '';
    const lbl = document.createElement('div');
    lbl.className = lcls;
    lbl.style.left = (lx/W*100)+'%';
    lbl.style.top = (ly/H*100)+'%';
    lbl.title = e.dead ? 'INERT — '+e.trig : e.trig;
    lbl.innerHTML = deadTag + (e.trig.length>26 ? e.trig.slice(0,24)+'…'+odTag : e.trig+odTag);
    stage.appendChild(lbl);
  });
  svg.innerHTML = svgInner;

  // dim non-involved nodes
  Object.keys(NODES).forEach(id=>{
    const el = document.getElementById('gn-'+id);
    if(!el) return;
    el.classList.toggle('sel', sel===id);
    let related=false;
    if(sel){ related = (id===sel) || EDGES.some(e=>(e.from===sel&&e.to===id)||(e.to===sel&&e.from===id)); }
    el.classList.toggle('dim', !!sel && !related);
  });
}

function selectNode(id){
  SELECTED = (SELECTED===id) ? null : id;
  if(CUR_V==='A'){
    document.getElementById('inspector').innerHTML = inspectorHTML();
    drawGraphEdges();
  } else { render(); }
}

/* ════════════════ VARIANT B — JOURNEY FLOW ════════════════ */
/* the happy path as L→R stages; branch-offs hang under the stage they fork from */
const FLOW_STAGES = [
  { node:'N14', glyph:'☰', name:'Nav', sketch:'NavPanel · existing', kind:'existing' },
  { node:'N6',  glyph:'▦', name:'Workflows page', sketch:'021 · NET-NEW view', kind:'netnew',
    branches:[{ label:'select project / open map', trig:'intra-page state', to:null }] },
  { node:'N7',  glyph:'✎', name:'Build · describe', sketch:'018', kind:'netnew',
    branches:[{ label:'← back to Workflows', trig:'auto-save-draft-and-exit', od:'OD-3' }] },
  { node:'N8',  glyph:'⛭', name:'Refine by form', sketch:'019', kind:'netnew',
    branches:[{ label:'018→019 handoff trigger', trig:'underspecified', od:'OD-2' }] },
  { node:'N9',  glyph:'⬆', name:'Publish gauntlet', sketch:'020 · verdict ABI live', kind:'mixed',
    branches:[
      { label:'BLOCK — judge fail / lint / pre-run', trig:'→ "Fix & re-publish" · no override', od:null },
      { label:'success returns WHERE?', trig:'020 offers no back-link', od:'OD-1' }] },
  { node:'N10', glyph:'▶', name:'Run (launch dialog)', sketch:'012/021 · NET-NEW', kind:'netnew',
    branches:[{ label:'Run on a draft?', trig:'no — Run only once published', od:'OD-10' }] },
  { node:'N11', glyph:'💬', name:'Thread · workflow mode', sketch:'022', kind:'thread',
    branches:[
      { label:'pause at llm_human_input', trig:'pick / Proceed-Abort / type → resume', od:null },
      { label:'"New thread ▸" escape-hatch', trig:'spawns a sibling Deep thread', od:'OD-8' },
      { label:'cancel', trig:'3-way terminal: done / failed / cancelled', od:null },
      { label:'after resolve, in the THREAD: "tweak to add a column"', trig:'conversational Deep forks a NEW version → 019 (v2)', od:'OD-5' }] },
  { node:'N12', glyph:'◆', name:'Deliverable in FILES', sketch:'WorkspacePanel · SEED-038', kind:'existing',
    branches:[{ label:'"Open in FILES ▸" → deliverable lands here', trig:'flashPanel() · cited .docx → panel FILES (no fork from the panel)', od:null }] },
];

function renderB(){
  const sub = `The happy path as left-to-right stages: <b>Nav → Workflows page → Build (018) → Refine (019) → Publish gauntlet (020) → Run → Thread (022) → deliverable in FILES</b>. Branch-offs (tweak → new version, block → fix, escape-hatch) hang under the stage they fork from. Click a stage to inspect it. <b style="color:var(--color-text-dim)">Curated view — 8 of the 16 surfaces on the happy spine; see variant A for the full graph.</b>`;
  const lanes = FLOW_STAGES.map((s,i)=>{
    const last = i===FLOW_STAGES.length-1;
    const branches = (s.branches||[]).map(b=>`<div class="branch-chip" ${b.od?`onmouseenter="showInfo(event,'${b.od}')" onmouseleave="hideInfo()"`:''}>
        ${b.label}<br><span class="bc-trig">${b.trig}</span>${b.od?` <span class="bc-od">⚑ ${b.od}</span>`:''}
      </div>`).join('');
    return `<div class="lane">
      <div class="lane-h">${i===0?'entry':last?'deliverable':'stage '+i}</div>
      <div class="stage-card ${s.kind} ${FLOW_SEL===s.node?'sel':''}" onclick="selFlow('${s.node}')">
        ${(s.branches||[]).some(b=>b.od)?`<span class="sc-od" onmouseenter="showInfo(event,'${(s.branches.find(b=>b.od)||{}).od}')" onmouseleave="hideInfo()">⚑</span>`:''}
        <div class="sc-glyph">${s.glyph}</div>
        <div class="sc-name">${s.name}</div>
        <div class="sc-sketch">${s.sketch}</div>
      </div>
      ${!last?'<div class="lane-arrow">→</div>':''}
      ${branches?`<div class="branch"><div class="branch-h">branch-offs</div>${branches}</div>`:''}
    </div>`;
  }).join('');

  const sel = FLOW_SEL ? NODES[FLOW_SEL] : null;
  const detail = sel
    ? `<div class="fd-name">${sel.id} · ${sel.name} ${kindChip(sel.kind)}</div>
       <div class="fd-where">${sel.where}</div>`
    : `<div class="fd-empty">Click a stage above to see where that surface lives + its real mechanic.</div>`;

  return `<div class="stage">
    ${introHTML('', sub)}
    ${legendHTML()}
    ${bannerHTML()}
    <div class="flow-lanes scrollbar-thin">${lanes}</div>
    <div class="flow-detail">${detail}</div>
    <div class="callout"><b>One forward spine, branches that never trap you.</b> The single edge that leaves a page for a thread is <b>Run</b> (create-thread-then-switch). The two unresolved seams on the spine: <b>OD-1</b> (where Publish success returns) and <b>OD-2</b> (the 018→019 handoff). After resolve, "tweak this" forks a new version back into 019 — the same destination as the page's Tweak (OD-5).</div>
  </div>`;
}
function selFlow(id){ FLOW_SEL = (FLOW_SEL===id)?null:id; render(); }

/* ════════════════ VARIANT C — LAYERED IA ════════════════ */
/* top layer = nav-level ActiveViews; workflow sub-surfaces nest beneath N6;
   each sub-surface annotated with its redirect + three-homes grouping */
const TOP_VIEWS = ['N1','N2','N3','N4','N5','N6'];
const NESTED = {
  N6: [
    { node:'N13', redir:'click card / View ▦ → intra-page master-detail (no route)', home:'library', od:null },
    { node:'N7',  redir:'+ Build / Open ✎ → openBuilder() · net-new draft CRUD', home:'authoring', od:'OD-2' },
    { node:'N8',  redir:'018→019 continue · Tweak forks v(n+1)', home:'authoring', od:'OD-5' },
    { node:'N9',  redir:'Publish… → 8-stage gauntlet · POST /workflows/{id}/publish', home:'authoring', od:'OD-1' },
    { node:'N10', redir:'Run ▶ → modal collects kickoff + KB scope (still on the page)', home:'library', od:'OD-10' },
    { node:'N11', redir:'⇥ LEAVES the page → doRun() creates a thread + workflow mode + switches to Chat. NOT a sub-surface of N6 — it is a DESTINATION in the Execution home.', home:'execution', od:'OD-9' },
  ],
  N1: [
    { node:'N12', redir:'thread set → setViewingThread → panel binds; deliverable → FILES', home:'execution', od:null },
  ],
};
const HOMES = {
  authoring: { glyph:'✎', title:'Authoring', sub:'the Builder · 018→019→020', why:'authors the definition; NO Run affordance' },
  library:   { glyph:'▦', title:'Library + Launch', sub:'the Workflows page · 012/021', why:'the catalog + launchpad; only LAUNCHES' },
  execution: { glyph:'💬', title:'Execution', sub:'a Chat thread · 022', why:'the bounded run; reuses run/stream/lock/resume' },
};

function renderC(){
  const sub = `The nav-level views are the top layer; the workflow sub-surfaces nest beneath the <b>Workflows page</b>, each with its redirect annotation. Every surface is tagged with its <b>three-homes</b> grouping — Authoring / Library+Launch / Execution. Click any surface to inspect it. <b style="color:var(--color-text-dim)">Curated view — 13 of 16 surfaces; the nav-chrome cluster (NavPanel / mobile drawer / dead AppDock) is folded into the deadnote below. See variant A for the full graph.</b>`;

  const homeCards = Object.entries(HOMES).map(([k,h])=>`<div class="home-col ${k}">
    <div class="hc-h"><span class="hc-glyph">${h.glyph}</span><div><div class="hc-title">${h.title}</div><div class="hc-sub">${h.sub}</div></div></div>
    <div style="font-size:11px;color:var(--color-text-muted);line-height:1.5">${h.why}</div>
  </div>`).join('');

  const topRow = TOP_VIEWS.map(id=>{
    const n=NODES[id];
    const nested = NESTED[id];
    let block = `<div class="ia-view ${n.kind} ${IA_SEL===id?'sel':''}" onclick="selIA('${id}')">
      <div class="iv-top"><span class="iv-name">${n.name}</span> ${kindChip(n.kind)}</div>
      <div class="iv-sub">${n.sub}</div>
    </div>`;
    if(nested){
      block = `<div style="flex:1;min-width:128px">${block}
        <div class="ia-nest">
          <div style="font-size:8.5px;color:var(--color-text-dim);font-family:var(--font-mono);margin-bottom:2px">reached FROM this page — the ⇥ one (N11) EXITS to the Execution home; the rest are authoring/library sub-surfaces</div>
          ${nested.map(sn=>{
            const m=NODES[sn.node];
            return `<div class="ia-sub ${m.kind==='thread'?'thread':m.kind==='mixed'?'mixed':''} ${IA_SEL===sn.node?'sel':''}" onclick="event.stopPropagation(); selIA('${sn.node}')">
              ${sn.od?`<span class="is-od" onmouseenter="showInfo(event,'${sn.od}')" onmouseleave="hideInfo()">⚑</span>`:''}
              <div class="is-top"><span class="is-name">${m.name}</span> ${kindChip(m.kind)}
                <span class="is-home ${sn.home}">${HOMES[sn.home].title}</span></div>
              <div class="is-redir">↳ ${sn.redir}</div>
            </div>`;
          }).join('')}
        </div></div>`;
    }
    return block;
  }).join('');

  const sel = IA_SEL ? NODES[IA_SEL] : null;
  return `<div class="stage">
    ${introHTML('', sub)}
    ${legendHTML()}
    ${bannerHTML()}

    <div class="ia-layer">
      <p class="ia-layer-h">The three homes — one home per concern <span class="lh-line"></span></p>
      <div class="ia-homes">${homeCards}</div>
    </div>

    <div class="ia-layer">
      <p class="ia-layer-h">Top layer · nav-level ActiveViews (a flat useState union) <span class="lh-line"></span></p>
      <div class="ia-top-row" style="align-items:flex-start">${topRow}</div>
    </div>

    ${sel?`<div class="flow-detail"><div class="fd-name">${sel.id} · ${sel.name} ${kindChip(sel.kind)}</div><div class="fd-where">${sel.where}</div></div>`:''}

    <div class="ia-deadnote">⊘ <b>AppDock (N16) is dead code</b> — a 3rd stale NAV_ITEMS array, never rendered. Adding "Workflows" forces a choice: sync a 4th array, or delete first + extract a shared NAV_ITEMS module.
      <span class="info-dot" onmouseenter="showInfo(event,'OD-6')" onmouseleave="hideInfo()">i</span>
      &nbsp; The mobile drawer (N15) must also get the row, or Workflows is desktop-only.</div>

    <div class="callout"><b>Authoring hands off, never executes.</b> The Builder (018→019→020) has NO Run affordance — it only Publishes/Continues. The Workflows page only LAUNCHES; execution lands in a Chat thread. Every nested redirect respects the three-homes split — that's the whole IA in one rule.</div>
  </div>`;
}
function selIA(id){ IA_SEL=(IA_SEL===id)?null:id; render(); }

/* ════════════════ tiered-guidance / OD popovers ════════════════ */
const KIND_INFO = {
  'kind-existing': `<b>Existing surface.</b> Already in the app today — a rendered <code>ActiveView</code> or panel. The new IA plugs into these without changing them.`,
  'kind-netnew':   `<b>NET-NEW.</b> No live surface yet (and mostly no backend). Only <code>GET /workflows/published</code> + <code>POST /workflows/{id}/publish</code> exist; all draft CRUD + NL-gen are net-new. Shown dashed.`,
  'kind-dead':     `<b>DEAD code.</b> Fully built but never rendered (no JSX call site). A divergence trap — see <span class="od-id">OD-6</span>.`,
  'kind-thread':   `<b>Mode of a thread.</b> Not a new view — the existing Chat view flipped to Harness by a per-thread workflow lock. Run = create thread + set workflow mode + switch to Chat.`,
  'kind-mixed':    `<b>Mixed.</b> A live backend route under a net-new UI. Only N9 (Publish gauntlet) qualifies — <code>POST /workflows/{id}/publish</code> exists, but the 8-stage gauntlet UI is net-new.`,
};
function showInfo(ev, key){
  const pop = document.getElementById('infoPop');
  let html='';
  if(key.startsWith('kind-')) html = KIND_INFO[key]||'';
  else if(OD[key]){
    const o=OD[key];
    html = `<span class="od-id">⚑ ${key} — ADOPTED (operator, 2026-06-14)</span><br><b>${o.q}</b><br>
      <span style="display:block;margin-top:4px;color:var(--color-text-dim)">${o.gap}</span>
      <span class="rec"><b>Adopted:</b> ${o.rec}</span>`;
  }
  pop.innerHTML = html;
  pop.classList.add('show');
  const r = ev.currentTarget.getBoundingClientRect();
  let x = r.left, y = r.bottom + 8;
  if (x + 350 > window.innerWidth) x = window.innerWidth - 360;
  if (y + 200 > window.innerHeight) y = r.top - 8 - pop.offsetHeight;
  pop.style.left = Math.max(8,x) + 'px'; pop.style.top = Math.max(8,y) + 'px';
}
function hideInfo(){ document.getElementById('infoPop').classList.remove('show'); }

/* ════════════════ dispatch ════════════════ */
function render(){
  const root = document.getElementById('root');
  if(CUR_V==='A') root.innerHTML = renderA();
  else if(CUR_V==='B') root.innerHTML = renderB();
  else root.innerHTML = renderC();
  if(CUR_V==='A'){
    // nodes are absolute-positioned children of the stage
    document.getElementById('graphStage').insertAdjacentHTML('beforeend', nodesLayer());
    requestAnimationFrame(drawGraphEdges);
  }
}
function setVariant(v){
  CUR_V=v;
  document.querySelectorAll('.variant-tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  render();
}
window.addEventListener('resize', ()=>{ if(CUR_V==='A') drawGraphEdges(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ SELECTED=null; FLOW_SEL=null; IA_SEL=null; hideInfo(); render(); } });
render();
</script>
