<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 149 — What the reveal costs (Phase 187 / VOCAB-01)</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* ══════════════════════════════════════════════════════════════════════════════
   SKETCH 149 — when ⌥ Technical-names is ON, what should the card show?

   WHAT IS ALREADY SHIPPED (audited 2026-08-01 — this sketch does NOT propose it):
     · `TechnicalNamesProvider`      one app-wide boolean, localStorage, default off
     · `WorkflowCanvas.tsx:1285`     the toggle, already in the canvas toolbar
     · `WorkflowCanvas.tsx:945`      merges `technical` onto every node's data
     · `PhaseNode.tsx:144`           title = technical ? technicalTitle : title
     · `PhaseSpineGraph.tsx:125`     the vertical spine does the SAME swap
   So "wire a reveal onto the canvas" is NOT the question — it is done, and both
   graph views already agree. The open question is narrower and newly urgent:

     THE SWAP DESTROYS THE PLAIN TITLE. That was cheap when the plain title was a
     generic type sentence. Sketch 148-C makes it specific ("Search Supplier
     Contracts"), so the same swap now costs real meaning.

   CONSTRAINT THAT SHAPES THE ANSWER: the card's `technicalLine` slot EXISTS and is
   rendered (`PhaseNodeCard.tsx:325`) but is deliberately NOT passed — `PhaseNode.tsx:183`
   reserves it, with `status` and `stepNumber`, for Phase 188. Variant B spends it;
   variant C does not. That is the trade, and it is a real one.

   Card geometry is the shipped 137-B, same source as sketch 148.
   ══════════════════════════════════════════════════════════════════════════════ */

html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans);
}
.variant-nav, .lead, .bar { flex-shrink: 0; }

.variant-nav {
  display: flex; gap: 6px; align-items: center; padding: 10px 24px;
  background: var(--color-bg-elev1); border-bottom: 1px solid var(--color-border);
}
.variant-tab {
  border: 1px solid transparent; background: transparent; color: var(--color-text-dim);
  font-family: var(--font-sans); font-size: 12.5px; padding: 6px 14px;
  border-radius: 999px; cursor: pointer; transition: all .15s ease;
}
.variant-tab:hover { color: var(--color-text); background: var(--color-muted); }
.variant-tab.active {
  background: var(--color-surface-hi); color: var(--color-text);
  border-color: var(--color-border); box-shadow: var(--shadow-sm);
}

.lead {
  padding: 12px 24px; font-size: 12.5px; color: var(--color-text-muted); line-height: 1.65;
  border-bottom: 1px solid var(--color-border); background: var(--color-bg-elev1);
}
.lead b { color: var(--color-text); font-weight: 600; }
.lead code { font-family: var(--font-mono); font-size: 11px; color: var(--color-primary); }
.lead .warn { color: hsl(0 72% 70%); font-weight: 600; }
.lead .good { color: hsl(142 71% 62%); font-weight: 600; }

.bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 24px; border-bottom: 1px solid var(--color-border);
}
.bar .lbl {
  font-family: var(--font-mono); font-size: 10px; color: var(--color-text-dim);
  text-transform: uppercase; letter-spacing: .09em;
}
.spacer { flex: 1; }

/* the shipped TechnicalNamesToggle, drawn as it appears in the canvas toolbar */
.revealtoggle {
  display: inline-flex; align-items: center; gap: 9px; cursor: pointer;
  border: 1px solid var(--color-border); background: var(--color-muted);
  border-radius: 999px; padding: 5px 13px 5px 9px; font-size: 12px;
  color: var(--color-text-muted); transition: all .15s ease;
}
.revealtoggle:hover { border-color: var(--color-text-dim); color: var(--color-text); }
.revealtoggle .sw {
  width: 30px; height: 17px; border-radius: 999px; background: var(--color-accent);
  border: 1px solid var(--color-border); position: relative; transition: all .2s ease;
}
.revealtoggle .sw::after {
  content: ''; position: absolute; top: 1.5px; left: 1.5px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--color-text-dim); transition: all .2s ease;
}
body.tech .revealtoggle { border-color: hsl(239 100% 82% / .5); color: var(--color-text); }
body.tech .revealtoggle .sw { background: hsl(239 84% 67% / .5); border-color: hsl(239 100% 82% / .6); }
body.tech .revealtoggle .sw::after { left: 14.5px; background: hsl(239 100% 82%); }

/* ── the stage ───────────────────────────────────────────────────────────── */
.stage { position: relative; flex: 1; min-height: 0; overflow: auto; }
.amb { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.amb::before, .amb::after {
  content: ''; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45;
}
.amb::before { width: 520px; height: 520px; left: 6%; top: -14%; background: hsl(239 84% 45% / .2); }
.amb::after  { width: 460px; height: 460px; right: 4%; bottom: -18%; background: hsl(258 90% 50% / .14); }

/* ── THE NODE — shipped 137-B (same geometry as sketch 148) ──────────────── */
.nodebox { position: relative; width: 260px; min-height: 104px; flex-shrink: 0; }
.card {
  position: relative; margin: 0 auto; width: 248px; min-height: 104px;
  border-radius: 22px; padding: 42px 20px 20px; text-align: center;
  background: hsl(220 30% 100% / .045); backdrop-filter: blur(8px);
  border: 1px solid hsl(220 30% 100% / .34);
  box-shadow: 0 1px 0 hsl(220 30% 100% / .06) inset, 0 18px 36px -22px rgba(0,0,0,.95);
}
.ttl {
  font-family: var(--font-headline); font-weight: 600; font-size: 14px;
  line-height: 1.25; color: var(--color-text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ttl.mono { font-family: var(--font-mono); font-size: 12px; }
.sub { margin-top: 4px; font-size: 11px; line-height: 1.45; color: var(--color-text-muted); }
.techline {
  margin-top: 4px; font-family: var(--font-mono); font-size: 10px; line-height: 1.45;
  color: var(--color-text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mark {
  position: absolute; left: 50%; top: -26px; transform: translateX(-50%);
  width: 62px; height: 62px; display: grid; place-items: center;
  pointer-events: none; z-index: 4;
}
.mark::before {
  content: ''; position: absolute; inset: -3px; border-radius: 50%; z-index: 0;
  background: radial-gradient(circle, var(--t, hsl(239 90% 70% / .40)), transparent 68%);
}
.mark::after {
  content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 36px; height: 8px; border-radius: 50%; background: rgba(0,0,0,.5); filter: blur(5px);
}
.mark svg { position: relative; z-index: 2; filter: drop-shadow(0 9px 13px rgba(0,0,0,.8)); }
.seal {
  position: absolute; top: 11px; right: 17px; width: 21px; height: 21px;
  border-radius: 50%; display: grid; place-items: center; z-index: 6;
  font-size: 10px; color: var(--color-text);
  background: hsl(220 30% 100% / .1); border: 1px solid hsl(220 30% 100% / .34);
}

/* ── the co-present matrix (the sketch-148 lesson, applied from the start) ── */
.matrix { position: relative; z-index: 1; padding: 30px 24px 40px; }
.mrow {
  display: grid; grid-template-columns: 190px 300px 300px 1fr;
  gap: 22px; align-items: start;
  padding: 30px 0 26px; border-bottom: 1px solid var(--color-border-soft);
}
.mrow.head {
  padding: 0 0 10px; border-bottom: 1px solid var(--color-border);
}
.mrow.head div {
  font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase;
  letter-spacing: .09em; color: var(--color-text-dim);
}
.mrow.pick { background: hsl(142 71% 45% / .05); }
.mrow.shipped { background: hsl(0 72% 51% / .04); }

.rowlbl { padding-top: 30px; }
.rowlbl h3 {
  margin: 0; font-size: 13px; font-weight: 600; color: var(--color-text);
}
.rowlbl p {
  margin: 6px 0 0; font-size: 11px; line-height: 1.55; color: var(--color-text-muted);
}
.rowlbl .cost {
  display: inline-block; margin-top: 9px; font-family: var(--font-mono); font-size: 9px;
  padding: 2px 8px; border-radius: 999px;
}
.cost.free { background: hsl(142 71% 45% / .16); color: hsl(142 71% 62%); border: 1px solid hsl(142 71% 45% / .35); }
.cost.spend { background: hsl(38 92% 60% / .16); color: hsl(38 92% 72%); border: 1px solid hsl(38 92% 60% / .4); }
.cost.loss { background: hsl(0 72% 51% / .16); color: hsl(0 72% 72%); border: 1px solid hsl(0 72% 51% / .4); }

.cell { display: flex; justify-content: center; padding-top: 30px; }
.cell.dim { opacity: .4; }

.verdict {
  padding-top: 30px; font-size: 11.5px; line-height: 1.6; color: var(--color-text-muted);
}
.verdict b { color: var(--color-text); }
.verdict .lost { color: hsl(0 72% 72%); font-weight: 600; }
.verdict .kept { color: hsl(142 71% 62%); font-weight: 600; }

.note {
  margin-top: 22px; padding: 13px 15px; border-radius: 10px;
  background: hsl(38 92% 60% / .07); border: 1px solid hsl(38 92% 60% / .28);
  font-size: 12.5px; line-height: 1.65; color: var(--color-text-muted);
}
.note b { color: hsl(38 92% 72%); }
.note code { font-family: var(--font-mono); font-size: 11px; color: var(--color-primary); }

/* ── the live canvas strip (tab 2) ───────────────────────────────────────── */
.flow {
  position: relative; z-index: 1; display: flex; align-items: flex-start;
  gap: 34px; padding: 90px 40px 60px; flex-wrap: wrap; row-gap: 80px;
}
.conn { flex-shrink: 0; width: 34px; height: 104px; display: grid; place-items: center; margin: 0 -34px; }

#sketch-tools {
  position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-family: system-ui;
  font-size: 11px; background: rgba(0,0,0,.78); color: #fff; padding: 8px 10px;
  border-radius: 8px; opacity: .35; transition: opacity .2s; display: flex; gap: 8px;
}
#sketch-tools:hover { opacity: 1; }
#sketch-tools select, #sketch-tools button {
  background: #222; color: #fff; border: 1px solid #444; border-radius: 5px;
  font-size: 11px; padding: 3px 7px; cursor: pointer;
}
.variant { display: none; }
.variant.active { display: block; }
</style>
</head>
<body>

<div class="variant-nav">
  <button class="variant-tab active" onclick="showVariant('matrix', this)">◫ All three, both states</button>
  <button class="variant-tab" onclick="showVariant('live', this)">Live canvas strip</button>
</div>

<div class="lead" id="lead"></div>

<div class="bar">
  <span class="lbl">Shipped control</span>
  <label class="revealtoggle" onclick="toggleTech()">
    <span class="sw"></span><span>⌥ Technical names</span>
  </label>
  <span class="spacer"></span>
  <span class="lbl" style="text-transform:none;letter-spacing:0">
    Same step throughout · step 2 of the renewal review · titles from sketch 148-C
  </span>
</div>

<div class="stage">
  <div class="amb"></div>
  <div id="variant-matrix" class="variant active"><div class="matrix" id="matrix"></div></div>
  <div id="variant-live" class="variant"><div class="flow" id="flow"></div></div>
</div>

<div id="sketch-tools">
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">Default</option>
  </select>
  <button onclick="setW(375)">P</button>
  <button onclick="setW(768)">T</button>
  <button onclick="setW(0)">Full</button>
</div>

<script src="../themes/phase-icons-3d.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════════
   ONE STEP, shown in every treatment. Real fields, and the plain title is the one
   sketch 148-C's layered ladder produces — which is the whole reason this question
   is now worth asking.
   ══════════════════════════════════════════════════════════════════════════════ */
const STEP = {
  type:      'llm_agent',
  slug:      'find-renewal-terms',
  plain:     'Search Supplier Contracts',              /* 148-C, config-derived tier */
  subtitle:  'Reads only the Supplier Contracts folder',
  typeLabel: 'AI agent step',                          /* PHASE_TYPE_LABELS.llm_agent */
};
/* `technicalTitle()` verbatim — phaseVocabulary.ts:180 */
const technicalTitle = s => s.typeLabel + ' · ' + s.slug;

let tech = false;

/* ── the three treatments ─────────────────────────────────────────────────── */
const TREATMENTS = [
  {
    key: 'a', cls: 'shipped',
    name: 'A · Swap the title',
    desc: 'What ships today. `title = technical ? technicalTitle : title` (PhaseNode.tsx:144). The plain title is replaced outright.',
    cost: ['loss', 'costs the plain title'],
    /* returns {ttlClass, ttl, sub, tline} */
    render: (on, s) => on
      ? { mono:true,  ttl: technicalTitle(s), sub: s.subtitle, tline: null }
      : { mono:false, ttl: s.plain,           sub: s.subtitle, tline: null },
    verdict: on => on
      ? 'The business meaning is <span class="lost">gone</span>. You can no longer tell this step searches Supplier Contracts — only that it is an agent step called <code>find-renewal-terms</code>. That was an acceptable trade when the plain title was the generic “Work out how to do it”; after 148-C it is a real loss.'
      : 'Identical to every other treatment when the reveal is off — which is the default state and the one most users will only ever see.',
  },
  {
    key: 'b', cls: '',
    name: 'B · Add a third line',
    desc: 'Plain title stays; technical detail fills the declared `technicalLine` slot beneath the subtitle.',
    cost: ['spend', 'spends 188’s reserved slot'],
    render: (on, s) => on
      ? { mono:false, ttl: s.plain, sub: s.subtitle, tline: technicalTitle(s) }
      : { mono:false, ttl: s.plain, sub: s.subtitle, tline: null },
    verdict: on => on
      ? 'Both readings are <span class="kept">co-present</span> — best comprehension of the three. But the slot it fills is <b>not free</b>: <code>PhaseNode.tsx:183</code> reserves <code>technicalLine</code> for Phase 188 alongside <code>status</code> and <code>stepNumber</code>. Taking it now means 188 arrives to a spent card, and the card grows a fourth line at every reveal.'
      : 'Identical at rest. The cost is only paid when the reveal is on — but the <i>slot commitment</i> is permanent.',
  },
  {
    key: 'c', cls: 'pick',
    name: 'C · Swap the subtitle ★',
    desc: 'Plain title stays as the title; technical detail replaces the SUBTITLE, which after 148-C is the least informative line on the card.',
    cost: ['free', 'costs no slot'],
    render: (on, s) => on
      ? { mono:false, ttl: s.plain, sub: null,       tline: technicalTitle(s) }
      : { mono:false, ttl: s.plain, sub: s.subtitle, tline: null },
    verdict: on => on
      ? 'Meaning <span class="kept">kept</span>, technical detail gained, <span class="kept">no new slot spent</span> and the card height never changes. What it gives up is the type subtitle — “Reads only the Supplier Contracts folder”. Ask whether that sentence earns its place once the title already says <i>Search Supplier Contracts</i>: here it is close to a restatement.'
      : 'Identical at rest, like the others. The whole difference lives in the ON state.',
  },
];

const LEADS = {
  matrix: 'The reveal is <b>already shipped on the canvas</b> — the toolbar toggle (<code>WorkflowCanvas.tsx:1285</code>), the shared provider, and the same swap on both graph views. So the question is not where it lives. It is: <b>when the reveal is ON, what should the card show?</b> Today it <span class="warn">swaps the title away</span>. That was cheap when the plain title was a generic type sentence; <b>sketch 148-C makes it specific</b>, so the same swap now destroys real meaning. Flip <b>⌥ Technical names</b> and read the right-hand column.',
  live: 'The same three treatments on a run of real steps, so you can judge the <b>density</b> rather than one isolated card — a fourth line on every node reads very differently across five of them than it does on one. Flip the toggle and watch the strip’s overall weight, not just the words.',
};

let current = 'matrix';

/* `step` is explicit rather than read off a module-level global, so the live strip
   can render five different steps without mutating shared state to do it. The seal
   shows only where the server would mark it — the KB-tool intersection, not "every
   card in a sketch". */
function cardHTML(t, on, step) {
  const s = step ?? STEP;
  const f = t.render(on, s);
  const grounded = s.type === 'llm_agent' || s.type === 'llm_batch_agents';
  return '<div class="nodebox">'
    + '<div class="card"'+(grounded?'':' style="border-color:var(--color-border-soft)"')+'>'
    +   '<div class="ttl'+(f.mono?' mono':'')+'">'+f.ttl+'</div>'
    +   (f.sub   ? '<div class="sub">'+f.sub+'</div>' : '')
    +   (f.tline ? '<div class="techline">'+f.tline+'</div>' : '')
    + '</div>'
    + '<div class="mark" style="--t:'+(TINT[s.type]||'hsl(220 30% 100% / .22)')+'">'+icon3d(s.type, 34)+'</div>'
    + (grounded ? '<div class="seal" title="Must prove it — this step reads your documents">⛨</div>' : '')
    + '</div>';
}

/* the shipped per-type icon-well tints (canvas-184.css / nodePresentation ICON_TINT) */
const TINT = {
  llm_agent:        'hsl(239 90% 70% / .40)',
  llm_emit:         'hsl(258 90% 70% / .40)',
  programmatic:     'hsl(200 85% 62% / .36)',
  llm_batch_agents: 'hsl(170 80% 55% / .34)',
  llm_human_input:  'hsl(38 92% 62% / .38)',
  llm_single:       'hsl(220 30% 100% / .22)',
};

function renderMatrix() {
  const head = '<div class="mrow head"><div>Treatment</div><div>Reveal OFF (default)</div>'
             + '<div>Reveal ON</div><div>What it costs</div></div>';
  const rows = TREATMENTS.map(t =>
      '<div class="mrow '+t.cls+'">'
    + '<div class="rowlbl"><h3>'+t.name+'</h3><p>'+t.desc.replace(/`([^`]+)`/g,'<code>$1</code>')+'</p>'
    +   '<span class="cost '+t.cost[0]+'">'+t.cost[1]+'</span></div>'
    + '<div class="cell'+(tech?' dim':'')+'">'+cardHTML(t,false)+'</div>'
    + '<div class="cell'+(tech?'':' dim')+'">'+cardHTML(t,true)+'</div>'
    + '<div class="verdict">'+t.verdict(tech).replace(/`([^`]+)`/g,'<code>$1</code>')+'</div>'
    + '</div>').join('');

  document.getElementById('matrix').innerHTML = head + rows
    + '<div class="note"><b>The slot is the real trade.</b> <code>technicalLine</code> is rendered by the shipped card '
    + '(<code>PhaseNodeCard.tsx:325</code>) but deliberately never passed — <code>PhaseNode.tsx:183</code> reserves it for '
    + 'Phase 188 along with <code>status</code> and <code>stepNumber</code>. B spends it; C reaches the same comprehension '
    + 'by giving up the type subtitle instead, which 148-C already made near-redundant. If B is chosen, that is a '
    + 'decision to hand Phase 188 a card with one fewer line to spend — worth making deliberately rather than by default.</div>';
}

/* the live strip — five steps, so density is judgeable */
const STRIP = [
  { type:'programmatic',    slug:'load-renewal-queue',  plain:'Prepare the inputs',
    subtitle:'A fixed step the server runs',            typeLabel:'Server step' },
  { type:'llm_agent',       slug:'find-renewal-terms',  plain:'Search Supplier Contracts',
    subtitle:'Reads only the Supplier Contracts folder', typeLabel:'AI agent step' },
  { type:'llm_agent',       slug:'check-pricing',       plain:'Run the pricing policy check',
    subtitle:'Applies your saved rules to each contract', typeLabel:'AI agent step' },
  { type:'llm_human_input', slug:'owner-signoff',       plain:'Wait for your approval',
    subtitle:'Pauses here until you answer',            typeLabel:'Needs you' },
  { type:'llm_emit',        slug:'renewal-deck',        plain:'Board-ready renewal pack',
    subtitle:'Fills your template and produces the file', typeLabel:'Deliverable' },
];

let stripTreatment = 'c';

function renderLive() {
  const t = TREATMENTS.find(x => x.key === stripTreatment);
  const cards = STRIP.map(s => cardHTML(t, tech, s));
  const conn = '<div class="conn"><svg width="34" height="12">'
    + '<line x1="0" y1="6" x2="26" y2="6" stroke="hsl(220 20% 40%)" stroke-width="1.5"/>'
    + '<path d="M26 2 L32 6 L26 10 Z" fill="hsl(220 20% 40%)"/></svg></div>';
  document.getElementById('flow').innerHTML =
      '<div style="width:100%;display:flex;gap:8px;margin-bottom:6px">'
    + TREATMENTS.map(x => '<button class="variant-tab'+(x.key===stripTreatment?' active':'')
        + '" onclick="pickStrip(\''+x.key+'\')">'+x.name+'</button>').join('')
    + '</div>' + cards.join(conn);
}

function pickStrip(k) { stripTreatment = k; renderLive(); }

function render() {
  renderMatrix();
  renderLive();
  document.getElementById('lead').innerHTML = LEADS[current];
}

function toggleTech() {
  tech = !tech;
  document.body.classList.toggle('tech', tech);
  render();
}

function showVariant(id, btn) {
  current = id;
  document.querySelectorAll('.variant').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.variant-nav .variant-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('variant-'+id).classList.add('active');
  btn.classList.add('active');
  document.getElementById('lead').innerHTML = LEADS[id];
}

function setW(w) {
  const f = document.getElementById('flow');
  f.style.maxWidth = w ? w+'px' : '';
}

render();
</script>
</body>
</html>
