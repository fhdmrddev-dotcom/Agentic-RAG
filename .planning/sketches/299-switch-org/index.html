<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 299-2 — Switch Org Prompt</title>
<link rel="stylesheet" href="../themes/default.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);font-size:var(--text-base)}
#vnav,#states{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--color-border);flex-wrap:wrap}
.lbl{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-dim);margin-right:6px}
.vtab,.stab{background:transparent;border:1px solid var(--color-border);color:var(--color-text-muted);font-size:var(--text-xs);padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;transition:all .15s ease}
.vtab:hover,.stab:hover{border-color:var(--color-primary)}
.vtab.active{background:var(--color-primary-dim);border-color:var(--color-primary);color:var(--color-primary)}
.stab.active{background:var(--color-accent);color:var(--color-text)}
#note{padding:8px 16px;font-size:var(--text-sm);color:var(--color-text-muted);border-bottom:1px solid var(--color-border-soft);line-height:1.5}
#note b{color:var(--color-text)}
#truth{display:flex;gap:18px;flex-wrap:wrap;padding:8px 16px;font-family:var(--font-mono);font-size:11px;color:var(--color-text-dim);border-bottom:1px solid var(--color-border-soft);background:var(--color-bg-elev1)}
#truth b{color:var(--color-text-muted);font-weight:500}
#truth .ok{color:var(--color-success)}

.frame{display:grid;grid-template-columns:58px 250px minmax(0,1fr);height:calc(100vh - 160px);min-height:560px}
.rail{background:var(--color-bg-elev1);border-right:1px solid var(--color-border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.rail .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--color-text-dim);font-size:16px}
.rail .ic.on{background:var(--color-primary-dim);color:var(--color-primary)}
.rail .sp{flex:1}
.orgchip{width:44px;border-radius:10px;padding:5px 0;text-align:center;font-size:9px;line-height:1.2;color:var(--color-text-muted);border:1px solid var(--color-border)}
.orgchip .sq{width:22px;height:22px;border-radius:6px;margin:0 auto 3px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.orgchip.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--color-primary)}40%{box-shadow:0 0 0 4px var(--color-primary-dim)}100%{box-shadow:0 0 0 0 transparent}}
.hist{border-right:1px solid var(--color-border);background:var(--color-bg-elev1);padding:12px 10px;overflow:hidden}
.hist .h{font-size:var(--text-sm);font-weight:600;margin:2px 6px 10px;display:flex;justify-content:space-between}
.hist .h span{font-size:10px;color:var(--color-text-dim);font-weight:500}
.hist .grp{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--color-text-dim);margin:12px 8px 6px}
.hist .row{font-size:var(--text-sm);color:var(--color-text-muted);padding:7px 8px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.hist .row.on{background:var(--color-surface);color:var(--color-text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--color-primary);animation:pulse 1.4s infinite;flex:none}
@keyframes pulse{50%{opacity:.35}}
main{position:relative;overflow:hidden;display:flex;flex-direction:column}

/* the live chat behind */
.chat{flex:1;overflow:auto;padding:22px 32px}
.chat .th{font-size:var(--text-sm);color:var(--color-text-dim);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.msg-u{margin-left:auto;max-width:70%;background:var(--color-surface);border:1px solid var(--color-border-soft);border-radius:14px;padding:10px 14px;font-size:var(--text-sm);margin-bottom:16px}
.msg-a{max-width:78%;font-size:var(--text-sm);line-height:1.65;color:var(--color-text)}
.strip{display:inline-flex;gap:8px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--color-primary);border:1px solid hsl(239 100% 82% / .3);background:var(--color-primary-dim);border-radius:999px;padding:3px 10px;margin-bottom:10px}
.composer{margin:0 32px 18px;border:1px solid var(--color-border);border-radius:14px;padding:12px 14px;font-size:var(--text-sm);color:var(--color-text-dim);background:var(--color-surface)}

/* the run page (after accept) */
.run{flex:1;overflow:auto;padding:22px 32px}
.run .crumb{font-size:var(--text-xs);color:var(--color-text-dim);margin-bottom:6px}
.run h1{font-family:var(--font-headline);font-size:var(--text-lg);margin:0 0 4px}
.run .meta{font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:16px}
.spine{border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface)}
.spine .st{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--color-border-soft);font-size:var(--text-sm)}
.spine .st:last-child{border-bottom:0}
.spine .g{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;background:var(--color-success-dim);color:var(--color-success)}
.spine .g.wait{background:var(--color-warning-dim);color:var(--color-warning)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.saves{font-size:var(--text-xs);color:var(--color-text-dim)}
.saves b{color:var(--color-text-muted)}
.bg{margin-top:16px;font-size:var(--text-xs);color:var(--color-text-muted);border:1px solid var(--color-border-soft);border-radius:8px;padding:8px 12px;background:var(--color-bg-elev1);display:flex;gap:8px;align-items:center}

.btn{background:transparent;border:1px solid var(--color-border);color:var(--color-text);border-radius:8px;padding:7px 14px;font-size:var(--text-sm);cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:var(--color-primary)}
.btn.primary{background:var(--color-primary-strong);border-color:transparent;color:#fff}
.btn.sm{padding:4px 10px;font-size:var(--text-xs)}

/* A: replaces the main area */
.ask-a{flex:1;display:flex;align-items:center;justify-content:center;padding:32px}
.ask-a .box{max-width:440px;text-align:center}
.orgbig{width:44px;height:44px;border-radius:12px;margin:0 auto 14px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px}
.ask-a h1{font-size:var(--text-md);font-weight:600;margin:0 0 6px}
.ask-a p{font-size:var(--text-sm);color:var(--color-text-muted);line-height:1.55;margin:0 0 16px}
.item{display:inline-flex;gap:8px;align-items:center;font-size:var(--text-sm);border:1px solid var(--color-border);border-radius:10px;padding:8px 12px;background:var(--color-surface);margin-bottom:16px;text-align:left}
.item .k{font-size:10px;font-family:var(--font-mono);color:var(--color-text-dim);text-transform:uppercase;letter-spacing:.06em}
.stillchip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-size:var(--text-xs);color:var(--color-text-muted);background:var(--color-bg-elev1);border:1px solid var(--color-border);border-radius:999px;padding:6px 8px 6px 12px;box-shadow:var(--shadow-md)}

/* B: modal over the live chat */
.scrim{position:absolute;inset:0;background:hsl(222 47% 5% / .45);display:grid;place-items:center}
.dlg{width:min(420px,92%);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow-lg)}
.dlg h1{font-size:var(--text-base);font-weight:600;margin:0 0 6px;display:flex;gap:10px;align-items:center}
.dlg p{font-size:var(--text-sm);color:var(--color-text-muted);margin:0 0 14px;line-height:1.55}
.dlg .row2{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.sq{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}

/* C: banner above the current view */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid hsl(239 100% 82% / .3);background:hsl(239 60% 50% / .12);font-size:var(--text-sm)}
.banner .t{flex:1;min-width:220px;line-height:1.45}
.banner .t span{color:var(--color-text-muted)}

.gone{display:flex;gap:8px;align-items:center;font-size:var(--text-xs);color:var(--color-text-muted);padding:8px 16px;border-bottom:1px solid var(--color-border-soft);background:var(--color-bg-elev1)}
.flag{position:fixed;right:14px;bottom:14px;max-width:330px;font-size:var(--text-xs);line-height:1.5;color:var(--color-text-muted);background:var(--color-bg-elev1);border:1px solid var(--color-border);border-left:3px solid var(--color-accent-violet);border-radius:8px;padding:10px 12px;z-index:20}
.flag b{color:var(--color-text)}
@media (max-width:820px){.frame{grid-template-columns:58px minmax(0,1fr)}.hist{display:none}}
</style>
</head>
<body>
<div id="vnav"><span class="lbl">VARIANT</span>
  <button class="vtab active" data-v="A">★ A · Prompt replaces the main area</button>
  <button class="vtab" data-v="B">B · Dialog over where you are</button>
  <button class="vtab" data-v="C">C · Banner above where you are</button>
</div>
<div id="states"><span class="lbl">MOMENT</span>
  <button class="stab active" data-s="ask">Link opened (asks)</button>
  <button class="stab" data-s="declined">Stayed in Northwind</button>
  <button class="stab" data-s="switching">Switching…</button>
  <button class="stab" data-s="opened">Switched, run open</button>
  <button class="stab" data-s="rerun">Re-run from that page</button>
</div>
<div id="note"></div>
<div id="truth"></div>
<div id="stage"></div>
<div class="flag"><b>Fixed in every variant (LINK-05):</b> nothing switches without a click. "Stay" leaves the active org <b>and the answering chat</b> exactly as they were. A re-run or fork started after switching saves under the <b>item's</b> org (Acme Legal), and says so on the button.</div>

<script>
const ORGS={nw:{name:"Northwind",ini:"N",col:"hsl(199 70% 42%)"},ac:{name:"Acme Legal",ini:"A",col:"hsl(330 60% 45%)"}};
const ITEM={kind:"Workflow run",title:"Contract review — Q3 supplier batch"};
let V="A",S="ask",active="nw",tokens=0,streamTimer=null;
const ANSWER="The renewal clause in the Halden supply agreement auto-renews for 12 months unless either party gives 90 days' written notice. Compared with the Brightwater contract, which needs only 30 days, Halden is the stricter of the two. Two further points stand out: the price-review window closes on 1 December, and the liability cap was lowered from 2× to 1× annual fees in the 2025 amendment. I'd flag the notice period first, because the deadline for giving notice this cycle falls on ";
const NOTES={
  A:"<b>A — the prompt takes the main area.</b> The link's destination is where you look, so the question sits there. Your chat keeps answering in the background; a chip at the bottom says so and takes you back.",
  B:"<b>B — a dialog over where you were.</b> The chat stays visible behind the scrim and you can watch it keep answering, which shows that nothing has moved yet. Stay closes the dialog; you're exactly where you were.",
  C:"<b>C — a banner above where you are.</b> The lightest touch: you are not taken anywhere until you choose. Risk: a banner is easy to miss, and the link can look like it did nothing."
};
function chip(id){const o=ORGS[id];return `<div class="orgchip" id="orgchip"><div class="sq" style="background:${o.col}">${o.ini}</div>${o.name.split(" ")[0]}</div>`}
function rail(view){return `<nav class="rail"><div class="ic">＋</div><div class="ic ${view==="chat"?"on":""}">💬</div><div class="ic">📚</div><div class="ic ${view==="run"?"on":""}">⛓</div><div class="ic">✦</div><div class="ic">⚙</div><div class="sp"></div>${chip(active)}</nav>`}
function hist(){
  if(active==="nw")return `<aside class="hist"><div class="h">Chats <span>Northwind</span></div><div class="grp">Today</div><div class="row on"><span class="dot"></span>Renewal clause comparison</div><div class="row">Q3 vendor contract summary</div><div class="grp">Yesterday</div><div class="row">Onboarding checklist draft</div><div class="row">Board pack — risk section</div></aside>`;
  return `<aside class="hist"><div class="h">Chats <span>Acme Legal</span></div><div class="grp">Today</div><div class="row">Matter intake — Halvorsen</div><div class="grp">Previous 7 days</div><div class="row">NDA redlines, round 2</div><div class="row">Engagement letter template</div></aside>`;
}
function chatView(){return `<div class="chat"><div class="th"><span class="dot"></span>Renewal clause comparison</div><div class="msg-u">Compare the renewal clauses in the Halden and Brightwater contracts. Which notice period is stricter?</div><div class="strip">⏱ <span id="el">0:14</span> · Step 3 · writing the answer</div><div class="msg-a" id="ans"></div></div><div class="composer">Answering… you can type your next message</div>`}
function runView(rerun){return `<div class="run"><div class="crumb">Workflows › Contract review</div><h1>${ITEM.title}</h1><div class="meta">Run in <b>Acme Legal</b> · started by Priya · 2 of 4 steps done · waiting on you</div>
  <div class="spine"><div class="st"><span class="g">✓</span>Collect the supplier contracts</div><div class="st"><span class="g">✓</span>Extract renewal and liability terms</div><div class="st"><span class="g wait">!</span>Approve the risk summary <span class="saves" style="margin-left:auto">waiting on you</span></div><div class="st" style="color:var(--color-text-dim)"><span class="g" style="background:var(--color-bg-elev1);color:var(--color-text-dim)">4</span>Send the summary to the matter team</div></div>
  <div class="acts"><button class="btn primary">Review and approve</button><button class="btn" id="rerunbtn">Re-run</button><button class="btn">Fork into a new workflow</button><span class="saves">Re-runs and forks save in <b>Acme Legal</b></span></div>
  ${rerun?`<div class="bg" style="border-left:3px solid var(--color-success)">✓ New run started in <b>&nbsp;Acme Legal&nbsp;</b> — the org this workflow belongs to, not the one you were in before.</div>`:""}
  <div class="bg"><span class="dot"></span>Your chat in Northwind is still answering. It'll be there when you switch back. <button class="btn sm" style="margin-left:auto">Switch back</button></div></div>`}
function askBody(){const o=ORGS.ac;return {
  title:`This is in ${o.name}`,
  text:`You're working in Northwind. Switch to ${o.name} to open it? Your chat that's answering now will keep going.`,
  item:`<div class="item"><span class="sq" style="background:${o.col}">${o.ini}</span><span><span class="k">${ITEM.kind}</span><br>${ITEM.title}</span></div>`,
  btns:`<button class="btn" data-go="declined">Stay in Northwind</button><button class="btn primary" data-go="switching">Switch to ${o.name}</button>`}}
function render(){
  document.getElementById("note").innerHTML=NOTES[V];
  const truth={ask:["Northwind","answering","not yet"],declined:["Northwind","answering","no"],switching:["→ Acme Legal","answering (server)","—"],opened:["Acme Legal","answering in Northwind","yes"],rerun:["Acme Legal","answering in Northwind","new run → Acme Legal"]}[S];
  document.getElementById("truth").innerHTML=`<span><b>active org</b> ${truth[0]}</span><span><b>Northwind chat stream</b> <span class="ok">● ${truth[1]}</span> · <span id="tok">${tokens}</span> words</span><span><b>item opened</b> ${truth[2]}</span><span><b>address</b> /app/runs/c41d8e2a-6f39-4b07-8a1c-9e2d5b7f0a63</span>`;
  active=(S==="opened"||S==="rerun")?"ac":"nw";
  let main="";const a=askBody();
  if(S==="opened"||S==="rerun"){main=runView(S==="rerun")}
  else if(S==="switching"){main=`<div class="ask-a"><div class="box"><div class="orgbig" style="background:${ORGS.ac.col}">A</div><p>Switching to Acme Legal…</p></div></div>`}
  else if(S==="declined"){
    main=(V==="A"?"":"")+chatView();
    if(V==="A")main=`<div class="gone">You stayed in Northwind. The link wasn't opened. <button class="btn sm" data-go="ask" style="margin-left:auto">Open it after all</button></div>`+chatView();
  }else{
    if(V==="A")main=`<div class="ask-a"><div class="box"><div class="orgbig" style="background:${ORGS.ac.col}">A</div><h1>${a.title}</h1><p>${a.text}</p>${a.item}<div style="display:flex;gap:8px;justify-content:center">${a.btns}</div></div></div><div class="stillchip"><span class="dot"></span>“Renewal clause comparison” is still answering <button class="btn sm" data-go="declined">Back to it</button></div>`;
    if(V==="B")main=chatView()+`<div class="scrim"><div class="dlg" role="dialog" aria-modal="true"><h1><span class="sq" style="background:${ORGS.ac.col}">A</span>${a.title}</h1><p>${a.text}</p>${a.item}<div class="row2">${a.btns}</div></div></div>`;
    if(V==="C")main=`<div class="banner"><span class="sq" style="background:${ORGS.ac.col}">A</span><div class="t">The link you opened is in <b>Acme Legal</b> — <span>${ITEM.kind.toLowerCase()} “${ITEM.title}”.</span></div><button class="btn sm" data-go="declined">Stay here</button><button class="btn sm primary" data-go="switching">Switch to Acme Legal</button></div>`+chatView();
  }
  const view=(S==="opened"||S==="rerun")?"run":"chat";
  document.getElementById("stage").innerHTML=`<div class="frame">${rail(view)}${hist()}<main>${main}</main></div>`;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setS(b.dataset.go));
  const rb=document.getElementById("rerunbtn");if(rb)rb.onclick=()=>setS("rerun");
  if(S==="opened"){const c=document.getElementById("orgchip");c&&c.classList.add("flash")}
  paint();
}
function setS(s){S=s;document.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("active",x.dataset.s===s));render();if(s==="switching")setTimeout(()=>{if(S==="switching")setS("opened")},1100)}
function paint(){const el=document.getElementById("ans");if(el){const words=ANSWER.split(" ");el.innerHTML=words.slice(0,Math.min(tokens,words.length)).join(" ")+' <span class="dot" style="display:inline-block"></span>'}const t=document.getElementById("tok");if(t)t.textContent=tokens;const e=document.getElementById("el");if(e){const s=14+Math.floor(tokens/3);e.textContent=`0:${String(s).padStart(2,"0")}`}}
setInterval(()=>{tokens=(tokens+1)%(ANSWER.split(" ").length+20);paint()},260);
document.querySelectorAll(".vtab").forEach(b=>b.onclick=()=>{V=b.dataset.v;document.querySelectorAll(".vtab").forEach(x=>x.classList.toggle("active",x===b));setS("ask")});
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>setS(b.dataset.s));
render();
</script>
</body>
</html>
