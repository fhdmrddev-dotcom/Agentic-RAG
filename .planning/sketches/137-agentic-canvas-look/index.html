<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 137 — How the canvas should LOOK (Phase 183)</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
  .variant-nav, .lead, .bar { flex-shrink: 0; }

  .lead {
    padding: var(--space-3) var(--space-6); font-size: var(--text-sm); color: var(--color-text-muted);
    line-height: 1.6; border-bottom: 1px solid var(--color-border); background: var(--color-bg-elev1);
  }
  .lead b { color: var(--color-text); }

  /* ─────────── control bar ─────────── */
  .bar {
    display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
    padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--color-border);
  }
  .bar .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-dim); text-transform: uppercase; letter-spacing: .09em; }
  .seg { display: inline-flex; background: var(--color-muted); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 3px; }
  .seg button {
    border: 0; background: transparent; color: var(--color-text-dim); font-family: var(--font-sans);
    font-size: var(--text-xs); padding: 5px 13px; border-radius: 999px; cursor: pointer;
    transition: all var(--dur-base) var(--ease-out);
  }
  .seg button:hover { color: var(--color-text); }
  .seg button.on { background: var(--color-surface-hi); color: var(--color-text); box-shadow: var(--shadow-sm); }
  .seg.energy button.on { background: linear-gradient(135deg, hsl(239 84% 67% / .9), hsl(258 90% 66% / .9)); color: #fff; box-shadow: 0 0 16px hsl(239 100% 82% / .35); }
  .spacer { flex: 1; }

  /* ─────────── the stage ─────────── */
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .plane { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
  .plane.panning { cursor: grabbing; }
  .flow {
    position: absolute; left: 0; top: 0; transform-origin: 0 0;
    display: flex; align-items: center; gap: 0;
  }

  /* ─────────── shared node atoms ─────────── */
  .node { position: relative; flex-shrink: 0; cursor: pointer; transition: all var(--dur-slow) var(--ease-out); }
  .node .icowrap { position: relative; flex-shrink: 0; display: grid; place-items: center; }
  .ico3d { display: block; position: relative; z-index: 2; filter: drop-shadow(0 4px 8px rgba(0,0,0,.55)); }
  .halo {
    position: absolute; inset: -6px; border-radius: 50%; z-index: 1;
    background: radial-gradient(circle, hsl(239 100% 82% / .28), transparent 68%);
    opacity: 0; transition: opacity var(--dur-slow) var(--ease-out);
  }
  .node.active .halo { opacity: 1; }
  body.alive .node.active .halo { animation: haloPulse 2.1s ease-in-out infinite; }
  @keyframes haloPulse { 0%,100% { transform: scale(1); opacity: .75 } 50% { transform: scale(1.13); opacity: 1 } }

  .ttl { font-family: var(--font-headline); font-weight: 600; letter-spacing: -0.01em; color: var(--color-text); }
  .sub { color: var(--color-text-muted); }
  .techline { display: none; font-family: var(--font-mono); font-size: 10px; color: var(--color-text-dim); margin-top: 5px; }
  body.tech .techline { display: block; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; border-radius: 999px;
    padding: 2px 9px; font-size: 10.5px; font-weight: 500; white-space: nowrap;
  }
  .badge.cited { color: hsl(142 71% 62%); background: hsl(142 71% 45% / .14); border: 1px solid hsl(142 71% 45% / .3); }
  .badge.file  { color: hsl(258 90% 78%); background: hsl(258 90% 66% / .14); border: 1px solid hsl(258 90% 66% / .32); }
  .badge.you   { color: hsl(38 92% 68%);  background: hsl(38 92% 60% / .14);  border: 1px solid hsl(38 92% 60% / .32); }
  .badge.soon  { color: var(--color-text-dim); background: transparent; border: 1px dashed var(--color-border); }

  /* ─────────── connector ─────────── */
  .conn { position: relative; flex-shrink: 0; display: grid; place-items: center; }
  .conn .line { position: relative; height: 2px; width: 100%; border-radius: 2px; overflow: hidden; background: var(--color-border); }
  .conn .line::after {
    content: ''; position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(90deg, transparent 0%, hsl(239 100% 82% / .95) 45%, hsl(190 95% 68% / .95) 55%, transparent 100%);
    background-size: 240% 100%; transition: opacity var(--dur-slow) var(--ease-out);
  }
  body.alive .conn.flowing .line::after { opacity: 1; animation: comet 1.5s linear infinite; }
  @keyframes comet { 0% { background-position: 220% 0 } 100% { background-position: -120% 0 } }
  .conn .tip {
    position: absolute; right: -1px; width: 0; height: 0;
    border-left: 6px solid var(--color-border); border-top: 4px solid transparent; border-bottom: 4px solid transparent;
  }

  /* ═══════════════ A — ENERGY FLOW ═══════════════ */
  .va .node {
    display: flex; align-items: center; gap: 14px; width: 268px; padding: 15px 17px;
    border-radius: 18px; background: linear-gradient(150deg, hsl(220 30% 10%), hsl(220 32% 7%));
    border: 1px solid hsl(220 20% 20%);
    box-shadow: 0 1px 0 hsl(220 20% 26%) inset, 0 14px 30px -14px rgba(0,0,0,.9);
  }
  .va .node:hover { transform: translateY(-3px); border-color: hsl(239 100% 82% / .4); box-shadow: 0 1px 0 hsl(220 20% 30%) inset, 0 22px 42px -16px rgba(0,0,0,.95), 0 0 30px -8px hsl(239 100% 82% / .3); }
  .va .node.active { border-color: hsl(239 100% 82% / .55); box-shadow: 0 1px 0 hsl(220 20% 32%) inset, 0 22px 44px -16px rgba(0,0,0,.95), 0 0 42px -6px hsl(239 100% 82% / .38); }
  .va .icowrap { width: 54px; height: 54px; border-radius: 16px;
    background: linear-gradient(150deg, hsl(220 22% 26%), hsl(220 26% 16%));
    border: 1px solid hsl(220 20% 32%); box-shadow: 0 1px 0 hsl(220 20% 42%) inset, 0 6px 14px -6px rgba(0,0,0,.8); }
  .va .body { min-width: 0; flex: 1; }
  .va .ttl { font-size: 14.5px; line-height: 1.3; }
  .va .sub { font-size: 11.5px; margin-top: 3px; line-height: 1.45; }
  .va .badges { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .va .conn { width: 78px; }
  .va .conn .line { width: 66px; }

  /* ═══════════════ B — GLASS DEPTH ═══════════════ */
  .vb .node {
    width: 244px; padding: 34px 20px 20px; border-radius: 22px; text-align: center;
    background: linear-gradient(160deg, hsl(220 30% 100% / .07), hsl(220 30% 100% / .02));
    backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid hsl(220 30% 100% / .11);
    box-shadow: 0 1px 0 hsl(220 30% 100% / .13) inset, 0 26px 50px -22px rgba(0,0,0,.95);
    margin-top: 26px;
  }
  .vb .node:hover { transform: translateY(-5px); border-color: hsl(220 30% 100% / .2); box-shadow: 0 1px 0 hsl(220 30% 100% / .2) inset, 0 36px 64px -22px rgba(0,0,0,1); }
  .vb .node.active { border-color: hsl(239 100% 82% / .45); box-shadow: 0 1px 0 hsl(220 30% 100% / .2) inset, 0 36px 64px -22px rgba(0,0,0,1), 0 0 48px -10px hsl(239 100% 82% / .4); }
  /* the icon literally floats ABOVE the panel, with its own contact shadow */
  .vb .icowrap { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); width: 62px; height: 62px; }
  .vb .icowrap .ico3d { filter: drop-shadow(0 10px 14px rgba(0,0,0,.75)); }
  .vb .icowrap::before {
    content: ''; position: absolute; inset: -4px; border-radius: 50%; z-index: 0;
    background: radial-gradient(circle, hsl(220 30% 100% / .16), transparent 66%);
  }
  .vb .icowrap::after {
    content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    width: 42px; height: 9px; border-radius: 50%; background: rgba(0,0,0,.55); filter: blur(5px); z-index: 0;
  }
  .vb .ttl { font-size: 15px; line-height: 1.3; }
  .vb .sub { font-size: 11.5px; margin-top: 6px; line-height: 1.5; }
  .vb .badges { display: flex; gap: 5px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  .vb .conn { width: 66px; }
  .vb .conn .line { width: 54px; }
  .vb .flowbg { position: absolute; inset: 0; pointer-events: none; }

  /* ═══════════════ C — SOFT BLOCKS ═══════════════ */
  .vc .node {
    display: flex; align-items: center; gap: 15px; width: 276px; padding: 18px;
    border-radius: 20px; border: 1px solid transparent;
    box-shadow: 0 12px 26px -14px rgba(0,0,0,.85);
  }
  .vc .node[data-type="llm_agent"]        { background: linear-gradient(150deg, hsl(239 60% 24% / .55), hsl(239 40% 14% / .5)); border-color: hsl(239 70% 60% / .28); }
  .vc .node[data-type="llm_emit"]         { background: linear-gradient(150deg, hsl(258 60% 26% / .55), hsl(258 40% 15% / .5)); border-color: hsl(258 70% 62% / .3); }
  .vc .node[data-type="programmatic"]     { background: linear-gradient(150deg, hsl(200 45% 22% / .5),  hsl(200 35% 13% / .5)); border-color: hsl(200 60% 55% / .26); }
  .vc .node[data-type="llm_batch_agents"] { background: linear-gradient(150deg, hsl(170 45% 20% / .5),  hsl(170 35% 12% / .5)); border-color: hsl(170 60% 50% / .26); }
  .vc .node[data-type="llm_human_input"]  { background: linear-gradient(150deg, hsl(38 60% 25% / .5),   hsl(38 45% 14% / .5));  border-color: hsl(38 80% 58% / .3); }
  .vc .node[data-type="llm_single"]       { background: linear-gradient(150deg, hsl(220 25% 18% / .8),  hsl(220 25% 11% / .8)); border-color: hsl(220 20% 30% / .5); }
  .vc .node[data-type="connector"]        { background: linear-gradient(150deg, hsl(220 20% 14% / .6),  hsl(220 20% 9% / .6));  border-color: hsl(220 20% 24% / .6); border-style: dashed; }
  .vc .node:hover { transform: translateY(-3px) scale(1.015); box-shadow: 0 20px 38px -16px rgba(0,0,0,.95); }
  .vc .node.active { box-shadow: 0 20px 38px -16px rgba(0,0,0,.95), 0 0 40px -8px hsl(239 100% 82% / .35); }
  .vc .icowrap { width: 56px; height: 56px; border-radius: 50%; background: hsl(220 30% 100% / .15); border: 1px solid hsl(220 30% 100% / .18); }
  .vc .body { min-width: 0; flex: 1; }
  .vc .ttl { font-size: 15px; line-height: 1.3; }
  .vc .sub { font-size: 12px; margin-top: 4px; line-height: 1.45; color: hsl(226 30% 84% / .72); }
  .vc .badges { display: flex; gap: 5px; margin-top: 9px; flex-wrap: wrap; }
  .vc .conn { width: 62px; }
  .vc .conn .line { width: 50px; }

  /* ═════ D — SYNTHESIS (B's depth, C's warmth, left-aligned) ═════ */
  .vd .node {
    display: flex; align-items: center; gap: 16px; width: 300px; padding: 17px 18px 17px 46px;
    margin-left: 30px; border-radius: 20px;
    background: linear-gradient(160deg, hsl(220 30% 100% / .075), hsl(220 30% 100% / .022));
    backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid hsl(220 30% 100% / .11);
    box-shadow: 0 1px 0 hsl(220 30% 100% / .13) inset, 0 24px 48px -22px rgba(0,0,0,.95);
  }
  .vd .node:hover { transform: translateY(-4px); border-color: hsl(220 30% 100% / .19);
                    box-shadow: 0 1px 0 hsl(220 30% 100% / .2) inset, 0 34px 60px -22px rgba(0,0,0,1); }
  /* the icon overhangs the left edge and floats, with its own contact shadow (B's signature move) */
  .vd .icowrap { position: absolute; left: -30px; top: 50%; transform: translateY(-50%); width: 62px; height: 62px; }
  .vd .icowrap .ico3d { filter: drop-shadow(0 9px 13px rgba(0,0,0,.8)); }
  .vd .icowrap::after {
    content: ''; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 8px; border-radius: 50%; background: rgba(0,0,0,.6); filter: blur(5px); z-index: 0;
  }
  /* per-type colour is a TINT behind the icon only — never a tile wash, so run status keeps the colour budget */
  .vd .icowrap::before {
    content: ''; position: absolute; inset: -5px; border-radius: 50%; z-index: 0;
    background: radial-gradient(circle, var(--tint, hsl(220 30% 100% / .18)), transparent 68%);
  }
  .vd .node[data-type="llm_agent"]        { --tint: hsl(239 90% 70% / .40); }
  .vd .node[data-type="llm_emit"]         { --tint: hsl(258 90% 70% / .40); }
  .vd .node[data-type="programmatic"]     { --tint: hsl(200 85% 62% / .36); }
  .vd .node[data-type="llm_batch_agents"] { --tint: hsl(170 80% 55% / .34); }
  .vd .node[data-type="llm_human_input"]  { --tint: hsl(38 92% 62% / .38); }
  .vd .node[data-type="llm_single"]       { --tint: hsl(220 30% 100% / .22); }
  .vd .node[data-type="connector"]        { --tint: hsl(220 20% 70% / .22); }
  .vd .body { min-width: 0; flex: 1; }
  .vd .ttl { font-size: 15px; line-height: 1.3; }
  .vd .sub { font-size: 11.5px; margin-top: 4px; line-height: 1.5; }
  .vd .badges { display: flex; gap: 5px; margin-top: 9px; flex-wrap: wrap; }
  .vd .conn { width: 96px; }
  .vd .conn .line { width: 62px; }
  .vd .stepn { left: auto; right: 10px; top: 10px; }

  /* ═════ run status — a layer OVER any variant, to test the colour budget ═════ */
  .node[data-run="done"]    { border-color: hsl(142 71% 45% / .5) !important; }
  .node[data-run="running"] { border-color: hsl(239 100% 82% / .6) !important;
                              box-shadow: 0 0 44px -8px hsl(239 100% 82% / .45), 0 24px 48px -22px rgba(0,0,0,.95) !important; }
  .node[data-run="needs"]   { border-color: hsl(38 92% 60% / .65) !important;
                              box-shadow: 0 0 42px -10px hsl(38 92% 60% / .4), 0 24px 48px -22px rgba(0,0,0,.95) !important; }
  .node[data-run="failed"]  { border-color: hsl(0 72% 55% / .65) !important;
                              box-shadow: 0 0 42px -10px hsl(0 72% 51% / .4), 0 24px 48px -22px rgba(0,0,0,.95) !important; }
  .node[data-run="idle"]    { opacity: .46; }
  .runchip {
    display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px;
    font-size: 10.5px; font-weight: 600; margin-top: 8px;
  }
  .runchip.done    { color: hsl(142 71% 62%); background: hsl(142 71% 45% / .16); border: 1px solid hsl(142 71% 45% / .35); }
  .runchip.running { color: hsl(239 100% 86%); background: hsl(239 100% 82% / .16); border: 1px solid hsl(239 100% 82% / .4); }
  .runchip.needs   { color: hsl(38 92% 68%);  background: hsl(38 92% 60% / .16);  border: 1px solid hsl(38 92% 60% / .4); }
  .runchip.failed  { color: hsl(0 85% 72%);   background: hsl(0 72% 51% / .16);   border: 1px solid hsl(0 72% 51% / .45); }
  .runchip.idle    { color: var(--color-text-dim); background: transparent; border: 1px dashed var(--color-border); }

  /* step counter — the only "technical" thing kept, and it is a plain number */
  .stepn {
    position: absolute; top: -9px; left: -9px; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; font-family: var(--font-mono); font-size: 10px;
    background: var(--color-bg-elev1); border: 1px solid var(--color-border); color: var(--color-text-dim); z-index: 3;
  }
  .vb .stepn { top: 12px; left: 12px; }

  .endpin {
    display: flex; align-items: center; gap: 7px; margin-left: 14px; flex-shrink: 0;
    font-size: 11px; color: var(--color-text-dim); font-family: var(--font-mono);
  }
  .endpin .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--color-text-dim); }

  /* read-only footer */
  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; align-items: center; gap: 10px;
    padding: 7px 250px 7px var(--space-5); font-size: var(--text-xs); color: var(--color-text-muted);
    background: hsl(220 40% 5% / .9); backdrop-filter: blur(12px); border-top: 1px solid var(--color-border);
  }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px;
          font-size: 11px; border: 1px solid var(--color-border); background: var(--color-muted); color: var(--color-text-muted); }

  .zoom {
    position: absolute; left: 14px; bottom: 48px; z-index: 20; display: flex; gap: 2px; padding: 3px;
    background: hsl(220 30% 8% / .9); backdrop-filter: blur(10px); border: 1px solid var(--color-border);
    border-radius: 12px; box-shadow: var(--shadow-md); opacity: .25; transition: opacity var(--dur-base) var(--ease-out);
  }
  .stage:hover .zoom { opacity: 1; }
  .zoom button { width: 26px; height: 26px; border: 0; border-radius: 7px; background: transparent;
                 color: var(--color-text-muted); cursor: pointer; font-family: var(--font-mono); }
  .zoom button:hover { background: var(--color-accent); color: var(--color-text); }

  .toast {
    position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%) translateY(10px);
    background: var(--color-surface-hi); border: 1px solid var(--color-border); color: var(--color-text);
    padding: 9px 15px; border-radius: 12px; font-size: var(--text-sm); box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none; transition: all var(--dur-base) var(--ease-out); z-index: 9998; max-width: 70ch;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ambient backdrop — gives every variant a sense of depth without adding clutter */
  .amb { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .amb::before, .amb::after {
    content: ''; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5;
  }
  .amb::before { width: 520px; height: 520px; left: 8%; top: -12%; background: hsl(239 84% 45% / .22); }
  .amb::after  { width: 460px; height: 460px; right: 6%; bottom: -16%; background: hsl(258 90% 50% / .16); }
  /* Alive = the surface breathes even with nothing selected. Calm = completely still. */
  body.alive .amb::before { animation: drift1 19s ease-in-out infinite; }
  body.alive .amb::after  { animation: drift2 23s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); opacity: .5 }
                      50%     { transform: translate(70px,44px) scale(1.14); opacity: .78 } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); opacity: .42 }
                      50%     { transform: translate(-58px,-38px) scale(1.11); opacity: .68 } }

  /* the running step breathes on its own - no click needed */
  .node[data-run="running"] .halo { opacity: 1; }
  body.alive .node[data-run="running"] .halo { animation: haloPulse 2.1s ease-in-out infinite; }
  body.alive .node[data-run="running"] { animation: cardBreathe 2.6s ease-in-out infinite; }
  @keyframes cardBreathe { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
  body.alive .runchip.running::before { content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; animation: haloPulse 1.3s ease-in-out infinite; }

  /* a still surface must look deliberately still, not broken */
  body:not(.alive) .conn .line::after { animation: none !important; opacity: 0 !important; }
</style>
</head>
<body class="alive">

<nav class="variant-nav">
  <span class="label">Sketch 137</span>
  <button class="variant-tab active" data-v="a" type="button">A: Energy Flow</button>
  <button class="variant-tab" data-v="b" type="button">B: Glass Depth</button>
  <button class="variant-tab" data-v="c" type="button">C: Soft Blocks</button>
  <button class="variant-tab" data-v="d" type="button">D: Synthesis — B’s depth + C’s warmth</button>
</nav>

<p class="lead" id="lead"></p>

<div class="bar">
  <span class="lbl">Workflow</span>
  <div class="seg" id="defseg"></div>
  <div class="spacer"></div>
  <span class="lbl">Motion</span>
  <div class="seg energy" id="feelseg">
    <button type="button" data-feel="calm">Calm — still</button>
    <button type="button" data-feel="alive" class="on">Alive — breathing</button>
  </div>
  <span class="lbl">Live status</span>
  <div class="seg" id="runseg">
    <button type="button" data-run="off" class="on">Off</button>
    <button type="button" data-run="running">Mid-run</button>
    <button type="button" data-run="needs">Needs you</button>
    <button type="button" data-run="failed">Failed</button>
  </div>
  <span class="lbl">Agent icon</span>
  <div class="seg" id="agentseg">
    <button type="button" data-agent="llm_agent_compass" class="on">🧭 Compass</button>
    <button type="button" data-agent="llm_agent_satellite">📡 Dish</button>
    <button type="button" data-agent="llm_agent_brain">🧠 Brain</button>
    <button type="button" data-agent="llm_agent">🤖 Robot</button>
  </div>
  <span class="lbl">Team icon</span>
  <div class="seg" id="iconseg">
    <button type="button" data-icon="llm_batch_agents" class="on">Today</button>
    <button type="button" data-icon="llm_batch_agents_alt">Brighter</button>
  </div>
  <div class="seg" id="techseg">
    <button type="button" data-tech="off" class="on">Plain language</button>
    <button type="button" data-tech="on">⌥ Technical names</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="amb"></div>
  <div class="plane" id="plane"><div class="flow" id="flow"></div></div>
  <div class="zoom">
    <button type="button" data-z="in">＋</button>
    <button type="button" data-z="out">－</button>
    <button type="button" data-z="fit">⤢</button>
  </div>
  <div class="foot">
    <span class="pill">👁 View only</span>
    <span id="foottext">You can look around freely — the shape is fixed because this workflow is published.</span>
    <div class="spacer"></div>
    <span class="pill" id="footmeta"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="sketch-toolbar">
  <span>137</span>
  <select id="theme-switcher"><option value="default">Deep Midnight</option></select>
  <button type="button" data-vw="390">▮</button>
  <button type="button" data-vw="768">▭</button>
  <button type="button" data-vw="0">▬</button>
</div>

<script src="../themes/phase-icons-3d.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   Real workflows, read live from the local Supabase (2026-07-25).
   `plain` is the business-language title a non-technical user reads;
   `tech` is the real slug + phase_type, revealed by the ⌥ toggle.
   The `connectors` set is a FORWARD PREVIEW (Phases 189/190) — ghosted,
   labelled, and drawn with the same verified 3D icon set.
   ══════════════════════════════════════════════════════════════════════════ */
var WF = {
  'risk-register': {
    label: 'Risk Register', meta: 'published · 2 steps · the most common shape',
    steps: [
      { icon: 'llm_agent', type: 'llm_agent', slug: 'retrieve',
        plain: 'Search the knowledge base', sub: 'Finds every risk it can support with a source',
        badges: [['cited', '⛨ Must cite its sources']] },
      { icon: 'llm_emit', type: 'llm_emit', slug: 'emit',
        plain: 'Produce the risk register', sub: 'Fills your Word template, one row per risk',
        badges: [['cited', '⛨ Every cell cited'], ['file', '▤ risk-register.docx']] }
    ]
  },
  'eval_coverage': {
    label: 'Full 5-step flow', meta: 'published · 5 steps · the deepest workflow in the system',
    steps: [
      { icon: 'programmatic', type: 'programmatic', slug: 'split',
        plain: 'Break up the request', sub: 'Splits the topic into parts to work through' },
      { icon: 'llm_batch_agents', type: 'llm_batch_agents', slug: 'fanout',
        plain: 'Work on the parts together', sub: 'Five assistants review in parallel' },
      { icon: 'llm_agent', type: 'llm_agent', slug: 'deep_dive',
        plain: 'Dig deeper', sub: 'Searches the knowledge base and the web' },
      { icon: 'llm_human_input', type: 'llm_human_input', slug: 'confirm',
        plain: 'Check with you', sub: 'Pauses here until you answer',
        badges: [['you', '✋ Waits for you']] },
      { icon: 'llm_single', type: 'llm_single', slug: 'summarize',
        plain: 'Write it up', sub: 'Brings everything into one answer' }
    ]
  },
  'connectors': {
    label: 'With connectors', meta: 'preview · what Phases 189–190 add to this same canvas',
    steps: [
      { icon: 'llm_agent', type: 'llm_agent', slug: 'gather',
        plain: 'Search the knowledge base', sub: 'Finds every compliance gap, with sources',
        badges: [['cited', '⛨ Must cite its sources']] },
      { icon: 'llm_emit', type: 'llm_emit', slug: 'emit',
        plain: 'Produce the gap report', sub: 'Fills your Word template',
        badges: [['cited', '⛨ Every cell cited'], ['file', '▤ gap-report.docx']] },
      { icon: 'connector_email', type: 'connector', slug: 'send-email', soon: true,
        plain: 'Email the report', sub: 'Sends it to your distribution list',
        badges: [['soon', '⌁ Coming in a later phase']] },
      { icon: 'connector_ticket', type: 'connector', slug: 'create-ticket', soon: true,
        plain: 'Raise a ticket per gap', sub: 'Asks you before it creates anything',
        badges: [['you', '✋ Asks you first'], ['soon', '⌁ Coming in a later phase']] }
    ]
  }
};
var ORDER = ['risk-register', 'eval_coverage', 'connectors'];

var LEAD = {
  a: '<b>A — Energy Flow.</b> Deep, lit panels on a living connector. The 3D icon sits in a recessed well; ' +
     'the line between steps carries a soft light that only travels when something is running. ' +
     'This is the energy language already shipped in the publish gauntlet and the live step-flow (Phase 127), extended onto the canvas.',
  b: '<b>B — Glass Depth.</b> Frosted translucent panels with real elevation, and the 3D icon <i>floating above</i> the card with its own ' +
     'contact shadow — depth you can actually see, not a drawn effect. The quietest of the three: one title, one line, everything else on demand.',
  d: '<b>D \u2014 Synthesis.</b> B\u2019s floating 3D icon and frosted depth, on C\u2019s left-aligned layout so a chain of steps scans quickly. ' +
     'The decisive change: per-step-type colour is reduced to a <i>tint behind the icon</i> rather than a whole coloured tile \u2014 which keeps the ' +
     'strong colours free for <b>run status</b>. Turn <b>Live status</b> on and compare D against C: in C the step-type colour and the ' +
     'running / failed colour fight each other; in D they do not.',
  c: '<b>C — Soft Blocks.</b> Big friendly tiles, each kind of step with its own gentle colour. The most approachable and the least technical-feeling — ' +
     'colour does the sorting so the words don\'t have to. Warmest, but it spends the most colour, which leaves less room for status colour later.'
};

var variant = 'a', current = 'risk-register', teamIcon = 'llm_batch_agents',
    agentIcon = 'llm_agent_compass', runMode = 'off';

/* A realistic mid-run snapshot: everything before the focus step is done, the focus
   step carries the live state, everything after is idle. Mirrors the honest node-state
   model in research Pitfall 4 - a node is only `done` on a real phase_completed, and
   `idle` is never inferred to be success. */
function runStateFor(i, total) {
  if (runMode === 'off') return null;
  var focus = Math.min(runMode === 'running' ? 1 : runMode === 'needs' ? 3 : 2, total - 1);
  if (i < focus) return 'done';
  if (i > focus) return 'idle';
  return runMode === 'running' ? 'running' : runMode === 'needs' ? 'needs' : 'failed';
}
var RUN_LABEL = { done: '\u2713 Done', running: '\u25cf Working on this now',
                  needs: '\u270b Waiting for you', failed: '\u2715 Stopped here', idle: 'Not started' };
var x = 0, y = 0, k = 1, activeIdx = -1;
var flow = document.getElementById('flow'), plane = document.getElementById('plane'), stage = document.getElementById('stage');

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function render() {
  var wf = WF[current];
  var html = '';
  wf.steps.forEach(function (s, i) {
    if (i > 0) {
      html += '<div class="conn" data-conn="' + i + '"><div class="line"></div></div>';
    }
    var badges = (s.badges || []).map(function (b) {
      return '<span class="badge ' + b[0] + '">' + esc(b[1]) + '</span>';
    }).join('');
    var iconSize = (variant === 'b' || variant === 'd') ? 52 : 34;
    // `busts-in-silhouette` measures avg-luma 34.5 vs 135-185 for the other five
    // marks, so it is the one glyph that can disappear on Deep Midnight.
    var iconKey = s.icon === 'llm_batch_agents' ? teamIcon
                : s.icon === 'llm_agent' ? agentIcon : s.icon;
    var rs = runStateFor(i, wf.steps.length);
    var runChip = rs ? '<div><span class="runchip ' + rs + '">' + RUN_LABEL[rs] + '</span></div>' : '';
    html +=
      '<div class="node' + (s.soon ? ' soon' : '') + '" data-i="' + i + '" data-type="' + s.type + '"' +
        (rs ? ' data-run="' + rs + '"' : '') +
        (s.soon ? ' style="opacity:.62"' : '') + '>' +
        '<span class="stepn">' + (i + 1) + '</span>' +
        '<div class="icowrap"><span class="halo"></span>' + icon3d(iconKey, iconSize) + '</div>' +
        '<div class="body">' +
          '<div class="ttl">' + esc(s.plain) + '</div>' +
          '<div class="sub">' + esc(s.sub) + '</div>' +
          '<div class="techline">' + esc(s.slug) + ' · ' + esc(s.type) + '</div>' +
          (badges ? '<div class="badges">' + badges + '</div>' : '') + runChip +
        '</div>' +
      '</div>';
  });
  html += '<div class="endpin"><span class="dot"></span> done</div>';
  flow.innerHTML = html;
  flow.className = 'flow v' + variant;

  flow.querySelectorAll('.node').forEach(function (n) {
    n.addEventListener('click', function () {
      var i = +n.getAttribute('data-i');
      setActive(activeIdx === i ? -1 : i);
      var s = WF[current].steps[i];
      toast(s.soon
        ? 'Connectors arrive in a later phase — shown here so the look is designed for them now, using the same verified 3D icon set.'
        : 'Step ' + (i + 1) + ' — “' + s.plain + '”.  Behind the scenes this is the phase “' + s.slug + '”, which is also its id on the canvas.');
    });
  });

  document.getElementById('footmeta').textContent = wf.meta;
  // With a run snapshot on screen the RUNNING step carries the motion by itself.
  // Otherwise keep a step selected so the Motion toggle always has something to show
  // (the earlier build could land on "nothing selected", which made Calm and Alive
  // look identical - reported by the operator, 2026-07-25).
  var want = activeIdx;
  if (runMode === 'off' && (want < 0 || want >= wf.steps.length)) want = Math.min(1, wf.steps.length - 1);
  if (runMode !== 'off') want = -1;
  setActive(want);
  fit();
}

function setActive(i) {
  activeIdx = i;
  // In a run snapshot the flowing edge follows the RUNNING step, not the selection.
  var runningIdx = -1;
  flow.querySelectorAll('.node').forEach(function (n) {
    if (n.getAttribute('data-run') === 'running') runningIdx = +n.getAttribute('data-i');
  });
  var lit = runningIdx >= 0 ? runningIdx : i;
  flow.querySelectorAll('.node').forEach(function (n) { n.classList.toggle('active', +n.getAttribute('data-i') === i); });
  flow.querySelectorAll('.conn').forEach(function (c) { c.classList.toggle('flowing', +c.getAttribute('data-conn') === lit); });
  document.getElementById('foottext').textContent =
    runningIdx >= 0 ? 'Step ' + (runningIdx + 1) + ' is running — switch Motion to Calm to hold it still.'
    : i < 0 ? 'You can look around freely — the shape is fixed because this workflow is published.'
    : 'Step ' + (i + 1) + ' of ' + WF[current].steps.length + ' selected — switch Motion to Calm to hold it still.';
}

/* ── pan / zoom ── */
function apply() { flow.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + k + ')'; }
function fit() {
  var r = plane.getBoundingClientRect();
  var w = flow.scrollWidth, h = flow.scrollHeight;
  if (!w || !h) return;
  k = Math.max(0.32, Math.min(1.3, Math.min((r.width - 120) / w, (r.height - 150) / h)));
  x = (r.width - w * k) / 2;
  y = (r.height - h * k) / 2 - 10;
  apply();
}
var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
plane.addEventListener('pointerdown', function (e) {
  if (e.target.closest('.node')) return;
  dragging = true; sx = e.clientX; sy = e.clientY; ox = x; oy = y;
  plane.classList.add('panning'); plane.setPointerCapture(e.pointerId);
});
plane.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  x = ox + (e.clientX - sx); y = oy + (e.clientY - sy); apply();
});
function endPan(e) {
  if (!dragging) return;
  dragging = false; plane.classList.remove('panning');
  try { plane.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
}
plane.addEventListener('pointerup', endPan);
plane.addEventListener('pointercancel', endPan);
plane.addEventListener('wheel', function (e) {
  e.preventDefault();
  var r = plane.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  var nk = Math.max(0.3, Math.min(1.8, k * (e.deltaY < 0 ? 1.1 : 1 / 1.1))), f = nk / k;
  x = mx - (mx - x) * f; y = my - (my - y) * f; k = nk; apply();
}, { passive: false });
document.querySelectorAll('[data-z]').forEach(function (b) {
  b.addEventListener('click', function () {
    var m = b.getAttribute('data-z');
    if (m === 'fit') return fit();
    var r = plane.getBoundingClientRect(), cx = r.width / 2, cy = r.height / 2;
    var nk = Math.max(0.3, Math.min(1.8, k * (m === 'in' ? 1.18 : 1 / 1.18))), f = nk / k;
    x = cx - (cx - x) * f; y = cy - (cy - y) * f; k = nk; apply();
  });
});

/* ── controls ── */
var defseg = document.getElementById('defseg');
ORDER.forEach(function (key, i) {
  var b = document.createElement('button');
  b.type = 'button'; b.textContent = WF[key].label;
  if (i === 0) b.className = 'on';
  b.addEventListener('click', function () {
    defseg.querySelectorAll('button').forEach(function (o) { o.classList.remove('on'); });
    b.classList.add('on'); current = key; activeIdx = -1; render();
  });
  defseg.appendChild(b);
});

document.querySelectorAll('#feelseg button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('#feelseg button').forEach(function (o) { o.classList.remove('on'); });
    b.classList.add('on');
    var on = b.getAttribute('data-feel') === 'alive';
    document.body.classList.toggle('alive', on);
    toast(on
      ? 'Alive - the backdrop drifts, the working step breathes, and light travels the line into it.'
      : 'Calm - everything holds completely still. Same layout, no motion.');
  });
});
document.querySelectorAll('#runseg button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('#runseg button').forEach(function (o) { o.classList.remove('on'); });
    b.classList.add('on');
    runMode = b.getAttribute('data-run');
    activeIdx = -1;
    render();
    if (runMode !== 'off') toast('A run snapshot painted onto the same nodes. Compare C and D: in C the step-type colour competes with the status colour; in D the strong colours were kept free.');
  });
});
var AGENT_NOTES = {
  'llm_agent_compass': 'compass \u2014 luminance 157.4. An agent works out HOW to get there rather than following a fixed script; that is exactly what separates it from a plain write step. An object, like gear / memo / package.',
  'llm_agent_satellite': 'satellite-antenna \u2014 luminance 176.4. Reaching out and gathering. The brightest of the four and the most abstract.',
  'llm_agent_brain': 'brain \u2014 luminance 169.2. Reads as thinking, but it is the second-most common AI icon after the robot.',
  'llm_agent': 'robot \u2014 luminance 134.9. The mark PHASE_GLYPHS uses today.'
};
document.querySelectorAll('#agentseg button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('#agentseg button').forEach(function (o) { o.classList.remove('on'); });
    b.classList.add('on');
    agentIcon = b.getAttribute('data-agent');
    render();
    toast(AGENT_NOTES[agentIcon]);
  });
});
document.querySelectorAll('#iconseg button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('#iconseg button').forEach(function (o) { o.classList.remove('on'); });
    b.classList.add('on');
    teamIcon = b.getAttribute('data-icon');
    render();
    toast(teamIcon === 'llm_batch_agents'
      ? 'fluent-emoji:busts-in-silhouette - the mark PHASE_GLYPHS uses today. Average luminance 34.5 against 135-185 for the other five.'
      : 'fluent-emoji:handshake - luminance 182.6. NOTE: PHASE_GLYPHS is shared, so changing it also changes the workflows-page card, the run + publish soul headers, the gauntlet stages and the live step cards.');
  });
});
document.querySelectorAll('#techseg button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('#techseg button').forEach(function (o) { o.classList.remove('on'); });
    b.classList.add('on');
    document.body.classList.toggle('tech', b.getAttribute('data-tech') === 'on');
    fit();
  });
});
document.querySelectorAll('.variant-tab').forEach(function (t) {
  t.addEventListener('click', function () {
    document.querySelectorAll('.variant-tab').forEach(function (o) { o.classList.remove('active'); });
    t.classList.add('active');
    variant = t.getAttribute('data-v');
    document.getElementById('lead').innerHTML = LEAD[variant];
    render();
  });
});

var toastEl = document.getElementById('toast'), toastT = null;
function toast(m) {
  toastEl.textContent = m; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('show'); }, 3600);
}

document.getElementById('theme-switcher').addEventListener('change', function () {
  document.querySelector('link[href*=themes]').href = '../themes/' + this.value + '.css';
});
document.querySelectorAll('[data-vw]').forEach(function (b) {
  b.addEventListener('click', function () {
    var w = b.getAttribute('data-vw');
    stage.style.maxWidth = w === '0' ? '' : w + 'px';
    stage.style.margin = w === '0' ? '' : '0 auto';
    setTimeout(fit, 40);
  });
});
window.addEventListener('resize', fit);

document.getElementById('lead').innerHTML = LEAD.a;
render();
/* render() now guarantees something is always demonstrating the Motion toggle. */
</script>
</body>
</html>
