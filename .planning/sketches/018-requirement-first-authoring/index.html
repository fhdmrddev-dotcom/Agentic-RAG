  </div>`;
  // Centerpiece-first: while guesses/grounding are open, the meter + ground rail lead and the dial collapses.
  // JOB 2: the one-time "needs a template" nudge leads the canvas, pointing down at the fill step.
  const body = done
    ? `${groundRailHTML()}${dialHTML()}${inputsStripHTML()}${meter}${flowHTML('chips')}`
    : `${tplNudgeHTML()}${groundRailHTML()}${meter}${dialOrSummaryHTML()}${inputsStripHTML()}${flowHTML('chips')}`;
  return `<div class="canvas">${body}
    ${done?`<div class="published-note">✓ All confirm-chips cleared & grounded — the draft is <b>bound</b>. The inferred folder confirmed to a real id, the template attached, the unmapped placeholder routed. Next: refine by form (019) → publish gauntlet (020).</div>`:''}
  </div>`;
}

// ── talk rail (A & C share the left rail) — a LIGHT conversation only, never a control panel ──
// Post-draft only (EMPTY uses the describe-first hero, not this rail). The grounding affordances
// live on the RIGHT (the artifact), revealed BY the draft — the rail just narrates.
function talkHTML(){
  const msgs=[];
  msgs.push(`<div class="talk-label">Your requirement → the AI's draft</div>`);
  msgs.push(`<div class="msg user">${REQUIREMENT}</div>`);
  if(STATE==='composing'){
    msgs.push(`<div class="msg ai thinking"><div class="bot"></div><div class="mt">Drafting one workflow from your requirement — the draft appears whole, then it tells you what grounding it still needs.</div></div>`);
  } else {
    const cleared=allCleared() && TPL_ATTACHED && PROJECT_CONFIRMED;
    msgs.push(`<div class="msg ai"><div class="bot"></div><div class="mt">Drafted a <b>4-phase</b> workflow ending in a cited template-fill, and set strictness to <b>Strict</b> (you said it's risk-committee-reviewed). I drafted from your requirement alone — so the draft now shows what it still needs from you on the right: ${cleared?'all set. ✓':'a template, a confirmed folder, and the guesses I flagged →'}</div></div>`);
    if(cleared) msgs.push(`<div class="msg user">All set — keep it.</div>`);
  }
  // The composer is a light re-draft control only — NOT a grounding-collection panel.
  const composer = `<div class="talk-composer">
    <div class="req-label"><span class="req-star">★</span> Business requirement <span style="color:var(--color-text-dim);text-transform:none;letter-spacing:0">· the anchor</span></div>
    <textarea class="talk-input" id="reqInput" rows="3" oninput="onReqInput(this)">${REQUIREMENT}</textarea>
    <button class="compose-btn" id="composeBtn" onclick="onCompose()">↻ Re-draft from this requirement</button>
    <div class="talk-hint">grounding (template · folder) is surfaced by the draft on the right — refine there, not here</div>
  </div>`;
  return `<div class="talk"><div class="talk-scroll">${msgs.join('')}</div>${composer}</div>`;
}

function onReqInput(el){
  const empty = el.value.trim().length===0;
  el.classList.toggle('req-empty', empty);
  const warn=document.getElementById('reqWarn'); if(warn) warn.classList.toggle('show', empty);
  const btn=document.getElementById('composeBtn'); if(!btn) return;
  // Only the FIRST screen (EMPTY) flips the button copy; the post-draft rail keeps its "Re-draft" label.
  if(STATE==='empty'){ btn.disabled=empty; btn.textContent=empty?'Describe a requirement to draft':'Draft the workflow ▸'; }
}
function onCompose(){ setState('composing'); setTimeout(()=>{ if(STATE==='composing') setState('draft'); }, 1700); }

// ── header ──
function headHTML(){
  let bind;
  if(STATE==='empty'||STATE==='composing') bind=`<span class="bind-badge pending">○ binding — waiting for a draft</span>`;
  else if(fullyGrounded()) bind=`<span class="bind-badge clear">✓ grounded & confirmed — bound</span>`;
  else { const ng=unresolvedKeys().length+groundingGaps(); bind=`<span class="bind-badge blocked">⚠ ${ng} item${ng===1?'':'s'} await${ng===1?'s':''} you — provisional</span>`; }
  const canPublish = STATE!=='empty'&&STATE!=='composing'&&fullyGrounded();
  const publish = `<button class="publish-btn ${canPublish?'':'disabled'}" ${canPublish?'':'title="Confirm every grey area first — nothing binds until you do"'} onclick="${canPublish?"alert('→ sketch 020: the 8-stage publish gauntlet (lint → real golden run → judge verdict). A judge fail is a hard wall.')":''}">Continue to publish ▸</button>`;
  return `<div class="builder-head">
    <span class="bh-title">＋ Author a workflow <span class="netnew">NET-NEW · Phase 103</span></span>
    <span class="spacer"></span>${bind}${publish}
  </div>`;
}

// ── render ──
function canvasFor(){ return CUR_V==='A'?canvasA():CUR_V==='B'?canvasB():canvasC(); }
function render(){
  let body;
  // EMPTY = the FIRST screen: one calm column, no rail, the describe box IS the whole screen.
  if(STATE==='empty'){
    body=`<div class="body-area first">${describeFirstHTML()}</div>`;
  }
  else if(CUR_V==='A') body=`<div class="body-area vA">${talkHTML()}${canvasA()}</div>`;
  else if(CUR_V==='B') body=`<div class="body-area vB">${canvasB()}</div>`;
  else body=`<div class="body-area vC">${talkHTML()}${canvasC()}</div>`;
  // grounding popovers (project-folder picker + fill-contract inspection + grey-area confirm popover)
  // overlay EVERY variant — the per-phase reveal affordances trigger the confirm popover in A/B/C alike.
  // infoPopHTML is the tiered-guidance ⓘ micro-hint popover (job 3) — also overlays every variant.
  document.getElementById('shell').innerHTML = headHTML()+body+folderPopHTML()+fillContractHTML()+chipPopHTML()+infoPopHTML();
  // position any open chip popover against its field anchor (handles seeded states with no click event)
  if(CHIP_OPEN){
    requestAnimationFrame(()=>{ const pop=document.getElementById('chipPop'), anchor=document.getElementById('chipAnchor-'+CHIP_OPEN);
      if(pop && anchor){ const r=anchor.getBoundingClientRect();
        pop.style.top=Math.min(r.bottom+6, window.innerHeight-320)+'px';
        pop.style.left=Math.max(12, Math.min(r.left, window.innerWidth-332))+'px'; } });
  }
}

function setVariant(v){ CUR_V=v; FOLDER_POP=false; FC_OPEN=false; INFO_OPEN=null; document.querySelectorAll('.variant-tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  // B has no left rail describe; keep state coherent
  if(CUR_V==='B' && (STATE==='draft')) ACTIVE_GREY=ACTIVE_GREY||unresolvedKeys()[0]||null;
  // C auto-shows the active correction popover mid-flow; other variants render it inline (no floating pop)
  CHIP_OPEN = (CUR_V==='C' && STATE==='confirming' && ACTIVE_GREY && RESOLVED[ACTIVE_GREY]==='unconfirmed') ? ACTIVE_GREY : null;
  render(); }

function setState(s){
  STATE=s; FOLDER_POP=false; FC_OPEN=false; INFO_OPEN=null;
  if(s==='empty'){ // back to the FIRST screen — clear all post-draft grounding so it re-reveals on next draft
    resetResolved(); TPL_ATTACHED=false; PROJECT_CONFIRMED=false; PROJECT_FOLDER='fld_ops'; TPL_NUDGE_DISMISSED=false; }
  else if(s==='draft'){ // fresh draft: grounding UNPROVIDED — the draft reveals it needs template + folder + clears
    resetResolved(); TPL_ATTACHED=false; PROJECT_CONFIRMED=false; PROJECT_FOLDER='fld_ops'; TPL_NUDGE_DISMISSED=false; }
  else if(s==='confirming'){ // mid-flow: project folder confirmed + template attached, one guess cleared, one open
    resetResolved(); PROJECT_CONFIRMED=true; TPL_ATTACHED=true; RESOLVED.vendorScope='confirmed'; ACTIVE_GREY='tplPlaceholder';
    CHIP_OPEN = (CUR_V==='C') ? 'tplPlaceholder' : null; } // C auto-shows the active correction popover
  else if(s==='done'){ // fully grounded & confirmed
    RESOLVED={vendorScope:'confirmed', tplPlaceholder:'corrected:Leave blank for manual entry'}; ACTIVE_GREY=null;
    TPL_ATTACHED=true; PROJECT_CONFIRMED=true; }
  document.querySelectorAll('#stToggle button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  render();
}

// clearing the last grey area while in draft/confirming reflects live in the header bind-badge + canvas (STATE is unchanged; the resolution map drives it)
resetResolved();
render();
</script>
</body>
</html>
