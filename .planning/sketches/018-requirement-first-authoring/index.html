/* ───────────────────────────────────────────────────────────────
   Sketch 018 — Requirement-First Authoring · Phase 103 · NET-NEW
   Q: You describe a business requirement, the AI drafts the whole
      workflow AND sets a strictness dial — how does it CONFIRM its
      grey-area guesses (ambiguous folder ref, vague scope, unmapped
      template placeholder) instead of silently inventing them?
   The grey-area confirm loop is the CENTERPIECE.
   Extends 013 (describe/refine, inferred-inputs strip). Adds the
   6th phase type (llm_emit), the real strictness dial (citation_policy
   strict|flag|partial|draft), and the no-silent-substitution loop.
   ─────────────────────────────────────────────────────────────── */
body { padding-top: 52px; }
.shell { height: calc(100vh - 52px); overflow: hidden; }

/* ── header ── */
.builder-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--color-border); background: var(--color-bg-elev1); }
.builder-head .bh-title { font-family: var(--font-headline); font-weight: 600; font-size: var(--text-md); display:flex; align-items:center; gap:var(--space-2); }
.builder-head .netnew { font-family: var(--font-mono); font-size: 9px; padding: 2px 7px; border-radius: var(--radius-full); background: var(--color-accent-violet); color: #fff; }
.builder-head .spacer { flex: 1; }
.bind-badge { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); padding: 4px var(--space-3); border-radius: var(--radius-full); border:1px solid; font-family:var(--font-mono); }
.bind-badge.blocked { background: var(--color-warning-dim); color: var(--color-warning); border-color: hsl(38 92% 60% / .4); }
.bind-badge.clear { background: var(--color-success-dim); color: var(--color-success); border-color: hsl(142 71% 45% / .35); }
.bind-badge.pending { background: var(--color-muted); color: var(--color-text-dim); border-color: var(--color-border); }
.publish-btn { font-size: var(--text-sm); font-weight: 600; padding: 7px var(--space-4); border-radius: var(--radius-md); background: var(--color-primary); color: hsl(240 60% 8%); border: none; cursor: pointer; transition: filter var(--dur-fast) var(--ease-out); }
.publish-btn:hover:not(.disabled) { filter:brightness(1.08); }
.publish-btn.disabled { background: var(--color-muted); color: var(--color-text-dim); cursor: not-allowed; }

/* ── layouts per variant ── */
.body-area { display: grid; height: calc(100vh - 52px - 53px); overflow: hidden; }
.body-area.vA { grid-template-columns: 360px 1fr; }
.body-area.vB { grid-template-columns: 1fr; }
.body-area.vC { grid-template-columns: 360px 1fr; }
/* EMPTY first-screen: ONE calm column, no rail — the describe box IS the whole screen. */
.body-area.first { grid-template-columns: 1fr; }

/* ── describe-first hero (EMPTY — reads in 3 seconds) ── */
.describe-first { height:100%; overflow-y:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: var(--space-8) var(--space-6); background: var(--color-bg); }
.df-inner { width:100%; max-width: 640px; display:flex; flex-direction:column; gap:var(--space-4); animation: fadeSlideUp var(--dur-slow) var(--ease-out); }
.df-lead { text-align:center; }
.df-lead .df-glyph { font-size: 30px; opacity:.9; }
.df-lead .df-title { font-family: var(--font-headline); font-weight:700; font-size: var(--text-2xl); color: var(--color-text); margin-top: var(--space-2); }
.df-box { position:relative; }
.df-req-label { font-size: 10px; text-transform:uppercase; letter-spacing:.05em; color: var(--color-primary); font-family: var(--font-mono); margin-bottom: var(--space-2); display:flex; align-items:center; gap:6px; }
.df-req-label .req-star { color: var(--color-warning); }
.df-req-label .req-tag { color: var(--color-text-dim); text-transform:none; letter-spacing:0; }
.df-input { width:100%; background: var(--color-surface); border:1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5); color: var(--color-text); font-family: inherit; font-size: var(--text-md); line-height:1.6; resize:none; transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast); }
.df-input:focus { outline:none; border-color: var(--color-primary-glow); box-shadow: var(--shadow-glow-primary); }
.df-input.req-empty { border-color: hsl(38 92% 60% / .5); }
.df-actions { display:flex; align-items:center; gap: var(--space-3); }
.df-draft-btn { flex:1; font-size: var(--text-md); font-weight:600; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--color-primary); color: hsl(240 60% 8%); border:none; cursor:pointer; transition: filter var(--dur-fast); }
.df-draft-btn:hover:not(:disabled) { filter:brightness(1.08); }
.df-draft-btn:disabled { background: var(--color-muted); color: var(--color-text-dim); cursor:not-allowed; }
.df-hint { text-align:center; font-size: 12px; color: var(--color-text-muted); line-height:1.55; padding: 0 var(--space-4); }
.df-hint b { color: var(--color-text); font-weight:600; }
.df-warn { font-size: 11px; color: var(--color-warning); display:none; }
.df-warn.show { display:block; }

/* ── talk rail (shared) ── */
.talk { display: flex; flex-direction: column; border-right: 1px solid var(--color-border); background: var(--color-bg-elev1); overflow: hidden; }
.talk-scroll { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.talk-label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-dim); font-family: var(--font-mono); }
.msg { font-size: 13px; line-height: 1.55; animation: fadeSlideUp var(--dur-base) var(--ease-out); }
.msg.user { align-self: flex-end; max-width: 90%; background: var(--color-primary-dim); border: 1px solid var(--color-primary-glow); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md) var(--radius-md) var(--radius-sm) var(--radius-md); }
.msg.ai { display: flex; gap: var(--space-2); color: var(--color-text); }
.msg.ai .bot { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary), var(--color-accent-violet)); flex-shrink: 0; }
.msg.ai.thinking .bot { animation: brandPulse 1.5s infinite; }
.msg.ai .mt { background: var(--color-surface); border: 1px solid var(--color-border-soft); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); }
.talk-composer { padding: var(--space-3); border-top: 1px solid var(--color-border); }
.req-label { font-size: 10px; text-transform: uppercase; letter-spacing:.05em; color: var(--color-primary); font-family: var(--font-mono); margin-bottom: 5px; display:flex; align-items:center; gap:5px; }
.req-label .req-star { color: var(--color-warning); }
.talk-input { width: 100%; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-3); color: var(--color-text); font-family: inherit; font-size: var(--text-sm); resize: none; transition: border-color var(--dur-fast) var(--ease-out); }
.talk-input:focus { outline:none; border-color: var(--color-primary-glow); box-shadow: var(--shadow-glow-primary); }
.talk-input.req-empty { border-color: hsl(38 92% 60% / .5); }
.req-warn { font-size: 10px; color: var(--color-warning); margin-top: 5px; display:none; }
.req-warn.show { display:block; }
.compose-btn { margin-top: var(--space-2); width:100%; font-size: var(--text-sm); font-weight:600; padding: 8px; border-radius: var(--radius-md); background: var(--color-primary); color: hsl(240 60% 8%); border:none; cursor:pointer; transition: filter var(--dur-fast); }
.compose-btn:hover:not(:disabled) { filter:brightness(1.08); }
.compose-btn:disabled { background: var(--color-muted); color: var(--color-text-dim); cursor:not-allowed; }
.talk-hint { font-size: 10px; color: var(--color-text-dim); margin-top: 6px; text-align: center; }

/* ── draft canvas (shared) ── */
.canvas { overflow-y: auto; padding: var(--space-5) var(--space-6) 80px; background: var(--color-bg); }
.canvas-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3); color: var(--color-text-dim); text-align: center; }
.canvas-empty .big { font-size: 32px; }

/* one-shot composing state */
.composing-card { max-width: 460px; margin: 14vh auto 0; text-align:center; display:flex; flex-direction:column; align-items:center; gap:var(--space-4); }
.composing-orb { width:56px; height:56px; border-radius:50%; background: linear-gradient(135deg, var(--color-primary), var(--color-accent-violet)); animation: brandPulse 1.5s infinite; box-shadow: var(--shadow-glow-primary); }
.composing-card .ct { font-family:var(--font-headline); font-weight:600; font-size: var(--text-lg); color: var(--color-text); }
.composing-card .cs { font-size: 12.5px; color: var(--color-text-muted); max-width: 360px; }
.composing-steps { display:flex; flex-direction:column; gap:6px; width:100%; max-width: 360px; text-align:left; margin-top:var(--space-2); }
.cstep { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--color-text-dim); padding:5px 0; }
.cstep .dot { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--color-border); display:grid; place-items:center; font-size:8px; flex-shrink:0; }
.cstep.done { color:var(--color-text); } .cstep.done .dot { background:var(--color-success-dim); border-color:var(--color-success); color:var(--color-success); }
.cstep.active { color:var(--color-text); } .cstep.active .dot { border-color:var(--color-primary); animation:pulseGlow 1.4s infinite; }
.note-bar { font-size:10px; color:var(--color-text-dim); margin-top:var(--space-3); font-style:italic; }

/* auto-repair transient micro-state */
.repair-flash { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--color-warning); background:var(--color-warning-dim); border:1px solid hsl(38 92% 60% / .35); border-radius:var(--radius-md); padding:7px var(--space-3); margin:0 auto var(--space-4); max-width:380px; }
.repair-flash .spin { width:12px; height:12px; border:2px solid hsl(38 92% 60% / .35); border-top-color:var(--color-warning); border-radius:50%; animation:repairspin .8s linear infinite; }
@keyframes repairspin { to { transform:rotate(360deg); } }
.repair-flash .x { margin-left:auto; cursor:default; opacity:.5; }

/* ── strictness dial ── */
.dial { border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); padding: var(--space-4); margin-bottom: var(--space-5); }
.dial-summary { width:100%; display:flex; align-items:center; gap:var(--space-2); text-align:left; border:1px solid var(--color-border); border-radius:var(--radius-lg); background:var(--color-surface); padding:var(--space-3) var(--space-4); margin-bottom:var(--space-5); cursor:pointer; font-family:inherit; color:var(--color-text); transition:border-color var(--dur-fast) var(--ease-out); }
.dial-summary:hover { border-color:var(--color-primary-glow); }
.dial-summary .ds-ico { font-size:14px; opacity:.8; }
.dial-summary .ds-txt { flex:1; font-size:12px; color:var(--color-text-muted); }
.dial-summary .ds-txt b { color:var(--color-text); }
.dial-summary .ds-enum { font-family:var(--font-mono); font-size:10px; color:var(--color-accent-violet); }
.dial-summary .ds-ai { font-size:9px; padding:2px 7px; border-radius:var(--radius-full); background:hsl(258 90% 66% / .15); color:var(--color-accent-violet); }
.dial-summary .ds-adj { font-size:11px; color:var(--color-primary); }
.dial-h { display:flex; align-items:center; gap:var(--space-2); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--color-text-dim); font-family:var(--font-mono); margin-bottom:var(--space-3); }
.dial-h .ai-set { margin-left:auto; font-size:9px; padding:2px 7px; border-radius:var(--radius-full); background:hsl(258 90% 66% / .15); color:var(--color-accent-violet); text-transform:none; letter-spacing:0; }
.preset-row { display:flex; gap:var(--space-2); }
.preset { flex:1; text-align:left; border:1px solid var(--color-border); border-radius:var(--radius-md); background:var(--color-bg-elev1); padding:var(--space-3); cursor:pointer; transition:all var(--dur-fast) var(--ease-out); }
.preset:hover { border-color:var(--color-primary-glow); }
.preset.on { border-color:var(--color-primary); background:var(--color-primary-dim); }
.preset .pn { font-weight:600; font-size:var(--text-sm); display:flex; align-items:center; gap:6px; }
.preset .pc { font-size:11px; color:var(--color-text-muted); margin-top:4px; line-height:1.4; }
.preset.on .pn { color:var(--color-primary); }
.preset .penum { font-family:var(--font-mono); font-size:9px; color:var(--color-text-dim); margin-top:6px; display:block; }
.dial-adv-toggle { margin-top:var(--space-3); font-size:11px; color:var(--color-primary); background:none; border:none; cursor:pointer; display:flex; align-items:center; gap:5px; padding:0; }
.dial-adv-toggle .caret { transition:transform var(--dur-fast); } .dial-adv-toggle.open .caret { transform:rotate(90deg); }
.dial-adv { margin-top:var(--space-3); padding-top:var(--space-3); border-top:1px solid var(--color-border-soft); display:none; animation:fadeSlideUp var(--dur-base) var(--ease-out); }
.dial-adv.open { display:block; }
.adv-block { margin-bottom:var(--space-4); }
.adv-block .ab-h { font-size:11px; color:var(--color-text-muted); margin-bottom:var(--space-2); font-weight:600; }
.gate-chips { display:flex; flex-wrap:wrap; gap:6px; }
.gate-chip { display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:4px var(--space-3); border-radius:var(--radius-full); border:1px solid var(--color-border); background:var(--color-muted); color:var(--color-text-dim); cursor:pointer; font-family:var(--font-mono); transition:all var(--dur-fast); }
.gate-chip.on { background:var(--color-success-dim); color:var(--color-success); border-color:hsl(142 71% 45% / .35); }
.gate-chip .gck { width:13px; height:13px; border-radius:3px; border:1px solid currentColor; display:grid; place-items:center; font-size:8px; }
.gate-chip .gate-cfg { margin-left:4px; padding:1px 5px; border-radius:var(--radius-sm); background:hsl(142 71% 45% / .18); font-size:9px; }
.judge-banner { display:flex; align-items:flex-start; gap:8px; margin-top:var(--space-3); padding:var(--space-3); border:1px solid hsl(258 90% 66% / .4); border-radius:var(--radius-md); background:hsl(258 90% 66% / .1); }
.judge-banner .jb-ico { font-size:15px; line-height:1.2; flex-shrink:0; }
.judge-banner .jb-txt { font-size:10.5px; color:var(--color-text-muted); line-height:1.45; }
.judge-banner .jb-txt b { color:var(--color-accent-violet); }
.seg { display:inline-flex; border:1px solid var(--color-border); border-radius:var(--radius-md); overflow:hidden; }
.seg button { background:var(--color-bg-elev1); color:var(--color-text-muted); border:none; border-right:1px solid var(--color-border); padding:6px var(--space-3); font-size:11px; font-family:var(--font-mono); cursor:pointer; transition:all var(--dur-fast); }
.seg button:last-child { border-right:none; }
.seg button.on { background:var(--color-primary-dim); color:var(--color-primary); }
.seg button:hover:not(.on) { background:var(--color-accent); color:var(--color-text); }
.seg-caption { font-size:11px; color:var(--color-text-muted); margin-top:6px; min-height:32px; }
.policy-grey { font-size:10px; color:var(--color-text-dim); margin-top:var(--space-2); display:flex; align-items:center; gap:6px; opacity:.7; }
.policy-grey .gtag { font-family:var(--font-mono); font-size:8px; padding:1px 5px; border-radius:var(--radius-sm); background:var(--color-muted); }

/* ── inferred inputs / assets strip ── */
.inputs-strip { border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); padding: var(--space-4); margin-bottom: var(--space-5); }
.inputs-strip .is-h { display: flex; align-items: center; gap: var(--space-2); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-dim); font-family: var(--font-mono); margin-bottom: var(--space-3); }
.input-chips { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items:center; }
.input-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px var(--space-3); border-radius: var(--radius-md); background: var(--color-muted); border: 1px solid var(--color-border-soft); font-size: 12px; }
.input-chip .ic-type { font-family: var(--font-mono); font-size: 9px; color: var(--color-text-dim); }
.input-chip.template { border-color: hsl(258 90% 66% / .4); }
.assets-h { display:flex; align-items:center; gap:var(--space-2); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--color-accent-violet); font-family:var(--font-mono); margin:var(--space-4) 0 var(--space-2); }

/* ── phase flow (read-only spine) ── */
.flow { list-style: none; margin: 0; padding: 0; }
.flow > li { position: relative; padding-left: 30px; padding-bottom: var(--space-3); }
.flow > li:last-child { padding-bottom: 0; }
.flow > li::before { content:''; position:absolute; left:10px; top:34px; bottom:-4px; width:2px; background: var(--color-border-soft); }
.flow > li:last-child::before { display:none; }
.flow-node { position:absolute; left:0; top:12px; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:10px; background: var(--color-surface); border:1.5px solid var(--color-border); color: var(--color-text-dim); z-index:1; }
.pcard { border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); padding: var(--space-3); transition: all var(--dur-base) var(--ease-out); position:relative; }
.pcard.emit { border-color: hsl(258 90% 66% / .5); background: linear-gradient(180deg, hsl(258 90% 66% / .05), var(--color-surface)); }
.pcard.has-grey { border-color: hsl(38 92% 60% / .5); }
.pcard-top { display: flex; align-items: center; gap: var(--space-2); }
.pcard .p-name { font-weight: 600; font-size: var(--text-sm); flex: 1; }
.ptype { font-family: var(--font-mono); font-size: 9px; padding: 1px 6px; border-radius: var(--radius-sm); text-transform: uppercase; }
.pt-agent { background: var(--color-success-dim); color: var(--color-success); }
.pt-single { background: var(--color-primary-dim); color: var(--color-primary); }
.pt-human { background: var(--color-warning-dim); color: var(--color-warning); }
.pt-prog { background: var(--color-muted); color: var(--color-text-muted); }
.pt-batch { background: hsl(258 90% 66% / .15); color: var(--color-accent-violet); }
.pt-emit { background: hsl(258 90% 66% / .22); color: var(--color-accent-violet); }
.pcard .p-note { font-size: 11.5px; color: var(--color-text-muted); margin-top: 5px; }
.pcard-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: var(--space-2); align-items: center; }
.tchip { font-family: var(--font-mono); font-size: 9px; color: var(--color-text-muted); border: 1px solid var(--color-border-soft); padding: 1px 5px; border-radius: var(--radius-sm); }
.tchip.scope { color: var(--color-success); border-color: hsl(142 71% 45% / .35); }
.tchip.scope.unconfirmed { color: var(--color-warning); border-color: hsl(38 92% 60% / .5); background:var(--color-warning-dim); }
.tchip.gate { color: var(--color-primary); border-color: var(--color-primary-glow); }
.tchip.cit { color: var(--color-accent-violet); border-color: hsl(258 90% 66% / .4); }
.tchip.placeholder { color: var(--color-warning); border-color: hsl(38 92% 60% / .5); background:var(--color-warning-dim); }

/* ── grey-area: shared confirm-card vocabulary ── */
.grey-card { border:1px solid hsl(38 92% 60% / .5); background:var(--color-warning-dim); border-radius:var(--radius-md); padding:var(--space-3); animation:fadeSlideUp var(--dur-base) var(--ease-out); }
.grey-card.resolved { border-color:hsl(142 71% 45% / .35); background:var(--color-success-dim); }
.grey-head { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; }
.grey-head .gico { font-size:14px; }
.grey-kind { font-family:var(--font-mono); font-size:8px; padding:1px 6px; border-radius:var(--radius-sm); background:hsl(38 92% 60% / .2); color:var(--color-warning); text-transform:uppercase; margin-left:auto; }
.grey-card.resolved .grey-kind { background:hsl(142 71% 45% / .2); color:var(--color-success); }
.grey-said { font-size:11.5px; color:var(--color-text-muted); margin-top:6px; }
.grey-said .quote { color:var(--color-text); font-style:italic; }
.grey-read { font-size:12.5px; margin-top:8px; padding:8px var(--space-3); background:var(--color-surface); border:1px solid var(--color-border-soft); border-radius:var(--radius-sm); display:flex; align-items:center; gap:8px; }
.grey-read .ico { color:var(--color-success); } .grey-read .bound-id { font-family:var(--font-mono); font-size:9px; color:var(--color-text-dim); margin-left:auto; }
.grey-alts { margin-top:8px; display:flex; flex-direction:column; gap:5px; }
.grey-alt { font-size:11.5px; padding:6px var(--space-3); border:1px solid var(--color-border); border-radius:var(--radius-sm); background:var(--color-bg-elev1); cursor:pointer; display:flex; align-items:center; gap:8px; transition:all var(--dur-fast); }
.grey-alt:hover { border-color:var(--color-primary-glow); background:var(--color-accent); }

.grey-actions { display:flex; gap:var(--space-2); margin-top:var(--space-3); }
.gbtn { font-size:11.5px; font-weight:600; padding:6px var(--space-4); border-radius:var(--radius-sm); cursor:pointer; border:1px solid; transition:all var(--dur-fast); }
.gbtn.confirm { background:var(--color-success); color:hsl(160 60% 8%); border-color:var(--color-success); }

.gbtn.correct:hover { border-color:var(--color-primary-glow); color:var(--color-text); }
.grey-resolved-line { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--color-success); }
.grey-batch { font-family:var(--font-mono); font-size:8px; padding:1px 6px; border-radius:var(--radius-full); background:var(--color-muted); color:var(--color-text-dim); flex-shrink:0; }

/* ── A: batched assumptions panel ── */
.assume-panel { border:1px solid hsl(38 92% 60% / .5); background:var(--color-surface); border-radius:var(--radius-lg); margin-bottom:var(--space-5); overflow:hidden; animation:fadeSlideUp var(--dur-slow) var(--ease-out); }
.assume-panel.cleared { border-color:hsl(142 71% 45% / .35); }
.assume-bar { display:flex; align-items:center; gap:var(--space-2); padding:var(--space-3) var(--space-4); background:var(--color-warning-dim); border-bottom:1px solid hsl(38 92% 60% / .3); }
.assume-panel.cleared .assume-bar { background:var(--color-success-dim); border-color:hsl(142 71% 45% / .3); }
.assume-bar .ab-ico { font-size:16px; }
.assume-bar .ab-title { font-weight:600; font-size:var(--text-sm); }
.assume-bar .ab-count { margin-left:auto; font-family:var(--font-mono); font-size:11px; padding:2px var(--space-2); border-radius:var(--radius-full); background:var(--color-warning); color:hsl(40 60% 10%); }
.assume-panel.cleared .ab-count { background:var(--color-success); color:hsl(160 60% 10%); }
.assume-body { padding:var(--space-4); display:flex; flex-direction:column; gap:var(--space-3); }
.assume-foot { padding:var(--space-3) var(--space-4); border-top:1px solid var(--color-border-soft); display:flex; align-items:center; gap:var(--space-3); }
.assume-foot .af-note { font-size:11px; color:var(--color-text-dim); flex:1; }
.lock-til { font-size:11px; color:var(--color-warning); display:flex; align-items:center; gap:5px; }
.assume-panel.cleared .lock-til { color:var(--color-success); }

/* ── B: inline checkpoint stepper context ── */
.checkpoint-wrap { padding:var(--space-5) var(--space-6); max-width:720px; margin:0 auto; }
.cp-progress { display:flex; align-items:center; gap:6px; margin-bottom:var(--space-4); font-size:11px; color:var(--color-text-dim); font-family:var(--font-mono); }
.cp-pip { width:15px; height:15px; border-radius:50%; background:var(--color-border); color:var(--color-text-dim); display:inline-grid; place-items:center; font-size:8px; font-weight:700; border:1px solid var(--color-border); }
.cp-pip.done { background:var(--color-success); color:hsl(160 60% 8%); border-color:var(--color-success); }
.cp-pip.active { background:transparent; color:var(--color-warning); border:2px solid var(--color-warning); transform:scale(1.15); animation:pulseGlow 1.4s infinite; }
.cp-stream { display:flex; flex-direction:column; gap:var(--space-3); }
.cp-ai { display:flex; gap:var(--space-2); }
.cp-ai .bot { width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,var(--color-primary),var(--color-accent-violet)); flex-shrink:0; }
.cp-ai .body { flex:1; }
.cp-ai .lead { font-size:13px; color:var(--color-text); margin-bottom:var(--space-2); }
.cp-resolved-mini { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--color-success); padding:6px var(--space-3); border:1px solid hsl(142 71% 45% / .25); border-radius:var(--radius-sm); background:var(--color-success-dim); }
.cp-done-banner { text-align:center; padding:var(--space-5); border:1px dashed hsl(142 71% 45% / .4); border-radius:var(--radius-lg); background:var(--color-success-dim); color:var(--color-success); margin-top:var(--space-3); }
.cp-ai .seq { font-size:9px; color:var(--color-text-dim); font-family:var(--font-mono); margin-bottom:4px; }
.cp-ai.active .body { animation:fadeSlideUp var(--dur-base) var(--ease-out); }
.cp-user { align-self:flex-end; max-width:80%; font-size:12px; background:var(--color-primary-dim); border:1px solid var(--color-primary-glow); padding:var(--space-2) var(--space-3); border-radius:var(--radius-md) var(--radius-md) var(--radius-sm) var(--radius-md); }
.cp-user .cu-tag { font-size:9px; font-family:var(--font-mono); color:var(--color-text-dim); margin-right:6px; text-transform:uppercase; }
.cp-req { align-self:flex-end; max-width:88%; font-size:12.5px; line-height:1.5; background:var(--color-primary-dim); border:1px solid var(--color-primary-glow); padding:var(--space-3); border-radius:var(--radius-md) var(--radius-md) var(--radius-sm) var(--radius-md); }
.cp-req .cr-label { font-size:9px; font-family:var(--font-mono); color:var(--color-primary); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:4px; }
.cp-composer { display:flex; gap:var(--space-2); margin-top:var(--space-4); padding:var(--space-3); border:1px solid var(--color-border); border-radius:var(--radius-md); background:var(--color-surface); color:var(--color-text-dim); font-size:12px; align-items:center; }
.cp-composer .cc-input { flex:1; color:var(--color-text-dim); }
.cp-composer .cc-send { font-size:11px; font-weight:600; padding:5px var(--space-3); border-radius:var(--radius-sm); background:var(--color-muted); color:var(--color-text-dim); border:none; }

/* ── C: confirm chips on draft ── */
.chip-confirm { display:inline-flex; align-items:center; gap:5px; font-size:9px; font-family:var(--font-mono); padding:1px 6px; border-radius:var(--radius-full); background:var(--color-warning); color:hsl(40 60% 10%); cursor:pointer; border:none; animation:pulseGlow 2s infinite; }
.chip-confirm:hover { filter:brightness(1.08); }
.chip-pop { position:fixed; z-index:8001; width:320px; background:var(--color-surface-hi); border:1px solid hsl(38 92% 60% / .5); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:var(--space-4); animation:fadeSlideUp var(--dur-fast) var(--ease-out); }
.chip-pop::before { content:''; position:absolute; top:-7px; left:24px; width:12px; height:12px; background:var(--color-surface-hi); border-left:1px solid hsl(38 92% 60% / .5); border-top:1px solid hsl(38 92% 60% / .5); transform:rotate(45deg); }
.chip-pop .cp-pinned { font-size:9px; font-family:var(--font-mono); color:var(--color-text-dim); margin-bottom:6px; }
#chipBackdrop { position:fixed; inset:0; z-index:8000; }
.draft-meter { display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3) var(--space-4); border:1px solid var(--color-border); border-radius:var(--radius-lg); background:var(--color-surface); margin-bottom:var(--space-5); }

.draft-meter .dm-txt { flex:1; }
.draft-meter .dm-title { font-weight:600; font-size:var(--text-sm); }
.draft-meter .dm-sub { font-size:11px; color:var(--color-text-muted); margin-top:2px; }
.dm-track { width:120px; height:6px; border-radius:3px; background:var(--color-muted); overflow:hidden; }
.dm-fill { height:100%; background:var(--color-warning); transition:width var(--dur-slow) var(--ease-out), background var(--dur-slow); border-radius:3px; }
.draft-meter.clear { border-color:hsl(142 71% 45% / .35); }
.draft-meter.clear .dm-fill { background:var(--color-success); }
.tchip.resolved { color:var(--color-success); border-color:hsl(142 71% 45% / .35); background:var(--color-success-dim); }

/* ── shared published note ── */
.published-note { padding: var(--space-3) var(--space-6); border-top: 1px dashed var(--color-border-soft); font-size: 11px; color: var(--color-text-dim); line-height: 1.5; }
.published-note b { color: var(--color-primary); }

/* ── grounding strip (NET-NEW: describe-step grounding affordances) ── */
.ground { border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); padding: var(--space-3); margin-top: var(--space-3); }
.ground-h { display:flex; align-items:center; gap:var(--space-2); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--color-text-dim); font-family:var(--font-mono); margin-bottom:var(--space-2); }
.ground-h .gnetnew { font-family:var(--font-mono); font-size:8px; padding:1px 6px; border-radius:var(--radius-full); background:var(--color-accent-violet); color:#fff; text-transform:none; letter-spacing:0; margin-left:auto; }
.ground-seq { font-size:10.5px; color:var(--color-text-dim); line-height:1.5; margin-bottom:var(--space-3); }
.ground-seq b { color:var(--color-text-muted); }
.ground-seq .opt { color:var(--color-accent-violet); font-weight:600; }
.ground-seq .req { color:var(--color-warning); font-weight:600; }
.ground-row { display:flex; flex-direction:column; gap:var(--space-2); }
.ground-aff { display:flex; align-items:center; gap:var(--space-2); border:1px dashed var(--color-border); border-radius:var(--radius-md); background:var(--color-bg-elev1); padding:var(--space-2) var(--space-3); cursor:pointer; font-family:inherit; color:var(--color-text-muted); font-size:12px; text-align:left; width:100%; transition:all var(--dur-fast) var(--ease-out); }
.ground-aff:hover { border-color:var(--color-primary-glow); color:var(--color-text); }
.ground-aff .ga-ico { font-size:14px; flex-shrink:0; }
.ground-aff .ga-txt { flex:1; }
.ground-aff .ga-mode { font-family:var(--font-mono); font-size:8px; padding:1px 6px; border-radius:var(--radius-sm); background:var(--color-muted); color:var(--color-text-dim); flex-shrink:0; }
.ground-aff.attached { border-style:solid; border-color:hsl(258 90% 66% / .4); background:hsl(258 90% 66% / .07); color:var(--color-text); }
.ground-aff.attached .ga-mode { background:hsl(258 90% 66% / .18); color:var(--color-accent-violet); }
.ground-aff.set { border-style:solid; border-color:hsl(142 71% 45% / .35); background:var(--color-success-dim); color:var(--color-text); }
.ground-aff.set .ga-mode { background:hsl(142 71% 45% / .2); color:var(--color-success); }
.ga-clear { margin-left:6px; font-size:10px; color:var(--color-text-dim); border:none; background:none; cursor:pointer; padding:2px 4px; border-radius:var(--radius-sm); }
.ga-clear:hover { color:var(--color-warning); background:var(--color-warning-dim); }
.ground-aff .ga-meta { display:flex; align-items:center; gap:5px; flex:1; min-width:0; }
.ground-aff .ga-meta .ga-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ground-two-level { font-size:10px; color:var(--color-text-dim); line-height:1.5; margin-top:var(--space-2); padding-top:var(--space-2); border-top:1px solid var(--color-border-soft); }
.ground-two-level b { color:var(--color-text-muted); }
.ground-two-level .you-set { color:var(--color-success); }
.ground-two-level .ai-guess { color:var(--color-warning); }

/* ── folder-tree popover (project folder picker) ── */
#groundBackdrop { position:fixed; inset:0; z-index:8000; }
.folder-pop { position:fixed; z-index:8001; width:340px; max-height:420px; display:flex; flex-direction:column; background:var(--color-surface-hi); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); animation:fadeSlideUp var(--dur-fast) var(--ease-out); overflow:hidden; }
.folder-pop .fp-h { padding:var(--space-3) var(--space-3) var(--space-2); border-bottom:1px solid var(--color-border-soft); }
.folder-pop .fp-title { font-size:11px; font-weight:600; color:var(--color-text); display:flex; align-items:center; gap:6px; }
.folder-pop .fp-sub { font-size:10px; color:var(--color-text-dim); margin-top:3px; line-height:1.4; }
.folder-search { width:100%; margin-top:var(--space-2); background:var(--color-bg-elev1); border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:6px var(--space-3); color:var(--color-text); font-family:inherit; font-size:12px; }
.folder-search:focus { outline:none; border-color:var(--color-primary-glow); }
.folder-tree { flex:1; overflow-y:auto; padding:var(--space-2); }
.folder-node { display:flex; align-items:center; gap:7px; padding:5px var(--space-2); border-radius:var(--radius-sm); cursor:pointer; font-size:12px; color:var(--color-text-muted); transition:background var(--dur-fast); }
.folder-node:hover { background:var(--color-accent); color:var(--color-text); }
.folder-node.on { background:var(--color-success-dim); color:var(--color-success); }
.folder-node .fn-ico { font-size:12px; flex-shrink:0; }
.folder-node .fn-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.folder-node .fn-id { font-family:var(--font-mono); font-size:8px; color:var(--color-text-dim); }
.folder-node.on .fn-id { color:var(--color-success); }
.folder-node.lvl1 { padding-left:var(--space-4); } .folder-node.lvl2 { padding-left:var(--space-6); }
.folder-pop .fp-foot { padding:var(--space-2) var(--space-3); border-top:1px solid var(--color-border-soft); font-size:9.5px; color:var(--color-text-dim); font-family:var(--font-mono); }

/* ── template fill-contract panel (upload-time inspection — layer 1) ── */
.fc-pop { position:fixed; z-index:8001; width:420px; max-height:560px; display:flex; flex-direction:column; background:var(--color-surface-hi); border:1px solid hsl(258 90% 66% / .4); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); animation:fadeSlideUp var(--dur-fast) var(--ease-out); overflow:hidden; }
.fc-pop.rejected { border-color:var(--color-danger); }
.fc-pop.warn { border-color:hsl(38 92% 60% / .5); }
.fc-h { padding:var(--space-3) var(--space-4); border-bottom:1px solid var(--color-border-soft); }
.fc-h .fc-title { font-size:var(--text-sm); font-weight:600; display:flex; align-items:center; gap:7px; }
.fc-h .fc-file { font-family:var(--font-mono); font-size:10px; color:var(--color-text-dim); margin-top:3px; }
.fc-h .fc-parser { font-size:9.5px; color:var(--color-text-dim); margin-top:6px; line-height:1.45; }
.fc-h .fc-parser code { font-family:var(--font-mono); color:var(--color-accent-violet); font-size:9px; }
.fc-status { display:flex; align-items:center; gap:7px; padding:var(--space-2) var(--space-4); font-size:11.5px; font-weight:600; }
.fc-status.clean { background:var(--color-success-dim); color:var(--color-success); }
.fc-status.rejected { background:var(--color-danger-dim); color:var(--color-danger); }
.fc-status.warn { background:var(--color-warning-dim); color:var(--color-warning); }
.fc-status.empty { background:var(--color-muted); color:var(--color-text-muted); }
.fc-body { flex:1; overflow-y:auto; padding:var(--space-3) var(--space-4); }
.fc-list { display:flex; flex-direction:column; gap:6px; }
.fc-ph { display:flex; align-items:center; gap:8px; padding:6px var(--space-3); border:1px solid var(--color-border-soft); border-radius:var(--radius-sm); background:var(--color-bg-elev1); font-size:12px; }
.fc-ph .fc-tag { font-family:var(--font-mono); font-size:10.5px; color:var(--color-text); }
.fc-ph .fc-kind { font-family:var(--font-mono); font-size:8px; padding:1px 5px; border-radius:var(--radius-sm); background:var(--color-muted); color:var(--color-text-dim); }
.fc-ph .fc-state { margin-left:auto; font-size:10px; display:flex; align-items:center; gap:4px; }
.fc-ph.mapped .fc-state { color:var(--color-success); }
.fc-ph.unmapped { border-color:hsl(38 92% 60% / .4); background:var(--color-warning-dim); }
.fc-ph.unmapped .fc-state { color:var(--color-warning); }
.fc-ph .fc-src { font-family:var(--font-mono); font-size:8.5px; color:var(--color-text-dim); }
.fc-badtag { font-family:var(--font-mono); font-size:11px; color:var(--color-danger); background:var(--color-danger-dim); border:1px solid hsl(0 72% 51% / .4); border-radius:var(--radius-sm); padding:6px var(--space-3); margin-top:var(--space-2); word-break:break-all; }
.fc-callout { font-size:11px; line-height:1.5; color:var(--color-text-muted); margin-top:var(--space-3); padding:var(--space-3); border-radius:var(--radius-sm); background:var(--color-bg-elev1); border:1px solid var(--color-border-soft); }
.fc-callout b { color:var(--color-text); }
.fc-callout.warn { border-color:hsl(38 92% 60% / .4); }
.fc-callout.warn b { color:var(--color-warning); }
.fc-foot { padding:var(--space-3) var(--space-4); border-top:1px solid var(--color-border-soft); display:flex; align-items:center; gap:var(--space-2); }
.fc-foot .fc-note { flex:1; font-size:10px; color:var(--color-text-dim); line-height:1.4; }
.fc-foot .fc-act { font-size:11px; font-weight:600; padding:6px var(--space-3); border-radius:var(--radius-sm); border:1px solid var(--color-border); background:var(--color-bg-elev1); color:var(--color-text-muted); cursor:pointer; transition:all var(--dur-fast); }
.fc-foot .fc-act.primary { background:var(--color-primary); color:hsl(240 60% 8%); border-color:var(--color-primary); }
.fc-foot .fc-act:hover { filter:brightness(1.08); }
.fc-flagpick { display:flex; flex-wrap:wrap; gap:4px; padding:var(--space-2) var(--space-4); border-bottom:1px solid var(--color-border-soft); background:rgba(0,0,0,.18); }
.fc-flagpick .fcp-lbl { font-size:8.5px; font-family:var(--font-mono); color:var(--color-text-dim); width:100%; }
.fc-flagpick button { font-size:9px; font-family:var(--font-mono); padding:2px 6px; border-radius:var(--radius-sm); border:1px solid var(--color-border); background:var(--color-bg-elev1); color:var(--color-text-dim); cursor:pointer; }
.fc-flagpick button.on { background:var(--color-accent-violet); color:#fff; border-color:var(--color-accent-violet); }

/* ── post-draft grounding-reveal (the draft ASKS for grounding) ── */
/* a workflow-level project-folder set/confirm bar — appears ONLY after the draft */
.ground-rail { border: 1px solid hsl(38 92% 60% / .35); border-radius: var(--radius-lg); background: var(--color-surface); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-5); display:flex; align-items:center; gap: var(--space-3); animation: fadeSlideUp var(--dur-base) var(--ease-out); }
.ground-rail.all-set { border-color: hsl(142 71% 45% / .35); }
.ground-rail .gr-ico { font-size: 16px; flex-shrink:0; }
.ground-rail .gr-body { flex:1; min-width:0; }
.ground-rail .gr-title { font-size: var(--text-sm); font-weight:600; color: var(--color-text); }
.ground-rail .gr-sub { font-size: 11px; color: var(--color-text-muted); margin-top:2px; line-height:1.45; }
.ground-rail .gr-folder { display:inline-flex; align-items:center; gap:6px; font-size: 11.5px; font-family: var(--font-mono); padding: 5px var(--space-3); border-radius: var(--radius-md); border:1px solid; cursor:pointer; background:none; transition: all var(--dur-fast); flex-shrink:0; }
.ground-rail .gr-folder.unset { border-color: hsl(38 92% 60% / .5); background: var(--color-warning-dim); color: var(--color-warning); }
.ground-rail .gr-folder.set { border-color: hsl(142 71% 45% / .35); background: var(--color-success-dim); color: var(--color-success); }
.ground-rail .gr-folder:hover { filter:brightness(1.1); }

/* a per-phase grounding affordance pinned INSIDE a draft phase card — the phase reveals what it needs */
.needs-aff { display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-family:var(--font-mono); padding: 3px 8px; border-radius: var(--radius-full); border:1px solid; cursor:pointer; background:none; transition: all var(--dur-fast); }
.needs-aff.want { border-color: hsl(258 90% 66% / .5); background: hsl(258 90% 66% / .12); color: var(--color-accent-violet); animation: pulseGlow 2.4s infinite; }
.needs-aff.want:hover { filter:brightness(1.12); }
.needs-aff.got { border-color: hsl(258 90% 66% / .4); background: hsl(258 90% 66% / .08); color: var(--color-accent-violet); }
.needs-aff.confirm { border-color: hsl(38 92% 60% / .5); background: var(--color-warning-dim); color: var(--color-warning); animation: pulseGlow 2.4s infinite; }
.needs-aff.confirm:hover { filter:brightness(1.12); }
.pcard .p-reveal { font-size: 11px; color: var(--color-text-muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--color-border-soft); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.pcard .p-reveal .pr-lead { color: var(--color-text-dim); }
.pcard.wants-ground { border-color: hsl(258 90% 66% / .4); }

.refine-intro { display:flex; gap:var(--space-3); padding: var(--space-3) var(--space-4); border:1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); margin-bottom: var(--space-5); animation: fadeSlideUp var(--dur-base) var(--ease-out); }

<script>
// ─────────────────────────────────────────────────────────────
//  DOMAIN-AGNOSTIC EXAMPLE (strict template-fill → natural grey areas)
//  Requirement: "Fill our weekly vendor-risk report template from the
//  latest vendor assessments in our knowledge base."
//  → a template asset with placeholders (one UNMAPPED)
//  → an ambiguous folder ref ('vendor assessments' → which folder?)
//  → a strict cited fill (every placeholder must trace to evidence)
// ─────────────────────────────────────────────────────────────
const REQUIREMENT = "Fill our weekly vendor-risk report template from the latest vendor assessments in our knowledge base. Every figure must trace back to a source — it's reviewed by our risk committee.";

// The whole draft the AI emits in ONE shot (proven one-shot in spike-097).
// llm_emit is the deliverable terminus carrying the citation badge.
const PHASES = [
  {id:'gather', n:'Gather latest vendor assessments', t:'llm_agent', tt:'pt-agent',
   tools:['search_documents'], scopeRef:'vendorScope', note:'Pulls the most recent assessment per vendor from the scoped folder.'},
  {id:'extract', n:'Extract risk figures per vendor', t:'llm_batch_agents', tt:'pt-batch',
   tools:['search_documents'], note:'One agent per vendor — pulls score, tier, last-reviewed date, open findings.'},
  {id:'review', n:'Risk owner sign-off', t:'llm_human_input', tt:'pt-human',
   tools:[], note:'Pauses for the risk owner to approve the extracted figures before the report binds.'},
  {id:'emit', n:'Fill & export the vendor-risk report', t:'llm_emit', tt:'pt-emit',
   tools:[], emitter:'render_template', note:'Fills every placeholder in the template — each value cited to its assessment.',
   placeholderRef:'tplPlaceholder', citation:'strict'},
];

// The TWO+ grey areas this draft surfaces (centerpiece).
// 1. ambiguous folder ref — the PRIME trigger
// 2. unmapped template placeholder
const GREY = {
  vendorScope: {
    kind:'folder ref', ico:'📁', phase:'gather',
    // origin:'requirement' — `said` is a VERBATIM fragment of the user's requirement text, so the
    // "You said …" quote frame is honest. Never put an AI finding in this field.
    origin:'requirement',
    said:'the latest vendor assessments in our knowledge base',
    readName:'Vendors — 2025 Assessments', readId:'fld_8c1a',
    readPath:'KB › Operations › Vendors — 2025 Assessments',
    // alts are computed dynamically (folderScopeAlts) so they stay WITHIN the project_folder_id —
    // a per-phase folder_scope can only narrow inside the workflow's project folder (harness.py:241-253).
  },
  tplPlaceholder: {
    kind:'template field', ico:'❏', phase:'emit',
    // origin:'template' — the placeholder was DISCOVERED by parsing the template (DocxTemplate parse),
    // NOT spoken by the user. So `found` (the AI's reading) is rendered with a "In your template I found …"
    // frame — never the "You said …" quote frame, which is reserved for requirement-derived greys.
    // (no-silent-substitution: never conflate the user's words with the AI's reading — BRIEF §2 / §7.)
    origin:'template',
    found:'{{committee_sign_off_date}}',
    foundNote:'a placeholder in your template I can\'t source',
    readName:'Leave blank for manual entry at review time',
    readId:'unmapped',
    readPath:'template: weekly-vendor-risk.docx',
    alts:[
      {name:'Map to the "Risk owner sign-off" phase timestamp', path:'phase: review'},
      {name:'Map to today\'s run date', path:'input: run_date'},
      {name:'Drop the placeholder from the fill', path:'template edit'},
    ],
  },
};

// Strictness presets — REAL enum words only.
const PRESETS = {
  strict: {name:'Strict', emoji:'🔒', cit:'strict',
    caption:'Honest fail — the report is NOT produced if any figure can\'t be traced to a source.',
    gates:['citations_required','output_file_valid','freshness','llm_judge_rubric'],
    citMode:'deterministic'},
  middle: {name:'Middle', emoji:'⚖️', cit:'flag',
    caption:'Delivered with uncited values marked " [unverified]" + a coverage summary — working-grade.',
    gates:['citations_required','structure_check','llm_judge_rubric'],
    citMode:'presence'},
  loose: {name:'Loose', emoji:'✎', cit:'draft',
    caption:'No citation enforcement; output is prepended "DRAFT — citations not enforced" for a human to review.',
    gates:[], citMode:'presence'},
};
const GATE_LABELS = {
  citations_required:'citations_required',
  output_file_valid:'output_file_valid',
  freshness:'freshness',
  structure_check:'structure_check',
  llm_judge_rubric:'llm_judge_rubric',
};
const CIT_CAPTIONS = {
  strict:'Honest fail, deliverable NOT produced — compliance / financial / legal: reject anything unverified.',
  flag:'Deliver WITH " [unverified]" marks + a coverage summary — working-grade.',
  partial:'BLANK the uncited values (null over invent) + a gap list — data-room.',
  draft:'No enforcement; prepend "DRAFT — citations not enforced" — a human reviews.',
};

// ── live UI state ──
let CUR_V='A', STATE='empty';
let PRESET='strict', ADV_OPEN=false, CIT='strict';
let DIAL_PEEK=false;   // while grey areas are open the dial collapses to a summary chip; click to expand
let GATES = {citations_required:true, output_file_valid:true, freshness:true, structure_check:false, llm_judge_rubric:true};
// grey-area resolution map: greyKey → 'unconfirmed' | 'confirmed' | 'corrected:<altName>'
let RESOLVED = {};
let ACTIVE_GREY = null;   // B: which checkpoint card is open
let CHIP_OPEN = null;     // C: which chip popover is open

// ── post-draft grounding state (NET-NEW surfaces) ──
// CORE REFRAME: the AI drafts from the requirement ALONE, so grounding is REVEALED by the draft,
// not collected up front. The first screen is JUST the describe box — these surfaces only exist
// AFTER a draft. The template is OPTIONAL; its PRESENCE flips analysis-mode <-> fill-mode (ties to the dial).
let TPL_ATTACHED = false;      // start UNATTACHED — the draft's llm_emit phase REVEALS it needs a template
// The AI INFERRED a project folder from the requirement (fld_ops) but it is UNCONFIRMED until you confirm it.
// Once confirmed it is the workflow-level project_folder_id; the per-phase folder_scope (fld_8c1a, a descendant)
// can only narrow WITHIN it (harness.py:241-253). project_folder_id is author-CONFIRMED, never silently bound.
let PROJECT_FOLDER = 'fld_ops'; // the folder the AI inferred (the value); confirmation is tracked separately
let PROJECT_CONFIRMED = false; // has the author confirmed the inferred project_folder_id? (set/confirm affordance)
let FOLDER_POP = false;        // project-folder picker popover open
let FOLDER_Q = '';             // folder search query
let FC_OPEN = false;           // fill-contract inspection panel open
let FC_FLAG = 'clean';         // which fill-contract flag state is demonstrated: clean|malformed|runsplit|empty|wrongfmt
// JOB 2: one-time dismissible "needs a template" contextual banner. Appears WITH the draft (never on EMPTY),
// points at the fill step. Once dismissed it stays gone for the session; attaching a template also retires it.
let TPL_NUDGE_DISMISSED = false;
// JOB 3: tiered-guidance ⓘ micro-hint popover — which explainer is open (key into INFO_HINTS), or null.
let INFO_OPEN = null;

// ── the project folder tree (simplified, searchable) — author's DELIBERATE choice ──
// Distinct from per-phase folder_scope (the AI INFERS that + you confirm in the grey-area loop).
const FOLDERS = [
  {id:'fld_root', name:'Knowledge Base', lvl:0, ico:'🏠', parent:null},
  {id:'fld_ops',  name:'Operations', lvl:1, ico:'📁', parent:'fld_root'},
  {id:'fld_8c1a', name:'Vendors — 2025 Assessments', lvl:2, ico:'📁', parent:'fld_ops'},
  {id:'fld_arc24',name:'Vendors — Archive 2024', lvl:2, ico:'📁', parent:'fld_ops'},
  {id:'fld_proc', name:'Procurement', lvl:1, ico:'📁', parent:'fld_root'},
  {id:'fld_onb',  name:'Vendor Onboarding', lvl:2, ico:'📁', parent:'fld_proc'},
  {id:'fld_fin',  name:'Finance', lvl:1, ico:'📁', parent:'fld_root'},
];
function folderById(id){ return FOLDERS.find(f=>f.id===id)||null; }
function folderBreadcrumb(id){ const parts=[]; let f=folderById(id); while(f){ parts.unshift(f.name); f=f.parent?folderById(f.parent):null; } return 'KB › '+parts.slice(1).join(' › '); }
function isDescendant(id, ancestorId){ let f=folderById(id); while(f){ if(f.parent===ancestorId) return true; f=f.parent?folderById(f.parent):null; } return false; }
// Per-phase folder_scope can ONLY narrow WITHIN the project_folder_id (harness.py:241-253).
// So the grey-area alternatives are descendants of the picked project folder — never siblings/the whole KB.
// folder_scope is itself a BOUND list[UUID] (BRIEF 3.6), so each confirmed scope is rendered as a list.
function folderScopeAlts(){
  if(!PROJECT_FOLDER) return [];   // no project folder → folder_scope is unbindable; card prompts to pick one first
  return FOLDERS
    .filter(f=>f.id!=='fld_8c1a' && isDescendant(f.id, PROJECT_FOLDER))
    .map(f=>({name:f.name, id:f.id, path:folderBreadcrumb(f.id)}))
    .concat([{name:'Fall back to the whole PROJECT folder', id:PROJECT_FOLDER, path:folderBreadcrumb(PROJECT_FOLDER)}]);
}

// ── the parsed fill-contract for each flag state (framed as parsed via the REAL extractor) ──
// Real parser: DocxTemplate.get_undeclared_template_variables() / parse_docx_template_variables (stdlib zip+regex).
const FILL_CONTRACTS = {
  clean: {
    cls:'clean', icon:'✓', file:'weekly-vendor-risk.docx', fmt:'docx',
    status:'Clean contract — 5 placeholders parsed · 4 mappable from your KB · 1 unmapped',
    placeholders:[
      {tag:'{{vendor_name}}', kind:'field', mapped:true, src:'KB → assessment.vendor'},
      {tag:'{{risk_tier}}', kind:'field', mapped:true, src:'KB → assessment.tier'},
      {tag:'{{review_date}}', kind:'field', mapped:true, src:'KB → assessment.last_reviewed'},
      {tag:'{%tr for r in risks%}', kind:'loop / table row', mapped:true, src:'KB → assessment.open_findings[]'},
      {tag:'{{committee_sign_off_date}}', kind:'field', mapped:false, src:'no KB source found'},
    ],
    callout:null,
  },
  malformed: {
    cls:'rejected', icon:'✕', file:'q3-board-deck.docx', fmt:'docx',
    status:'Rejected — malformed template tag (Jinja won\'t compile)',
    placeholders:[],
    badtag:'{{ revenue_total   ← unclosed: opening {{ never closed before paragraph end',
    callout:{cls:'warn', html:'<b>The exact bad tag is shown above.</b> The filler can\'t guess your intent from a broken tag — fix it in the source document and re-upload. Nothing is auto-repaired (silent repair could bind the wrong field).'},
  },
  runsplit: {
    cls:'warn', icon:'⚠', file:'monthly-summary.docx', fmt:'docx',
    status:'Word run-split warning — 1 placeholder fragmented across XML runs',
    placeholders:[
      {tag:'{{period_label}}', kind:'field', mapped:true, src:'KB → run.period'},
      {tag:'{{ total_⟂spend }}', kind:'field · SPLIT', mapped:false, src:'fragmented — filler can\'t see it'},
    ],
    callout:{cls:'warn', html:'<b>Known silent-miss failure mode.</b> Word fragmented <code>{{total_spend}}</code> across separate XML runs (an edit mid-tag), so the renderer never sees it as one variable — it would silently stay literal in the output. <b>Fix: delete the placeholder and retype it in one pass</b> (no mid-tag cursor moves), then re-upload.'},
  },
  empty: {
    cls:'empty', icon:'○', file:'vendor-notes.docx', fmt:'docx',
    status:'No placeholders found — this is not a fillable template',
    placeholders:[],
    callout:{cls:'', html:'This .docx has <b>zero <code>{{…}}</code> placeholders</b> — nothing to fill. Did you mean <b>analysis mode</b>? Remove the template and the workflow writes prose / a written analysis instead (the deliverable still goes through the judge + integrity gate).'},
  },
  wrongfmt: {
    cls:'rejected', icon:'✕', file:'risk-data.csv', fmt:'csv',
    status:'Wrong format — fill-contract templates must be .docx / .pptx / .xlsx',
    placeholders:[],
    callout:{cls:'warn', html:'<b>.csv isn\'t a fillable Office template.</b> The placeholder parser only reads <code>.docx</code> (DocxTemplate), <code>.pptx</code>, and <code>.xlsx</code>. Convert to one of those, or upload it as a regular KB document and use analysis mode.'},
  },
};
const FC_FLAG_ORDER = ['clean','malformed','runsplit','empty','wrongfmt'];
const FC_FLAG_LABEL = {clean:'clean', malformed:'malformed tag', runsplit:'word run-split', empty:'no placeholders', wrongfmt:'wrong format'};

// ── JOB 3: tiered-guidance micro-hint explainers (the ⓘ popovers). REAL enum words only — no invented labels. ──
// Surface-to-stakes: these are passive, non-blocking, hidden behind the ⓘ until hover/tap. No modal here.
const INFO_HINTS = {
  how: {
    title:'How this works', glyph:'✎', enum:null,
    body:`<b>You describe the goal in plain language</b> — not a phase list. The AI then drafts the whole workflow in one pass, <b>sets the strictness</b> proportional to the stakes you described, and <b>asks you about anything it had to guess</b> (an ambiguous folder, an unmapped template field) instead of silently inventing it. Grounding — the template + the project folder — is a <b>refinement the draft reveals</b>, not something you set up front.<br><br>The requirement is the one <b>required</b> field — <b>publish is rejected (400) without it</b>, and it's what the always-on publish judge grades the deliverable against.`,
    foot:'the first screen stays just the box · required field',
  },
  project_folder: {
    title:'Project folder', glyph:'📁', enum:'project_folder_id',
    body:`The workflow's <b>home knowledge base</b> — the folder you <b>confirm</b> (binds as a single UUID, never a path). It's distinct from the per-phase <code>folder_scope</code> the AI <b>infers</b> for each searching phase: a phase's <code>folder_scope</code> can only <b>narrow WITHIN</b> the project folder, never reach outside it. You set the project folder; the AI only guesses the per-phase narrowing — and surfaces that guess for you to confirm.`,
    foot:'project_folder_id (UUID) · author-confirmed, never silently bound',
  },
  strict: {
    title:'Strict / citation_policy', glyph:'🔒', enum:'citation_policy',

    enums:[
      {k:'strict', v:'Honest fail — the deliverable is NOT produced if any value is uncited.'},
      {k:'flag', v:'Deliver WITH " [unverified]" marks + a coverage summary.'},
      {k:'partial', v:'Blank the uncited values (null over invent) + a gap list.'},
      {k:'draft', v:'No enforcement; prepend "DRAFT — citations not enforced".'},
    ],
    foot:"citation_policy strict|flag|partial|draft · llm_emit only",
  },
  judge: {
    title:'The always-on judge', glyph:'🛡', enum:'llm_judge_rubric',

    foot:'always-on at publish · the dial cannot remove it',
  },
};
function openInfo(e, key){ if(e){ e.stopPropagation(); }
  INFO_OPEN=key; render();
  // re-resolve the dot's anchor AFTER render (the old node was destroyed) so the popover pins to the live ⓘ.
  requestAnimationFrame(()=>{ const pop=document.getElementById('infoPop'); if(!pop) return;
    const w=pop.offsetWidth||280, h=pop.offsetHeight||160;
    const anchor=document.getElementById('infoDot-'+key);
    const r=anchor?anchor.getBoundingClientRect():null;
    if(r && (r.width||r.height)){ pop.style.top=Math.min(r.bottom+8, window.innerHeight-h-12)+'px';
      pop.style.left=Math.max(12, Math.min(r.left-8, window.innerWidth-w-12))+'px'; }
    else { pop.style.top=Math.max(64,(window.innerHeight-h)/2)+'px'; pop.style.left=Math.max(12,(window.innerWidth-w)/2)+'px'; }
  });
}

// ── strictness dial ──
function applyPreset(p){ PRESET=p; CIT=PRESETS[p].cit; const set=new Set(PRESETS[p].gates);
  GATES={citations_required:set.has('citations_required'),output_file_valid:set.has('output_file_valid'),freshness:set.has('freshness'),structure_check:set.has('structure_check'),llm_judge_rubric:set.has('llm_judge_rubric')};
  render(); }
function toggleGate(g){ GATES[g]=!GATES[g]; PRESET='custom'; render(); }

  const PRE_TIMING={freshness:true};

}

// ── phase scope/placeholder chip (reflects grey-area state) ──
function scopeChip(p){
  if(!p.scopeRef) return '';
  const st=RESOLVED[p.scopeRef]||'unconfirmed', g=GREY[p.scopeRef];
  // folder_scope binds as a list[UUID] (BRIEF 3.6) — render it as a list even with one element.
  if(st==='unconfirmed') return `<span class="tchip scope unconfirmed" title="Folder ref not yet confirmed">📁 “${g.said.split(' in ')[0]}” — needs confirm</span>`;
  if(st.startsWith('corrected:')){ const nm=st.slice(10); const f=FOLDERS.find(x=>x.name===nm); const id=f?f.id:g.readId; return `<span class="tchip scope" title="folder_scope: [${id}]">📁 folder_scope [${id}] · ${nm}</span>`; }
  return `<span class="tchip scope" title="folder_scope: [${g.readId}]">📁 folder_scope [${g.readId}] · ${g.readName}</span>`;
}
function placeholderChip(p){
  if(!p.placeholderRef) return '';
  const st=RESOLVED[p.placeholderRef]||'unconfirmed';
  if(st==='unconfirmed') return `<span class="tchip placeholder" title="Unmapped placeholder">❏ {{committee_sign_off_date}} — unmapped</span>`;
  if(st.startsWith('corrected:')) return `<span class="tchip resolved">❏ ${st.slice(10).slice(0,28)}…</span>`;
  return `<span class="tchip resolved">❏ blank for manual entry</span>`;
}
function gateChips(p){
  if(p.t!=='llm_emit') return '';
  // BRIEF §3.4/§3.5: validators are PER-PHASE — freshness (timing='pre') keys to the searching phase,
  // not the emit deliverable. So count emit-node gates separately from pre-timing ones rather than
  // implying the whole set runs on this node. freshness shows on the searching phase's chip instead.
  const PRE_TIMING = {freshness:true};
  const emitGates = Object.keys(GATES).filter(g=>GATES[g] && !PRE_TIMING[g]).length;
  return `<span class="tchip gate" title="Per-phase validators that run on THIS deliverable node — pre-timing gates like freshness key to their own phase; the publish judge is a separate always-on gate, not a per-phase one">${emitGates} gate${emitGates===1?'':'s'} on this node + publish judge</span><span class="tchip cit">citation_policy: ${CIT}</span>`;
}

      return `<div class="p-reveal" id="emitAttachAnchor"><span class="pr-lead" style="width:100%">⬆ To fill a document this phase needs a template:</span>
        <div class="attach-tpl-row">
          <button class="attach-tpl-btn" onclick="attachTemplate()">

            <span class="atb-fmt">net-new</span>

        <span class="pr-lead" style="width:100%">Without one the deliverable is <b>written prose</b> (analysis mode). The template's presence flips analysis ↔ fill — clicking opens the fill-contract (placeholders + flag states).</span></div>`;
    }
    return `<div class="p-reveal"><span class="pr-lead">❏ Template attached —</span>
      <button class="needs-aff got" onclick="openFillContract()">fill mode · weekly-vendor-risk.docx · inspect ▸</button></div>`;
  }
  // searching phase: reveal the per-phase folder_scope the AI INFERRED — confirm or correct it.
  if(p.scopeRef==='vendorScope'){
    const st=RESOLVED[p.scopeRef]||'unconfirmed';
    if(st==='unconfirmed'){
      const projFolder = PROJECT_FOLDER?FOLDERS.find(f=>f.id===PROJECT_FOLDER):null;
      const inferred = FOLDERS.find(f=>f.id===GREY.vendorScope.readId);
      return `<div class="p-reveal"><span class="pr-lead">📁 I inferred this phase searches</span>
        <button class="needs-aff confirm" id="chipAnchor-vendorScope" onclick="openChip(event,'vendorScope')">${inferred?inferred.name:'a folder'} · confirm folder ▾</button>
        <span class="pr-lead" style="width:100%">I never silently bind a scope${projFolder?` — only folders inside <b>${projFolder.name}</b> are offered`:''}.</span></div>`;
    }
    const f=FOLDERS.find(x=>x.id===(st.startsWith('corrected:')?(FOLDERS.find(z=>z.name===st.slice(10))||{}).id:GREY.vendorScope.readId));
    return `<div class="p-reveal"><span class="pr-lead">📁 Folder confirmed —</span>
      <button class="needs-aff got" onclick="openChip(event,'vendorScope')" id="chipAnchor-vendorScope" style="border-color:hsl(142 71% 45% / .4);background:var(--color-success-dim);color:var(--color-success)">folder_scope [${f?f.id:GREY.vendorScope.readId}] · change ▾</button></div>`;
  }
  return '';
}

function phaseCard(p, idx, mode){
  // mode: 'chips' (variant C) shows confirm chips inline; else read-only chips
  const tools = p.tools.map(t=>`<span class="tchip">${t}</span>`).join('');
  let scope = scopeChip(p), ph = placeholderChip(p);
  // variant C: append a confirm chip to the unconfirmed greys
  if(mode==='chips'){
    if(p.scopeRef && RESOLVED[p.scopeRef]==='unconfirmed') scope += ` <button class="chip-confirm" id="chipAnchor-${p.scopeRef}" onclick="openChip(event,'${p.scopeRef}')">confirm ▾</button>`;
    if(p.placeholderRef && RESOLVED[p.placeholderRef]==='unconfirmed') ph += ` <button class="chip-confirm" id="chipAnchor-${p.placeholderRef}" onclick="openChip(event,'${p.placeholderRef}')">confirm ▾</button>`;
  }
  const hasGrey = (p.scopeRef&&RESOLVED[p.scopeRef]==='unconfirmed')||(p.placeholderRef&&RESOLVED[p.placeholderRef]==='unconfirmed');
  const isEmit = p.t==='llm_emit';
  // the draft REVEALS what grounding this phase still needs (post-draft, on the artifact)
  const reveal = phaseRevealHTML(p);
  const wantsGround = (isEmit && !TPL_ATTACHED) || (p.scopeRef==='vendorScope' && (RESOLVED.vendorScope||'unconfirmed')==='unconfirmed');
  return `<li><span class="flow-node">${idx+1}</span>
    <div class="pcard ${isEmit?'emit':''} ${hasGrey&&mode==='chips'?'has-grey':''} ${wantsGround?'wants-ground':''}">
      <div class="pcard-top"><span class="p-name">${p.n}</span><span class="ptype ${p.tt}">${p.t}</span></div>
      <div class="p-note">${p.note}</div>
      <div class="pcard-meta">${tools}${scope}${ph}${isEmit?`<span class="tchip cit">emitter: ${p.emitter}</span>`:''}${gateChips(p)}</div>
      ${reveal}
    </div></li>`;
}

function flowHTML(mode){ return `<ol class="flow">${PHASES.map((p,i)=>phaseCard(p,i,mode)).join('')}</ol>`; }

// ── grey-area confirm card (shared vocabulary) ──
// The folder ref's alternatives + read line are computed from the picked project_folder_id so the
// per-phase folder_scope can only narrow WITHIN it (harness.py:241-253). folder_scope binds as a
// list[UUID] (BRIEF 3.6), so the read line leads with the bound id(s); the breadcrumb is human-only.
function greyAlts(key){ return key==='vendorScope' ? folderScopeAlts() : GREY[key].alts; }
// Honest origin line — NEVER conflate the user's words with the AI's reading (BRIEF §2 no-silent-substitution).
// origin:'requirement' → the `said` text is a verbatim requirement fragment, framed "You said …".
// origin:'template'    → the `found` text was parsed from the template (DocxTemplate parse), framed
//                        "In your template I found …" — it is the AI's finding, not the user's words.
function greyOriginLine(g, opts){
  opts=opts||{};
  if(g.origin==='template'){
    const note = opts.truncate ? '' : ` <span style="color:var(--color-text-dim)">— ${g.foundNote}</span>`;
    return `<div class="grey-said">In your template I found <span class="quote" style="font-family:var(--font-mono);font-style:normal">${g.found}</span>${note}</div>`;
  }
  // requirement-derived: a verbatim quote of the user's words.
  const q = opts.truncate ? `${g.said.slice(0,52)}…` : g.said;
  return `<div class="grey-said">You said <span class="quote">“${q}”</span></div>`;
}
function greyCardHTML(key, opts){
  opts=opts||{};
  // variant A renders these as a checklist inside a review panel — stamp each card with its batch position
  const batchBadge = opts.batch ? `<span class="grey-batch">${opts.batch.i} of ${opts.batch.n}</span>` : '';
  const g=GREY[key], st=RESOLVED[key]||'unconfirmed';
  const isFolder = key==='vendorScope';
  if(st!=='unconfirmed'){
    const label = st.startsWith('corrected:') ? `Corrected → ${st.slice(10)}` : `Confirmed → ${g.readName}`;
    return `<div class="grey-card resolved">
      <div class="grey-resolved-line">${batchBadge}✓ <b>${g.kind==='folder ref'?'Folder':'Template field'}:</b> ${label}
        <button class="gbtn correct" style="margin-left:auto;padding:3px 10px" onclick="reopenGrey('${key}')">change</button></div>
    </div>`;
  }
  // No project folder → folder_scope is unbindable (it requires project_folder_id). Prompt to pick one first.
  if(isFolder && !PROJECT_FOLDER){
    return `<div class="grey-card">
      <div class="grey-head">${batchBadge}<span class="gico">${g.ico}</span> Can't bind a folder scope yet<span class="grey-kind">${g.kind}</span></div>
      ${greyOriginLine(g)}
      <div class="grey-read"><span class="ico">⚠</span> <b>No project folder set</b> — <span style="font-family:var(--font-mono)">folder_scope</span> requires a <span style="font-family:var(--font-mono)">project_folder_id</span> to narrow within. Pick a project folder first.</div>
      <div class="grey-actions">
        <button class="gbtn confirm" onclick="openFolderPop(event)">📁 Pick a project folder</button>
      </div>
    </div>`;
  }
  const alts = greyAlts(key).map(a=>`<div class="grey-alt" onclick="correctGrey('${key}','${a.name.replace(/'/g,"\\'")}')"><span>↳ ${a.name}</span><span class="a-path">${a.path}</span></div>`).join('');
  // Folder read line: bound id is the primary token (id is the bound value, path is only for humans).
  const readLine = isFolder
    ? `<div class="grey-read"><span class="ico">→</span> I'll bind <b style="font-family:var(--font-mono)">folder_scope: [${g.readId}]</b> <span style="font-size:10px;color:var(--color-text-dim)">(1 id)</span><span class="bound-id" style="margin-left:auto">${g.readName}</span></div>
      <div style="font-size:10px;color:var(--color-text-dim);margin-top:5px">id is the bound value · <span style="font-family:var(--font-mono)">${g.readPath}</span> is only for you to read</div>`
    : `<div class="grey-read"><span class="ico">→</span> I read this as <b>${g.readName}</b><span class="bound-id">${g.readId}</span></div>
      ${g.readPath?`<div style="font-size:10px;color:var(--color-text-dim);font-family:var(--font-mono);margin-top:5px">${g.readPath}</div>`:''}`;
  return `<div class="grey-card">
    <div class="grey-head">${batchBadge}<span class="gico">${g.ico}</span> I made a guess here — confirm before it binds<span class="grey-kind">${g.kind}</span></div>
    ${greyOriginLine(g)}
    ${readLine}
    <div style="font-size:10px;color:var(--color-text-dim);margin-top:8px">Or correct it${isFolder?' (only folders inside your project folder)':''}:</div>
    <div class="grey-alts">${alts}</div>
    <div class="grey-actions">
      <button class="gbtn confirm" onclick="confirmGrey('${key}')">✓ Confirm — bind it</button>
    </div>
  </div>`;
}

// ── grey-area actions ──
function confirmGrey(key){ RESOLVED[key]='confirmed'; advanceActive(key); render(); }
function correctGrey(key, alt){ RESOLVED[key]='corrected:'+alt; advanceActive(key); render(); }

// ── shared popover positioning (folder picker + fill contract) ──
function positionPop(id, anchorEl){
  const pop=document.getElementById(id); if(!pop) return;
  const w=pop.offsetWidth||360, h=pop.offsetHeight||400;
  if(anchorEl){
    const r=anchorEl.getBoundingClientRect();
    pop.style.top=Math.min(r.bottom+6, window.innerHeight-h-12)+'px';
    pop.style.left=Math.max(12, Math.min(r.left, window.innerWidth-w-12))+'px';
  } else {
    // centered fallback (e.g. fill-contract opened from a chip or seeded state)
    pop.style.top=Math.max(64, (window.innerHeight-h)/2)+'px';
    pop.style.left=Math.max(12, (window.innerWidth-w)/2)+'px';
  }
}

function canvasA(){

// ── VARIANT B: inline checkpoint cards (one at a time, in the talk stream) ──
function canvasB(){
  if(STATE==='composing') return composingHTML();
  const keys=greyKeys();
  const cleared=allCleared();
  const done=fullyGrounded();
  // progress pips
  const pips=keys.map((k,i)=>{ const st=RESOLVED[k]; const done=st!=='unconfirmed'; const active=!done&&k===ACTIVE_GREY;
    const cls=done?'done':(active?'active':''); const aria=done?'confirmed':(active?'in progress':'pending');
    const glyph=done?'✓':(active?'•':(i+1)); return `<span class="cp-pip ${cls}" role="img" aria-label="checkpoint ${i+1}: ${aria}">${glyph}</span>`; }).join('');
  let stream='';
  // 1 · the user's described requirement opens the conversation
  stream += `<div class="cp-req"><span class="cr-label">★ Business requirement</span>${REQUIREMENT}</div>`;
  // 2 · the AI's draft turn — the whole draft, then "here's what I had to guess"
  stream += `<div class="cp-ai"><div class="bot"></div><div class="body">
    <div class="lead">Here's the whole draft — <b>4 phases</b>, ending in the cited template-fill. I set strictness to <b>Strict</b> because you said it's reviewed by your risk committee. I drafted from your requirement alone, so the draft shows what it still needs: a <b>template</b> + a confirmed <b>project folder</b> (above), and <b>${keys.length} guesses</b> I had to make — let me confirm those one at a time.</div>
  </div></div>`;
  // 3 · walk the checkpoints in order: resolved ones become PAST turns (AI card + user echo),
  //     the active one arrives as the latest AI turn; later ones stay hidden until reached.
  let reachedActive=false, seq=0;
  keys.forEach(k=>{
    const st=RESOLVED[k], g=GREY[k]; seq++;
    if(st!=='unconfirmed'){
      // past turn: the AI's confirm card (collapsed to its resolved line) + the user's echoed reply
      const corrected=st.startsWith('corrected:');
      const label=corrected?`corrected → ${st.slice(10)}`:`confirmed → ${g.readName}`;
      const echo=corrected?`Use “${st.slice(10)}” instead`:'Confirm — that’s right';
      stream+=`<div class="cp-ai"><div class="bot"></div><div class="body"><div class="seq">checkpoint ${seq} of ${keys.length}</div><div class="cp-resolved-mini">✓ <b>${g.kind}:</b> ${label}</div></div></div>`;
      stream+=`<div class="cp-user"><span class="cu-tag">${corrected?'corrected':'confirmed'}</span>${echo}</div>`;
    } else if(k===ACTIVE_GREY && !reachedActive){
      reachedActive=true;
      // latest AI turn: the active checkpoint card, alternatives expanded so confirm-vs-correct is live
      stream+=`<div class="cp-ai active"><div class="bot"></div><div class="body"><div class="seq">checkpoint ${seq} of ${keys.length} · just now</div>${greyCardHTML(k)}</div></div>`;
    }
  });
  if(done){
    stream+=`<div class="cp-done-banner">✓ Every guess confirmed & the draft grounded — it's now bound. Refine it by form next, or publish.</div>`;
  } else if(cleared){
    stream+=`<div class="cp-done-banner" style="border-style:solid;border-color:hsl(38 92% 60% / .4);background:var(--color-warning-dim);color:var(--color-warning)">Guesses cleared — finish the grounding above (template + project folder) to bind the draft.</div>`;
  } else {
    // a passive composer so the surface reads as a real chat thread, not a wizard
    stream+=`<div class="cp-composer"><span class="cc-input">…or reply in plain language to adjust the draft</span><span class="cc-send">Send</span></div>`;
  }
  // The draft REVEALS its grounding: the project-folder rail leads, the dial collapses, the receipt re-opens it.
  // JOB 2: the one-time "needs a template" nudge leads the checkpoint wrap, pointing down at the fill step.
  return `<div class="checkpoint-wrap">
    ${tplNudgeHTML()}
    ${groundRailHTML()}
    ${dialOrSummaryHTML()}
    ${groundReceiptHTML()}

    <div class="talk-label" style="margin-bottom:var(--space-2)">In the talk stream — one checkpoint at a time</div>
    <div class="cp-stream">${stream}</div>
  </div>`;
}
