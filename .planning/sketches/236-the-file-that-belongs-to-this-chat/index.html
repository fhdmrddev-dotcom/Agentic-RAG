<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 236 — The file that belongs to this chat</title>
<link rel="stylesheet" href="../themes/default.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);font-size:var(--text-base);display:flex;flex-direction:column;overflow:hidden}

/* ── variant nav (flow, never fixed — the 079/080 lesson) ────────────────── */
#vnav{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);
  background:var(--color-bg-elev1);border-bottom:1px solid var(--color-border);flex-shrink:0;flex-wrap:wrap}
#vnav .sk{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-dim);margin-right:var(--space-2)}
.vtab{background:transparent;border:1px solid var(--color-border);color:var(--color-text-muted);
  font-family:var(--font-sans);font-size:var(--text-xs);font-weight:500;padding:6px 12px;
  border-radius:var(--radius-full);cursor:pointer;transition:all var(--dur-fast) var(--ease-out)}
.vtab:hover{color:var(--color-text);border-color:var(--color-text-dim)}
.vtab.active{background:var(--color-primary-dim);border-color:var(--color-primary);color:var(--color-primary)}
#vnav .spacer{flex:1}

/* ── state cycler ────────────────────────────────────────────────────────── */
#states{display:flex;align-items:center;gap:6px;padding:var(--space-2) var(--space-4);
  background:var(--color-bg);border-bottom:1px solid var(--color-border-soft);flex-shrink:0;flex-wrap:wrap}
#states .lbl{font-size:var(--text-xs);color:var(--color-text-dim);margin-right:var(--space-2);
  text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stab{background:var(--color-muted);border:1px solid transparent;color:var(--color-text-muted);
  font-size:var(--text-xs);padding:4px 10px;border-radius:var(--radius-sm);cursor:pointer;
  transition:all var(--dur-fast) var(--ease-out)}
.stab:hover{color:var(--color-text);background:var(--color-accent)}
.stab.active{background:var(--color-accent);border-color:var(--color-border);color:var(--color-text)}

/* ── stage ───────────────────────────────────────────────────────────────── */
#stage{flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden;padding:var(--space-4)}
#frame{width:100%;max-width:1280px;display:flex;flex-direction:column;min-height:0;
  background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;
  transition:max-width var(--dur-slow,260ms) var(--ease-out)}
.variant{flex:1;min-height:0;display:none;flex-direction:column;position:relative}
.variant.on{display:flex}

/* ── app chrome (thin, just enough to place the composer honestly) ───────── */
.apptop{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);
  border-bottom:1px solid var(--color-border-soft);flex-shrink:0}
.apptop .dot{width:7px;height:7px;border-radius:50%;background:var(--color-success)}
.apptop .title{font-family:var(--font-headline);font-size:var(--text-sm);font-weight:600}
.apptop .crumb{font-size:var(--text-xs);color:var(--color-text-dim)}

.chat{flex:1;min-height:0;overflow-y:auto;padding:var(--space-6) var(--space-4) var(--space-4)}
.chatinner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-5)}

.msg{display:flex;gap:var(--space-3)}
.av{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;margin-top:2px}
.av.me{background:var(--color-accent);color:var(--color-text-muted)}
.av.ai{background:var(--color-primary-dim);color:var(--color-primary)}
.mbody{flex:1;min-width:0}
.mtext{font-size:var(--text-base);line-height:1.62}
.empty{color:var(--color-text-dim);font-size:var(--text-sm);text-align:center;padding:var(--space-12) 0;line-height:1.7}

/* the agent's quiet one-line pointer (decision 7 — panel-owned tools read as pointers) */
.ptr{display:inline-flex;align-items:center;gap:7px;font-size:var(--text-xs);color:var(--color-text-dim);
  font-family:var(--font-mono);margin-bottom:var(--space-2)}
.ptr .tick{color:var(--color-success)}

/* ── composer: the SHIPPED shape ─────────────────────────────────────────── */
.composerwrap{padding:0 var(--space-4) var(--space-4);flex-shrink:0}
.composer{max-width:760px;margin:0 auto;border-radius:var(--radius-xl);border:1px solid var(--color-border);
  background:hsl(220 30% 7% / 0.8);backdrop-filter:blur(6px);box-shadow:var(--shadow-lg);
  transition:box-shadow var(--dur-fast) var(--ease-out)}
.composer:focus-within{box-shadow:var(--shadow-lg),0 0 0 2px var(--color-primary-glow)}

/* chips bar — the EXISTING ActiveConnectorChips row (MessageInput.tsx:321) */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:var(--space-2) var(--space-3) 0}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:var(--text-xs);
  padding:4px 4px 4px 8px;border-radius:var(--radius-full);border:1px solid var(--color-border);
  background:var(--color-muted);animation:chipIn 220ms var(--ease-bounce)}
@keyframes chipIn{from{opacity:0;transform:translateY(4px) scale(.96)}to{opacity:1;transform:none}}
.chip .fi{flex-shrink:0}
.chip .nm{font-weight:500;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .sc{color:var(--color-primary);font-size:var(--text-xs);padding-left:7px;
  border-left:1px solid var(--color-border);margin-left:1px}
.chip .ttl{color:var(--color-text-dim);font-family:var(--font-mono);font-size:.68rem}
.chip .x{width:17px;height:17px;border-radius:50%;border:0;background:transparent;cursor:pointer;
  color:var(--color-text-dim);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:all var(--dur-fast)}
.chip .x:hover{background:var(--color-danger-dim);color:var(--color-danger)}
.chip.connector{border-style:dashed;opacity:.85}
.chip.expired{opacity:.55;border-style:dashed}
.chip.expired .nm{text-decoration:line-through}

.ta{padding:var(--space-1) var(--space-4) var(--space-1)}
.ta textarea{width:100%;min-height:36px;resize:none;border:0;background:transparent;outline:none;
  color:var(--color-text);font-family:var(--font-sans);font-size:var(--text-sm);padding:8px 0}
.ta textarea::placeholder{color:hsl(220 16% 45% / .75)}

.bar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-1) var(--space-2) var(--space-2)}
.barL{display:flex;align-items:center;gap:var(--space-1);position:relative}
.plus{width:28px;height:28px;border-radius:var(--radius-full);border:0;background:transparent;
  color:var(--color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all var(--dur-fast) var(--ease-out)}
.plus:hover{background:var(--color-muted);color:var(--color-text)}
.plus.open{background:var(--color-accent);color:var(--color-text)}
.plus.has{color:var(--color-primary)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-full);padding:5px 11px;
  font-size:var(--text-xs);font-weight:500;color:var(--color-text-muted);cursor:pointer;
  background:transparent;border:0;transition:all var(--dur-fast)}
.pill:hover{background:var(--color-muted);color:var(--color-text)}
.send{width:30px;height:30px;border-radius:var(--radius-full);border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all var(--dur-fast) var(--ease-out)}
.send.off{background:var(--color-muted);color:var(--color-text-dim);cursor:not-allowed}
.send.on{background:var(--color-primary-strong);color:white;box-shadow:var(--shadow-glow-primary)}

/* ── the + menu — DropdownMenuContent align=start side=top ───────────────── */
.menu{position:absolute;bottom:calc(100% + 6px);left:0;min-width:272px;z-index:40;
  background:var(--color-surface-hi);border:1px solid var(--color-border);border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg);overflow:hidden;display:none;
  animation:menuIn 150ms var(--ease-out)}
.menu.on{display:block}
@keyframes menuIn{from{opacity:0;transform:translateY(5px) scale(.98)}to{opacity:1;transform:none}}
.menu .mhead{padding:9px 12px 7px;font-size:.68rem;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--color-text-dim)}
.menu .grp{padding:var(--space-1);border-bottom:1px solid var(--color-border-soft)}
.menu .grp:last-child{border-bottom:0}
.mitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;cursor:pointer;
  background:transparent;color:var(--color-text);font-family:var(--font-sans);font-size:var(--text-xs);
  padding:8px 10px;border-radius:var(--radius-sm);transition:background var(--dur-fast)}
.mitem:hover{background:var(--color-accent)}
.mitem .ic{color:var(--color-primary);flex-shrink:0;display:flex}
.mitem .sub{display:block;color:var(--color-text-dim);font-size:.68rem;margin-top:2px;font-weight:400}
.mitem .lbl{font-weight:500}
.mfoot{padding:8px 12px 10px;font-size:.68rem;color:var(--color-text-dim);line-height:1.5;
  background:hsl(220 30% 5% / .6)}

/* ── destination moment: the cloud modal ─────────────────────────────────── */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);z-index:60;
  display:none;align-items:center;justify-content:center;padding:var(--space-4)}
.scrim.on{display:flex;animation:fade 160ms var(--ease-out)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:470px;background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;
  animation:modalIn 200ms var(--ease-out)}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.mtop{padding:var(--space-4) var(--space-4) var(--space-3);border-bottom:1px solid var(--color-border-soft)}
.mtop h3{margin:0;font-family:var(--font-headline);font-size:var(--text-md);font-weight:700}
.mtop p{margin:5px 0 0;font-size:var(--text-xs);color:var(--color-text-dim)}
.dest{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:5px 10px;
  border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:500;
  background:var(--color-primary-dim);color:var(--color-primary);border:1px solid var(--color-primary-glow)}
.flist{max-height:232px;overflow-y:auto;padding:var(--space-2)}
.frow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-sm);
  cursor:pointer;border:1px solid transparent;transition:all var(--dur-fast)}
.frow:hover{background:var(--color-accent)}
.frow.sel{background:var(--color-primary-dim);border-color:var(--color-primary-glow)}
.frow .nm{font-size:var(--text-xs);font-weight:500}
.frow .mt{font-size:.68rem;color:var(--color-text-dim);margin-top:2px}
.frow .rad{margin-left:auto;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--color-border);flex-shrink:0}
.frow.sel .rad{border-color:var(--color-primary);background:var(--color-primary);
  box-shadow:inset 0 0 0 3px var(--color-surface)}
.mbot{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-2);
  padding:var(--space-3) var(--space-4);border-top:1px solid var(--color-border-soft);
  background:hsl(220 30% 5% / .5)}
.btn{border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:600;padding:8px 15px;cursor:pointer;
  border:1px solid var(--color-border);background:transparent;color:var(--color-text-muted);
  transition:all var(--dur-fast) var(--ease-out);font-family:var(--font-sans)}
.btn:hover{color:var(--color-text);border-color:var(--color-text-dim)}
.btn.pri{background:var(--color-primary-strong);border-color:var(--color-primary-strong);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.pri:disabled{opacity:.4;cursor:not-allowed;filter:none}

/* ── refusal ─────────────────────────────────────────────────────────────── */
.refuse{max-width:760px;margin:0 auto var(--space-2);display:flex;align-items:flex-start;gap:10px;
  padding:11px 13px;border-radius:var(--radius-md);border:1px solid var(--color-danger);
  background:var(--color-danger-dim);animation:chipIn 200ms var(--ease-out)}
.refuse .ic{color:var(--color-danger);flex-shrink:0;margin-top:1px}
.refuse .tx{flex:1;min-width:0;font-size:var(--text-xs);line-height:1.55}
.refuse .tx b{display:block;margin-bottom:3px;font-size:var(--text-xs)}
.refuse .tx code{font-family:var(--font-mono);font-size:.68rem;color:var(--color-text-muted);
  word-break:break-word}
.refuse .ok{align-self:center;border:0;background:transparent;color:var(--color-text-muted);
  font-size:var(--text-xs);font-weight:600;cursor:pointer;padding:5px 9px;border-radius:var(--radius-sm)}
.refuse .ok:hover{background:var(--color-muted);color:var(--color-text)}

/* ── the in-sketch review card (3 actions, on the screen) ────────────────── */
.try{max-width:760px;margin:var(--space-4) auto 0;padding:var(--space-3) var(--space-4);
  border-radius:var(--radius-md);border:1px dashed var(--color-border);background:hsl(220 30% 7% / .5)}
.try h4{margin:0 0 7px;font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--color-text-dim)}
.try ol{margin:0;padding-left:17px;font-size:var(--text-xs);color:var(--color-text-muted);line-height:1.75}
.try kbd{font-family:var(--font-mono);font-size:.68rem;background:var(--color-muted);
  border:1px solid var(--color-border);border-radius:3px;padding:1px 4px;color:var(--color-text)}

/* ── the fork banner, so each variant states its own claim ───────────────── */
.claim{max-width:760px;margin:0 auto var(--space-4);padding:10px 14px;border-radius:var(--radius-md);
  border-left:2px solid var(--color-primary);background:var(--color-primary-dim);
  font-size:var(--text-xs);line-height:1.6}
.claim b{color:var(--color-primary)}

/* ── sketch toolbar ──────────────────────────────────────────────────────── */
#tools{position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;
  background:rgba(0,0,0,.78);color:#fff;padding:7px 10px;border-radius:8px;opacity:.4;
  transition:opacity .2s;display:flex;align-items:center;gap:8px}
#tools select,#tools button{font-size:11px;font-family:system-ui;background:#1b1b1b;color:#fff;
  border:1px solid #3a3a3a;border-radius:4px;padding:3px 6px;cursor:pointer}
#tools button.on{background:#4f46e5;border-color:#4f46e5}
#anno{position:fixed;z-index:10000;pointer-events:none;background:#000;color:#0f0;
  font:10px/1.4 ui-monospace,monospace;padding:3px 6px;border-radius:3px;display:none;white-space:pre}
</style>
</head>
<body>

<div id="vnav">
  <span class="sk">SKETCH 236</span>
  <button class="vtab active" data-v="a" onclick="showVariant('a')">A: Scope on the chip ★ Selected</button>
  <button class="vtab" data-v="b" onclick="showVariant('b')">B: The door names it</button>
  <span class="spacer"></span>
  <span class="sk" id="qline">How does a person know a file is HERE, not in the Library?</span>
</div>

<div id="states">
  <span class="lbl">State</span>
  <button class="stab active" data-s="rest"    onclick="showState('rest')">Rest</button>
  <button class="stab" data-s="menu"    onclick="showState('menu')">Menu open</button>
  <button class="stab" data-s="cloud"   onclick="showState('cloud')">Destination moment</button>
  <button class="stab" data-s="pending" onclick="showState('pending')">Attached, not sent</button>
  <button class="stab" data-s="sent"    onclick="showState('sent')">Sent · agent used it</button>
  <button class="stab" data-s="refused" onclick="showState('refused')">Refused (.pdf)</button>
  <button class="stab" data-s="expired" onclick="showState('expired')">Expired (24h)</button>
</div>

<div id="stage"><div id="frame">
  <div class="variant on" id="variant-a"></div>
  <div class="variant" id="variant-b"></div>
</div></div>

<div id="tools">
  <select id="themesel" onchange="swapTheme(this.value)">
    <option value="default">Deep Midnight</option>
  </select>
  <button onclick="setVP(375,this)">375</button>
  <button onclick="setVP(768,this)">768</button>
  <button class="on" onclick="setVP(0,this)">Full</button>
  <button id="annobtn" onclick="toggleAnno(this)">anno</button>
</div>
<div id="anno"></div>

<script src="COPY.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Sketch 236 — two variants x seven states, both rendered from COPY.
   ⚠ No straight apostrophes inside single-quoted strings (the 079 lesson):
     all prose lives in COPY.js using double quotes.
   ═══════════════════════════════════════════════════════════════════════════ */

var S = COPY.scenario
var E = COPY.engine
var SH = COPY.shared

var current = { v: 'a', s: 'rest' }

/* ── file-type ribbon icon, the shared fileIcon() idea from decision 10 ──── */
var EXT_COLOR = {
  '.xlsx': 'hsl(142 71% 45%)', '.docx': 'hsl(217 91% 60%)', '.pptx': 'hsl(25 95% 53%)',
  '.csv': 'hsl(142 71% 45%)', '.md': 'hsl(220 16% 55%)', '.json': 'hsl(38 92% 60%)',
  '.txt': 'hsl(220 16% 55%)', '.png': 'hsl(258 90% 66%)', '.jpg': 'hsl(258 90% 66%)',
  '.pdf': 'hsl(0 72% 51%)'
}
function fileIcon(ext, px) {
  var sz = px || 15
  var col = EXT_COLOR[ext] || 'hsl(220 16% 55%)'
  return '<svg class="fi" width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<path d="M6 2h8l5 5v15a1 1 0 01-1 1H6a1 1 0 01-1-1V3a1 1 0 011-1z" fill="' + col + '" fill-opacity="0.16" stroke="' + col + '" stroke-width="1.3"/>' +
    '<path d="M14 2v5h5" stroke="' + col + '" stroke-width="1.3"/>' +
    '<rect x="5" y="14" width="14" height="6" rx="1" fill="' + col + '"/></svg>'
}
function ico(name, px) {
  var sz = px || 15
  var P = {
    paperclip: '<path d="M21 12.8l-8.5 8.5a5 5 0 01-7-7l9-9a3.3 3.3 0 014.7 4.7l-9 9a1.7 1.7 0 01-2.4-2.4l8.3-8.3"/>',
    cloud: '<path d="M4 16a4 4 0 012-7.5 5.5 5.5 0 0110.5-1A4.2 4.2 0 0120 16"/><path d="M12 12v8M9 17l3-3 3 3"/>',
    plug: '<path d="M9 2v6M15 2v6M7 8h10v4a5 5 0 01-10 0V8zM12 17v5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    send: '<path d="M4 12l16-8-6 16-2-6-8-2z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
    warn: '<path d="M12 3l9 17H3l9-17zM12 9v5M12 17.5v.5"/>',
    check: '<path d="M20 6L9 17l-5-5"/>'
  }
  return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P[name] + '</svg>'
}

/* ── the + menu, per variant ─────────────────────────────────────────────── */
function menuHTML(v) {
  var C = COPY[v]
  var head = C.menuTitle ? '<div class="mhead">' + C.menuTitle + '</div>' : ''
  var subLocal = '', subCloud = ''
  if (v === 'a') {
    // A keeps the menu plain — no destination words here, the chip carries it.
    subLocal = ''
    subCloud = ''
  } else {
    subLocal = '<span class="sub">' + E.ALLOWED_EXT.slice(0, 3).join(" ") + " · " + E.MAX_MB + ' MB max</span>'
    subCloud = '<span class="sub">Google Drive · Meridian Supply</span>'
  }
  var foot = C.menuFooter ? '<div class="mfoot">' + C.menuFooter + '</div>' : ''
  return '' +
    '<div class="menu" id="menu-' + v + '">' + head +
      '<div class="grp">' +
        '<button class="mitem" onclick="pickLocal(\'' + v + '\')">' +
          '<span class="ic">' + ico('paperclip') + '</span>' +
          '<span><span class="lbl">' + C.itemLocal + '</span>' + subLocal + '</span></button>' +
        '<button class="mitem" onclick="openCloud(\'' + v + '\')">' +
          '<span class="ic">' + ico('cloud') + '</span>' +
          '<span><span class="lbl">' + C.itemCloud + '</span>' + subCloud + '</span></button>' +
      '</div>' +
      '<div class="grp">' +
        '<button class="mitem" onclick="noop()">' +
          '<span class="ic" style="color:var(--color-text-dim)">' + ico('plug') + '</span>' +
          '<span><span class="lbl">' + C.itemConnectors + '</span></span></button>' +
      '</div>' + foot +
    '</div>'
}

/* ── the attachment chip, per variant ────────────────────────────────────── */
function chipHTML(v, opts) {
  var C = COPY[v]
  var o = opts || {}
  if (o.expired) {
    return '<span class="chip expired" title="' + SH.expiredWhy + '">' + fileIcon(S.file.ext) +
      '<span class="nm">' + S.file.name + '</span>' +
      '<span class="sc" style="color:var(--color-text-dim)">' + SH.expiredChip + '</span></span>'
  }
  var scope = C.chipScope
    ? '<span class="sc">' + C.chipScope + '</span>' + (C.chipTtl ? '<span class="ttl">' + C.chipTtl + '</span>' : '')
    : ''
  var x = o.readonly ? '' :
    '<button class="x" title="' + C.chipRemove + '" aria-label="' + C.chipRemove + '" onclick="removeChip(\'' + v + '\')">×</button>'
  return '<span class="chip">' + fileIcon(S.file.ext) +
    '<span class="nm">' + S.file.name + '</span>' +
    '<span class="ttl">' + S.file.sizeLabel + '</span>' + scope + x + '</span>'
}

/* ── the destination moment ──────────────────────────────────────────────── */
function modalHTML(v) {
  var C = COPY[v]
  var rows = S.cloudFiles.map(function (f, i) {
    return '<div class="frow' + (i === 0 ? ' sel' : '') + '" onclick="selectRow(this)">' +
      fileIcon(f.ext, 19) +
      '<span><span class="nm">' + f.name + '</span><span class="mt">' + f.meta + '</span></span>' +
      '<span class="rad"></span></div>'
  }).join('')
  // B states the destination as a chip inside the modal; A does not.
  var dest = (v === 'b')
    ? '<span class="dest">' + ico('clock', 13) + S.threadTitle + '</span>'
    : ''
  return '' +
    '<div class="scrim" id="scrim-' + v + '" onclick="if(event.target===this)closeCloud(\'' + v + '\')">' +
      '<div class="modal" role="dialog" aria-label="' + C.cloudTitle + '">' +
        '<div class="mtop"><h3>' + C.cloudTitle + '</h3><p>' + C.cloudSub + '</p>' + dest + '</div>' +
        '<div class="flist">' + rows + '</div>' +
        '<div class="mbot">' +
          '<button class="btn" onclick="closeCloud(\'' + v + '\')">' + C.cloudCancel + '</button>' +
          '<button class="btn pri" onclick="confirmCloud(\'' + v + '\')">' + C.cloudConfirm + '</button>' +
        '</div></div></div>'
}

/* ── refusal — the SERVER's own sentence ─────────────────────────────────── */
function refuseHTML(v) {
  var allowed = E.ALLOWED_EXT.slice().sort().join(", ")
  return '<div class="refuse">' +
    '<span class="ic">' + ico('warn', 16) + '</span>' +
    '<span class="tx"><b>' + S.refusedFile.name + '</b>' +
      '<code>' + E.REFUSE_TYPE(S.refusedFile.ext, allowed) + '</code></span>' +
    '<button class="ok" onclick="showState(\'rest\')">' + SH.refusalDismiss + '</button></div>'
}

/* ── conversation ────────────────────────────────────────────────────────── */
function chatHTML(v, st) {
  var C = COPY[v]
  if (st !== 'sent' && st !== 'expired') {
    return '<div class="empty">' + S.threadTitle + '<br><span style="font-size:var(--text-xs)">' +
      'Nothing sent yet.</span></div>'
  }
  var note = (st === 'sent' && C.sentNote)
    ? '<span class="sc" style="border-left:0;padding-left:0;margin-left:4px">' + C.sentNote + '</span>'
    : ''
  var chip = (st === 'expired')
    ? chipHTML(v, { expired: true })
    : chipHTML(v, { readonly: true })
  return '' +
    '<div class="msg"><span class="av me">You</span><span class="mbody">' +
      '<div class="chips" style="padding:0 0 8px">' + chip + note + '</div>' +
      '<div class="mtext">' + S.userMsg + '</div></span></div>' +
    '<div class="msg"><span class="av ai">AI</span><span class="mbody">' +
      '<div class="ptr"><span class="tick">' + ico('check', 12) + '</span>' +
        SH.agentReadLine(S.file.name) + '</div>' +
      '<div class="mtext">' + S.agentReply + '</div></span></div>'
}

/* ── full variant render ─────────────────────────────────────────────────── */
function render(v) {
  var C = COPY[v]
  var st = current.s
  var hasChip = (st === 'pending')
  var claim = (v === 'a')
    ? '<b>A · Scope on the chip.</b> The menu says nothing about where the file goes. ' +
      'The chip is the only place that says <em>' + C.chipScope + ' · ' + C.chipTtl +
      '</em> — so the promise is made where the file actually is, and travels with it into the sent message.'
    : '<b>B · The door names it.</b> The menu header and footer settle the question before a file is ' +
      'chosen, and the modal repeats the destination. The chip then carries only the file — ' +
      'no scope word, because it was already said.'

  var refuse = (st === 'refused') ? refuseHTML(v) : ''
  var chipsRow = hasChip ? chipHTML(v, {}) : ''
  // the connector chip that already ships in this row, so the new chip is seen as a sibling
  if (hasChip) chipsRow = chipsRow + '<span class="chip connector">' + ico('plug', 13) + '<span class="nm">Meridian Supply</span></span>'

  var canSend = hasChip
  return '' +
    '<div class="apptop"><span class="dot"></span><span class="title">' + S.threadTitle + '</span>' +
      '<span class="crumb">Deep · claude-opus-5</span></div>' +
    '<div class="chat"><div class="chatinner">' + chatHTML(v, st) +
      '<div class="claim">' + claim + '</div>' +
      '<div class="try"><h4>Three things to try</h4><ol>' +
        '<li>Click the <kbd>+</kbd> in the composer — read the menu and ask yourself where a file would go.</li>' +
        '<li>Choose the cloud item, pick a file, confirm — watch what the chip then says.</li>' +
        '<li>Switch to the other variant on the same state and compare <em>only the words</em>.</li>' +
      '</ol></div>' +
    '</div></div>' +
    '<div class="composerwrap">' + refuse +
      '<div class="composer">' +
        '<div class="chips">' + chipsRow + '</div>' +
        '<div class="ta"><textarea rows="1" placeholder="' + SH.composerPlaceholder + '">' +
          (hasChip ? S.userMsg : '') + '</textarea></div>' +
        '<div class="bar"><div class="barL">' +
          '<button class="plus' + (st === 'menu' ? ' open' : '') + (hasChip ? ' has' : '') +
            '" data-testid="' + E.PLUS_BTN_TESTID + '" aria-label="Add content and tools" ' +
            'onclick="toggleMenu(\'' + v + '\')">' + ico('plus', 16) + '</button>' +
          menuHTML(v) +
          '<button class="pill">Anthropic</button>' +
          '<button class="pill">Opus 5</button>' +
          '<button class="pill">Deep</button>' +
        '</div>' +
        '<button class="send ' + (canSend ? 'on' : 'off') + '" aria-label="' + SH.sendLabel + '">' +
          ico('send', 15) + '</button></div>' +
      '</div></div>' +
    modalHTML(v)
}

function paint() {
  document.getElementById('variant-a').innerHTML = render('a')
  document.getElementById('variant-b').innerHTML = render('b')
  if (current.s === 'menu') {
    var m = document.getElementById('menu-' + current.v)
    if (m) m.classList.add('on')
  }
  if (current.s === 'cloud') {
    var sc = document.getElementById('scrim-' + current.v)
    if (sc) sc.classList.add('on')
  }
}

/* ── handlers ────────────────────────────────────────────────────────────── */
function showVariant(v) {
  current.v = v
  document.querySelectorAll('.variant').forEach(function (e) { e.classList.remove('on') })
  document.getElementById('variant-' + v).classList.add('on')
  document.querySelectorAll('.vtab').forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-v') === v)
  })
  paint()
}
function showState(s) {
  current.s = s
  document.querySelectorAll('.stab').forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-s') === s)
  })
  paint()
}
function toggleMenu(v) {
  showState(current.s === 'menu' ? 'rest' : 'menu')
}
function pickLocal(v) {
  // A local pick normally opens the OS file dialog. Here it lands straight on
  // the attached-not-sent state, which is the thing being judged.
  showState('pending')
}
function openCloud(v) { showState('cloud') }
function closeCloud(v) { showState('rest') }
function confirmCloud(v) { showState('pending') }
function removeChip(v) { showState('rest') }
function selectRow(el) {
  var list = el.parentNode
  list.querySelectorAll('.frow').forEach(function (r) { r.classList.remove('sel') })
  el.classList.add('sel')
}
function noop() { showState('rest') }

/* ── toolbar ─────────────────────────────────────────────────────────────── */
function swapTheme(n) {
  document.querySelector('link[href*=themes]').href = '../themes/' + n + '.css'
}
function setVP(w, btn) {
  document.getElementById('frame').style.maxWidth = w ? (w + 'px') : '1280px'
  document.querySelectorAll('#tools button').forEach(function (b) {
    if (b.id !== 'annobtn') b.classList.remove('on')
  })
  btn.classList.add('on')
}
var annoOn = false
function toggleAnno(btn) {
  annoOn = !annoOn
  btn.classList.toggle('on', annoOn)
  document.getElementById('anno').style.display = 'none'
}
document.addEventListener('mousemove', function (e) {
  if (!annoOn) return
  var box = document.getElementById('anno')
  var t = e.target
  if (!t || t === document.body) { box.style.display = 'none'; return }
  var cs = getComputedStyle(t)
  box.textContent = t.tagName.toLowerCase() + (t.className && typeof t.className === 'string' ? '.' + t.className.split(' ')[0] : '') +
    '\n' + Math.round(t.getBoundingClientRect().width) + ' x ' + Math.round(t.getBoundingClientRect().height) +
    '\ncolor  ' + cs.color + '\nsize   ' + cs.fontSize + '\npad    ' + cs.padding
  box.style.display = 'block'
  box.style.left = (e.clientX + 14) + 'px'
  box.style.top = (e.clientY + 14) + 'px'
})

paint()
</script>
</body>
</html>
