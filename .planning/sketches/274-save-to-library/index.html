<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 274 — Save to Library</title>
<link rel="stylesheet" href="../themes/default.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);font-size:var(--text-base);display:flex;flex-direction:column;overflow:hidden}

/* ── variant nav + state cycler (flow, never fixed) ─────────────────────── */
#vnav{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);
  background:var(--color-bg-elev);border-bottom:1px solid var(--color-border);flex-shrink:0;flex-wrap:wrap}
#vnav .sk{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-dim);margin-right:var(--space-2)}
.vtab{background:transparent;border:1px solid var(--color-border);color:var(--color-text-muted);
  font-family:var(--font-sans);font-size:var(--text-xs);font-weight:500;padding:6px 12px;
  border-radius:var(--radius-full);cursor:pointer;transition:all var(--dur-fast) var(--ease-out)}
.vtab:hover{color:var(--color-text);border-color:var(--color-text-dim)}
.vtab.active{background:var(--color-primary-dim);border-color:var(--color-primary);color:var(--color-primary)}
#vnav .spacer{flex:1}
#states{display:flex;align-items:center;gap:6px;padding:var(--space-2) var(--space-4);
  background:var(--color-bg);border-bottom:1px solid var(--color-border-soft);flex-shrink:0;flex-wrap:wrap}
#states .lbl{font-size:var(--text-xs);color:var(--color-text-dim);margin-right:var(--space-2);
  text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stab{background:var(--color-muted);border:1px solid transparent;color:var(--color-text-muted);
  font-size:var(--text-xs);padding:4px 10px;border-radius:var(--radius-sm);cursor:pointer;
  transition:all var(--dur-fast) var(--ease-out);font-family:var(--font-sans)}
.stab:hover{color:var(--color-text);background:var(--color-accent)}
.stab.active{background:var(--color-accent);border-color:var(--color-border);color:var(--color-text)}

/* ── stage ───────────────────────────────────────────────────────────────── */
#stage{flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden;padding:var(--space-4)}
#frame{width:100%;max-width:1280px;display:flex;flex-direction:column;min-height:0;
  background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;
  transition:max-width var(--dur-slow) var(--ease-out)}
.variant{flex:1;min-height:0;display:none;flex-direction:column;position:relative}
.variant.on{display:flex}
.apptop{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);
  border-bottom:1px solid var(--color-border-soft);flex-shrink:0}
.apptop .dot{width:7px;height:7px;border-radius:50%;background:var(--color-success)}
.apptop .title{font-family:var(--font-headline);font-size:var(--text-sm);font-weight:600}
.apptop .crumb{font-size:var(--text-xs);color:var(--color-text-dim)}
.apptop .sp{flex:1}
.ptog{font-size:var(--text-xs);border:1px solid var(--color-border);background:transparent;color:var(--color-text-muted);
  border-radius:var(--radius-sm);padding:4px 9px;cursor:pointer;font-family:var(--font-sans);transition:all var(--dur-fast)}
.ptog:hover,.ptog.on{color:var(--color-text);border-color:var(--color-text-dim)}

.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);transition:grid-template-columns var(--dur-slow) var(--ease-out)}
.body.withpanel{grid-template-columns:minmax(0,1fr) 30%}
.col{display:flex;flex-direction:column;min-height:0}
.chat{flex:1;min-height:0;overflow-y:auto;padding:var(--space-6) var(--space-4) var(--space-4)}
.chatinner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-5)}
.msg{display:flex;gap:var(--space-3)}
.av{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;margin-top:2px}
.av.me{background:var(--color-accent);color:var(--color-text-muted)}
.av.ai{background:var(--color-primary-dim);color:var(--color-primary)}
.mbody{flex:1;min-width:0}
.mtext{font-size:var(--text-base);line-height:1.62}
.ptr{display:inline-flex;align-items:center;gap:7px;font-size:var(--text-xs);color:var(--color-text-dim);
  font-family:var(--font-mono);margin-bottom:var(--space-2)}
.ptr .tick{color:var(--color-success)}

/* ── the attachment chip (shipped 244 shape, 24h dropped per D-07) ───────── */
.chiprow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 0 8px;position:relative}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:var(--text-xs);
  padding:4px 4px 4px 8px;border-radius:var(--radius-full);border:1px solid var(--color-border);
  background:var(--color-muted)}
.chip .nm{font-weight:500;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .sz{color:var(--color-text-dim);font-family:var(--font-mono);font-size:.68rem}
.chip .sc{color:var(--color-text-muted);padding-left:7px;border-left:1px solid var(--color-border)}
.chip .pad{width:4px}
/* A: the always-visible ⋯ inside the chip */
.more{width:20px;height:20px;border-radius:50%;border:0;background:transparent;cursor:pointer;
  color:var(--color-text-dim);display:flex;align-items:center;justify-content:center;transition:all var(--dur-fast)}
.more:hover,.more.open,.more:focus-visible{background:var(--color-accent);color:var(--color-text);outline:none}
/* A: the segment the chip gains after a save */
.seg{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 7px;margin-left:2px;border-radius:var(--radius-full);
  background:var(--color-success-dim);color:var(--color-success);font-weight:500;cursor:pointer;
  text-decoration:none;transition:filter var(--dur-fast);animation:segIn 260ms var(--ease-bounce)}
.seg:hover{filter:brightness(1.15)}
.seg.already{background:var(--color-primary-dim);color:var(--color-primary)}
.seg .ix,.libchip .ix,.after .ix{color:var(--color-text-dim);font-family:var(--font-mono);font-size:.66rem;font-weight:400}
@keyframes segIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
/* B: the verb written beside the chip */
.verb{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;
  color:var(--color-text-muted);font-family:var(--font-sans);font-size:var(--text-xs);font-weight:500;
  padding:4px 9px;border-radius:var(--radius-full);cursor:pointer;transition:all var(--dur-fast)}
.verb:hover,.verb.hot,.verb:focus-visible{color:var(--color-primary);border-color:var(--color-primary-glow);background:var(--color-primary-dim);outline:none}
/* B: the sibling Library chip */
.libchip{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:500;
  padding:4px 10px 4px 8px;border-radius:var(--radius-full);border:1px solid hsl(38 92% 50% / .35);
  background:var(--color-warning-dim);color:var(--color-text);cursor:pointer;animation:segIn 260ms var(--ease-bounce);
  transition:filter var(--dur-fast)}
.libchip:hover{filter:brightness(1.15)}
.libchip .fold{color:var(--color-warning);display:flex}
.libchip{max-width:100%;white-space:nowrap;min-width:0}
.libchip .path{color:var(--color-text-muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg{white-space:nowrap}
.libchip .ext{color:var(--color-text-dim)}
/* C: icon button + tooltip */
.ibtn{width:26px;height:26px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;
  color:var(--color-text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;
  transition:all var(--dur-fast)}
.ibtn:hover,.ibtn.hot,.ibtn:focus-visible{color:var(--color-primary);background:var(--color-primary-dim);border-color:var(--color-primary-glow);outline:none}
.tip{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;
  background:var(--color-surface-hi);border:1px solid var(--color-border);color:var(--color-text);
  font-size:.68rem;padding:4px 8px;border-radius:var(--radius-sm);box-shadow:var(--shadow-md);
  pointer-events:none;opacity:0;transition:opacity var(--dur-fast)}
.ibtn:hover .tip,.ibtn.hot .tip,.ibtn:focus-visible .tip{opacity:1}
/* C: the line under the message */
.after{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:var(--text-xs);color:var(--color-text-muted);
  animation:segIn 260ms var(--ease-out)}
.after .ok{color:var(--color-success);display:flex}
.after.already .ok{color:var(--color-primary)}
.after a{color:var(--color-primary);text-decoration:none;font-weight:500;cursor:pointer}
.after a:hover{text-decoration:underline}

/* A: the chip menu */
.cmenu{position:absolute;top:calc(100% - 2px);left:0;min-width:200px;z-index:30;background:var(--color-surface-hi);
  border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:var(--space-1);
  animation:menuIn 150ms var(--ease-out)}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.mitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;cursor:pointer;
  background:transparent;color:var(--color-text);font-family:var(--font-sans);font-size:var(--text-xs);
  padding:8px 10px;border-radius:var(--radius-sm);transition:background var(--dur-fast)}
.mitem:hover{background:var(--color-accent)}
.mitem .ic{color:var(--color-primary);display:flex}
.mitem.dim .ic{color:var(--color-text-dim)}

/* ── the composer (static — this sketch is about the transcript) ─────────── */
.composerwrap{padding:0 var(--space-4) var(--space-4);flex-shrink:0}
.composer{max-width:760px;margin:0 auto;border-radius:var(--radius-xl);border:1px solid var(--color-border);
  background:hsl(220 30% 7% / 0.8);padding:12px 14px;font-size:var(--text-sm);color:hsl(220 16% 45% / .75)}

/* ── claim + try ─────────────────────────────────────────────────────────── */
.claim{max-width:760px;margin:var(--space-2) auto 0;padding:10px 14px;border-radius:var(--radius-md);
  border-left:2px solid var(--color-primary);background:var(--color-primary-dim);font-size:var(--text-xs);line-height:1.6}
.claim b{color:var(--color-primary)}
.try{max-width:760px;margin:var(--space-3) auto 0;padding:var(--space-3) var(--space-4);
  border-radius:var(--radius-md);border:1px dashed var(--color-border);background:hsl(220 30% 7% / .5)}
.try h4{margin:0 0 7px;font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-dim)}
.try ol{margin:0;padding-left:17px;font-size:var(--text-xs);color:var(--color-text-muted);line-height:1.75}

/* ── the panel (Files section) ───────────────────────────────────────────── */
.panel{border-left:1px solid var(--color-border);background:var(--color-bg-elev);display:flex;flex-direction:column;min-height:0;
  animation:panIn 240ms var(--ease-out)}
@keyframes panIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.psec{padding:var(--space-3) var(--space-4)}
.phead{display:flex;align-items:center;gap:8px;font-size:.68rem;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--color-text-dim);margin-bottom:var(--space-2)}
.phead .ct{font-family:var(--font-mono);background:var(--color-muted);border-radius:var(--radius-full);padding:1px 7px;font-weight:500}
.frow{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:var(--radius-sm);position:relative;
  transition:background var(--dur-fast)}
.frow:hover{background:var(--color-accent)}
.frow .meta{flex:1;min-width:0}
.frow .fn{font-size:var(--text-xs);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fm{font-size:.68rem;color:var(--color-text-dim);margin-top:2px}
.frow .fm .agent{color:var(--color-text-dim);font-style:italic}
.frow .act{flex-shrink:0;display:flex;align-items:center;gap:4px}
.frow .cmenu{top:calc(100% - 4px);left:auto;right:6px}
.frow .fm .seg,.frow .fm .libchip{margin-left:0;margin-top:5px}

/* ── the dialog ──────────────────────────────────────────────────────────── */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:var(--space-4);animation:fade 160ms var(--ease-out)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:480px;background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;animation:modalIn 200ms var(--ease-out)}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.mtop{padding:var(--space-4) var(--space-4) var(--space-3);border-bottom:1px solid var(--color-border-soft)}
.mtop h3{margin:0;font-family:var(--font-headline);font-size:var(--text-md);font-weight:700}
.mtop p{margin:5px 0 0;font-size:var(--text-xs);color:var(--color-text-dim);line-height:1.5}
.filechip{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font-size:var(--text-xs);
  padding:4px 10px 4px 8px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-muted)}
.mmid{padding:var(--space-3) var(--space-4)}
.flabel{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-dim);margin-bottom:7px}
.search{width:100%;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-sm);
  color:var(--color-text);font-family:var(--font-sans);font-size:var(--text-xs);padding:8px 10px;outline:none;margin-bottom:6px;
  transition:border-color var(--dur-fast)}
.search:focus{border-color:var(--color-primary)}
.flist{max-height:220px;overflow-y:auto;border:1px solid var(--color-border-soft);border-radius:var(--radius-sm);padding:4px}
.opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--radius-sm);cursor:pointer;
  border:1px solid transparent;font-size:var(--text-xs);transition:all var(--dur-fast)}
.opt:hover{background:var(--color-accent)}
.opt.sel{background:var(--color-primary-dim);border-color:var(--color-primary-glow)}
.opt .fold{color:var(--color-warning);display:flex;flex-shrink:0}
.opt .par{color:var(--color-text-dim)}
.opt .leaf{font-weight:500}
.opt .rad{margin-left:auto;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--color-border);flex-shrink:0}
.opt.sel .rad{border-color:var(--color-primary);background:var(--color-primary);box-shadow:inset 0 0 0 3px var(--color-surface)}
.none{font-size:var(--text-xs);color:var(--color-text-dim);padding:10px}
/* B tree */
.tnode{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;
  font-size:var(--text-xs);border:1px solid transparent;transition:all var(--dur-fast)}
.tnode:hover{background:var(--color-accent)}
.tnode.sel{background:var(--color-primary-dim);border-color:var(--color-primary-glow)}
.tnode .chev{width:14px;color:var(--color-text-dim);display:flex;justify-content:center;transition:transform var(--dur-fast)}
.tnode .chev.open{transform:rotate(90deg)}
.tnode .fold{color:var(--color-warning);display:flex}
/* C select */
.sel-trig{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--color-bg);
  border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-family:var(--font-sans);
  font-size:var(--text-xs);padding:8px 10px;cursor:pointer;transition:border-color var(--dur-fast)}
.sel-trig:hover,.sel-trig.open{border-color:var(--color-text-dim)}
.sel-trig .ph{color:var(--color-text-dim)}
.sel-pop{margin-top:4px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface-hi);
  box-shadow:var(--shadow-md);padding:4px;max-height:200px;overflow-y:auto;animation:menuIn 140ms var(--ease-out)}
/* warnings + refusal */
.warn{display:flex;gap:9px;margin-top:10px;padding:9px 11px;border-radius:var(--radius-sm);font-size:var(--text-xs);line-height:1.5;
  border:1px solid hsl(38 92% 50% / .4);background:var(--color-warning-dim);animation:segIn 200ms var(--ease-out)}
.warn .ic{color:var(--color-warning);flex-shrink:0;margin-top:1px}
.err{display:flex;gap:9px;margin-top:10px;padding:9px 11px;border-radius:var(--radius-sm);font-size:var(--text-xs);line-height:1.5;
  border:1px solid var(--color-danger);background:var(--color-danger-dim);animation:segIn 200ms var(--ease-out)}
.err .ic{color:var(--color-danger);flex-shrink:0;margin-top:1px}
.err code{display:block;font-family:var(--font-mono);font-size:.68rem;color:var(--color-text-muted);margin-top:2px}
.mbot{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-2);padding:var(--space-3) var(--space-4);
  border-top:1px solid var(--color-border-soft);background:hsl(220 30% 5% / .5)}
.mbot .req{margin-right:auto;font-size:.68rem;color:var(--color-text-dim)}
.btn{border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:600;padding:8px 15px;cursor:pointer;
  border:1px solid var(--color-border);background:transparent;color:var(--color-text-muted);
  transition:all var(--dur-fast) var(--ease-out);font-family:var(--font-sans)}
.btn:hover{color:var(--color-text);border-color:var(--color-text-dim)}
.btn.pri{background:var(--color-primary-strong);border-color:var(--color-primary-strong);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.pri:disabled{opacity:.4;cursor:not-allowed;filter:none}
/* already result */
.result{padding:var(--space-5) var(--space-4) var(--space-4);text-align:left}
.result .big{display:flex;align-items:center;gap:10px;font-family:var(--font-headline);font-size:var(--text-md);font-weight:700}
.result .big .ic{color:var(--color-primary);display:flex}
.result p{font-size:var(--text-xs);color:var(--color-text-muted);line-height:1.6;margin:8px 0 0}
.result .where{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:var(--text-xs);font-weight:500;
  padding:4px 10px 4px 8px;border-radius:var(--radius-full);border:1px solid hsl(38 92% 50% / .35);background:var(--color-warning-dim)}
.result .where .fold{color:var(--color-warning);display:flex}

/* ── toolbar ─────────────────────────────────────────────────────────────── */
#tools{position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;
  background:rgba(0,0,0,.78);color:#fff;padding:7px 10px;border-radius:8px;opacity:.4;
  transition:opacity .2s;display:flex;align-items:center;gap:8px}
#tools:hover{opacity:1}
#tools select,#tools button{font-size:11px;font-family:system-ui;background:#1b1b1b;color:#fff;
  border:1px solid #3a3a3a;border-radius:4px;padding:3px 6px;cursor:pointer}
#tools button.on{background:#4f46e5;border-color:#4f46e5}
#anno{position:fixed;z-index:10000;pointer-events:none;background:#000;color:#0f0;
  font:10px/1.4 ui-monospace,monospace;padding:3px 6px;border-radius:3px;display:none;white-space:pre}
</style>
</head>
<body>

<div id="vnav">
  <span class="sk">SKETCH 274</span>
  <button class="vtab active" data-v="a" onclick="showVariant('a')">A: Menu on the chip ★ Selected</button>
  <button class="vtab" data-v="b" onclick="showVariant('b')">B: The word on the chip</button>
  <button class="vtab" data-v="c" onclick="showVariant('c')">C: Icon + plain picker</button>
  <span class="spacer"></span>
  <span class="sk">How does a person keep a chat file, on purpose, and see that they did?</span>
</div>

<div id="states">
  <span class="lbl">State</span>
  <button class="stab active" data-s="sent"    onclick="showState('sent')">Sent</button>
  <button class="stab" data-s="offer"   onclick="showState('offer')">Action offered</button>
  <button class="stab" data-s="pick"    onclick="showState('pick')">Pick a folder</button>
  <button class="stab" data-s="version" onclick="showState('version')">Same name → v2</button>
  <button class="stab" data-s="saved"   onclick="showState('saved')">Saved</button>
  <button class="stab" data-s="already" onclick="showState('already')">Same file already there</button>
  <button class="stab" data-s="refused" onclick="showState('refused')">Refused (not your folder)</button>
  <button class="stab" data-s="panel"   onclick="showState('panel')">Panel · Files</button>
</div>

<div id="stage"><div id="frame">
  <div class="variant on" id="variant-a"></div>
  <div class="variant" id="variant-b"></div>
  <div class="variant" id="variant-c"></div>
</div></div>

<div id="tools">
  <select onchange="swapTheme(this.value)"><option value="default">Deep Midnight</option></select>
  <button onclick="setVP(375,this)">375</button>
  <button onclick="setVP(768,this)">768</button>
  <button class="on" onclick="setVP(0,this)">Full</button>
  <button id="annobtn" onclick="toggleAnno(this)">anno</button>
</div>
<div id="anno"></div>

<script src="COPY.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Sketch 274 — three variants x eight states, every string from COPY.
   ⚠ No straight apostrophes inside single-quoted strings: prose lives in COPY.js.
   ═══════════════════════════════════════════════════════════════════════════ */
var S = COPY.scenario, E = COPY.engine, SH = COPY.shared

/* ui state. mark = null | {kind:'saved'|'already', fid, indexing} */
var ui = { v: 'a', s: 'sent', dialog: false, picked: null, query: '', error: false, result: false,
           menu: null, hot: false, panel: false, mark: null, saving: false, selOpen: false, open: {f5: true, f6: true} }

function F(id) { return S.folders.filter(function (f) { return f.id === id })[0] }
function pathOf(arr) { return arr.join(' › ') }
function leafOf(arr) { return arr[arr.length - 1] }
function folderByPath(arr) { return S.folders.filter(function (f) { return pathOf(f.path) === pathOf(arr) })[0] }

/* ── icons ───────────────────────────────────────────────────────────────── */
var EXT_COLOR = { '.xlsx': 'hsl(142 71% 45%)', '.md': 'hsl(220 16% 55%)' }
function fileIcon(ext, px) {
  var sz = px || 15, col = EXT_COLOR[ext] || 'hsl(220 16% 55%)'
  return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<path d="M6 2h8l5 5v15a1 1 0 01-1 1H6a1 1 0 01-1-1V3a1 1 0 011-1z" fill="' + col + '" fill-opacity="0.16" stroke="' + col + '" stroke-width="1.3"/>' +
    '<path d="M14 2v5h5" stroke="' + col + '" stroke-width="1.3"/><rect x="5" y="14" width="14" height="6" rx="1" fill="' + col + '"/></svg>'
}
function ico(name, px) {
  var sz = px || 15
  var P = {
    more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
    lib: '<path d="M4 4v16M8 4v16M12 5l4 15M17 4l3 .8"/>',
    libplus: '<path d="M5 4h9l4 4v6"/><path d="M5 4v16h8"/><path d="M18 16v6M15 19h6"/>',
    folder: '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
    warn: '<path d="M12 3l9 17H3l9-17zM12 9v5M12 17.5v.5"/>',
    panel: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    down: '<path d="M6 9l6 6 6-6"/>',
    ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',
    copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>'
  }
  var fill = (name === 'more') ? 'currentColor' : 'none'
  return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="' + fill + '" stroke="currentColor" ' +
    'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P[name] + '</svg>'
}

/* ── the after-mark, per variant ─────────────────────────────────────────── */
function markText(m) {
  var f = F(m.fid)
  return { label: m.kind === 'already' ? SH.alreadyInLibrary : SH.inLibrary, path: pathOf(f.path), leaf: leafOf(f.path) }
}
function segHTML(m) {      // A
  var t = markText(m)
  return '<a class="seg' + (m.kind === 'already' ? ' already' : '') + '" title="' + t.path + '" onclick="noop()">' +
    ico(m.kind === 'already' ? 'copy' : 'check', 12) + t.label + ' · ' + t.leaf +
    (m.indexing ? ' <span class="ix">· ' + SH.indexing + '</span>' : '') + '</a>'
}
function libchipHTML(m) {  // B
  var t = markText(m)
  return '<a class="libchip" title="' + t.path + '" onclick="noop()"><span class="fold">' + ico('folder', 13) + '</span>' +
    t.label + ' <span class="path">· ' + t.path + '</span>' +
    (m.indexing ? ' <span class="ix">· ' + SH.indexing + '</span>' : '') +
    ' <span class="ext">' + ico('ext', 11) + '</span></a>'
}
function lineHTML(m) {     // C
  var t = markText(m)
  var txt = m.kind === 'already' ? COPY.c.alreadyLine(t.path) : COPY.c.savedLine(t.path)
  return '<div class="after' + (m.kind === 'already' ? ' already' : '') + '"><span class="ok">' + ico(m.kind === 'already' ? 'copy' : 'check', 13) + '</span>' +
    txt + (m.indexing ? ' <span class="ix">· ' + SH.indexing + '</span>' : '') + ' · <a onclick="noop()">' + SH.openDoc + '</a></div>'
}

/* ── the attachment chip + its action, per variant ───────────────────────── */
function baseChip(inner) {
  return '<span class="chip">' + fileIcon(S.file.ext) + '<span class="nm">' + S.file.name + '</span>' +
    '<span class="sz">' + S.file.sizeLabel + '</span><span class="sc">' + E.CHIP_SCOPE + '</span>' + (inner || '<span class="pad"></span>') + '</span>'
}
function actionHTML(v, where) {
  var m = ui.mark
  if (v === 'a') {
    var menu = (ui.menu === where)
      ? '<div class="cmenu" role="menu"><button class="mitem" role="menuitem" onclick="openDialog()"><span class="ic">' + ico('libplus', 14) + '</span>' + SH.verb + '…</button>' +
        (where === 'chat' ? '<button class="mitem dim" role="menuitem" onclick="openPanel()"><span class="ic">' + ico('panel', 14) + '</span>' + SH.openInPanel + '</button>' : '') + '</div>'
      : ''
    return { inChip: '<button class="more' + (ui.menu === where ? ' open' : '') + '" aria-label="' + COPY.a.moreLabel + '" aria-haspopup="menu" onclick="toggleMenu(\'' + where + '\')">' + ico('more', 14) + '</button>', after: '', menu: menu }
  }
  if (v === 'b') {
    if (m) return { inChip: '', after: '', menu: '' }
    return { inChip: '', after: '<button class="verb' + (ui.hot ? ' hot' : '') + '" onclick="openDialog()">' + ico('libplus', 13) + SH.verb + '</button>', menu: '' }
  }
  if (m) return { inChip: '', after: '', menu: '' }
  return { inChip: '', after: '<button class="ibtn' + (ui.hot ? ' hot' : '') + '" aria-label="' + COPY.c.iconLabel + '" onclick="openDialog()">' + ico('libplus', 14) + '<span class="tip">' + COPY.c.iconLabel + '</span></button>', menu: '' }
}
function chipRowHTML(v, where) {
  var m = ui.mark
  var act = actionHTML(v, where)
  var inner = ''
  if (v === 'a') inner = (m ? segHTML(m) : '') + act.inChip
  var chip = baseChip(inner || null)
  var sib = (v === 'b' && m) ? libchipHTML(m) : ''
  return chip + act.after + sib + act.menu
}

/* ── dialog body, per variant ────────────────────────────────────────────── */
function optHTML(f) {
  var par = f.path.slice(0, -1)
  return '<div class="opt' + (ui.picked === f.id ? ' sel' : '') + '" role="option" aria-selected="' + (ui.picked === f.id) + '" onclick="pick(\'' + f.id + '\')">' +
    '<span class="fold">' + ico('folder', 14) + '</span><span>' +
    (par.length ? '<span class="par">' + pathOf(par) + ' › </span>' : '') + '<span class="leaf">' + leafOf(f.path) + '</span></span>' +
    '<span class="rad"></span></div>'
}
function pickerA() {
  var q = ui.query.toLowerCase()
  var list = S.folders.filter(function (f) { return pathOf(f.path).toLowerCase().indexOf(q) >= 0 })
  return '<div class="flabel">' + SH.folderRequired + '</div>' +
    '<input class="search" placeholder="' + COPY.a.search + '" value="' + ui.query + '" oninput="ui.query=this.value;repaintList()" id="srch">' +
    '<div class="flist" role="listbox" id="flist">' + (list.length ? list.map(optHTML).join('') : '<div class="none">No folder matches.</div>') + '</div>'
}
function pickerB() {
  // a tree from the flat paths
  function kids(prefix) {
    return S.folders.filter(function (f) {
      return f.path.length === prefix.length + 1 && pathOf(f.path.slice(0, prefix.length)) === pathOf(prefix)
    })
  }
  function node(f, depth) {
    var ch = kids(f.path), isOpen = !!ui.open[f.id]
    var row = '<div class="tnode' + (ui.picked === f.id ? ' sel' : '') + '" style="padding-left:' + (8 + depth * 18) + 'px" role="treeitem" aria-selected="' + (ui.picked === f.id) + '"' +
      (ch.length ? ' aria-expanded="' + isOpen + '"' : '') + ' onclick="pick(\'' + f.id + '\')">' +
      '<span class="chev' + (isOpen ? ' open' : '') + '" onclick="event.stopPropagation();toggleNode(\'' + f.id + '\')">' + (ch.length ? ico('chev', 12) : '') + '</span>' +
      '<span class="fold">' + ico('folder', 14) + '</span>' + leafOf(f.path) + '</div>'
    return row + (isOpen ? ch.map(function (c) { return node(c, depth + 1) }).join('') : '')
  }
  return '<div class="flabel">' + SH.folderRequired + '</div><div class="flist" role="tree">' + kids([]).map(function (f) { return node(f, 0) }).join('') + '</div>'
}
function pickerC() {
  var cur = ui.picked ? F(ui.picked) : null
  var pop = ui.selOpen ? '<div class="sel-pop" role="listbox">' + S.folders.map(function (f) {
    return '<div class="opt' + (ui.picked === f.id ? ' sel' : '') + '" role="option" onclick="pick(\'' + f.id + '\');ui.selOpen=false;paint()"><span class="fold">' + ico('folder', 14) + '</span>' + pathOf(f.path) + '</div>'
  }).join('') + '</div>' : ''
  return '<div class="flabel">' + SH.folderRequired + '</div>' +
    '<button class="sel-trig' + (ui.selOpen ? ' open' : '') + '" onclick="ui.selOpen=!ui.selOpen;paint()">' +
    (cur ? '<span>' + pathOf(cur.path) + '</span>' : '<span class="ph">' + COPY.c.selectPlaceholder + '</span>') + ico('down', 14) + '</button>' + pop
}
function dialogHTML(v) {
  if (!ui.dialog) return ''
  if (ui.result) {
    var at = folderByPath(S.alreadyAt), picked = F(ui.picked)
    return '<div class="scrim" onclick="if(event.target===this)finishAlready()"><div class="modal" role="dialog" aria-label="' + SH.alreadyTitle + '">' +
      '<div class="result"><div class="big"><span class="ic">' + ico('copy', 18) + '</span>' + SH.alreadyTitle + '</div>' +
      '<p>' + SH.alreadyBody(pathOf(at.path)) + '</p>' +
      '<span class="where"><span class="fold">' + ico('folder', 13) + '</span>' + pathOf(at.path) + '</span>' +
      (picked && picked.id !== at.id ? '<p>' + SH.alreadyDiffFolder(pathOf(picked.path)) + '</p>' : '') + '</div>' +
      '<div class="mbot"><button class="btn" onclick="finishAlready()">' + SH.done + '</button>' +
      '<button class="btn pri" onclick="finishAlready()">' + SH.openDoc + '</button></div></div></div>'
  }
  var picker = v === 'a' ? pickerA() : v === 'b' ? pickerB() : pickerC()
  var f = ui.picked ? F(ui.picked) : null
  var warn = (f && f.has && !ui.error)
    ? '<div class="warn"><span class="ic">' + ico('warn', 15) + '</span><span>' + SH.versionWarn(f.has.name, pathOf(f.path), f.has.nextVersion) + '</span></div>' : ''
  var err = ui.error
    ? '<div class="err" role="alert"><span class="ic">' + ico('warn', 15) + '</span><span><b>' + SH.refuseLead + '</b><code>' + E.REFUSE_NOT_OWNER + '</code></span></div>' : ''
  return '<div class="scrim" onclick="if(event.target===this)closeDialog()"><div class="modal" role="dialog" aria-label="' + SH.dialogTitle + '">' +
    '<div class="mtop"><h3>' + SH.dialogTitle + '</h3><p>' + SH.dialogSub + '</p>' +
      '<span class="filechip">' + fileIcon(S.file.ext, 14) + S.file.name + ' <span style="color:var(--color-text-dim);font-family:var(--font-mono);font-size:.68rem">' + S.file.sizeLabel + '</span></span></div>' +
    '<div class="mmid">' + picker + warn + err + '</div>' +
    '<div class="mbot"><span class="req">' + (f ? '' : SH.folderRequired) + '</span>' +
      '<button class="btn" onclick="closeDialog()">' + SH.cancel + '</button>' +
      '<button class="btn pri" ' + (f && !ui.saving ? '' : 'disabled') + ' onclick="confirmSave()">' + (ui.saving ? SH.saving : SH.confirm) + '</button></div>' +
  '</div></div>'
}

/* ── the panel ───────────────────────────────────────────────────────────── */
function panelHTML(v) {
  if (!ui.panel) return ''
  var m = ui.mark, act = actionHTML(v, 'panel')
  var rowAct = '', under = ''
  if (v === 'a') { rowAct = act.inChip; under = m ? segHTML(m) : '' }
  if (v === 'b') { rowAct = act.after; under = m ? libchipHTML(m) : '' }
  if (v === 'c') { rowAct = act.after; under = m ? lineHTML(m) : '' }
  return '<aside class="panel"><div class="psec"><div class="phead">' + SH.panelTitle + ' <span class="ct">2</span></div>' +
    '<div class="frow">' + fileIcon(S.file.ext, 20) + '<div class="meta"><div class="fn">' + S.file.name + '</div>' +
      '<div class="fm">' + S.file.sizeLabel + ' · ' + E.CHIP_SCOPE + (under ? '<div>' + under + '</div>' : '') + '</div></div>' +
      '<div class="act">' + rowAct + '</div>' + (v === 'a' ? act.menu : '') + '</div>' +
    '<div class="frow">' + fileIcon(S.agentFile.ext, 20) + '<div class="meta"><div class="fn">' + S.agentFile.name + '</div>' +
      '<div class="fm">' + S.agentFile.sizeLabel + ' · <span class="agent">' + SH.panelAgentFile + '</span></div></div><div class="act"></div></div>' +
  '</div></aside>'
}

/* ── full render ─────────────────────────────────────────────────────────── */
function render(v) {
  var C = COPY[v]
  var chatRow = chipRowHTML(v, 'chat')
  var under = (v === 'c' && ui.mark) ? lineHTML(ui.mark) : ''
  var tries = {
    a: ['Click the ⋯ on the chip, then the verb.', 'Type in the search box; pick Suppliers › Meridian › Pricing and read the warning.', 'Pick Suppliers › Northwind to see the refusal; pick Suppliers › Meridian to see the same-file case.'],
    b: ['Click the verb beside the chip.', 'Expand the tree; pick Pricing and read the warning.', 'Pick Northwind to see the refusal; pick Meridian to see the same-file case.'],
    c: ['Hover or tab to the icon; read the tooltip; click it.', 'Open the dropdown; pick a path.', 'Pick Suppliers › Northwind to see the refusal; Suppliers › Meridian for the same-file case.']
  }[v]
  return '' +
    '<div class="apptop"><span class="dot"></span><span class="title">' + S.threadTitle + '</span>' +
      '<span class="crumb">Deep · claude-opus-5</span><span class="sp"></span>' +
      '<button class="ptog' + (ui.panel ? ' on' : '') + '" onclick="ui.panel=!ui.panel;ui.menu=null;paint()">' + ico('panel', 12) + ' Panel</button></div>' +
    '<div class="body' + (ui.panel ? ' withpanel' : '') + '"><div class="col">' +
      '<div class="chat"><div class="chatinner">' +
        '<div class="msg"><span class="av me">You</span><span class="mbody">' +
          '<div class="chiprow">' + chatRow + '</div>' +
          '<div class="mtext">' + S.userMsg + '</div>' + under + '</span></div>' +
        '<div class="msg"><span class="av ai">AI</span><span class="mbody">' +
          '<div class="ptr"><span class="tick">' + ico('check', 12) + '</span>' + SH.agentRead(S.file.name) + '</div>' +
          '<div class="mtext">' + S.agentReply + '</div></span></div>' +
        '<div class="claim"><b>' + C.name + '.</b> ' + C.claim + '</div>' +
        '<div class="try"><h4>Three things to try</h4><ol><li>' + tries.join('</li><li>') + '</li></ol></div>' +
      '</div></div>' +
      '<div class="composerwrap"><div class="composer">Ask anything…</div></div>' +
    '</div>' + panelHTML(v) + '</div>' +
    dialogHTML(v)
}
function paint() {
  ['a', 'b', 'c'].forEach(function (v) {
    document.getElementById('variant-' + v).innerHTML = (v === ui.v) ? render(v) : ''
  })
}
function repaintList() {
  var keep = document.getElementById('srch'), pos = keep ? keep.selectionStart : 0
  paint()
  var s = document.getElementById('srch'); if (s) { s.focus(); s.setSelectionRange(pos, pos) }
}

/* ── state presets ───────────────────────────────────────────────────────── */
function reset() {
  ui.dialog = false; ui.picked = null; ui.query = ''; ui.error = false; ui.result = false
  ui.menu = null; ui.hot = false; ui.panel = false; ui.mark = null; ui.saving = false; ui.selOpen = false
}
function showState(s) {
  ui.s = s; reset()
  var fPricing = 'f7', fNorth = 'f8', fMer = 'f6'
  if (s === 'offer') { if (ui.v === 'a') ui.menu = 'chat'; else ui.hot = true }
  if (s === 'pick') ui.dialog = true
  if (s === 'version') { ui.dialog = true; ui.picked = fPricing; ui.query = 'meridian' }
  if (s === 'saved') ui.mark = { kind: 'saved', fid: 'f4', indexing: false }
  if (s === 'already') { ui.dialog = true; ui.picked = fMer; ui.result = true }
  if (s === 'refused') { ui.dialog = true; ui.picked = fNorth; ui.error = true; ui.query = 'supp' }
  if (s === 'panel') ui.panel = true
  document.querySelectorAll('.stab').forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-s') === s) })
  paint()
}
function showVariant(v) {
  ui.v = v
  document.querySelectorAll('.variant').forEach(function (e) { e.classList.remove('on') })
  document.getElementById('variant-' + v).classList.add('on')
  document.querySelectorAll('.vtab').forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-v') === v) })
  showState(ui.s)
}

/* ── handlers (fake backend) ─────────────────────────────────────────────── */
function toggleMenu(where) { ui.menu = (ui.menu === where) ? null : where; paint() }
function openPanel() { ui.menu = null; ui.panel = true; paint() }
function openDialog() { ui.menu = null; ui.hot = false; ui.dialog = true; ui.picked = null; ui.error = false; ui.result = false; paint() }
function closeDialog() { ui.dialog = false; ui.selOpen = false; ui.error = false; paint() }
function pick(id) { ui.picked = id; ui.error = false; paint() }
function toggleNode(id) { ui.open[id] = !ui.open[id]; paint() }
function confirmSave() {
  var f = F(ui.picked); if (!f) return
  ui.saving = true; paint()
  setTimeout(function () {
    ui.saving = false
    if (f.locked) { ui.error = true; paint(); return }                                    // the minter's 403, verbatim
    if (pathOf(f.path) === pathOf(S.pickedForAlready)) { ui.result = true; paint(); return } // same bytes elsewhere (D-13)
    ui.dialog = false; ui.mark = { kind: 'saved', fid: f.id, indexing: true }; paint()
    setTimeout(function () { if (ui.mark) { ui.mark.indexing = false; paint() } }, 2600)       // the document row exists; search finds it once indexed
  }, 700)
}
function finishAlready() { ui.dialog = false; ui.result = false; ui.mark = { kind: 'already', fid: folderByPath(S.alreadyAt).id, indexing: false }; paint() }
function noop() {}

/* ── toolbar ─────────────────────────────────────────────────────────────── */
function swapTheme(n) { document.querySelector('link[href*=themes]').href = '../themes/' + n + '.css' }
function setVP(w, btn) {
  document.getElementById('frame').style.maxWidth = w ? (w + 'px') : '1280px'
  document.querySelectorAll('#tools button').forEach(function (b) { if (b.id !== 'annobtn') b.classList.remove('on') })
  btn.classList.add('on')
}
var annoOn = false
function toggleAnno(btn) { annoOn = !annoOn; btn.classList.toggle('on', annoOn); document.getElementById('anno').style.display = 'none' }
document.addEventListener('mousemove', function (e) {
  if (!annoOn) return
  var box = document.getElementById('anno'), t = e.target
  if (!t || t === document.body) { box.style.display = 'none'; return }
  var cs = getComputedStyle(t)
  box.textContent = t.tagName.toLowerCase() + (typeof t.className === 'string' && t.className ? '.' + t.className.split(' ')[0] : '') +
    '\n' + Math.round(t.getBoundingClientRect().width) + ' x ' + Math.round(t.getBoundingClientRect().height) +
    '\ncolor  ' + cs.color + '\nsize   ' + cs.fontSize + '\npad    ' + cs.padding
  box.style.display = 'block'; box.style.left = (e.clientX + 14) + 'px'; box.style.top = (e.clientY + 14) + 'px'
})
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { ui.menu = null; if (ui.dialog) closeDialog(); else paint() } })

paint()
</script>
</body>
</html>
